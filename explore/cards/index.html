<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DevEco 质感卡片</title>
<link rel="stylesheet" href="../../deveco-intui-kit/fonts/fonts.css">
<link rel="stylesheet" href="cards.css">
</head>
<body data-view="all">
<main class="page">
  <header class="head">
    <h1>质感卡片</h1>
    <p>每张参考图只取三样：序列（结构和节奏）、颜色对比（用哪些色、各占多少）、质感（材质细节），全部用代码生成，不画具体的东西。卡片左上角的色条是颜色占比。</p>
    <div class="viewbar">
      <div class="views" role="radiogroup" aria-label="看哪一层">
        <button type="button" role="radio" aria-checked="true" data-view="0">合成</button>
        <button type="button" role="radio" aria-checked="false" data-view="1">序列</button>
        <button type="button" role="radio" aria-checked="false" data-view="2">配色</button>
        <button type="button" role="radio" aria-checked="false" data-view="3">质感</button>
      </div>
      <p class="view-note" id="view-note">三层叠在一起的样子。</p>
    </div>
    <p>鼠标移到卡片上：塑料膜和冰沙的光、石塔最高那格、月晕的光心、天水镜像的对称轴、冰泉的漩涡都会跟着走。</p>
  </header>
  <section class="wall" aria-label="质感卡片">
    <figure class="cell">
      <div class="glass-wrap"><div class="print" aria-hidden="true"></div>
      <article class="card c-glass" aria-label="毛玻璃">
        <div class="card-body">
          <span class="prop" role="img" aria-label="颜色占比"><i style="--c:#1E4FB6;--w:13"></i><i style="--c:#8E8890;--w:12"></i><i style="--c:#F6C454;--w:3"></i><i style="--c:#E0228A;--w:12"></i><i style="--c:#16090F;--w:3"></i><i style="--c:#34BED4;--w:14"></i><i style="--c:#0E7894;--w:4"></i><i style="--c:#A0AA3A;--w:7"></i><i style="--c:#B28C46;--w:11"></i><i style="--c:#EEA890;--w:8"></i><i style="--c:#7090C0;--w:13"></i></span>
          <div class="spacer"></div>
          <h3 class="title">毛玻璃</h3>
          <p class="line">色条 · 模糊后的柔和过渡 · 染色和亮边</p>
        </div>
      </article></div>
      <figcaption>
        <img class="ref" src="refs/glass-bg.jpg" alt="参考：苹果的毛玻璃材质（这张照片没用上，底下换成了色条）" width="72" height="72" loading="lazy">
        <dl class="abs"><div><dt>序列</dt><dd>底下是另外八张卡片的主色，排成宽窄不一的竖条</dd></div><div><dt>对比</dt><dd>卡片里被模糊成柔和的过渡，边缘外是清楚的硬边</dd></div><div><dt>质感</dt><dd>模糊、提饱和，一层浅色染色和一圈亮边</dd></div></dl>
      </figcaption>
    </figure>
    <figure class="cell">
      <article class="card c-film" data-fx="film" aria-label="塑料膜">
        <canvas class="fx fx-under" aria-hidden="true"></canvas>
        <div class="card-body">
          <span class="prop" role="img" aria-label="颜色占比"><i style="--c:#E0228A;--w:50"></i><i style="--c:#8246E0;--w:14"></i><i style="--c:#FFB0DA;--w:12"></i><i style="--c:#6A0C3C;--w:14"></i><i style="--c:#16090F;--w:10"></i></span>
          <div class="spacer"></div>
          <h3 class="title">塑料膜</h3>
          <p class="line">斜褶 · 洋红黑白 · 镜面反光</p>
        </div>
        <canvas class="fx fx-over" aria-hidden="true"></canvas>
      </article>
      <figcaption>
        <img class="ref" src="refs/film.jpg" alt="参考：零食袋铝膜上的黑色标签" width="72" height="72" loading="lazy">
        <dl class="abs"><div><dt>序列</dt><dd>两组斜向的褶，一密一疏，折线处是硬的</dd></div><div><dt>对比</dt><dd>洋红、黑、白三色硬碰硬，背光的褶转紫</dd></div><div><dt>质感</dt><dd>镜面一样的反光，高光扫过印在膜上的黑字；光跟着鼠标走</dd></div></dl>
      </figcaption>
    </figure>
    <figure class="cell">
      <article class="card c-moon" data-fx="moon" aria-label="月晕">
        <canvas class="fx fx-under" aria-hidden="true"></canvas>
        <div class="card-body">
          <span class="prop" role="img" aria-label="颜色占比"><i style="--c:#0A0B0E;--w:55"></i><i style="--c:#1C1F25;--w:20"></i><i style="--c:#96A2B0;--w:13"></i><i style="--c:#F4F6F8;--w:5"></i><i style="--c:#BAB278;--w:4"></i><i style="--c:#7A667E;--w:3"></i></span>
          <div class="spacer"></div>
          <h3 class="title">月晕</h3>
          <p class="line">同心光环 · 近黑对冷白 · 柔散颗粒</p>
        </div>
      </article>
      <figcaption>
        <img class="ref" src="refs/moon.jpg" alt="参考：薄云里的满月和月晕" width="72" height="72" loading="lazy">
        <dl class="abs"><div><dt>序列</dt><dd>以光心为圆心的几圈光环，被一条条横向暗带切开</dd></div><div><dt>对比</dt><dd>大面积近黑，中间一小块冷白，环上很淡的黄和紫</dd></div><div><dt>质感</dt><dd>柔的、散的，带胶片颗粒；光心跟着鼠标走，暗带慢慢漂</dd></div></dl>
      </figcaption>
    </figure>
    <figure class="cell">
      <article class="card c-tower" data-fx="tower" aria-label="石塔">
        <canvas class="fx fx-under" aria-hidden="true"></canvas>
        <div class="card-body">
          <span class="prop" role="img" aria-label="颜色占比"><i style="--c:#1E4EBA;--w:30"></i><i style="--c:#3A5AA6;--w:16"></i><i style="--c:#56607E;--w:14"></i><i style="--c:#706A74;--w:36"></i><i style="--c:#FCC85C;--w:4"></i></span>
          <div class="spacer"></div>
          <h3 class="title">石塔</h3>
          <p class="line">竖向凹槽 · 暖灰一级级变钴蓝 · 混凝土颗粒</p>
        </div>
      </article>
      <figcaption>
        <img class="ref" src="refs/tower.jpg" alt="参考：黄昏的教堂塔身" width="72" height="72" loading="lazy">
        <dl class="abs"><div><dt>序列</dt><dd>一根根竖向凹槽，颜色从中间往两边一级级变，每级同样的差；中间那格跟着鼠标走</dd></div><div><dt>对比</dt><dd>暖灰对钴蓝，冷暖各占一半，只在中间几根上有几点暖黄</dd></div><div><dt>质感</dt><dd>混凝土的细颗粒、竖向雨痕、柱面的圆弧明暗</dd></div></dl>
      </figcaption>
    </figure>
    <figure class="cell">
      <article class="card c-slush" data-fx="slush" aria-label="冰沙">
        <canvas class="fx fx-under" aria-hidden="true"></canvas>
        <div class="card-body">
          <span class="prop" role="img" aria-label="颜色占比"><i style="--c:#B6421A;--w:22"></i><i style="--c:#E8821E;--w:44"></i><i style="--c:#FAC06E;--w:20"></i><i style="--c:#FFF2E2;--w:11"></i><i style="--c:#3E1406;--w:3"></i></span>
          <div class="spacer"></div>
          <h3 class="title">冰沙</h3>
          <p class="line">弧线颗粒 · 橙色同色系 · 半透明冰晶</p>
        </div>
      </article>
      <figcaption>
        <img class="ref" src="refs/slush.jpg" alt="参考：橙红冰沙的表面" width="72" height="72" loading="lazy">
        <dl class="abs"><div><dt>序列</dt><dd>颗粒沿着挖痕的同心弧一道道排开，每四道一条亮边</dd></div><div><dt>对比</dt><dd>同一个橙色系从深砖红到杏色，只在高光处跳出奶白</dd></div><div><dt>质感</dt><dd>半透明，每颗冰晶一个小圆顶；光跟着鼠标走，冰晶跟着闪</dd></div></dl>
      </figcaption>
    </figure>
    <figure class="cell">
      <article class="card c-tundra" data-fx="tundra" aria-label="苔原">
        <canvas class="fx fx-under" aria-hidden="true"></canvas>
        <div class="card-body">
          <span class="prop" role="img" aria-label="颜色占比"><i style="--c:#D4D8DB;--w:6"></i><i style="--c:#B28C46;--w:22"></i><i style="--c:#9C7B4C;--w:9"></i><i style="--c:#6E6630;--w:11"></i><i style="--c:#8C4E2E;--w:2"></i><i style="--c:#A0AA3A;--w:6"></i><i style="--c:#2C2D29;--w:42"></i><i style="--c:#5E676C;--w:2"></i></span>
          <div class="spacer"></div>
          <h3 class="title">苔原</h3>
          <p class="line">地层 · 土黄橄榄压炭黑 · 纤维与碎粒</p>
        </div>
      </article>
      <figcaption>
        <img class="ref" src="refs/tundra.jpg" alt="参考：苔原、瀑布和玄武岩" width="72" height="72" loading="lazy">
        <dl class="abs"><div><dt>序列</dt><dd>横向地层厚薄交替、微微倾斜，中间夹一条亮绿，下面一大块炭黑</dd></div><div><dt>对比</dt><dd>土黄、赭石、橄榄占大面积，苔藓绿只有一小条，炭黑压底</dd></div><div><dt>质感</dt><dd>草的纤维、苔藓的团块、玄武岩的碎粒；鼠标上下有一点视差</dd></div></dl>
      </figcaption>
    </figure>
    <figure class="cell">
      <article class="card c-rainbow" data-fx="rainbow" aria-label="彩虹薄雾">
        <canvas class="fx fx-under" aria-hidden="true"></canvas>
        <div class="card-body">
          <span class="prop" role="img" aria-label="颜色占比"><i style="--c:#8290A4;--w:45"></i><i style="--c:#CFD2CE;--w:33"></i><i style="--c:#ECBE9E;--w:5"></i><i style="--c:#EADA9C;--w:5"></i><i style="--c:#CBE2B0;--w:5"></i><i style="--c:#A8C8EC;--w:7"></i></span>
          <div class="spacer"></div>
          <h3 class="title">彩虹薄雾</h3>
          <p class="line">主虹副虹 · 灰蓝底上的粉彩 · 雾</p>
        </div>
      </article>
      <figcaption>
        <img class="ref" src="refs/rainbow.jpg" alt="参考：雾里的一段彩虹" width="72" height="72" loading="lazy">
        <dl class="abs"><div><dt>序列</dt><dd>一道主虹、一道颜色反过来的淡副虹，中间夹一条更暗的天</dd></div><div><dt>对比</dt><dd>灰蓝底上几乎没有饱和度的粉彩，整体对比很低</dd></div><div><dt>质感</dt><dd>雾的颗粒和慢慢飘的明暗，没有硬边；鼠标左右推动色带</dd></div></dl>
      </figcaption>
    </figure>
    <figure class="cell">
      <article class="card c-mirror" data-fx="mirror" aria-label="天水镜像">
        <canvas class="fx fx-under" aria-hidden="true"></canvas>
        <div class="card-body">
          <span class="prop" role="img" aria-label="颜色占比"><i style="--c:#6C88C2;--w:26"></i><i style="--c:#C8CEE4;--w:18"></i><i style="--c:#F0AA78;--w:8"></i><i style="--c:#FF9C40;--w:2"></i><i style="--c:#4E6282;--w:32"></i><i style="--c:#2E3C52;--w:14"></i></span>
          <div class="spacer"></div>
          <h3 class="title">天水镜像</h3>
          <p class="line">对称轴 · 冷蓝紫对一道暖橙 · 云絮与水纹</p>
        </div>
      </article>
      <figcaption>
        <img class="ref" src="refs/mirror.jpg" alt="参考：日落的天空倒映在水里" width="72" height="72" loading="lazy">
        <dl class="abs"><div><dt>序列</dt><dd>一条水平对称轴，上下是同一片纹理，越往下水纹越疏；轴跟着鼠标上下</dd></div><div><dt>对比</dt><dd>冷的蓝紫对轴线上一道暖橙，下半部整体压暗、偏蓝</dd></div><div><dt>质感</dt><dd>上面是柔的云絮，下面是水的横纹</dd></div></dl>
      </figcaption>
    </figure>
    <figure class="cell">
      <article class="card c-spring" data-fx="spring" aria-label="冰泉">
        <canvas class="fx fx-under" aria-hidden="true"></canvas>
        <div class="card-body">
          <span class="prop" role="img" aria-label="颜色占比"><i style="--c:#0A6480;--w:12"></i><i style="--c:#2EB8CE;--w:38"></i><i style="--c:#96E2EE;--w:25"></i><i style="--c:#E4F7FA;--w:22"></i><i style="--c:#042A33;--w:3"></i></span>
          <div class="spacer"></div>
          <h3 class="title">冰泉</h3>
          <p class="line">流线 · 青绿同色系 · 乳白通透</p>
        </div>
      </article>
      <figcaption>
        <img class="ref" src="refs/spring.jpg" alt="参考：冰泉的漩涡" width="72" height="72" loading="lazy">
        <dl class="abs"><div><dt>序列</dt><dd>绕漩涡的流线，一根根白丝往外散开、被水流拉直；漩涡跟着鼠标走</dd></div><div><dt>对比</dt><dd>青绿、乳白、深青同一冷色系，漩涡中心最深</dd></div><div><dt>质感</dt><dd>乳白的通透感和水花颗粒</dd></div></dl>
      </figcaption>
    </figure>
  </section>
</main>
<script src="cards.js"></script>
</body>
</html>
