<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DevEco 质感卡片</title>
<link rel="stylesheet" href="../../deveco-intui-kit/fonts/fonts.css">
<link rel="stylesheet" href="cards.css">
</head>
<body>
<main class="page">
  <header class="head">
    <h1>质感卡片</h1>
    <p>每张参考图先做成一张卡片：内容都一样，只换配色和质感，放在一起比。以后挑出有意思的，再往按钮、面板、背景这些形式上发展。</p>
    <p>鼠标移到卡片上，光会跟着走，塑料膜和冰沙最明显。云、雾和水会慢慢动。</p>
  </header>
  <section class="wall" aria-label="质感卡片">
    <figure class="cell">
      <div class="glass-wrap"><div class="print" aria-hidden="true"></div>
      <article class="card c-glass" aria-label="毛玻璃">
        <div class="card-body">
          <div class="row-top"><span class="chip">Agent·回归</span><span class="meta">刚刚</span></div>
          <div class="spacer"></div>
          <h3 class="title">回归跑完<small>38 条旅程全过</small></h3>
          <p class="body">Mate 70 Pro 真机已释放，排队的 Agent·调优 接着用。</p>
          <div class="bar-row"><span class="bar"><i></i></span><span class="num">38/38</span></div>
          <div class="actions"><button class="btn btn2" type="button">查看报告</button><button class="btn btn1" type="button">交给调优</button></div>
        </div>
      </article></div>
      <figcaption>
        <img class="ref" src="refs/glass-bg.jpg" alt="参考：冰泉边的秋色灌木和石头（当作毛玻璃底下的景）" width="72" height="72" loading="lazy">
        <div><div class="cap-h"><b>毛玻璃</b><span class="sw"><i style="--c:#F6F7F9" title="#F6F7F9"></i><i style="--c:#D9DDE3" title="#D9DDE3"></i><i style="--c:#3574F0" title="#3574F0"></i><i style="--c:#111317" title="#111317"></i></span></div>
        <p>苹果式毛玻璃：底下的照片被模糊、提了饱和，卡片自己只加一层浅色染色和一圈亮边。完整实验台在 explore/glass。</p></div>
      </figcaption>
    </figure>
    <figure class="cell">
      <article class="card c-film" data-fx="film" aria-label="塑料膜">
        <canvas class="fx fx-under" aria-hidden="true"></canvas>
        <div class="card-body">
          <div class="row-top"><span class="chip">Agent·回归</span><span class="meta">刚刚</span></div>
          <div class="spacer"></div>
          <h3 class="title">回归跑完<small>38 条旅程全过</small></h3>
          <p class="body">Mate 70 Pro 真机已释放，排队的 Agent·调优 接着用。</p>
          <div class="bar-row"><span class="bar"><i></i></span><span class="num">38/38</span></div>
          <div class="actions"><button class="btn btn2" type="button">查看报告</button><button class="btn btn1" type="button">交给调优</button></div>
        </div>
        <canvas class="fx fx-over" aria-hidden="true"></canvas>
      </article>
      <figcaption>
        <img class="ref" src="refs/film.jpg" alt="参考：零食袋铝膜上的黑色标签" width="72" height="72" loading="lazy">
        <div><div class="cap-h"><b>塑料膜</b><span class="sw"><i style="--c:#E0228A" title="#E0228A"></i><i style="--c:#FFB0DA" title="#FFB0DA"></i><i style="--c:#7A40DE" title="#7A40DE"></i><i style="--c:#3E0624" title="#3E0624"></i><i style="--c:#16090F" title="#16090F"></i></span></div>
        <p>零食袋的铝膜：反光很硬、有折痕，褶子里偏紫；黑色标签印在膜上，高光从字上扫过去。鼠标移动相当于转动袋子。</p></div>
      </figcaption>
    </figure>
    <figure class="cell">
      <article class="card c-moon" data-fx="moon" aria-label="月晕">
        <canvas class="fx fx-under" aria-hidden="true"></canvas>
        <div class="card-body">
          <div class="row-top"><span class="chip">Agent·回归</span><span class="meta">刚刚</span></div>
          <div class="spacer"></div>
          <h3 class="title">回归跑完<small>38 条旅程全过</small></h3>
          <p class="body">Mate 70 Pro 真机已释放，排队的 Agent·调优 接着用。</p>
          <div class="bar-row"><span class="bar"><i></i></span><span class="num">38/38</span></div>
          <div class="actions"><button class="btn btn2" type="button">查看报告</button><button class="btn btn1" type="button">交给调优</button></div>
        </div>
      </article>
      <figcaption>
        <img class="ref" src="refs/moon.jpg" alt="参考：薄云里的满月和月晕" width="72" height="72" loading="lazy">
        <div><div class="cap-h"><b>月晕</b><span class="sw"><i style="--c:#04050A" title="#04050A"></i><i style="--c:#2A2E36" title="#2A2E36"></i><i style="--c:#96A0AC" title="#96A0AC"></i><i style="--c:#E9EEF3" title="#E9EEF3"></i><i style="--c:#C8C08A" title="#C8C08A"></i></span></div>
        <p>满月透过薄云：中间一团冷白的光，往外一圈淡黄、再外一圈发紫；离月亮近的云带银边。主按钮也带一圈晕。</p></div>
      </figcaption>
    </figure>
    <figure class="cell">
      <article class="card c-tower" data-fx="tower" aria-label="石塔">
        <canvas class="fx fx-under" aria-hidden="true"></canvas>
        <div class="card-body">
          <div class="row-top"><span class="chip">Agent·回归</span><span class="meta">刚刚</span></div>
          <div class="spacer"></div>
          <h3 class="title">回归跑完<small>38 条旅程全过</small></h3>
          <p class="body">Mate 70 Pro 真机已释放，排队的 Agent·调优 接着用。</p>
          <div class="bar-row"><span class="bar"><i></i></span><span class="num">38/38</span></div>
          <div class="actions"><button class="btn btn2" type="button">查看报告</button><button class="btn btn1" type="button">交给调优</button></div>
        </div>
      </article>
      <figcaption>
        <img class="ref" src="refs/tower.jpg" alt="参考：黄昏的教堂塔身" width="72" height="72" loading="lazy">
        <div><div class="cap-h"><b>石塔</b><span class="sw"><i style="--c:#2658C2" title="#2658C2"></i><i style="--c:#6C98E6" title="#6C98E6"></i><i style="--c:#8C868D" title="#8C868D"></i><i style="--c:#4E4B52" title="#4E4B52"></i><i style="--c:#F6C454" title="#F6C454"></i></span></div>
        <p>哈尔格林姆斯教堂的黄昏：混凝土的灰里带一点紫，竖向柱子一格格往外降；天是蓝调时刻的蓝，窗口和钟面是暖黄的灯。</p></div>
      </figcaption>
    </figure>
    <figure class="cell">
      <article class="card c-slush" data-fx="slush" aria-label="冰沙">
        <canvas class="fx fx-under" aria-hidden="true"></canvas>
        <div class="card-body">
          <div class="row-top"><span class="chip">Agent·回归</span><span class="meta">刚刚</span></div>
          <div class="spacer"></div>
          <h3 class="title">回归跑完<small>38 条旅程全过</small></h3>
          <p class="body">Mate 70 Pro 真机已释放，排队的 Agent·调优 接着用。</p>
          <div class="bar-row"><span class="bar"><i></i></span><span class="num">38/38</span></div>
          <div class="actions"><button class="btn btn2" type="button">查看报告</button><button class="btn btn1" type="button">交给调优</button></div>
        </div>
      </article>
      <figcaption>
        <img class="ref" src="refs/slush.jpg" alt="参考：橙红冰沙的表面" width="72" height="72" loading="lazy">
        <div><div class="cap-h"><b>冰沙</b><span class="sw"><i style="--c:#B03A10" title="#B03A10"></i><i style="--c:#E2721C" title="#E2721C"></i><i style="--c:#F8B05C" title="#F8B05C"></i><i style="--c:#FFF4E8" title="#FFF4E8"></i><i style="--c:#3E1406" title="#3E1406"></i></span></div>
        <p>冰沙表面：橙红的底从里面透亮，细碎的冰晶一颗颗反光，挖过的地方留下一道有光泽的弧；配色里加了椰子片的奶白。</p></div>
      </figcaption>
    </figure>
    <figure class="cell">
      <article class="card c-tundra" data-fx="tundra" aria-label="苔原">
        <canvas class="fx fx-under" aria-hidden="true"></canvas>
        <div class="card-body">
          <div class="row-top"><span class="chip">Agent·回归</span><span class="meta">刚刚</span></div>
          <div class="spacer"></div>
          <h3 class="title">回归跑完<small>38 条旅程全过</small></h3>
          <p class="body">Mate 70 Pro 真机已释放，排队的 Agent·调优 接着用。</p>
          <div class="bar-row"><span class="bar"><i></i></span><span class="num">38/38</span></div>
          <div class="actions"><button class="btn btn2" type="button">查看报告</button><button class="btn btn1" type="button">交给调优</button></div>
        </div>
      </article>
      <figcaption>
        <img class="ref" src="refs/tundra.jpg" alt="参考：苔原、瀑布和玄武岩" width="72" height="72" loading="lazy">
        <div><div class="cap-h"><b>苔原</b><span class="sw"><i style="--c:#D6DADD" title="#D6DADD"></i><i style="--c:#B28C46" title="#B28C46"></i><i style="--c:#6C622E" title="#6C622E"></i><i style="--c:#A0A838" title="#A0A838"></i><i style="--c:#2E2F2B" title="#2E2F2B"></i></span></div>
        <p>冰岛苔原：山体的土黄、赭石一层层横着叠，草有纤维感；中间一条发黄的苔藓绿，底下是湿的黑色玄武岩。</p></div>
      </figcaption>
    </figure>
    <figure class="cell">
      <article class="card c-rainbow" data-fx="rainbow" aria-label="彩虹薄雾">
        <canvas class="fx fx-under" aria-hidden="true"></canvas>
        <div class="card-body">
          <div class="row-top"><span class="chip">Agent·回归</span><span class="meta">刚刚</span></div>
          <div class="spacer"></div>
          <h3 class="title">回归跑完<small>38 条旅程全过</small></h3>
          <p class="body">Mate 70 Pro 真机已释放，排队的 Agent·调优 接着用。</p>
          <div class="bar-row"><span class="bar"><i></i></span><span class="num">38/38</span></div>
          <div class="actions"><button class="btn btn2" type="button">查看报告</button><button class="btn btn1" type="button">交给调优</button></div>
        </div>
      </article>
      <figcaption>
        <img class="ref" src="refs/rainbow.jpg" alt="参考：雾里的一段彩虹" width="72" height="72" loading="lazy">
        <div><div class="cap-h"><b>彩虹薄雾</b><span class="sw"><i style="--c:#808EA2" title="#808EA2"></i><i style="--c:#CFD2CE" title="#CFD2CE"></i><i style="--c:#ECBE9E" title="#ECBE9E"></i><i style="--c:#CBE2B0" title="#CBE2B0"></i><i style="--c:#A8C8EC" title="#A8C8EC"></i></span></div>
        <p>阴天里的彩虹：颜色很淡，被雾吃掉一半，外侧偏杏色、内侧偏蓝，边上没有硬线，里侧的天稍亮一点。</p></div>
      </figcaption>
    </figure>
    <figure class="cell">
      <article class="card c-mirror" data-fx="mirror" aria-label="天水镜像">
        <canvas class="fx fx-under" aria-hidden="true"></canvas>
        <div class="card-body">
          <div class="row-top"><span class="chip">Agent·回归</span><span class="meta">刚刚</span></div>
          <div class="spacer"></div>
          <h3 class="title">回归跑完<small>38 条旅程全过</small></h3>
          <p class="body">Mate 70 Pro 真机已释放，排队的 Agent·调优 接着用。</p>
          <div class="bar-row"><span class="bar"><i></i></span><span class="num">38/38</span></div>
          <div class="actions"><button class="btn btn2" type="button">查看报告</button><button class="btn btn1" type="button">交给调优</button></div>
        </div>
      </article>
      <figcaption>
        <img class="ref" src="refs/mirror.jpg" alt="参考：日落的天空倒映在水里" width="72" height="72" loading="lazy">
        <div><div class="cap-h"><b>天水镜像</b><span class="sw"><i style="--c:#7090C0" title="#7090C0"></i><i style="--c:#D8E0EE" title="#D8E0EE"></i><i style="--c:#EEA890" title="#EEA890"></i><i style="--c:#F4A060" title="#F4A060"></i><i style="--c:#26343C" title="#26343C"></i></span></div>
        <p>日落后的天和水：云底是杏粉色的余晖，地平线一道橙光；水面把整片天倒过来，压暗、偏蓝，有很细的横纹。</p></div>
      </figcaption>
    </figure>
    <figure class="cell">
      <article class="card c-spring" data-fx="spring" aria-label="冰泉">
        <canvas class="fx fx-under" aria-hidden="true"></canvas>
        <div class="card-body">
          <div class="row-top"><span class="chip">Agent·回归</span><span class="meta">刚刚</span></div>
          <div class="spacer"></div>
          <h3 class="title">回归跑完<small>38 条旅程全过</small></h3>
          <p class="body">Mate 70 Pro 真机已释放，排队的 Agent·调优 接着用。</p>
          <div class="bar-row"><span class="bar"><i></i></span><span class="num">38/38</span></div>
          <div class="actions"><button class="btn btn2" type="button">查看报告</button><button class="btn btn1" type="button">交给调优</button></div>
        </div>
      </article>
      <figcaption>
        <img class="ref" src="refs/spring.jpg" alt="参考：冰泉的漩涡" width="72" height="72" loading="lazy">
        <div><div class="cap-h"><b>冰泉</b><span class="sw"><i style="--c:#0E7894" title="#0E7894"></i><i style="--c:#34BED4" title="#34BED4"></i><i style="--c:#90E2EE" title="#90E2EE"></i><i style="--c:#DCF6FA" title="#DCF6FA"></i><i style="--c:#042A33" title="#042A33"></i></span></div>
        <p>冰川融水的蓝：乳白里透着青绿，白色水花一缕一缕往下冲，漩涡中心颜色最深。</p></div>
      </figcaption>
    </figure>
  </section>
</main>
<script src="cards.js"></script>
</body>
</html>
