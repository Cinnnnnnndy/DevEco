<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DevEco 质感卡片</title>
<link rel="stylesheet" href="../../deveco-intui-kit/fonts/fonts.css">
<link rel="stylesheet" href="cards.css">
</head>
<body>
<main class="page">
  <header class="head">
    <h1>质感卡片</h1>
    <p>每张参考图做成一张卡片：不画具体的东西，但留住它的渐变、光和质感。玻璃参照苹果的做法用代码现算——底下是一层发光的渐变，上面的玻璃按厚薄折射、起雾、分出色边，边缘有反光和高光；卡片上的字压在一块液态玻璃上。</p>
    <p class="hint">鼠标移到卡片上就是光源：高光、反光、玻璃边上的亮线都会跟着走。</p>
  </header>

  <section class="feature" aria-label="新加的参考：瀑布">
    <article class="card c-fall" data-fx="fall" aria-label="瀑布">
      <canvas class="fx" aria-hidden="true"></canvas>
      <div class="plate"><h3 class="title">瀑布</h3><p class="line">水幕 · 水雾 · 逆光</p></div>
    </article>
    <div class="feature-note">
      <img class="ref ref-lg" src="refs/fall.jpg" alt="参考：瀑布画圈的部分，水幕后面透出苔绿的岩壁" width="390" height="325" loading="lazy">
      <dl class="abs">
        <div><dt>渐变</dt><dd>苔绿和岩石的暗底，从左下的暗处往右上的太阳一路变亮，底部被水雾抬成乳白</dd></div>
        <div><dt>光感</dt><dd>逆光：水幕薄处透出后面的苔绿，厚处发白发亮；雾里斜着几道光，水滴闪着往下走</dd></div>
        <div><dt>质感</dt><dd>一缕缕竖向的水幕往下流，按厚薄折射、起雾，越往下越散成雾</dd></div>
      </dl>
    </div>
  </section>

  <section class="wall" aria-label="质感卡片">
    <figure class="cell">
      <article class="card c-glass" data-fx="glass" aria-label="毛玻璃">
        <canvas class="fx" aria-hidden="true"></canvas>
        <div class="plate"><h3 class="title">毛玻璃</h3><p class="line">透镜 · 磨砂 · 色条</p></div>
      </article>
      <figcaption>
        <img class="ref" src="refs/glass-bg.jpg" alt="参考：苹果的毛玻璃材质（这张照片没用上，底下换成了色条）" width="72" height="72" loading="lazy">
        <dl class="abs">
          <div><dt>渐变</dt><dd>底下是另外九张卡片的主色排成的竖条，每条上浅下深</dd></div>
          <div><dt>光感</dt><dd>透镜边上一圈亮线，迎光那侧最亮，对面一道弱的内反光，底下落一片淡影</dd></div>
          <div><dt>质感</dt><dd>上面是清透的液态透镜（跟着鼠标走），边缘把色条压弯、分出色边；下面一块磨砂把色条糊成柔和的过渡</dd></div>
        </dl>
      </figcaption>
    </figure>
    <figure class="cell">
      <article class="card c-film" data-fx="film" aria-label="塑料膜">
        <canvas class="fx" aria-hidden="true"></canvas>
        <div class="plate"><h3 class="title">塑料膜</h3><p class="line">镜面 · 褶皱 · 洋红</p></div>
      </article>
      <figcaption>
        <img class="ref" src="refs/film.jpg" alt="参考：零食袋铝膜上的黑色标签" width="72" height="72" loading="lazy">
        <dl class="abs">
          <div><dt>渐变</dt><dd>洋红从深梅到亮粉，褶子背光的一面转紫</dd></div>
          <div><dt>光感</dt><dd>像在影棚里拍：一块大柔光箱、一条灯管映在褶上，拉出长长的反光；鼠标是点光</dd></div>
          <div><dt>质感</dt><dd>皱起来的镀铝膜，折痕处是硬的；黑标签是一块深色的亮面玻璃</dd></div>
        </dl>
      </figcaption>
    </figure>
    <figure class="cell">
      <article class="card c-moon" data-fx="moon" aria-label="月晕">
        <canvas class="fx" aria-hidden="true"></canvas>
        <div class="plate"><h3 class="title">月晕</h3><p class="line">冷光 · 薄云 · 光环</p></div>
      </article>
      <figcaption>
        <img class="ref" src="refs/moon.jpg" alt="参考：薄云里的满月和月晕" width="72" height="72" loading="lazy">
        <dl class="abs">
          <div><dt>渐变</dt><dd>近黑的夜空里一小块冷白，往外一圈圈暗下去，带一点淡黄和淡紫</dd></div>
          <div><dt>光感</dt><dd>月光透过薄云被打散成光晕，云边镶一道亮边；月亮跟着鼠标走</dd></div>
          <div><dt>质感</dt><dd>一条条横向的云像磨砂玻璃条，慢慢往左漂，厚处糊、薄处透</dd></div>
        </dl>
      </figcaption>
    </figure>
    <figure class="cell">
      <article class="card c-tower" data-fx="tower" aria-label="石塔">
        <canvas class="fx" aria-hidden="true"></canvas>
        <div class="plate"><h3 class="title">石塔</h3><p class="line">长虹玻璃 · 钴蓝 · 暖灰</p></div>
      </article>
      <figcaption>
        <img class="ref" src="refs/tower.jpg" alt="参考：黄昏的教堂塔身" width="72" height="72" loading="lazy">
        <dl class="abs">
          <div><dt>渐变</dt><dd>两边钴蓝、中间暖灰，几点暖黄的灯</dd></div>
          <div><dt>光感</dt><dd>每根玻璃柱上一道竖向高光，排成一列；柱缝暗下去</dd></div>
          <div><dt>质感</dt><dd>长虹玻璃：十三根竖柱把后面的颜色折成一级一级，柱顶从中间往两边一级级降，是石塔的序列</dd></div>
        </dl>
      </figcaption>
    </figure>
    <figure class="cell">
      <article class="card c-slush" data-fx="slush" aria-label="冰沙">
        <canvas class="fx" aria-hidden="true"></canvas>
        <div class="plate"><h3 class="title">冰沙</h3><p class="line">冰粒 · 透光 · 橙</p></div>
      </article>
      <figcaption>
        <img class="ref" src="refs/slush.jpg" alt="参考：橙红冰沙的表面" width="72" height="72" loading="lazy">
        <dl class="abs">
          <div><dt>渐变</dt><dd>同一个橙：中心亮杏色，往外到橙、到砖红，像从里面透出来的光</dd></div>
          <div><dt>光感</dt><dd>每颗冰粒是一个小透镜，里面倒映一小块橙光，顶上一个奶白高光，背光那侧透出暖光</dd></div>
          <div><dt>质感</dt><dd>冰粒沿着挖痕的同心弧一道道排开，粒和粒之间是暗下去的碎冰</dd></div>
        </dl>
      </figcaption>
    </figure>
    <figure class="cell">
      <article class="card c-tundra" data-fx="tundra" aria-label="苔原">
        <canvas class="fx" aria-hidden="true"></canvas>
        <div class="plate"><h3 class="title">苔原</h3><p class="line">地层 · 叠色玻璃 · 苔绿</p></div>
      </article>
      <figcaption>
        <img class="ref" src="refs/tundra.jpg" alt="参考：苔原、瀑布和玄武岩" width="72" height="72" loading="lazy">
        <dl class="abs">
          <div><dt>渐变</dt><dd>倾斜的地层：浅灰、土黄、橄榄、亮苔绿，炭黑压底</dd></div>
          <div><dt>光感</dt><dd>每层上沿一道斜面接住左上来的光，下面落一道浅影</dd></div>
          <div><dt>质感</dt><dd>一片片叠起来的有色玻璃，有的磨砂、有的清透，透出草纤维和苔藓团</dd></div>
        </dl>
      </figcaption>
    </figure>
    <figure class="cell">
      <article class="card c-rainbow" data-fx="rainbow" aria-label="彩虹薄雾">
        <canvas class="fx" aria-hidden="true"></canvas>
        <div class="plate"><h3 class="title">彩虹薄雾</h3><p class="line">雾 · 粉彩 · 两道虹</p></div>
      </article>
      <figcaption>
        <img class="ref" src="refs/rainbow.jpg" alt="参考：雾里的一段彩虹" width="72" height="72" loading="lazy">
        <dl class="abs">
          <div><dt>渐变</dt><dd>灰蓝的天往下变暖白，主虹和反过来的副虹都是粉彩</dd></div>
          <div><dt>光感</dt><dd>主虹里面比外面亮，两道虹之间一条暗带；雾里有几道斜光</dd></div>
          <div><dt>质感</dt><dd>雾是一层层飘着的磨砂，把虹糊开又露出来，没有硬边</dd></div>
        </dl>
      </figcaption>
    </figure>
    <figure class="cell">
      <article class="card c-mirror" data-fx="mirror" aria-label="天水镜像">
        <canvas class="fx" aria-hidden="true"></canvas>
        <div class="plate"><h3 class="title">天水镜像</h3><p class="line">天光 · 水纹 · 倒影</p></div>
      </article>
      <figcaption>
        <img class="ref" src="refs/mirror.jpg" alt="参考：日落的天空倒映在水里" width="72" height="72" loading="lazy">
        <dl class="abs">
          <div><dt>渐变</dt><dd>上面从深蓝到淡紫，到地平线一道暖橙；下面是同一片天倒过来，偏冷偏暗</dd></div>
          <div><dt>光感</dt><dd>太阳贴着地平线，水面上一条碎金的光路，越近越散</dd></div>
          <div><dt>质感</dt><dd>水面是一层会动的玻璃：越远的水纹越细，把倒影揉碎</dd></div>
        </dl>
      </figcaption>
    </figure>
    <figure class="cell">
      <article class="card c-spring" data-fx="spring" aria-label="冰泉">
        <canvas class="fx" aria-hidden="true"></canvas>
        <div class="plate"><h3 class="title">冰泉</h3><p class="line">乳蓝 · 漩涡 · 亮网</p></div>
      </article>
      <figcaption>
        <img class="ref" src="refs/spring.jpg" alt="参考：冰泉的漩涡" width="72" height="72" loading="lazy">
        <dl class="abs">
          <div><dt>渐变</dt><dd>中间乳白的浅青，往外到湖蓝、到深青</dd></div>
          <div><dt>光感</dt><dd>水面把光聚成一张亮网落在底上，高光和天光浮在水面</dd></div>
          <div><dt>质感</dt><dd>绕着漩涡流动的水面，乳白的水丝顺着流向走；漩涡跟着鼠标</dd></div>
        </dl>
      </figcaption>
    </figure>
  </section>
</main>
<script src="cards.js"></script>
</body>
</html>
