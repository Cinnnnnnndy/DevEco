<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>质感工作台</title>
<link rel="stylesheet" href="../../deveco-intui-kit/fonts/fonts.css">
<link rel="stylesheet" href="workbench.css">
</head>
<body>
<header class="top">
  <a class="back" href="index.html"><span aria-hidden="true">←</span> 质感色卡</a>
  <nav class="picker" id="picker" aria-label="换一张纹理"></nav>
  <div class="acts">
    <button type="button" class="btn" id="reset">恢复默认</button>
    <button type="button" class="btn" id="copy">复制参数</button>
  </div>
</header>
<p class="notice" id="notice" role="alert" hidden></p>

<div class="wb">
  <section class="hero" aria-labelledby="name">
    <div class="hero-main">
      <div class="frame main-frame" id="main-frame" data-fb="tex"><canvas id="c-main" aria-label="当前参数下的纹理"></canvas></div>
      <p class="steps" id="steps"></p>
    </div>
    <div class="hero-side">
      <div class="title-block">
        <p class="kicker">质感工作台</p>
        <h1 id="name"></h1>
        <p class="line" id="line"></p>
      </div>
      <figure class="swatch">
        <div class="frame swatch-field" data-fb="abs"><canvas id="c-swatch" aria-label="最抽象的一版"></canvas></div>
        <div class="bar" id="bar" aria-hidden="true"></div>
        <figcaption>
          <p class="swatch-cap">色卡 · 抽象度 1</p>
          <ul class="hexes" id="hexes" aria-label="调色板，按亮度从暗到亮"></ul>
        </figcaption>
      </figure>
    </div>
  </section>

  <aside class="panel" id="panel" aria-label="参数"></aside>

  <div class="scenes">
    <section class="scene" aria-labelledby="t-wp">
      <header class="scene-head">
        <h2 id="t-wp">手机壁纸</h2>
        <p>沿主路径再拖一层、压暗一点，让字和图标浮在上面。「取景」是在纹理里左右挪。</p>
      </header>
      <div class="wp">
        <figure class="phone">
          <div class="screen frame" data-fb="abs">
            <canvas id="c-lock" aria-hidden="true"></canvas>
            <div class="ui lock" aria-hidden="true">
              <div class="sb"><span></span><span class="sb-r"><i class="sig"></i><i class="bat"></i></span></div>
              <p class="lock-date">9月30日 星期三</p>
              <p class="lock-time">9:41</p>
              <div class="note glass"><i class="note-ic"></i><div><b>日历</b><span>10:30 纹理评审 · 3 号会议室</span></div><em>现在</em></div>
              <div class="lock-foot">
                <span class="round glass"><svg viewBox="0 0 24 24"><path d="M9 3h6v4l-1.5 3v10h-3V10L9 7z"/></svg></span>
                <span class="round glass"><svg viewBox="0 0 24 24"><path d="M4 8h3l2-2.5h6L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></span>
              </div>
              <i class="home-ind"></i>
            </div>
          </div>
          <figcaption>锁屏</figcaption>
        </figure>
        <figure class="phone">
          <div class="screen frame" data-fb="abs">
            <canvas id="c-home" aria-hidden="true"></canvas>
            <div class="ui home" aria-hidden="true">
              <div class="sb"><span>9:41</span><span class="sb-r"><i class="sig"></i><i class="bat"></i></span></div>
              <div class="widget glass"><span class="w-day">星期三</span><span class="w-num">30</span><span class="w-ev">10:30 纹理评审</span></div>
              <div class="apps">
                <span class="app"><i><svg viewBox="0 0 24 24"><path d="M4 8h3l2-2.5h6L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></i><em>相机</em></span>
                <span class="app"><i><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M4 16l5-5 4 4 3-3 4 4"/></svg></i><em>相册</em></span>
                <span class="app"><i><svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="14" rx="2"/><path d="M4 10h16M9 4v4M15 4v4"/></svg></i><em>日历</em></span>
                <span class="app"><i><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 7.5V12l3 2"/></svg></i><em>时钟</em></span>
                <span class="app"><i><svg viewBox="0 0 24 24"><path d="M7 18h10a4 4 0 0 0 .4-8A5.5 5.5 0 0 0 6.6 11 3.5 3.5 0 0 0 7 18z"/></svg></i><em>天气</em></span>
                <span class="app"><i><svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="16" rx="2"/><path d="M8.5 9h7M8.5 12.5h7M8.5 16h4"/></svg></i><em>备忘录</em></span>
                <span class="app"><i><svg viewBox="0 0 24 24"><path d="M9 17V6l10-2v11"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="15" r="2"/></svg></i><em>音乐</em></span>
                <span class="app"><i><svg viewBox="0 0 24 24"><path d="M4 6l5-2 6 2 5-2v14l-5 2-6-2-5 2z"/><path d="M9 4v14M15 6v14"/></svg></i><em>地图</em></span>
              </div>
              <div class="dock glass">
                <span class="app"><i><svg viewBox="0 0 24 24"><path d="M7 4h3l1.5 4-2 1.5a10 10 0 0 0 5 5l1.5-2 4 1.5v3a2 2 0 0 1-2 2A15 15 0 0 1 5 6a2 2 0 0 1 2-2z"/></svg></i></span>
                <span class="app"><i><svg viewBox="0 0 24 24"><path d="M5 6h14a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1h-8l-4 3v-3H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1z"/></svg></i></span>
                <span class="app"><i><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg></i></span>
                <span class="app"><i><svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="2"/><path d="M4.5 7l7.5 6 7.5-6"/></svg></i></span>
              </div>
              <i class="home-ind"></i>
            </div>
          </div>
          <figcaption>桌面</figcaption>
        </figure>
        <div class="scene-ctl" id="ctl-wp"></div>
      </div>
    </section>

    <section class="scene" aria-labelledby="t-bn">
      <header class="scene-head">
        <h2 id="t-bn">横幅</h2>
        <p>同一张纹理的四种变形，3 : 1。「条带取样」是条带那一张从纹理的哪一列取。</p>
      </header>
      <div class="scene-ctl row" id="ctl-bn"></div>
      <div class="banners">
        <figure class="bn">
          <div class="frame bn-frame" data-fb="abs">
            <canvas id="c-bn1" aria-hidden="true"></canvas>
            <div class="bn-copy on-glass glass"><span class="bn-kicker">质感</span><strong class="bn-title"></strong><span class="bn-sub"></span></div>
          </div>
          <figcaption><b>条带</b>只取纹理的一列，横着拉满，留一点原来的起伏</figcaption>
        </figure>
        <figure class="bn">
          <div class="frame bn-frame" data-fb="abs">
            <canvas id="c-bn2" aria-hidden="true"></canvas>
            <div class="bn-copy center"><strong class="bn-title"></strong><span class="bn-sub"></span><span class="bn-cta glass">查看纹理</span></div>
          </div>
          <figcaption><b>镜像</b>左右对折，中间是对称轴</figcaption>
        </figure>
        <figure class="bn">
          <div class="frame bn-frame" data-fb="abs">
            <canvas id="c-bn3" aria-hidden="true"></canvas>
            <div class="bn-copy solid"><span class="bn-kicker">质感</span><strong class="bn-title"></strong><span class="bn-sub"></span></div>
          </div>
          <figcaption><b>渐隐</b>左边渐成调色板里的一个纯色，留给文字</figcaption>
        </figure>
        <figure class="bn">
          <div class="frame bn-frame" data-fb="abs">
            <canvas id="c-bn4" aria-hidden="true"></canvas>
            <div class="bn-copy corner"><strong class="bn-title"></strong><span class="bn-sub"></span></div>
          </div>
          <figcaption><b>色块</b>按调色板的占比切成竖条，纹理只剩明暗</figcaption>
        </figure>
      </div>
    </section>

    <section class="scene how" aria-labelledby="t-how">
      <header class="scene-head">
        <h2 id="t-how">这张是怎么来的</h2>
        <p>前两步在 <code>tools/texture.py</code> 里离线算好；从「起点」往后，就是这个工作台实时在做的事。</p>
      </header>
      <ol class="chain">
        <li><img id="i-ref" alt="" width="160" height="200"><span>参考照片</span></li>
        <li><img id="i-base" alt="" width="160" height="200"><span>起点</span></li>
        <li><img id="i-tex" alt="" width="160" height="200"><span>纹理（默认参数）</span></li>
        <li><img id="i-abs" alt="" width="160" height="200"><span>色卡（抽象度 1）</span></li>
      </ol>
      <dl class="notes" id="notes"></dl>
    </section>
  </div>
</div>

<p class="toast" id="toast" role="status" hidden></p>
<script src="tex/data.js"></script>
<script src="cards-data.js"></script>
<script src="workbench.js"></script>
</body>
</html>
