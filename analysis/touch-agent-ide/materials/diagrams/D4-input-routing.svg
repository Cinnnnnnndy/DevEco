<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc"><title id="title">同一个触点，先明确交给应用还是交给 Agent</title><desc id="desc">P1-2 · 运行 / 选组件 / 圈画问题，三种模式对应三条输入路径。设计方案示意，非真实产品截图或已上线能力。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#3574f0"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><rect x="0" y="0" width="1400" height="820" rx="0" fill="#f5f6f8"/><text x="42" y="48" fill="#737b86" font-size="16" font-weight="600">DEVECO · TOUCH &amp; AGENT · DESIGN PROPOSAL</text><text x="42" y="93" fill="#15171a" font-size="30" font-weight="650">同一个触点，先明确交给应用还是交给 Agent</text><text x="42" y="127" fill="#737b86" font-size="19" font-weight="400">P1-2 · 运行 / 选组件 / 圈画问题，三种模式对应三条输入路径</text><rect x="1110" y="31" width="248" height="34" rx="7" fill="#edf3ff"/><text x="1128" y="54" fill="#3574f0" font-size="16" font-weight="600">方案示意 · 非现有产品截图</text><rect x="42" y="170" width="390" height="500" rx="14" fill="#fff" stroke="#e3e5e9" stroke-width="1"/><rect x="43" y="171" width="388" height="48" rx="13" fill="#eef0f3"/><rect x="43" y="199" width="388" height="20" rx="0" fill="#eef0f3"/><text x="60" y="202" fill="#15171a" font-size="19" font-weight="600">输入来源</text><rect x="502" y="170" width="390" height="500" rx="14" fill="#fff" stroke="#e3e5e9" stroke-width="1"/><rect x="503" y="171" width="388" height="48" rx="13" fill="#eef0f3"/><rect x="503" y="199" width="388" height="20" rx="0" fill="#eef0f3"/><text x="520" y="202" fill="#15171a" font-size="19" font-weight="600">IDE 当前模式</text><rect x="962" y="170" width="396" height="500" rx="14" fill="#fff" stroke="#e3e5e9" stroke-width="1"/><rect x="963" y="171" width="394" height="48" rx="13" fill="#eef0f3"/><rect x="963" y="199" width="394" height="20" rx="0" fill="#eef0f3"/><text x="980" y="202" fill="#15171a" font-size="19" font-weight="600">明确的接收方</text><rect x="66" y="265" width="330" height="34" rx="7" fill="#edf3ff"/><text x="78" y="288" fill="#3574f0" font-size="17" font-weight="600">手指触点</text><text x="80" y="329" fill="#737b86" font-size="20" font-weight="400">点按 / 拖动 / 多指手势</text><rect x="66" y="405" width="330" height="34" rx="7" fill="#edf3ff"/><text x="78" y="428" fill="#3574f0" font-size="17" font-weight="600">笔与圈画</text><text x="80" y="469" fill="#737b86" font-size="20" font-weight="400">标出问题区域</text><rect x="66" y="545" width="330" height="34" rx="7" fill="#edf3ff"/><text x="78" y="568" fill="#3574f0" font-size="17" font-weight="600">语音说明</text><text x="80" y="609" fill="#737b86" font-size="20" font-weight="400">“这里太挤，缩小间距”</text><rect x="526" y="265" width="342" height="54" rx="7" fill="#e6f5ec"/><text x="538" y="288" fill="#20874c" font-size="17" font-weight="600">运行应用</text><line x1="900" y1="292" x2="949" y2="292" stroke="#3574f0" stroke-width="3" marker-end="url(#arrow)"/><rect x="526" y="405" width="342" height="54" rx="7" fill="#edf3ff"/><text x="538" y="428" fill="#3574f0" font-size="17" font-weight="600">选择组件</text><line x1="900" y1="432" x2="949" y2="432" stroke="#3574f0" stroke-width="3" marker-end="url(#arrow)"/><rect x="526" y="545" width="342" height="54" rx="7" fill="#fdf1e3"/><text x="538" y="568" fill="#aa6800" font-size="17" font-weight="600">圈画问题</text><line x1="900" y1="572" x2="949" y2="572" stroke="#3574f0" stroke-width="3" marker-end="url(#arrow)"/><text x="986" y="279" fill="#15171a" font-size="20" font-weight="400">被测应用接收事件</text><text x="986" y="313" fill="#15171a" font-size="20" font-weight="400">保留应用原有手势</text><text x="986" y="419" fill="#15171a" font-size="20" font-weight="400">组件树 / 源码映射</text><text x="986" y="453" fill="#15171a" font-size="20" font-weight="400">生成对象上下文</text><text x="986" y="559" fill="#15171a" font-size="20" font-weight="400">截图 + 批注 + 设备身份</text><text x="986" y="593" fill="#15171a" font-size="20" font-weight="400">确认发送后再委派</text><line x1="440" y1="414" x2="489" y2="414" stroke="#3574f0" stroke-width="3" marker-end="url(#arrow)"/><text x="66" y="649" fill="#3574f0" font-size="19" font-weight="600">输入方式不决定当前模式</text><line x1="42" y1="727" x2="1358" y2="727" stroke="#e3e5e9" stroke-width="2"/><text x="42" y="760" fill="#737b86" font-size="18" font-weight="400">语音可补充选中对象；模式切换本身不应自动发送 Agent 指令。</text><text x="42" y="788" fill="#737b86" font-size="18" font-weight="400">验证 OS → IDE → 嵌入视图 → 应用的真实路由；不支持的手势提供独立窗口或真机路径。</text></g></svg>