<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc"><title id="title">软键盘出现后，目标、输入与停止仍然可达</title><desc id="desc">P0-2 · 响应可见工作区，键盘收起后恢复当前任务。设计方案示意，非真实产品截图或已上线能力。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#3574f0"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><rect x="0" y="0" width="1400" height="820" rx="0" fill="#f5f6f8"/><text x="42" y="48" fill="#737b86" font-size="16" font-weight="600">DEVECO · TOUCH &amp; AGENT · DESIGN PROPOSAL</text><text x="42" y="93" fill="#15171a" font-size="30" font-weight="650">软键盘出现后，目标、输入与停止仍然可达</text><text x="42" y="127" fill="#737b86" font-size="19" font-weight="400">P0-2 · 响应可见工作区，键盘收起后恢复当前任务</text><rect x="1110" y="31" width="248" height="34" rx="7" fill="#edf3ff"/><text x="1128" y="54" fill="#3574f0" font-size="16" font-weight="600">方案示意 · 非现有产品截图</text><rect x="42" y="170" width="604" height="500" rx="14" fill="#fff" stroke="#e3e5e9" stroke-width="1"/><rect x="43" y="171" width="602" height="48" rx="13" fill="#eef0f3"/><rect x="43" y="199" width="602" height="20" rx="0" fill="#eef0f3"/><text x="60" y="202" fill="#15171a" font-size="19" font-weight="600">风险示意 · 底部操作被遮挡</text><rect x="66" y="240" width="556" height="180" rx="8" fill="#f5f6f8"/><text x="88" y="279" fill="#15171a" font-size="20" font-weight="400">运行预览 · ProductCard</text><rect x="104" y="308" width="210" height="76" rx="8" fill="#dce7fc"/><rect x="338" y="308" width="210" height="76" rx="8" fill="#dce7fc"/><rect x="754" y="170" width="604" height="500" rx="14" fill="#fff" stroke="#e3e5e9" stroke-width="1"/><rect x="755" y="171" width="602" height="48" rx="13" fill="#eef0f3"/><rect x="755" y="199" width="602" height="20" rx="0" fill="#eef0f3"/><text x="772" y="202" fill="#15171a" font-size="19" font-weight="600">候选方案 · 在键盘上方保留任务</text><rect x="778" y="240" width="556" height=