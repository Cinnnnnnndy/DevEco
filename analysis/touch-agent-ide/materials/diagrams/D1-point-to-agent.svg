<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc"><title id="title">点选组件，把“这里”变成可核对的上下文</title><desc id="desc">P1-1 · 从预览对象到 Agent 任务，再回到对应设备验收。设计方案示意，非真实产品截图或已上线能力。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#3574f0"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><rect x="0" y="0" width="1400" height="820" rx="0" fill="#f5f6f8"/><text x="42" y="48" fill="#737b86" font-size="16" font-weight="600">DEVECO · TOUCH &amp; AGENT · DESIGN PROPOSAL</text><text x="42" y="93" fill="#15171a" font-size="30" font-weight="650">点选组件，把“这里”变成可核对的上下文</text><text x="42" y="127" fill="#737b86" font-size="19" font-weight="400">P1-1 · 从预览对象到 Agent 任务，再回到对应设备验收</text><rect x="1110" y="31" width="248" height="34" rx="7" fill="#edf3ff"/><text x="1128" y="54" fill="#3574f0" font-size="16" font-weight="600">方案示意 · 非现有产品截图</text><rect x="42" y="170" width="396" height="500" rx="14" fill="#fff" stroke="#e3e5e9" stroke-width="1"/><rect x="43" y="171" width="394" height="48" rx="13" fill="#eef0f3"/><rect x="43" y="199" width="394" height="20" rx="0" fill="#eef0f3"/><text x="60" y="202" fill="#15171a" font-size="19" font-weight="600">01 · 选择组件</text><rect x="502" y="170" width="396" height="500" rx="14" fill="#fff" stroke="#e3e5e9" stroke-width="1"/><rect x="503" y="171" width="394" height="48" rx="13" fill="#eef0f3"/><rect x="503" y="199" width="394" height="20" rx="0" fill="#eef0f3"/><text x="520" y="202" fill="#15171a" font-size="19" font-weight="600">02 · 核对上下文</text><rect x="962" y="170" width="396" height="500" rx="14" fill="#fff" stroke="#e3e5e9" stroke-width="1"/><rect x="963" y="171" width="394" height="48" rx="13" fill="#eef0f3"/><rect x="963" y="199" width="394" height="20" rx="0" fill="#eef0f3"/><text x="980" y="202" fill="#15171a" font-size="19" font-weight="600">03 · 委派与验证</text><rect x="62" y="235" width="112" height="34" rx="7" fill="#edf3ff"/><text x="74" y="258" fill="#3574f0" font-size="17" font-weight="600">选组件模式</text><rect x="76" y="298" width="326" height="250" rx="10" fill="#f5f6f8"/><rect x="102" y="325" width="274" height="185" rx="8" fill="#fff" stroke="#3574f0" stroke-width="3"/><rect x="108" y="305" width="160" height="34" rx="7" fill="#edf3ff"/><text x="120" y="328" fill="#3574f0" font-size="17" font-weight="600">ProductCard</text><rect x="120" y="350" width="90" height="110" rx="5" fill="#dce7fc"/><text x="230" y="370" fill="#15171a" font-size="19" font-weight="400">商品名称</text><text x="230" y="405" fill="#15171a" font-size="19" font-weight="400">¥ 299</text><text x="230" y="440" fill="#15171a" font-size="19" font-weight="400">商品描述</text><line x1="221" y1="387" x2="355" y2="387" stroke="#3574f0" stroke-width="2" stroke-dasharray="5 4"/><circle cx="367" cy="425" r="16" fill="#3574f0"/><text x="362" y="431" fill="#fff" font-size="17" font-weight="600">1</text><rect x="80" y="574" width="138" height="34" rx="7" fill="#f5f6f8"/><text x="92" y="597" fill="#737b86" font-size="17" font-weight="600">上一层：列表</text><rect x="230" y="574" width="168" height="34" rx="7" fill="#edf3ff"/><text x="242" y="597" fill="#3574f0" font-size="17" font-weight="600">当前：商品卡片</text><text x="526" y="266" fill="#15171a" font-size="20" font-weight="400">组件  ProductCard</text><text x="526" y="313" fill="#15171a" font-size="20" font-weight="400">文件  ProductCard.ets:48</text><text x="526" y="360" fill="#15171a" font-size="20" font-weight="400">设备  MateBook Fold</text><text x="526" y="407" fill="#15171a" font-size="20" font-weight="400">形态  展开态 · lg</text><text x="526" y="454" fill="#15171a" font-size="20" font-weight="400">快照  与当前运行版本一致</text><rect x="526" y="518" width="346" height="104" rx="9" fill="#edf3ff"/><text x="544" y="550" fill="#3574f0" font-size="19" font-weight="400">目标可见、设备可见</text><text x="544" y="581" fill="#3574f0" font-size="19" font-weight="400">层级选错可在发送前调整</text><rect x="986" y="240" width="348" height="116" rx="10" fill="#f5f6f8"/><text x="1002" y="272" fill="#15171a" font-size="21" font-weight="400">收紧这两项间距</text><text x="1002" y="308" fill="#15171a" font-size="21" font-weight="400">保持手机布局不变</text><rect x="1170" y="371" width="160" height="34" rx="7" fill="#edf3ff"/><text x="1182" y="394" fill="#3574f0" font-size="17" font-weight="600">交给当前 Agent</text><text x="986" y="462" fill="#15171a" font-size="20" font-weight="400">修改计划 · 影响 1 个组件</text><text x="986" y="515" fill="#15171a" font-size="20" font-weight="400">审阅改动 · 可按项回退</text><text x="986" y="568" fill="#15171a" font-size="20" font-weight="400">验证证据 · Fold / 手机</text><rect x="986" y="624" width="240" height="34" rx="7" fill="#e6f5ec"/><text x="998" y="647" fill="#20874c" font-size="17" font-weight="600">回到相同组件与设备</text><line x1="449" y1="414" x2="489" y2="414" stroke="#3574f0" stroke-width="3" marker-end="url(#arrow)"/><line x1="909" y1="414" x2="949" y2="414" stroke="#3574f0" stroke-width="3" marker-end="url(#arrow)"/><line x1="42" y1="727" x2="1358" y2="727" stroke="#e3e5e9" stroke-width="2"/><text x="42" y="760" fill="#737b86" font-size="18" font-weight="400">① 对象身份比坐标更稳定；圈画无法定位组件时，降级为带设备与时间的截图。</text><text x="42" y="788" fill="#737b86" font-size="18" font-weight="400">② 运行模式的点按继续操作应用；进入选择模式后，点按才生成 Agent 上下文。</text></g></svg>