<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc"><title id="title">笔的增量：笔迹与手掌触点，生命周期不同</title><desc id="desc">P0-P1 · 不能把首次接触就当作用户已确认的 Agent 指令。设计方案示意，非真实产品截图或已上线能力。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#3574f0"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><rect x="0" y="0" width="1400" height="820" rx="0" fill="#f5f6f8"/><text x="42" y="48" fill="#737b86" font-size="16" font-weight="600">DEVECO · TOUCH &amp; AGENT · DESIGN PROPOSAL</text><text x="42" y="93" fill="#15171a" font-size="30" font-weight="650">笔的增量：笔迹与手掌触点，生命周期不同</text><text x="42" y="127" fill="#737b86" font-size="19" font-weight="400">P0-P1 · 不能把首次接触就当作用户已确认的 Agent 指令</text><rect x="1110" y="31" width="248" height="34" rx="7" fill="#edf3ff"/><text x="1128" y="54" fill="#3574f0" font-size="16" font-weight="600">方案示意 · 非现有产品截图</text><rect x="42" y="170" width="604" height="500" rx="14" fill="#fff" stroke="#e3e5e9" stroke-width="1"/><rect x="43" y="171" width="602" height="48" rx="13" fill="#eef0f3"/><rect x="43" y="199" width="602" height="20" rx="0" fill="#eef0f3"/><text x="60" y="202" fill="#15171a" font-size="19" font-weight="600">输入现场 · 笔尖与手掌可能同时接触</text><rect x="754" y="170" width="604" height="500" rx="14" fill="#fff" stroke="#e3e5e9" stroke-width="1"/><rect x="755" y="171" width="602" height="48" rx="13" fill="#eef0f3"/><rect x="755" y="199" width="602" height="20" rx="0" fill="#eef0f3"/><text x="772" y="202" fill="#15171a" font-size="19" font-weight="600">处理方案 · 保留草稿，尊重取消</text><rect x="66" y="247" width="556" height="350" rx="10" fill="#f5f6f8"/><rect x="104" y="285" width="444" height="188" rx="7" fill="#fff" stroke="#e3e5e9" stroke-width="1"/><path d="M184 395 C221 325 278 347 272 390 C270 421 210 421 204 389 C200 360 254 331 279 363" fill="none" stroke="#3574f0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M298 362 L372 280" fill="none" stroke="#15171a" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><path d="M291 372 L301 351 L311 362 Z" fill="none" stroke="#15171a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="432" cy="432" rx="105" ry="62" fill="#bdc5d3" fill-opacity=".8"/><text x="386" y="439" fill="#15171a" font-size="20" font-weight="400">掌部接触</text><text x="86" y="536" fill="#737b86" font-size="20" font-weight="400">笔迹：保留原始笔画</text><text x="86" y="571" fill="#737b86" font-size="20" font-weight="400">手掌：不能视为批注或接管指令</text><rect x="778" y="260" width="556" height="50" rx="7" fill="#edf3ff"/><text x="790" y="283" fill="#3574f0" font-size="17" font-weight="600">笔迹 A → 有效草稿</text><rect x="778" y="348" width="556" height="50" rx="7" fill="#fdf1e3"/><text x="790" y="371" fill="#aa6800" font-size="17" font-weight="600">接触 B → 系统 / 应用取消</text><rect x="778" y="436" width="556" height="50" rx="7" fill="#fdf1e3"/><text x="790" y="459" fill="#aa6800" font-size="17" font-weight="600">擦除 A → 撤回待提交笔迹</text><rect x="778" y="524" width="556" height="50" rx="7" fill="#e6f5ec"/><text x="790" y="547" fill="#20874c" font-size="17" font-weight="600">明确提交 → 才交给 Agent</text><line x1="669" y1="414" x2="730" y2="414" stroke="#3574f0" stroke-width="3" marker-end="url(#arrow)"/><line x1="42" y1="727" x2="1358" y2="727" stroke="#e3e5e9" stroke-width="2"/><text x="42" y="760" fill="#737b86" font-size="18" font-weight="400">主动笔 / 被动笔、笔与手指协作、防误触均按实际硬件和鸿蒙事件模型验证。</text><text x="42" y="788" fill="#737b86" font-size="18" font-weight="400">取消是输入状态，不等于 Agent 已执行改动的回退；两类撤销必须分开。</text></g></svg>