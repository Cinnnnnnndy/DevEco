<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc"><title id="title">手指的增量：解决落点歧义，而非发明“点选”</title><desc id="desc">P0-T1 · 相同的组件选择能力，键鼠与手指分别需要什么反馈。设计方案示意，非真实产品截图或已上线能力。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#3574f0"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><rect x="0" y="0" width="1400" height="820" rx="0" fill="#f5f6f8"/><text x="42" y="48" fill="#737b86" font-size="16" font-weight="600">DEVECO · TOUCH &amp; AGENT · DESIGN PROPOSAL</text><text x="42" y="93" fill="#15171a" font-size="30" font-weight="650">手指的增量：解决落点歧义，而非发明“点选”</text><text x="42" y="127" fill="#737b86" font-size="19" font-weight="400">P0-T1 · 相同的组件选择能力，键鼠与手指分别需要什么反馈</text><rect x="1110" y="31" width="248" height="34" rx="7" fill="#edf3ff"/><text x="1128" y="54" fill="#3574f0" font-size="16" font-weight="600">方案示意 · 非现有产品截图</text><rect x="42" y="170" width="396" height="500" rx="14" fill="#fff" stroke="#e3e5e9" stroke-width="1"/><rect x="43" y="171" width="394" height="48" rx="13" fill="#eef0f3"/><rect x="43" y="199" width="394" height="20" rx="0" fill="#eef0f3"/><text x="60" y="202" fill="#15171a" font-size="19" font-weight="600">键鼠基线 · 接触前有光标</text><rect x="502" y="170" width="396" height="500" rx="14" fill="#fff" stroke="#e3e5e9" stroke-width="1"/><rect x="503" y="171" width="394" height="48" rx="13" fill="#eef0f3"/><rect x="503" y="199" width="394" height="20" rx="0" fill="#eef0f3"/><text x="520" y="202" fill="#15171a" font-size="19" font-weight="600">手指变化 · 接触区遮挡目标</text><rect x="962" y="170" width="396" height="500" rx="14" fill="#fff" stroke="#e3e5e9" stroke-width="1"/><rect x="963" y="171" width="394" height="48" rx="13" fill="#eef0f3"/><rect x="963" y="199" width="394" height="20" rx="0" fill="#eef0f3"/><text x="980" y="202" fill="#15171a" font-size="19" font-weight="600">适配方案 · 抬手后可核对</text>