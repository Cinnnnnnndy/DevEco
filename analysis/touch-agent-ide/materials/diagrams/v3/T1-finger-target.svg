ke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="66" y="533" fill="#737b86" font-size="20" font-weight="400">已有：点选组件与层级定位</text><text x="66" y="569" fill="#737b86" font-size="20" font-weight="400">不计为触控新增能力</text><ellipse cx="683" cy="351" rx="69" ry="52" fill="#bdc5d3" fill-opacity=".75"/><text x="633" y="357" fill="#15171a" font-size="20" font-weight="600">接触区</text><text x="526" y="533" fill="#737b86" font-size="20" font-weight="400">新增：落点 / 轮廓被手遮住</text><text x="526" y="569" fill="#737b86" font-size="20" font-weight="400">相邻或嵌套对象需要消歧</text><rect x="998" y="308" width="322" height="49" rx="6" fill="#edf3ff" stroke="#3574f0" stroke-width="2"/><text x="1012" y="339" fill="#3574f0" font-size="20" font-weight="600">命中：PriceLabel</text><rect x="986" y="509" width="348" height="34" rx="7" fill="#edf3ff"/><text x="998" y="532" fill="#3574f0" font-size="17" font-weight="600">确认当前组件</text><rect x="986" y="559" width="348" height="34" rx="7" fill="#f5f6f8"/><text x="998" y="582" fill="#15171a" font-size="17" font-weight="600">切到上一层 / 调整选区</text><line x1="909" y1="414" x2="949" y2="414" stroke="#3574f0" stroke-width="3" marker-end="url(#arrow)"/><line x1="42" y1="727" x2="1358" y2="727" stroke="#e3e5e9" stroke-width="2"/><text x="42" y="760" fill="#737b86" font-size="18" font-weight="400">触控适配：反馈避开接触区，命中结果可核对；Agent 只接收已确认的对象。</text><text x="42" y="788" fill="#737b86" font-size="18" font-weight="400">笔如支持悬停，可在落笔前预高亮；无悬停的笔仍须提供接触后的等效路径。</text></g></svg>