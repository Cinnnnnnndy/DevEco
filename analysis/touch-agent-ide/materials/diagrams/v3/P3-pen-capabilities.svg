<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc"><title id="title">笔的条件增强：有悬停与笔键，才使用它们</title><desc id="desc">P1-P3 · 先看硬件能力，再决定快捷方式；核心动作始终有可见入口。设计方案示意，非真实产品截图或已上线能力。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#3574f0"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><rect x="0" y="0" width="1400" height="820" rx="0" fill="#f5f6f8"/><text x="42" y="48" fill="#737b86" font-size="16" font-weight="600">DEVECO · TOUCH &amp; AGENT · DESIGN PROPOSAL</text><text x="42" y="93" fill="#15171a" font-size="30" font-weight="650">笔的条件增强：有悬停与笔键，才使用它们</text><text x="42" y="127" fill="#737b86" font-size="19" font-weight="400">P1-P3 · 先看硬件能力，再决定快捷方式；核心动作始终有可见入口</text><rect x="1110" y="31" width="248" height="34" rx="7" fill="#edf3ff"/><text x="1128" y="54" fill="#3574f0" font-size="16" font-weight="600">方案示意 · 非现有产品截图</text><rect x="42" y="170" width="396" height="500" rx="14" fill="#fff" stroke="#e3e5e9" stroke-width="1"/><rect x="43" y="171" width="394" height="48" rx="13" fill="#eef0f3"/><rect x="43" y="199" width="394" height="20" rx="0" fill="#eef0f3"/><text x="60" y="202" fill="#15171a" font-size="19" font-weight="600">识别条件</text><rect x="502" y="170" width="396" height="500" rx="14" fill="#fff" stroke="#e3e5e9" stroke-width="1"/><rect x="503" y="171" width="394" height="48" rx="13" fill="#eef0f3"/><rect x="503" y="199" width="394" height="20" rx="0" fill="#eef0f3"/><text x="520" y="202" fill="#15171a" font-size="19" font-weight="600">可选增强</text><rect x="962" y="170" width="396" height="500" rx="14" fill="#fff" stroke="#e3e5e9" stroke-width="1"/><rect x="963" y="171" width="394" height="48" rx="13" fill="#eef0f3"/><rect x="963" y="199" width="394" height="20" rx="0" fill="#eef0f3"/><text x="980" y="202" fill="#15171a" font-size="19" font-weight="600">无此能力时的路径</text><rect x="66" y="263" width="348" height="34" rx="7" fill="#edf3ff"/><text x="78" y="286" fill="#3574f0" font-size="17" font-weight="600">主动笔支持悬停？</text><text x="526" y="288" fill="#15171a" font-size="20" font-weight="400">落笔前预高亮目标</text><text x="986" y="288" fill="#15171a" font-size="20" font-weight="400">接触后核对命中对象</text><line x1="449" y1="280" x2="489" y2="280" stroke="#3574f0" stroke-width="3" marker-end="url(#arrow)"/><line x1="909" y1="280" x2="949" y2="280" stroke="#3574f0" stroke-width="3" marker-end="url(#arrow)"/><rect x="66" y="397" width="348" height="34" rx="7" fill="#edf3ff"/><text x="78" y="420" fill="#3574f0" font-size="17" font-weight="600">有可用笔键 / 擦除？</text><text x="526" y="422" fill="#15171a" font-size="20" font-weight="400">快捷切换工具或擦墨迹</text><text x="986" y="422" fill="#15171a" font-size="20" font-weight="400">可见工具栏 / 撤销</text><line x1="449" y1="414" x2="489" y2="414" stroke="#3574f0" stroke-width="3" marker-end="url(#arrow)"/><line x1="909" y1="414" x2="949" y2="414" stroke="#3574f0" stroke-width="3" marker-end="url(#arrow)"/><rect x="66" y="531" width="348" height="34" rx="7" fill="#edf3ff"/><text x="78" y="554" fill="#3574f0" font-size="17" font-weight="600">提供压感 / 倾斜？</text><text x="526" y="556" fill="#15171a" font-size="20" font-weight="400">按用途保留笔迹信息</text><text x="986" y="556" fill="#15171a" font-size="20" font-weight="400">基本笔迹仍可提交</text><line x1="449" y1="548" x2="489" y2="548" stroke="#3574f0" stroke-width="3" marker-end="url(#arrow)"/><line x1="909" y1="548" x2="949" y2="548" stroke="#3574f0" stroke-width="3" marker-end="url(#arrow)"/><line x1="42" y1="727" x2="1358" y2="727" stroke="#e3e5e9" stroke-width="2"/><text x="42" y="760" fill="#737b86" font-size="18" font-weight="400">不把手指的无 hover 前提套到所有笔；被动笔通常只是手指替代。</text><text x="42" y="788" fill="#737b86" font-size="18" font-weight="400">笔键不抢系统快捷动作；笔压不充当权限或危险操作确认；悬停本身不派发任务。</text></g></svg>