<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc"><title id="title">手指的增量：多触点是否真正到达被测应用</title><desc id="desc">P0-T2 · 鼠标模拟、宿主真实触点、目标真机必须分开记录。设计方案示意，非真实产品截图或已上线能力。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#3574f0"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><rect x="0" y="0" width="1400" height="820" rx="0" fill="#f5f6f8"/><text x="42" y="48" fill="#737b86" font-size="16" font-weight="600">DEVECO · TOUCH &amp; AGENT · DESIGN PROPOSAL</text><text x="42" y="93" fill="#15171a" font-size="30" font-weight="650">手指的增量：多触点是否真正到达被测应用</text><text x="42" y="127" fill="#737b86" font-size="19" font-weight="400">P0-T2 · 鼠标模拟、宿主真实触点、目标真机必须分开记录</text><rect x="1110" y="31" width="248" height="34" rx="7" fill="#edf3ff"/><text x="1128" y="54" fill="#3574f0" font-size="16" font-weight="600">方案示意 · 非现有产品截图</text><rect x="42" y="170" width="590" height="500" rx="14" fill="#fff" stroke="#e3e5e9" stroke-width="1"/><rect x="43" y="171" width="588" height="48" rx="13" fill="#eef0f3"/><rect x="43" y="199" width="588" height="20" rx="0" fill="#eef0f3"/><text x="60" y="202" fill="#15171a" font-size="19" font-weight="600">输入端 · 两个真实触点</text><rect x="740" y="170" width="618" height="500" rx="14" fill="#fff" stroke="#e3e5e9" stroke-width="1"/><rect x="741" y="171" width="616" height="48" rx="13" fill="#eef0f3"/><rect x="741" y="199" width="616" height="20" rx="0" fill="#eef0f3"/><text x="758" y="202" fill="#15171a" font-size="19" font-weight="600">接收端 · 明确当前路径</text><rect x="76" y="247" width="522" height="288" rx="10" fill="#f5f6f8"/><text x="96" y="280" fill="#15171a" font-size="20" font-weight="400">运行画面</text><circle cx="216" cy="377" r="27" fill="#edf3ff" stroke="#3574f0" stroke-width="2"/><circle cx="450" cy="377" r="27" fill="#edf3ff" stroke="#3574f0" stroke-width="2"/><line x1="250" y1="377" x2="288" y2="377" stroke="#3574f0" stroke-width="3" marker-end="url(#arrow)"/><line x1="414" y1="377" x2="376" y2="377" stroke="#3574f0" stroke-width="3" marker-end="url(#arrow)"/><text x="142" y="464" fill="#3574f0" font-size="20" font-weight="400">点 1 + 点 2 + 连续轨迹 + 取消</text><rect x="76" y="560" width="522" height="34" rx="7" fill="#fdf1e3"/><text x="88" y="583" fill="#aa6800" font-size="17" font-weight="600">不是只把两个触点压成一次鼠标拖动</text><rect x="764" y="256" width="188" height="34" rx="7" fill="#edf3ff"/><text x="776" y="279" fill="#3574f0" font-size="17" font-weight="600">运行验证</text><line x1="970" y1="273" x2="1008" y2="273" stroke="#3574f0" stroke-width="3" marker-end="url(#arrow)"/><text x="1022" y="280" fill="#15171a" font-size="20" font-weight="400">被测应用接收手势</text><rect x="764" y="379" width="188" height="34" rx="7" fill="#edf3ff"/><text x="776" y="402" fill="#3574f0" font-size="17" font-weight="600">画布导航</text><line x1="970" y1="396" x2="1008" y2="396" stroke="#3574f0" stroke-width="3" marker-end="url(#arrow)"/><text x="1022" y="403" fill="#15171a" font-size="20" font-weight="400">IDE 缩放 / 平移</text><rect x="764" y="502" width="188" height="34" rx="7" fill="#edf3ff"/><text x="776" y="525" fill="#3574f0" font-size="17" font-weight="600">标注问题</text><line x1="970" y1="519" x2="1008" y2="519" stroke="#3574f0" stroke-width="3" marker-end="url(#arrow)"/><text x="1022" y="526" fill="#15171a" font-size="20" font-weight="400">形成草稿，不操作应用</text><line x1="652" y1="414" x2="715" y2="414" stroke="#3574f0" stroke-width="3" marker-end="url(#arrow)"/><line x1="42" y1="727" x2="1358" y2="727" stroke="#e3e5e9" stroke-width="2"/><text x="42" y="760" fill="#737b86" font-size="18" font-weight="400">键鼠本来就能缩放；差异是实际触点、手势及取消是否被系统或嵌入视图拦截。</text><text x="42" y="788" fill="#737b86" font-size="18" font-weight="400">Agent 可整理复现证据；宿主触屏成功不等于目标手机 / 平板或目标笔输入通过。</text></g></svg>