7" rx="4" fill="#f7f8fa"/><rect x="1016" y="501" width="34" height="27" rx="4" fill="#f7f8fa"/><rect x="1057" y="501" width="34" height="27" rx="4" fill="#f7f8fa"/><rect x="1098" y="501" width="34" height="27" rx="4" fill="#f7f8fa"/><rect x="1139" y="501" width="34" height="27" rx="4" fill="#f7f8fa"/><rect x="1180" y="501" width="34" height="27" rx="4" fill="#f7f8fa"/><rect x="1221" y="501" width="34" height="27" rx="4" fill="#f7f8fa"/><rect x="1262" y="501" width="34" height="27" rx="4" fill="#f7f8fa"/><rect x="975" y="536" width="34" height="27" rx="4" fill="#f7f8fa"/><rect x="1016" y="536" width="34" height="27" rx="4" fill="#f7f8fa"/><rect x="1057" y="536" width="34" height="27" rx="4" fill="#f7f8fa"/><rect x="1098" y="536" width="34" height="27" rx="4" fill="#f7f8fa"/><rect x="1139" y="536" width="34" height="27" rx="4" fill="#f7f8fa"/><rect x="1180" y="536" width="34" height="27" rx="4" fill="#f7f8fa"/><rect x="1221" y="536" width="34" height="27" rx="4" fill="#f7f8fa"/><rect x="1262" y="536" width="34" height="27" rx="4" fill="#f7f8fa"/><text x="66" y="634" fill="#3574f0" font-size="18" font-weight="400">任务 #42 / ProductCard / Fold</text><text x="66" y="661" fill="#3574f0" font-size="18" font-weight="400">跨姿态保持同一语义身份</text><text x="526" y="634" fill="#737b86" font-size="18" font-weight="400">下屏可用时显示任务</text><text x="526" y="661" fill="#737b86" font-size="18" font-weight="400">不强迫其他 Agent 抢布局</text><text x="950" y="634" fill="#737b86" font-size="18" font-weight="400">键盘占位后收为任务条</text><text x="950" y="661" fill="#737b86" font-size="18" font-weight="400">不同时要求下屏承载完整面板</text><line x1="42" y1="727" x2="1358" y2="727" stroke="#e3e5e9" stroke-width="2"/><text x="42" y="760" fill="#737b86" font-size="18" font-weight="400">跨姿态保持任务和语义对象；未提交笔迹重新核对位置，防止坐标漂移。</text><text x="42" y="788" fill="#737b86" font-size="18" font-weight="400">依据实际机型、OS、键盘和笔的支持范围验证；此布局是设计候选。</text></g></svg>