<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/svg+xml" href="../../deveco-intui-kit/icons/deveco-code-logo-16.svg">
<title>冷启动分析报告：Agent 出结论、出补丁、真机复测</title>
<link rel="stylesheet" href="../../deveco-intui-kit/src/tokens.css">
<link rel="stylesheet" href="../../deveco-intui-kit/src/components.css">
<link rel="stylesheet" href="../../deveco-intui-kit/src/ai.css">
<link rel="stylesheet" href="../_shared/frame.css">
<link rel="stylesheet" href="../_shared/guide.css">
<script src="../../deveco-intui-kit/src/icons.js"></script>
<script src="../../deveco-intui-kit/icons/ai-icons.js"></script>
<script src="../_shared/frame.js"></script>
<script src="../_shared/guide.js"></script>
<style>
  .ide[data-ide-theme]{--proj-w:clamp(260px,20vw,300px)}
  /* ---- 编辑区：单独占满 / 分屏并排 ---- */
  #editor-body{flex:1;display:flex;min-height:0;min-width:0;overflow:hidden}
  #editor-body>[hidden]{display:none!important}
  #editor-body>*{flex:1;min-width:0;min-height:0}
  .editor.split #editor-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .editor.split #editor-body>*{border-left:1px solid var(--ui-border)}
  .editor.split #editor-body>.report{border-left:0}
  .tab.split-on::after{background:var(--ui-accent)}
  /* ---- 报告本体：卡片用填充分层，不画描边 ---- */
  .report{overflow:auto;min-height:0;padding:16px 18px 28px;display:flex;flex-direction:column;gap:16px;background:var(--ui-editor-bg);color:var(--ui-fg);font-family:var(--font-ui);font-size:var(--fs-para);line-height:var(--lh-para)}
  .report .loc{font-family:var(--font-code);font-size:11px;color:var(--ui-link);cursor:pointer;white-space:nowrap}
  .report .loc:hover{text-decoration:underline}
  .card{border-radius:var(--ai-r);background:var(--ui-bg)}
  .rep-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:60px 0;color:var(--ui-fg-info);font-size:var(--fs-sm)}
  .rep-empty svg{width:22px;height:22px;color:var(--ui-fg-disabled)}

  /* ---- Agent 结论卡：报告由 Agent 生成，结论先行 ---- */
  .report .ai-answer{background:var(--ui-bg)}
  .ai-answer__meta .who{color:var(--ui-fg)}
  .ai-answer__meta .grow{flex:1}
  .ai-answer__lead b{font-weight:600}
  .ai-answer__body code,.ai-approve__why code{font-family:var(--font-code);font-size:12px;padding:0 4px;border-radius:4px;background:var(--ai-surface-2)}
  .ag-trace{display:flex;flex-direction:column;gap:2px;margin:0 -6px}
  .ag-trace .ai-toolrow{cursor:default}
  .ag-trace .ai-toolrow .end .ok{color:var(--ui-success)}
  .ag-trace .ai-toolrow.wait-lease .what{color:var(--ui-fg-info)}
  .report .ai-approve{background:var(--ai-surface-2)}
  .ai-approve__cmd{background:var(--ui-bg)!important}
  .ai-answer__applied .fchip{display:inline-flex;gap:6px;align-items:center;height:22px;padding:0 8px;border-radius:6px;background:var(--ai-surface-2);font-family:var(--font-code);font-size:11px;color:var(--ui-fg);cursor:pointer}
  .ai-answer__applied .fchip:hover{background:var(--ui-hover)}
  .ai-answer__applied .fchip .ad{color:var(--ui-success)}.ai-answer__applied .fchip .rm{color:var(--ui-error)}
  .ai-answer__foot .ai-btn{font-family:var(--font-ui)}
  .ai-answer .ev-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--ui-fg-info)}
  .ai-answer .ev-line code{font-family:var(--font-code);font-size:11px;color:var(--ui-fg)}
  /* 证据 / 推断：证据实底，推断虚边——一眼分得出「量到的」和「猜的」 */
  .tag{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:9px;font-size:11px;line-height:18px;white-space:nowrap;flex:none;font-weight:400}
  .tag.ev{background:var(--ui-tag-bg);color:var(--ui-fg)}
  .tag.inf{background:transparent;color:var(--ui-fg-info);box-shadow:inset 0 0 0 1px var(--ui-component-border)}
  .tag.fixed{background:color-mix(in srgb,var(--ui-success) 16%,transparent);color:var(--ui-success)}

  /* ---- 总览列表 ---- */
  .page-group{cursor:pointer}
  .page-group .chev{transition:transform .15s;color:var(--ui-fg-info);flex:none}
  .page-group[aria-expanded="true"] .chev{transform:rotate(90deg)}
  .page-group svg.i.err{color:var(--ui-error)}
  .page-group svg.i.warn{color:var(--ui-warning)}
  .page-group svg.i.ok{color:var(--ui-success)}
  .page-ops[hidden]{display:none}
  .ov-row{cursor:pointer;gap:10px;padding-left:30px;border-radius:6px}
  .ov-row svg.i{width:15px;height:15px}
  .ov-row.err svg.i{color:var(--ui-error)}
  .ov-row.warn svg.i{color:var(--ui-warning)}
  .ov-row.ok svg.i{color:var(--ui-success)}
  .ov-row .optype{flex:none;font-weight:400}
  .ov-row .ms{font-family:var(--font-code);font-size:12px;min-width:82px;text-align:right}
  .ov-row .chev{transition:transform .15s;color:var(--ui-fg-info)}
  .ov-row[aria-expanded="true"] .chev{transform:rotate(90deg)}
  .ov-row .by{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--ui-fg-info);flex:none}
  .ov-row .by .ai-ring{width:10px;height:10px}
  .ov-row .ai-gmark{flex:none}
  .ov-note{margin:2px 12px 6px 58px;border:0;background:var(--ui-bg)}
  .ov-note .tag{margin-right:6px;vertical-align:1px}
  .ov-search{width:100%;height:26px;padding:0 8px;border:1px solid var(--ui-component-border);border-radius:6px;background:var(--ui-field-bg);color:var(--ui-fg);font:inherit;font-size:12px;outline:none}
  .ov-search:focus{border-color:var(--ui-accent)}
  .ov-search::placeholder{color:var(--ui-fg-disabled)}
  .ov-row .delta{font-family:var(--font-code);font-size:11px;min-width:40px;text-align:right;display:inline-flex;align-items:center;gap:2px;justify-content:flex-end}
  .ov-row .delta svg{width:9px;height:9px}
  .ov-row .delta.up{color:var(--ui-success)}
  .ov-row .delta.down{color:var(--ui-error)}
  .ov-row .delta.flat{color:var(--ui-fg-disabled)}
  .dm-seg{border:0;background:var(--ui-bg);padding:2px;border-radius:8px}
  .dm-seg button{border-radius:6px}
  .dm-seg button + button{border-left:0}
  .dm-seg button.on{background:var(--ui-tag-bg);font-weight:500}

  /* ---- 下钻：总分 ---- */
  .rep-score{display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap;padding:14px 16px}
  .rep-score .dm-score{flex:none}
  .rep-meta{flex:1;min-width:230px;align-content:start;font-size:var(--fs-sm);line-height:1.9}
  .rep-meta dd{display:flex;align-items:center;gap:6px}
  /* ---- 启动阶段瀑布：基础耗时中性灰，只有可优化段用状态色 ---- */
  .dm-chart{border:0;background:var(--ui-bg);border-radius:var(--ai-r)}
  .wf-plot{position:relative;padding-top:2px}
  .wf-labels{display:flex;align-items:flex-end;gap:2px;min-height:50px}
  .wf-lab{display:flex;flex-direction:column;align-items:center;text-align:center;gap:1px;font-size:10px;line-height:1.35;color:var(--ui-fg-info);padding:0 2px}
  .wf-lab b{font-size:11px;font-weight:600;color:var(--ui-fg);white-space:nowrap}
  .wf-lab .rk{margin-right:2px;font-weight:500}
  .wf-lab .rk.err{color:var(--ui-error)}
  .wf-lab .rk.warn{color:color-mix(in srgb,var(--ui-warning) 82%,var(--ui-fg))}
  .wf-lab .bad-note{font-weight:500;white-space:nowrap}
  .wf-lab .bad-note.err{color:var(--ui-error)}
  .wf-lab .bad-note.warn{color:color-mix(in srgb,var(--ui-warning) 82%,var(--ui-fg))}
  .wf-lab .bad-note.fixed{color:var(--ui-success)}
  .wf-bars{display:flex;gap:2px;height:30px}
  .wf-seg{display:flex;height:100%;border-radius:4px;overflow:hidden}
  .wf-ok{background:var(--ui-fg-disabled)}
  .wf-bad{cursor:pointer}
  .wf-bad.err{background:var(--ui-error)}
  .wf-bad.warn{background:var(--ui-warning)}
  .wf-bad:hover{filter:brightness(1.15)}
  .wf-thresh{position:absolute;top:0;bottom:0;left:var(--x);border-left:1.5px dashed var(--ui-warning);pointer-events:none}
  .wf-thresh b{position:absolute;bottom:-19px;left:4px;font-size:10px;font-weight:500;color:var(--ui-fg-info);white-space:nowrap;background:var(--ui-bg);padding:0 2px}
  .wf-thresh.end b{left:auto;right:4px}
  .wf-axis{display:flex;justify-content:space-between;margin-top:4px;font-family:var(--font-code);font-size:10px;color:var(--ui-fg-info)}
  /* ---- 根因卡片 ---- */
  .cause{border:0;background:var(--ui-bg);border-radius:var(--ai-r)}
  .cause .dm-card-hd{border-bottom:0;padding-bottom:0;font-weight:500}
  .cause .dm-card-ft{border-top:0;background:transparent}
  .cause.sel{box-shadow:inset 0 0 0 1px var(--ui-component-border)}
  .cause .dm-card-hd svg{width:16px;height:16px;flex:none}
  .cause.err .dm-card-hd svg{color:var(--ui-error)}
  .cause.warn .dm-card-hd svg{color:var(--ui-warning)}
  .cause.done .dm-card-hd svg{color:var(--ui-success)}
  .cause .why{font-size:12px;color:var(--ui-fg-info)}
  .rep-tbl{width:100%;border-collapse:collapse;font-size:11px;margin:2px 0}
  .rep-tbl th,.rep-tbl td{padding:4px 8px;text-align:left;vertical-align:top;border-bottom:1px solid var(--ui-border)}
  .rep-tbl th{font-weight:500;color:var(--ui-fg-info)}
  .rep-tbl td code,.cause code{font-family:var(--font-code);font-size:11px;background:var(--ui-tag-bg);padding:1px 4px;border-radius:4px;color:var(--ui-fg)}
  /* ---- 代码与根因的联动标识 ---- */
  .code-wrap .cause-pill{position:absolute;right:14px;top:8px;z-index:3;height:22px}
  .code .ln.cause-hl{position:relative}
  .code .ln.cause-hl.err{background:color-mix(in srgb,var(--ui-error) 16%,transparent)}
  .code .ln.cause-hl.warn{background:color-mix(in srgb,var(--ui-warning) 18%,transparent)}
  .code .ln.ai-block{position:relative}
  .code .ln.ai-block .ai-gut{z-index:3}
</style>
</head>
<body>
<div class="ide" id="ide" data-ide-theme="dark" data-left="none" data-right="none" data-bottom="none" role="application" aria-label="DevEco Studio">
  <div class="body">
    <div class="tw tw-left">
      <div class="pane on" data-pane="project">
        <div class="tw-hdr"><span class="title">Project <svg class="i"><use href="#i-chevD"/></svg></span><span class="grow"></span>
          <button class="abtn" title="Select Opened File"><svg class="i"><use href="#i-locate"/></svg></button>
          <button class="abtn" title="Collapse All"><svg class="i"><use href="#i-collapseAll"/></svg></button>
          <button class="abtn" title="Hide|Shift+Esc" data-act="hide-left"><svg class="i"><use href="#i-hide"/></svg></button></div>
        <div class="tw-body" id="tree-slot"></div>
      </div>
    </div>

    <div class="editor">
      <div class="tabs" id="tabs">
        <button class="tab on" data-file="__report__"><svg class="i"><use href="#i-gauge"/></svg>冷启动分析报告<span class="x"><svg class="i"><use href="#i-closeS"/></svg></span></button>
        <span class="grow"></span>
        <span class="tab-tools">
          <button class="btn sm" id="split-exit" hidden><svg class="i" style="width:12px;height:12px"><use href="#i-closeS"/></svg>退出分屏</button>
        </span>
      </div>

      <div id="editor-body">
      <div class="report" data-for-file="__report__" id="report">
        <div id="agent-card" style="margin-bottom:6px"></div>

        <div id="rep-overview">
          <div class="dm-group">冷启动总览 · 按得分排序<span class="cnt" id="ov-cnt">0</span><span class="grow"></span>
            <span class="dm-seg" id="ov-filter">
              <button class="on" data-f="problem">有问题<span class="dm-mono dm-muted" id="ov-cnt-problem" style="margin-left:4px"></span></button>
              <button data-f="all">全部<span class="dm-mono dm-muted" id="ov-cnt-all" style="margin-left:4px"></span></button>
            </span>
          </div>
          <div class="dm-row" style="padding:0 12px 8px">
            <input type="text" class="ov-search" id="ov-search" placeholder="按页面或操作名搜索…">
          </div>
          <div class="dm-list" id="ov-list"></div>
          <div class="rep-empty" id="ov-empty" hidden><svg><use href="#i-check"/></svg>没有匹配的项</div>
        </div>

        <div id="rep-detail" hidden>
          <div class="dm-row" id="rep-crumb" style="margin-bottom:12px">
            <button class="btn sm" id="btn-back"><svg class="i" style="width:12px;height:12px;transform:rotate(180deg)"><use href="#i-arrowR"/></svg>返回总览</button>
            <span class="dm-muted dm-small" id="rep-crumb-txt"></span>
          </div>
          <div class="dm-col" style="gap:16px">
          <div class="rep-score card">
            <div class="dm-score err" id="score-block">
              <div class="ring"><svg viewBox="0 0 88 88"><circle class="track" cx="44" cy="44" r="40"/><circle class="val" id="score-val" cx="44" cy="44" r="40"/></svg>
                <div class="num"><b id="score-num">0</b><span>/ 100</span></div>
              </div>
              <div class="info">
                <span class="dm-pill err grade" id="score-grade"></span>
                <div class="headline" id="score-headline">2095.66 ms</div>
                <div class="dm-muted dm-small" id="score-note"></div>
              </div>
            </div>
            <dl class="dm-kv rep-meta">
              <dt>启动页面</dt><dd><span class="dm-mono">entry:Index</span> · 操作 1 · 完成时延</dd>
              <dt>较上次</dt><dd id="score-delta"></dd>
            </dl>
          </div>

          <div class="dm-chart" id="wf">
            <div class="ch-t"><b>启动阶段拆分</b><span>· 5 段 · 点深色块看根因</span></div>
            <div class="wf-plot" id="wf-plot">
              <div class="wf-labels" id="wf-labels"></div>
              <div class="wf-bars" id="wf-bars"></div>
              <div class="wf-thresh" id="wf-thresh"><b>门槛 1100 ms</b></div>
            </div>
            <div class="wf-axis"><span>0 ms</span><span id="wf-total">总计 2095.66 ms</span></div>
          </div>

          <div class="rep-causes" id="rep-causes-wrap">
            <div class="dm-group">根因 · 按影响耗时排序<span class="cnt">3</span></div>
            <div class="dm-col" id="cause-list" style="gap:10px"></div>
          </div>
          </div>
        </div>
      </div>

      <div class="code-wrap" data-for-file="EntryAbility.ets" hidden>
        <div class="code" id="code-entry"></div>
        <span class="dm-pill cause-pill" id="cause-pill-entry" hidden></span>
      </div>
      <div class="code-wrap" data-for-file="AdvertisementIndex.ets" hidden>
        <div class="code" id="code-ad"></div>
        <span class="dm-pill cause-pill" id="cause-pill-ad" hidden></span>
      </div>
      </div>
      <div class="breadcrumbs" id="crumbs"></div>
    </div>
  </div>
</div>

<script>
(function(){
  var $=DemoFrame.$, $$=DemoFrame.$$, FILES=DemoFrame.FILES;
  var AGT='Agent·冷启动', OTHER='Agent·列表', DEV='HUAWEI Mate 70 Pro';

  /* ---------- 示例工程：这份报告要跳转到的文件（修复前 / Agent 补丁后） ---------- */
  FILES['__report__']={path:[],crumbs:['冷启动分析报告'],lines:[]};
  var ENTRY_BEFORE=[
    ['<span class="k">import</span> { <span class="ty">UIAbility</span> } <span class="k">from</span> <span class="s">\'@kit.AbilityKit\'</span>;'],
    ['<span class="k">import</span> { <span class="ty">abilityAccessCtrl</span> } <span class="k">from</span> <span class="s">\'@kit.AbilityKit\'</span>;'],
    ['<span class="k">import</span> { <span class="ty">window</span> } <span class="k">from</span> <span class="s">\'@kit.ArkUI\'</span>;'],
    ['<span class="k">import</span> { <span class="f">initSdks</span> } <span class="k">from</span> <span class="s">\'../utils/SdkBootstrap\'</span>;'],
    [''],
    ['<span class="k">export</span> <span class="k">default</span> <span class="k">class</span> <span class="ty">EntryAbility</span> <span class="k">extends</span> <span class="ty">UIAbility</span> {',{fold:1}],
    ['  <span class="f">onCreate</span>(<span class="p">want</span>, <span class="p">launchParam</span>) {',{fold:1}],
    ['    <span class="k">super</span>.<span class="f">onCreate</span>(<span class="p">want</span>, <span class="p">launchParam</span>);'],
    [''],
    ['    <span class="f">initSdks</span>();  <span class="c">// 同步初始化 Push / Analytics / Crash，共 600 ms</span>'],
    ['  }'],
    [''],
    ['  <span class="f">onWindowStageCreate</span>(<span class="p">windowStage</span>: <span class="ty">window</span>.<span class="ty">WindowStage</span>) {',{fold:1}],
    ['    <span class="k">const</span> <span class="p">atManager</span> = <span class="p">abilityAccessCtrl</span>.<span class="f">createAtManager</span>();'],
    [''],
    ['    <span class="p">atManager</span>.<span class="f">requestPermissionsFromUser</span>(<span class="k">this</span>.<span class="p">context</span>, [<span class="s">\'ohos.permission.LOCATION\'</span>]);'],
    [''],
    ['    <span class="p">windowStage</span>.<span class="f">loadContent</span>(<span class="s">\'pages/Index\'</span>, (<span class="p">err</span>) =&gt; {',{fold:1}],
    ['      <span class="k">if</span> (<span class="p">err</span>.<span class="p">code</span>) {'],
    ['        <span class="k">return</span>;'],
    ['      }'],
    ['    });'],
    ['  }'],
    ['}']
  ];
  var ENTRY_AFTER=[
    ['<span class="k">import</span> { <span class="ty">UIAbility</span> } <span class="k">from</span> <span class="s">\'@kit.AbilityKit\'</span>;'],
    ['<span class="k">import</span> { <span class="ty">abilityAccessCtrl</span> } <span class="k">from</span> <span class="s">\'@kit.AbilityKit\'</span>;'],
    ['<span class="k">import</span> { <span class="ty">window</span> } <span class="k">from</span> <span class="s">\'@kit.ArkUI\'</span>;'],
    ['<span class="k">import</span> { <span class="ty">taskpool</span> } <span class="k">from</span> <span class="s">\'@kit.ArkTS\'</span>;'],
    ['<span class="k">import</span> { <span class="f">initSdks</span> } <span class="k">from</span> <span class="s">\'../utils/SdkBootstrap\'</span>;'],
    [''],
    ['<span class="k">export</span> <span class="k">default</span> <span class="k">class</span> <span class="ty">EntryAbility</span> <span class="k">extends</span> <span class="ty">UIAbility</span> {',{fold:1}],
    ['  <span class="f">onCreate</span>(<span class="p">want</span>, <span class="p">launchParam</span>) {',{fold:1}],
    ['    <span class="k">super</span>.<span class="f">onCreate</span>(<span class="p">want</span>, <span class="p">launchParam</span>);'],
    ['  }'],
    [''],
    ['  <span class="f">onWindowStageCreate</span>(<span class="p">windowStage</span>: <span class="ty">window</span>.<span class="ty">WindowStage</span>) {',{fold:1}],
    ['    <span class="p">windowStage</span>.<span class="f">loadContent</span>(<span class="s">\'pages/Index\'</span>, (<span class="p">err</span>) =&gt; {',{fold:1}],
    ['      <span class="k">if</span> (<span class="p">err</span>.<span class="p">code</span>) {'],
    ['        <span class="k">return</span>;'],
    ['      }'],
    ['      <span class="ty">taskpool</span>.<span class="f">execute</span>(<span class="f">initSdks</span>);  <span class="c">// 首帧后放子线程，不挡数据请求</span>'],
    ['      <span class="k">const</span> <span class="p">atManager</span> = <span class="p">abilityAccessCtrl</span>.<span class="f">createAtManager</span>();  <span class="c">// 首帧画完再申请定位</span>'],
    ['      <span class="p">atManager</span>.<span class="f">requestPermissionsFromUser</span>(<span class="k">this</span>.<span class="p">context</span>, [<span class="s">\'ohos.permission.LOCATION\'</span>]);'],
    ['    });'],
    ['  }'],
    ['}']
  ];
  var AD_BEFORE=[
    ['<span class="k">import</span> { <span class="ty">AdConfig</span> } <span class="k">from</span> <span class="s">\'../model/AdConfig\'</span>;'],
    [''],
    ['<span class="m">@Entry</span>'],
    ['<span class="m">@Component</span>'],
    ['<span class="k">struct</span> <span class="ty">AdvertisementIndex</span> {',{fold:1}],
    ['  <span class="m">@State</span> <span class="p">ad</span>: <span class="ty">AdConfig</span> | <span class="k">null</span> = <span class="k">null</span>;'],
    [''],
    ['  <span class="f">aboutToAppear</span>() {',{fold:1}],

  }
  function meta(){
    return '<div class="ai-answer__meta"><svg><use href="#ai-logo-16"/></svg><span>报告由 <span class="who">'+AGT+'</span> 生成 · '+DEV+' · API 20 · 3 次冷启动 trace · <span id="ag-age">7 分钟前</span></span><span class="grow"></span>'
      +'<button class="ai-btn ai-btn--quiet" id="ag-rescan" type="button">'+(S.phase==='rescan'?'<span class="ai-ring"></span>采集中':'重新采集')+'</button>'
      +'<button class="ai-btn ai-btn--quiet" id="btn-export" type="button">导出</button></div>';
  }
  var LEAD_BEFORE='图标冷启动 <b>2096 ms</b>，超门槛 1100 ms 的 90%。卡在 3 处应用代码，修掉预计降到约 770 ms。';
  var BODY_BEFORE='① 广告排序 668 ms、② SDK 同步初始化 480 ms 是 trace 实测 <span class="tag ev">证据</span>；③ 首帧前弹定位权限 180 ms 是按时间重叠 <span class="tag inf">推断</span>。ListPage 白块归 '+OTHER+' 的任务，这里不修。';
  function renderAgent(){
    var c=$('#agent-card'),p=S.phase,h='';
    if(p==='report'||p==='rescan'){
      h='<div class="ai-answer">'+meta()+'<p class="ai-answer__lead">'+LEAD_BEFORE+'</p><p class="ai-answer__body">'+BODY_BEFORE+'</p>'
        +'<div class="ai-answer__foot"><button class="ai-btn ai-btn--primary" id="ag-fix" type="button"><svg><use href="#ai-fix"/></svg>让 Agent 修这 3 处</button>'
        +'<button class="ai-btn" id="ag-manual" type="button">自己看根因</button><span class="grow"></span>'
        +'<span class="ai-fb"><button type="button" title="有用"><svg><use href="#ai-thumb-up"/></svg></button><button type="button" title="没用"><svg><use href="#ai-thumb-down"/></svg></button></span></div></div>';
    }else if(p==='read'||p==='patch'||p==='wait'){
      var rows=row('read',p==='read'?'run':'ok')+(p!=='read'?row('patch',p==='patch'?'run':'ok'):'');
      h='<div class="ai-answer">'+meta()+'<p class="ai-answer__lead">'+LEAD_BEFORE+'</p><div class="ag-trace">'+rows+'</div>';
      if(p==='wait'){
        h+='<div class="ai-approve" id="ag-approve"><div class="ai-approve__h"><span class="ai-wait-dot"></span>在等你 · 装到 '+DEV+' 上复测？</div>'
          +'<p class="ai-approve__why">补丁改 2 个文件 3 处：排序挪进 <code>taskpool</code> 并缓存、SDK 与定位权限挪到首帧后。复测要重装应用、冷启动 5 次，<b>会清掉这台上的应用数据</b>。③ 是推断，实际可能省不到 180 ms。</p>'
          +'<div class="ai-approve__cmd">hvigorw assembleHap &amp;&amp; hdc -t 5G3AC2 install -r entry-default-signed.hap</div>'
          +'<div class="ai-approve__act"><button class="ai-btn ai-btn--primary" id="ag-go" type="button">应用并复测</button>'
          +'<button class="ai-btn ai-btn--fill" id="ag-peek" type="button">先看补丁</button>'
          +'<button class="ai-btn" id="ag-no" type="button">不用了</button></div></div>';
      }
      h+='</div>';
    }else if(p==='lease'||p==='build'||p==='cold'){
      var st={lease:0,build:1,cold:2}[p];
      var rs=row('read','ok')+row('patch','ok')+row('lease',st===0?'run':'ok',st===0?'还要 6 s':'')+(st>=1?row('build',st===1?'run':'ok'):'')+(st>=2?row('cold','run','<span id="ag-cold-n">1 / 5</span>'):'');
      h='<div class="ai-answer">'+meta()+'<p class="ai-answer__lead">补丁已写入，正在 '+DEV+' 上复测。</p><div class="ag-trace">'+rs+'</div></div>';
    }else if(p==='done'){
      var sc=scoreOf(total(),THRESHOLD);
      h='<div class="ai-answer" id="ag-done">'+meta()
        +'<p class="ai-answer__lead">修好了：图标冷启动 <b>2096 → 948 ms</b>，52 → '+sc+' 分，进门槛。</p>'
        +'<p class="ai-answer__body">深链接拉起、通知拉起跟着降到 902 / 871 ms。比预计多 178 ms：① 首次打开仍要排一次，③ 实省 120 ms，比推断少 60 ms。</p>'
        +'<div class="ev-line"><span class="tag ev">证据</span>任务「冷启动修复」· '+AGT+' · '+DEV+' · 5 次 trace <code>coldstart_fix_01…05.htrace</code></div>'
        +(S.accepted?'<div class="ai-answer__applied"><span class="ai-src"><span class="ai-spark"></span>由 '+AGT+' 改 · 2 个文件<i>·</i><button type="button" id="ag-revert2">退回</button></span></div>'
          :'<div class="ai-answer__applied">已写入 2 个文件 · 可退回 <span class="fchip" data-file="AdvertisementIndex.ets">AdvertisementIndex.ets <span class="ad">+8</span><span class="rm">−5</span></span><span class="fchip" data-file="EntryAbility.ets">EntryAbility.ets <span class="ad">+6</span><span class="rm">−1</span></span></div>')
        +'<div class="ai-answer__foot">'+(S.accepted?'':'<button class="ai-btn ai-btn--primary" id="ag-accept" type="button">接受改动</button><button class="ai-btn" id="ag-takeover" type="button">接手改代码</button><button class="ai-btn" id="ag-revert" type="button"><svg><use href="#ai-revert"/></svg>退回</button>')
        +'<span class="grow"></span><span class="ai-fb"><button type="button" title="有用"><svg><use href="#ai-thumb-up"/></svg></button><button type="button" title="没用"><svg><use href="#ai-thumb-down"/></svg></button></span></div></div>';
    }
    c.innerHTML=h;
  }
  function later(fn,ms){S.timers.push(setTimeout(fn,ms))}
  function clearTimers(){S.timers.forEach(clearTimeout);S.timers=[]}
  function go(p){S.phase=p;renderAgent()}
  function startFix(){
    if(S.phase!=='report')return;
    go('read');
    later(function(){go('patch')},900);
    later(function(){S.patched=true;renderCode();renderCauses();go('wait')},1900);
  }
  function approve(){
    go('lease');
    later(function(){go('build')},1200);
    later(function(){go('cold');var n=1,t=setInterval(function(){n++;var el=$('#ag-cold-n');if(el)el.textContent=n+' / 5';if(n>=5)clearInterval(t)},320);S.timers.push(t)},2400);
    later(function(){
      S.fixed=true;go('done');renderOverview();renderScore();renderWaterfall();renderCauses();
      $$('.ov-row .ai-gmark').forEach(function(m){var r=m.closest('.ov-row');r.classList.add('ai-touched')});
    },4300);
  }
  function revert(){
    clearTimers();S.fixed=false;S.patched=false;S.accepted=false;
    if($('.editor').classList.contains('split'))exitSplit();
    renderCode();renderOverview();renderScore();renderWaterfall();renderCauses();go('report');
  }

  /* ---------- 交互：点色块 / 点定位 → 代码分屏打开，报告和代码同时看得见 ---------- */
  function ensureTab(file){
    if($('.tab[data-file="'+file+'"]'))return;
    $('#tabs .grow').insertAdjacentHTML('beforebegin',DemoFrame.tabs([{file:file}]));
  }
  function findCauseIdx(file,line){
    for(var i=0;i<CAUSES.length;i++)if(CAUSES[i].file===file&&causeLine(CAUSES[i])===line)return i;
    return null;
  }
  var PILL_ID={'EntryAbility.ets':'cause-pill-entry','AdvertisementIndex.ets':'cause-pill-ad'};
  function highlightLine(file,line,causeIdx){
    var box=$('[data-for-file="'+file+'"] .code');if(!box)return;
    $$('.ln.cur',box).forEach(function(x){x.classList.remove('cur','cause-hl','err','warn')});
    var ln=$('.ln[data-ln="'+line+'"]',box),c=causeIdx!=null?CAUSES[causeIdx]:null;
    if(ln){ln.classList.add('cur');if(c&&!S.patched)ln.classList.add('cause-hl',c.sev);ln.scrollIntoView({block:'center'});}
    var p=$('#status-pos');if(p)p.textContent=line+':1';
    var pill=$('#'+PILL_ID[file]);
    if(pill){
      if(c){
        pill.className='dm-pill cause-pill '+(S.patched?'muted':c.sev);
        pill.innerHTML=S.patched?('根因 '+RANK[causeIdx]+' 的补丁 · 悬停左侧竖条看来源'):('<svg style="width:11px;height:11px"><use href="#i-'+(c.sev==='err'?'err':'warn')+'"/></svg>根因 '+RANK[causeIdx]+' · '+c.phase+' · -'+fmt(c.impact)+' ms');
        pill.hidden=false;
      }else pill.hidden=true;
    }
  }
  function enterSplit(file,line,causeIdx){
    if(causeIdx===undefined)causeIdx=findCauseIdx(file,line);
    ensureTab(file);
    var tab=$('.tab[data-file="'+file+'"]');if(tab)tab.click();
    $('#report').hidden=false;
    $('.editor').classList.add('split');
    $$('.tab[data-file]').forEach(function(t){t.classList.toggle('split-on',t.dataset.file==='__report__'||t.dataset.file===file)});
    $('#split-exit').hidden=false;
    highlightLine(file,line,causeIdx);
  }
  function exitSplit(){
    $('.editor').classList.remove('split');
    $$('.tab.split-on').forEach(function(t){t.classList.remove('split-on')});
    $('#split-exit').hidden=true;
    $$('.cause-pill').forEach(function(p){p.hidden=true});
    var rep=$('.tab[data-file="__report__"]');if(rep)rep.click();
  }
  function openCause(idx){
    var c=CAUSES[idx];if(!c)return;
    $$('.cause').forEach(function(x){x.classList.remove('sel')});
    var card=$('.cause[data-idx="'+idx+'"]');
    if(card){card.classList.add('sel');card.scrollIntoView({block:'nearest'});}
    enterSplit(c.file,causeLine(c),idx);
  }

  DemoFrame.init({device:DEV,deviceIcon:'#i-phone',pos:'1:1',workspace:false,onReady:function(){
    $('#tree-slot').innerHTML=DemoFrame.tree({sel:'EntryAbility.ets'});
    renderCode();renderOverview();renderScore();renderWaterfall();renderCauses();renderAgent();

    $('#ov-search').addEventListener('input',function(e){ovQuery=e.target.value;applyOverviewFilter()});

    document.getElementById('ide').addEventListener('click',function(e){
      var tabBtn=e.target.closest('#tabs .tab[data-file]');
      if(tabBtn){
        $('.editor').classList.remove('split');
        $$('.tab.split-on').forEach(function(t){t.classList.remove('split-on')});
        $('#split-exit').hidden=true;
      }
      if(e.target.closest('#split-exit')){exitSplit();return;}
      /* Agent 主流程 */
      if(e.target.closest('#ag-fix')){startFix();return;}
      if(e.target.closest('#ag-go')){approve();return;}
      if(e.target.closest('#ag-peek')){openCause(0);return;}
      if(e.target.closest('#ag-no')){revert();return;}
      if(e.target.closest('#ag-accept')){S.accepted=true;renderCode();renderAgent();return;}
      if(e.target.closest('#ag-takeover')){openCause(0);return;}
      if(e.target.closest('#ag-revert')||e.target.closest('#ag-revert2')){revert();return;}
      var fc=e.target.closest('.fchip[data-file]');
      if(fc){var ci=fc.dataset.file==='AdvertisementIndex.ets'?0:1;openCause(ci);return;}
      if(e.target.closest('#ag-manual')){showDetail(OVERVIEW[0]);return;}
      if(e.target.closest('#ag-rescan')){
        if(S.phase!=='report')return;
        go('rescan');later(function(){go('report');var a=$('#ag-age');if(a)a.textContent='刚刚'},1000);
        return;
      }
      if(e.target.closest('#btn-export')){
        var b=e.target.closest('#btn-export');if(b.dataset.busy)return;b.dataset.busy='1';
        b.textContent='已导出';setTimeout(function(){b.textContent='导出';delete b.dataset.busy},1600);
        return;
      }
      /* 手动：总览 → 下钻 → 根因 → 代码 */
      var flt=e.target.closest('#ov-filter button');
      if(flt){
        $$('#ov-filter button').forEach(function(b){b.classList.toggle('on',b===flt)});
        ovFilter=flt.dataset.f;applyOverviewFilter();return;
      }
      var grp=e.target.closest('.page-group');
      if(grp){ovPageState[grp.dataset.page]=grp.getAttribute('aria-expanded')!=='true';applyOverviewFilter();return;}
      var row=e.target.closest('.ov-row');
      if(row){
        var o=OVERVIEW[+row.dataset.idx];
        if(o.drill){showDetail(o);return;}
        var open=row.getAttribute('aria-expanded')==='true';
        $$('.ov-note').forEach(function(n){n.remove()});
        $$('.ov-row[aria-expanded="true"]').forEach(function(r){r.setAttribute('aria-expanded','false')});
        if(!open){
          var ok=o._grade.cls==='ok';
          row.insertAdjacentHTML('afterend','<div class="dm-callout ov-note"><svg style="color:var(--ui-'+(ok?'success':'fg-info')+')"><use href="#i-'+(ok?'check':'info')+'"/></svg><div>'+(S.fixed&&o.after?'<span class="tag fixed">复测</span>'+AGT+' 在 '+DEV+' 上复测 5 次，中位数 '+o.after.toFixed(0)+' ms。':o.note)+'</div></div>');
          row.setAttribute('aria-expanded','true');
        }
        return;
      }
      if(e.target.closest('#btn-back')){showOverview();return;}
      var bad=e.target.closest('.wf-bad');
      if(bad){openCause(+bad.dataset.cause);return;}
      var loc=e.target.closest('.report .loc');
      if(loc){enterSplit(loc.dataset.file,+loc.dataset.line);return;}
      var x=e.target.closest('.tab .x');
      if(x){
        var t=x.closest('.tab'),wasOn=t.classList.contains('on');
        if(t.dataset.file==='__report__')return;
        t.remove();
        if(wasOn){var rep=$('.tab[data-file="__report__"]');if(rep)rep.click();}
      }
    });
  }});
  DemoGuide.init([
    {target:'#ag-fix',kind:'click',pos:'bottom',label:'交给 Agent：出补丁、真机复测'},
    {target:'#ag-go',kind:'click',pos:'bottom',label:'在等你：拍板装机复测'},
    {target:'#ag-done .ev-line code',kind:'change',pos:'right',label:'复测证据归档到本任务，总览分数跟着回填'},
    {target:'#ag-manual',kind:'click',pos:'right',label:'想自己看：瀑布与根因'}
  ],{scene:{
    at:'Agent 刚跑完冷启动 trace，报告说图标启动 2.1 秒',
    goal:'知道慢在哪几行，修掉并在真机上确认进门槛',
    pain:'自己翻瀑布对 trace，改完再手动冷启动几次取平均',
    fix:'结论先行，每条标证据或推断；一键修，真机复测回填',
    agent:'它采 trace、归因、出补丁复测；别的 Agent 的项只读；你拍板装机'
  }});
})();
</script>
</body>
</html>
