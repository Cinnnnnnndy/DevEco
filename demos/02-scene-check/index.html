<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='32' y2='32' gradientUnits='userSpaceOnUse'%3E%3Cstop stop-color='%232C8DDD'/%3E%3Cstop offset='1' stop-color='%233357AC'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='7' fill='url(%23g)'/%3E%3Ctext x='16' y='22.5' font-family='Arial,Helvetica,sans-serif' font-size='13' font-weight='700' fill='white' text-anchor='middle'%3EDE%3C/text%3E%3C/svg%3E">
<title>02 · 场景化应用体检：上架会被打回的，写代码时就暴露</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../../deveco-intui-kit/src/tokens.css">
<link rel="stylesheet" href="../../deveco-intui-kit/src/components.css">
<link rel="stylesheet" href="../_shared/frame.css">
<link rel="stylesheet" href="../_shared/guide.css">
<script src="../../deveco-intui-kit/src/icons.js"></script>
<script src="../_shared/frame.js"></script>
<script src="../_shared/guide.js"></script>
<style>
  .ide[data-ide-theme]{--bottom-h:clamp(300px,40vh,400px);--ai-w:clamp(280px,20vw,320px)} /* 带属性选择器，压过 tokens.css 里按主题写的默认值 */
  .ide[data-ide-theme][data-scene="journey"]{--bottom-h:clamp(340px,44vh,440px)} /* 用户旅程：步骤 + 失败现场要多一点高度 */
  /* 底部体检面板标题栏 */
  .tw-bottom .tw-hdr .title{margin-right:4px}
  .btab .cnt{font-family:var(--font-code);font-size:11px;font-weight:400;color:var(--ui-fg-info);margin-left:2px}
  .btab.on .cnt{color:var(--ui-fg-info)}
  .btab .cnt.bad,.btab.on .cnt.bad{color:var(--ui-error)}
  .btab svg.i{width:14px;height:14px}
  .btab.on svg.i{color:var(--ui-fg)}
  #auto-pill{margin-right:6px}
  #auto-pill .spin{width:10px;height:10px;border-width:1.5px}
  /* 面板主体：左列表 + 右详情 */
  .chk{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 360px;min-height:0;height:100%}
  .chk-list{overflow:auto;min-height:0;border-right:1px solid var(--ui-border);padding:4px 0}
  .chk-list .dm-item{cursor:default}
  .chk-list .dm-item svg.i{width:14px;height:14px}
  .chk-list .dm-item.err svg.i{color:var(--ui-error)}
  .chk-list .dm-item.warn svg.i{color:var(--ui-warning)}
  .chk-list .dm-item .msg{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
  .chk-list .dm-item .loc{flex:none}
  .chk-list .dm-item .loc.dead{color:var(--ui-fg-info)}
  .chk-list .dm-item .dm-pill{flex:none}
  .chk-list .dm-item .dm-pill .spin{width:9px;height:9px;border-width:1.5px}
  .chk-list .empty-ok{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:40px 0;color:var(--ui-fg-info);font-size:var(--fs-sm)}
  .chk-list .empty-ok svg{width:24px;height:24px;color:var(--ui-success)}
  code{font-family:var(--font-code);font-size:11px;background:var(--ui-tag-bg);padding:1px 4px;border-radius:4px;color:var(--ui-fg)}
  .chk-detail{overflow:auto;min-height:0;display:flex;flex-direction:column;gap:10px;padding:10px 14px 10px;font-size:var(--fs-para);line-height:var(--lh-para)}
  .chk-detail .dt-head{display:flex;align-items:flex-start;gap:8px;font-weight:600}
  .chk-detail .dt-head svg{width:16px;height:16px;flex:none;margin-top:1px}
  .chk-detail .dt-head.err svg{color:var(--ui-error)}
  .chk-detail .dt-head.warn svg{color:var(--ui-warning)}
  .chk-detail .dt-loc{display:flex;align-items:center;gap:6px;font-size:var(--fs-sm);color:var(--ui-fg-info)}
  .chk-detail .dt-loc .loc{font-family:var(--font-code);font-size:11px;color:var(--ui-link)}
  .chk-detail .dt-loc svg{width:14px;height:14px}
  .chk-detail .dt-h{font-size:var(--fs-sm);line-height:var(--lh-sm);font-weight:600;color:var(--ui-fg-info);margin-bottom:3px}
  .chk-detail ul{margin:0;padding-left:16px}
  .chk-detail li{margin:1px 0}
  .chk-detail p{margin:0}
  .chk-detail .grow{flex:1}
  .chk-detail .dt-acts{display:flex;gap:6px;flex:none;padding-top:2px}
  .chk-detail .dt-acts .grow{flex:1}
  .chk-detail .dt-acts .dm-muted{font-size:var(--fs-sm)}

  /* ---------- 上架自检里的「一起跑的旅程」 ---------- */
  .chk-list .dm-group.jr-grp{margin-top:6px}
  .chk-list .dm-item.jr-pub svg.i{color:var(--ui-info)}
  .chk-list .dm-item.jr-pub.err svg.i{color:var(--ui-error)}
  .chk-list .dm-item.jr-new{color:var(--ui-fg-info)}
  .chk-list .dm-item.jr-new svg.i{color:var(--ui-fg-info)}
  .chk-list .dm-item.jr-new:hover{color:var(--ui-fg)}

  /* ---------- 用户旅程：左 步骤，右 详情 ---------- */
  .jr{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 420px;min-height:0;height:100%}
  .jr-main{display:flex;flex-direction:column;min-height:0;min-width:0;border-right:1px solid var(--ui-border)}
  .jr-compose{flex:none;display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--ui-border)}
  .jr-compose > svg.i{color:var(--ui-info)}
  .jr-prompt{flex:1;min-width:0;height:28px;border:1px solid var(--ui-component-border);border-radius:6px;background:var(--ui-field-bg);color:var(--ui-fg);font:inherit;font-size:var(--fs-para);padding:0 10px;outline:none;user-select:text}
  .jr-prompt:focus{border-color:var(--ui-accent)}
  .jr-tools{display:flex;gap:6px;flex:none}
  .jr .btn,.jr-foot .btn{height:26px;white-space:nowrap}
  .jr .btn svg.i,.jr-foot .btn svg.i{width:12px;height:12px}
  .jr .btn.primary svg.i,.jr-foot .btn.primary svg.i{color:var(--ui-accent-fg)}
  .jr .btn[disabled],.jr-foot .btn[disabled]{opacity:.5}
  .jr .dm-pill .spin,.jr-foot .dm-pill .spin,.jr-sum .spin{width:9px;height:9px;border-width:1.5px}
  .jr-sum{flex:none}
  .jr-sum .jr-sumr{display:inline-flex;align-items:center;gap:6px;font-weight:400;font-size:var(--fs-sm);color:var(--ui-fg-info)}
  .jr-sum .bad{color:var(--ui-error);font-weight:600}
  .jr-sum .good{color:var(--ui-success);font-weight:600}
  .jr-steps{flex:1;overflow:auto;min-height:0;padding:2px 0 10px}
  .jr-step{display:grid;grid-template-columns:18px auto minmax(0,1fr);gap:10px;align-items:start;padding:4px 12px 4px 10px;border-left:2px solid transparent;cursor:default}
  .jr-step:hover{background:var(--ui-hover-list)}
  .jr-step.sel{background:var(--ui-selection)}
  .jr-step.run{border-left-color:var(--ui-accent);background:color-mix(in srgb,var(--ui-accent) 14%,transparent)}
  .jr-step.fail{border-left-color:var(--ui-error)}
  .jr-step.skip .jr-body,.jr-step.skip .jr-thumb{opacity:.55}
  .jr-step.enter{animation:jrin .3s ease-out both;animation-delay:var(--d,0s)}
  @keyframes jrin{from{opacity:0;transform:translateY(4px)}}
  .jr-no{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:600;background:var(--ui-tag-bg);color:var(--ui-fg-info);margin-top:3px}
  .jr-step.pass .jr-no{background:var(--ui-success);color:var(--ui-accent-fg)}
  .jr-step.fail .jr-no{background:var(--ui-error);color:var(--ui-accent-fg)}
  .jr-step.run .jr-no{background:var(--ui-accent);color:var(--ui-accent-fg)}
  .jr-thumb{width:28px;height:63px;border-radius:4px;overflow:hidden;position:relative;border:1px solid var(--ui-component-border);background:var(--ui-tag-bg);display:grid;place-items:center;flex:none}
  .jr-thumb.none svg.i{width:12px;height:12px;color:var(--ui-fg-disabled)}
  .jr-thumb .jr-scr{position:absolute;left:0;top:0;transform:scale(.1707);transform-origin:0 0}
  .jr-thumb.lg{width:50px;height:113px}
  .jr-thumb.lg .jr-scr{transform:scale(.305)}
  .jr-step.pass .jr-thumb{border-color:color-mix(in srgb,var(--ui-success) 70%,transparent)}
  .jr-step.fail .jr-thumb{border-color:var(--ui-error)}
  .jr-step.run .jr-thumb{border-color:var(--ui-accent)}
  .jr-scr{width:164px;height:370px;background:#fff;color:#1a1a1a;font-family:var(--font-ui);font-size:11px;line-height:1.4;overflow:hidden;position:relative}
  .jr-body{min-width:0;display:flex;flex-direction:column;gap:1px}
  .jr-l1,.jr-l2,.jr-l3{display:flex;align-items:center;gap:8px;min-width:0}
  .jr-l1 .grow{flex:1}
  .jr-name,.jr-exp{min-width:0;height:22px;border:1px solid transparent;border-radius:5px;background:transparent;color:var(--ui-fg);font:inherit;font-size:var(--fs-para);padding:0 6px;outline:none;user-select:text}
  .jr-name{flex:0 1 380px;font-weight:600;margin-left:-7px}
  .jr-exp{flex:1 1 auto;max-width:640px;border-color:color-mix(in srgb,var(--ui-component-border) 70%,transparent);background:var(--ui-field-bg)}
  .jr-name:hover{border-color:var(--ui-component-border)}
  .jr-name:focus,.jr-exp:focus{border-color:var(--ui-accent);background:var(--ui-field-bg)}
  .jr-name[readonly],.jr-exp[readonly]{cursor:default}
  .jr-name::placeholder,.jr-exp::placeholder{color:var(--ui-fg-disabled);font-weight:400}
  .jr-tag{flex:none;width:26px;font-size:11px;color:var(--ui-fg-info)}
  .jr-l3{font-size:var(--fs-sm);line-height:var(--lh-sm);color:var(--ui-fg-info)}
  .jr-l3 .jr-ops{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .jr .loc{font-family:var(--font-code);font-size:11px;color:var(--ui-link);cursor:pointer;white-space:nowrap}
  .jr .loc.bad{color:var(--ui-error)}
  .jr-dur{font-family:var(--font-code);font-size:11px;color:var(--ui-fg-info);min-width:36px;text-align:right;white-space:nowrap}
  .jr-step .dm-pill{flex:none;min-width:44px;justify-content:center}
  .jr-del{flex:none}
  .jr-del svg.i{width:14px;height:14px}
  .jr-del[disabled]{opacity:.35}
  .jr-add{margin-left:8px;height:20px;padding:0 7px 0 5px;border:1px dashed var(--ui-component-border);border-radius:5px;background:transparent;color:var(--ui-fg-info);font-size:11px;font-weight:400;display:inline-flex;align-items:center;gap:3px}
  .jr-add:hover{color:var(--ui-fg);border-color:var(--ui-fg-info)}
  .jr-add svg.i{width:12px;height:12px;color:currentColor}
  .jr-add[disabled]{opacity:.45}
  .jr-busy{display:flex;align-items:center;gap:8px;padding:14px 16px;color:var(--ui-fg-info);font-size:var(--fs-sm)}
  .jr-empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--ui-fg-info);font-size:var(--fs-sm);text-align:center;padding:16px}
  .jr-empty svg{width:24px;height:24px;color:var(--ui-info)}
  /* 右侧详情 */
  .jr-detail{display:flex;flex-direction:column;min-height:0;min-width:0}
  .jr-detail .chk-detail{flex:1}
  .chk-detail .dt-head.ok svg{color:var(--ui-success)}
  .chk-detail .dt-head.info svg{color:var(--ui-info)}
  .chk-detail ol{margin:0;padding-left:18px}
  .jr-foot{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 14px;border-top:1px solid var(--ui-border)}
  .jr-foot .grow{flex:1}
  .jr-foot .dm-pill[role="button"]{cursor:pointer}
  .jr-foot .dm-muted{font-size:var(--fs-sm)}
  .jr-fail{display:flex;flex-direction:column;gap:8px}
  .jr-assert{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 8px;font-size:var(--fs-sm);line-height:var(--lh-sm)}
  .jr-assert .k2{color:var(--ui-fg-info)}
  .jr-assert .bad{color:var(--ui-error)}
  .jr-cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .jr-crop{position:relative;height:70px;overflow:hidden;border-radius:6px;border:1px solid var(--ui-component-border);background:#fff}
  .jr-crop .jr-scr{position:absolute;right:0;top:0;transform:scale(1.15);transform-origin:100% 0}
  .jr-lbl{position:absolute;left:6px;bottom:6px;height:18px;padding:0 7px;border-radius:9px;font-size:11px;line-height:18px;font-weight:600;color:var(--ui-accent-fg);white-space:nowrap}
  .jr-lbl.ok{background:var(--ui-success)}
  .jr-lbl.err{background:var(--ui-error)}
  .jr-log{font-family:var(--font-code);font-size:11px;line-height:17px;background:var(--ui-editor-bg);border:1px solid var(--ui-border);border-radius:6px;padding:5px 8px;color:var(--ui-fg);user-select:text}
  .jr-log > div{display:flex;gap:6px}
  .jr-log .jr-lt{flex:none;color:var(--ui-fg-info)}
  .jr-log .jr-lv{flex:none;width:8px;font-weight:600;color:var(--ui-fg-info)}
  .jr-log .jr-lm{min-width:0;word-break:break-all}
  .jr-log .jr-le,.jr-log .jr-le .jr-lv{color:var(--ui-error)}
  .jr-log mark{background:color-mix(in srgb,var(--ui-warning) 28%,transparent);color:inherit;border-radius:3px;padding:0 2px}
  .jr-log .jr-dadd{background:var(--diff-add);margin:0 -8px;padding:0 8px}
  .jr-log.jr-diff .jr-lm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;word-break:normal}
  .jr-ctx{display:flex;flex-wrap:wrap;gap:6px}
  .jr-ctx > span{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px;border-radius:5px;background:var(--ui-tag-bg);color:var(--ui-fg);font-size:11px}
  .jr-ctx svg.i{width:12px;height:12px}
  .jr-prog{display:flex;flex-direction:column;gap:4px;font-size:var(--fs-sm);line-height:var(--lh-sm)}
  .jr-prog > div{display:flex;align-items:center;gap:8px;min-height:20px;color:var(--ui-fg-info)}
  .jr-prog > div.done,.jr-prog > div.run{color:var(--ui-fg)}
  .jr-prog .mk{width:14px;height:14px;flex:none;display:grid;place-items:center}
  .jr-prog .mk svg{width:14px;height:14px;color:var(--ui-success)}
  .jr-prog .mk .spin{width:10px;height:10px;border-width:1.5px}
  .jr-prog .mk i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--ui-component-border)}
  .jr-verified{display:flex;gap:6px;align-items:flex-start;font-size:var(--fs-sm);line-height:var(--lh-sm)}
  .jr-verified svg{width:14px;height:14px;flex:none;color:var(--ui-success);margin-top:1px}
  .jr-film{display:flex;flex-wrap:wrap;gap:8px}
  .jr-fig{margin:0;min-width:74px;display:flex;flex-direction:column;align-items:center;gap:4px}
  .jr-fig figcaption{width:100%;font-size:11px;line-height:14px;color:var(--ui-fg-info);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .jr-fig.pass .jr-thumb{border-color:color-mix(in srgb,var(--ui-success) 70%,transparent)}
  .jr-sv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:start}
  .jr-sv > div:first-child{display:flex;flex-direction:column;gap:10px;min-width:0}

  /* ---------- 模拟器窗 ---------- */
  .tw-right .emu-dev{font-size:var(--fs-sm);color:var(--ui-fg-info);margin-left:2px;white-space:nowrap}
  .emu{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px 12px 12px;background:var(--ui-editor-bg)}
  .emu-strip{align-self:stretch;display:flex;align-items:center;gap:6px;min-height:28px;padding:4px 10px;border-radius:6px;background:var(--ui-tag-bg);color:var(--ui-fg);font-size:var(--fs-sm);line-height:var(--lh-sm);flex:none}
  .emu-strip svg{width:14px;height:14px;flex:none}
  .emu-strip .spin{width:10px;height:10px;border-width:1.5px}
  .emu-strip .tx{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .emu-strip.muted{color:var(--ui-fg-info)}
  .emu-strip.muted svg{color:var(--ui-icon)}
  .emu-strip.info{background:color-mix(in srgb,var(--ui-accent) 16%,transparent)}
  .emu-strip.ok{background:color-mix(in srgb,var(--ui-success) 16%,transparent)}
  .emu-strip.ok svg{color:var(--ui-success)}
  .emu-strip.err{background:color-mix(in srgb,var(--ui-error) 16%,transparent)}
  .emu-strip.err svg{color:var(--ui-error)}
  .emu .dm-device{flex:none}
  .emu .dm-device.phone{width:180px;height:386px} /* Mate 70 Pro 1260×2844：屏幕 164×370 */
  .emu-cap{font-size:var(--fs-sm);line-height:var(--lh-sm);color:var(--ui-fg-info);min-height:16px;text-align:center;flex:none}
  .jr-tap{position:absolute;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;background:color-mix(in srgb,var(--ui-accent) 35%,transparent);border:2px solid var(--ui-accent);pointer-events:none;z-index:3;animation:jrtap .7s ease-out both}
  @keyframes jrtap{0%{transform:scale(.4);opacity:0}40%{opacity:1}100%{transform:scale(1.1);opacity:.85}}
  @media (prefers-reduced-motion:reduce){.jr-tap,.jr-step.enter{animation:none}}

  /* ---------- 模拟器屏幕里的示例应用（应用自身配色，不随 IDE 主题变） ---------- */
  .mapp .m-hd{height:30px;flex:none;display:flex;align-items:center;gap:6px;padding:0 10px;font-weight:600;font-size:12px}
  .mapp .m-sp{flex:1}
  .mapp .m-cart{position:relative;width:20px;height:20px;display:grid;place-items:center;border-radius:5px;flex:none}
  .mapp .m-cart svg{width:16px;height:16px;color:#1a1a1a}
  .mapp .m-cart b{position:absolute;top:-3px;right:-4px;min-width:13px;height:13px;padding:0 3px;border-radius:7px;background:#E84026;color:#fff;font-size:8px;line-height:13px;text-align:center;font-weight:700}
  .mapp .hot-ok{outline:2px solid var(--ui-success);outline-offset:1px}
  .mapp .hot-err{outline:2px solid var(--ui-error);outline-offset:1px}
  .mapp .m-sub{padding:0 12px 8px;font-size:10px;color:#8a8f99}
  .mapp .m-inp{margin:4px 12px;height:28px;flex:none;border-radius:8px;border:1px solid #d9dce3;display:flex;align-items:center;padding:0 10px;font-size:10px;color:#1a1a1a}
  .mapp .m-btn{margin:12px 12px 0;height:30px;flex:none;border-radius:15px;background:#3574F0;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:11px}
  .mapp .m-banner{margin:0 10px 6px;height:60px;flex:none;border-radius:8px;background:linear-gradient(120deg,#3574F0,#8a6cf0);color:#fff;font-weight:600;font-size:12px;padding:10px;line-height:1.35}
  .mapp .m-banner small{font-size:9px;font-weight:400;opacity:.9}
  .mapp .search.m-on{color:#1a1a1a}
  .mapp .m-cnt{padding:0 12px 2px;font-size:9px;color:#8a8f99}
  .mapp .m-hero{margin:2px 10px 0;height:128px;flex:none;border-radius:10px;background:linear-gradient(160deg,#eef1f6,#d8dee9);display:grid;place-items:center}
  .mapp .m-hero i{width:58px;height:40px;border-radius:20px;background:#fff;box-shadow:0 4px 12px rgba(0,0,0,.12)}
  .mapp .m-price{padding:8px 12px 0;color:#E84026;font-size:16px;font-weight:700;line-height:20px}
  .mapp .m-name{padding:2px 12px 0;font-size:12px;font-weight:600}
  .mapp .m-spec{padding:2px 12px 0;font-size:9px;color:#8a8f99}
  .mapp .m-bar{flex:none;display:flex;gap:6px;padding:8px 10px 10px;border-top:1px solid #f0f0f0;align-items:center}
  .mapp .m-bar > span{flex:1;height:28px;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:3px;font-size:9px;font-weight:600;color:#fff;white-space:nowrap}
  .mapp .m-bar .m-add{background:#FF9F0A}
  .mapp .m-bar .m-buy{background:#E84026}
  .mapp .m-bar .m-buy.m-off{background:#c9ccd6}
  .mapp .m-bar .m-total{background:none;color:#1a1a1a;justify-content:flex-start;font-weight:400;border-radius:6px;padding-left:2px}
  .mapp .m-total b{color:#E84026;font-size:13px}
  .mapp .m-kv{display:flex;justify-content:space-between;padding:5px 12px;font-size:10px;color:#666}
  .mapp .m-kv b{color:#1a1a1a;font-weight:600}
  .mapp .m-empty{padding:70px 0 0;text-align:center;color:#8a8f99;font-size:11px}
  .mapp .row .m-qty{margin-left:auto;flex:none;font-size:9px;color:#8a8f99}
  /* 鸿蒙手机屏：挖孔 + 底部手势横条；PC 自由窗口里没有这两样，也没有手机状态栏 */
  .mapp{position:relative}
  .mapp .m-punch{position:absolute;top:4px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:#0b0b0d;z-index:4}
  .mapp .m-punch.r{left:auto;right:18%}
  .mapp .m-gbar{position:absolute;left:50%;bottom:3px;width:56px;height:3px;margin-left:-28px;border-radius:2px;background:#1a1a1a;opacity:.7;z-index:4}
  .mapp.md > .m-gbar{width:72px;margin-left:-36px}
  /* md 断点（≥600 vp）：左主内容 + 右栏常驻购物车（CheckoutPage 作为子组件） */
  .mapp .mdw{flex:1;display:flex;min-height:0}
  .mapp .mdl,.mapp .mdr{flex:1 1 0;min-width:0;display:flex;flex-direction:column;overflow:hidden}
  .mapp .mdl{border-right:1px solid #e6e8ed}
  .mapp .mdr{background:#fafbfc}
  .mapp .mdl > .mapp,.mapp .mdr > .mapp{flex:1;height:auto;min-height:0}
  .mapp .m-brand{flex:1;margin:10px;border-radius:12px;background:linear-gradient(150deg,#3574F0,#8a6cf0);color:#fff;padding:18px 14px;display:flex;flex-direction:column;gap:6px}
  .mapp .m-brand b{font-size:16px}
  .mapp .m-brand span{font-size:10px;opacity:.9}
  .zw{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;background:#fff}

  /* ---------- 运行在：本机原生窗口 / 碰一碰连上的真机 / 模拟器 ---------- */
  .jr-tgt{flex:none;display:flex;align-items:center;gap:6px;padding:6px 12px;border-bottom:1px solid var(--ui-border);min-width:0;overflow:hidden}
  .jr-tk{font-size:var(--fs-sm);color:var(--ui-fg-info);white-space:nowrap;margin-right:2px}
  .jr-tgt .grow{flex:1}
  .jr-tgs{font-size:var(--fs-sm);color:var(--ui-fg-info);white-space:nowrap}
  .dchip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 8px 0 7px;border:1px solid var(--ui-border);border-radius:6px;font:inherit;font-size:12px;background:transparent;color:var(--ui-fg);white-space:nowrap;flex:none}
  .dchip:hover{background:var(--ui-hover)}
  .dchip[disabled]{opacity:.5}
  .dchip .cb{width:14px;height:14px;border-radius:3px;border:1.5px solid var(--ui-component-border);flex:none;display:grid;place-items:center;box-sizing:border-box}
  .dchip.on{border-color:var(--ui-accent);background:color-mix(in srgb,var(--ui-accent) 10%,transparent)}
  .dchip.on .cb{background:var(--ui-accent);border-color:var(--ui-accent)}
  .dchip.on .cb::after{content:"";width:6px;height:3px;border-left:1.5px solid #fff;border-bottom:1.5px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
  .dchip svg.i{width:14px;height:14px;flex:none}
  .dchip b{font-weight:600}
  .dchip .rs{font-family:var(--font-code);font-size:10.5px;color:var(--ui-fg-info)}
  .dchip.tap{border-style:dashed}
  .dchip.tap svg.nfc{color:var(--ui-accent)}
  .dchip.tap .rs{font-family:var(--font-ui);color:var(--ui-link)}
  .dchip.busy{border-color:var(--ui-accent)}
  .bp{display:inline-block;font-family:var(--font-code);font-size:10px;line-height:15px;padding:0 4px;border-radius:4px;background:var(--ui-tag-bg);color:var(--ui-fg-info);font-weight:500;flex:none}
  .bp.md,.bp.lg{color:var(--ui-info);background:color-mix(in srgb,var(--ui-accent) 14%,transparent)}

  /* 多台并行：每步一行，每台设备一格截图（真实比例） */
  .jr-colhd{position:sticky;top:0;z-index:2;display:grid;grid-template-columns:18px auto minmax(0,1fr);gap:10px;align-items:center;padding:4px 12px;background:var(--ui-bg);border-bottom:1px solid var(--ui-border);font-size:11px;line-height:14px;color:var(--ui-fg-info)}
  .jr-colhd .rt{justify-self:end;white-space:nowrap}
  .jr-cells{display:flex;gap:6px;align-items:flex-start}
  .jr-ch{display:inline-flex;align-items:center;justify-content:center;gap:3px;white-space:nowrap;overflow:hidden;flex:none}
  .jr-ch svg.i{width:12px;height:12px;flex:none}
  .jr-ch span{overflow:hidden;text-overflow:ellipsis}
  .jr-cell{position:relative;display:flex;justify-content:center;flex:none}
  .jr-cell.pass .jr-thumb{border-color:color-mix(in srgb,var(--ui-success) 70%,transparent)}
  .jr-cell.fail .jr-thumb{border-color:var(--ui-error)}
  .jr-cell.run .jr-thumb{border-color:var(--ui-accent)}
  .jr-cell.skip .jr-thumb{opacity:.5}
  .jr-cell .mk{position:absolute;right:-4px;top:-4px;width:15px;height:15px;border-radius:50%;display:grid;place-items:center;background:var(--ui-bg);box-shadow:0 0 0 1px var(--ui-border);z-index:1}
  .jr-cell .mk svg{width:13px;height:13px}
  .jr-cell .mk.ok svg{color:var(--ui-success)}
  .jr-cell .mk.err svg{color:var(--ui-error)}
  .jr-cell .mk .spin{width:8px;height:8px;border-width:1.5px}
  .jr-devrow{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
  .jr-dv{margin:0;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:64px}
  .jr-dv figcaption{display:flex;align-items:center;gap:4px;font-size:11px;line-height:15px;white-space:nowrap}
  .jr-dv figcaption b{font-weight:600}
  .jr-dvst{font-size:11px;line-height:14px;color:var(--ui-fg-info);white-space:nowrap}
  .jr-dv.pass .jr-thumb{border-color:color-mix(in srgb,var(--ui-success) 70%,transparent)}
  .jr-dv.pass .jr-dvst{color:var(--ui-success)}
  .jr-dv.fail .jr-thumb{border-color:var(--ui-error)}
  .jr-dv.fail .jr-dvst{color:var(--ui-error);font-weight:600}
  .jr-dres{display:flex;flex-direction:column;gap:3px;font-size:var(--fs-sm);line-height:var(--lh-sm)}
  .jr-dres > div{display:flex;align-items:center;gap:6px;min-height:20px}
  .jr-dres svg.i{width:14px;height:14px;flex:none;color:var(--ui-icon)}
  .jr-dres .grow{flex:1}

  /* ---------- 碰上的真机：多屏协同镜像，按真实比例 ---------- */
  .ide[data-ide-theme][data-right="phones"][data-phones="2"]{--ai-w:480px}
  .phs{flex:1;min-height:0;overflow:auto;display:flex;flex-wrap:wrap;align-items:flex-end;align-content:center;justify-content:center;gap:16px 14px;padding:14px 12px;background:var(--ui-editor-bg)}
  .phs-empty{align-self:center;color:var(--ui-fg-info);font-size:var(--fs-sm)}
  .phd{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0}
  .phd.off{opacity:.45}
  .phv{position:relative;background:#0f1012;padding:5px;border-radius:18px;box-shadow:0 6px 18px rgba(0,0,0,.32)}
  .phv.fold{border-radius:12px}
  .phv .jscr{position:relative;overflow:hidden;border-radius:13px;background:#fff}
  .phv.fold .jscr{border-radius:8px}
  .phv.fold .jscr::after{content:"";position:absolute;top:0;bottom:0;left:50%;width:1px;background:rgba(0,0,0,.14);z-index:6}
  .ph-cap{display:flex;align-items:center;gap:5px;font-size:12px;white-space:nowrap;margin-top:3px}
  .ph-cap svg.i{width:14px;height:14px;color:var(--ui-icon)}
  .ph-cap b{font-weight:600}
  .ph-st{display:flex;align-items:center;gap:5px;max-width:100%;height:16px;font-size:11px;color:var(--ui-fg-info);white-space:nowrap;overflow:hidden}
  .ph-st .tx,.hc-st .tx{min-width:0;overflow:hidden;text-overflow:ellipsis}
  .ph-st svg.i,.hc-st svg.i{width:12px;height:12px;flex:none}
  .ph-st .spin,.hc-st .spin{width:9px;height:9px;border-width:1.5px;flex:none}
  .ph-st.err,.hc-st.err{color:var(--ui-error)}
  .ph-st.ok,.hc-st.ok{color:var(--ui-success)}
  .ph-st.info,.hc-st.info{color:var(--ui-fg)}

  /* ---------- 本机：鸿蒙电脑原生自由窗口（系统窗口，按应用自己的浅色） ---------- */
  .hwin{position:absolute;z-index:40;left:0;top:0;display:flex;flex-direction:column;border-radius:12px;background:#fff;box-shadow:0 18px 48px rgba(0,0,0,.42),0 0 0 1px rgba(0,0,0,.2)}
  .hwin[hidden]{display:none}
  .hwin.opening{animation:hwopen .28s cubic-bezier(.2,.8,.2,1)}
  @keyframes hwopen{from{opacity:0;transform:scale(.94) translateY(10px)}}
  .hw-bar{height:32px;flex:none;display:flex;align-items:center;gap:6px;padding:0 4px 0 10px;background:#F1F3F5;color:#1a1a1a;border-radius:12px 12px 0 0;cursor:move;user-select:none;font-family:var(--font-ui);font-size:12px;touch-action:none}
  .hw-ico{width:16px;height:16px;border-radius:5px;background:linear-gradient(135deg,#FF8A3D,#E84026);flex:none;display:grid;place-items:center}
  .hw-ico svg{width:11px;height:11px;color:#fff}
  .hw-name{font-weight:600;white-space:nowrap}
  .hw-bar .grow{flex:1}
  .hw-b{width:28px;height:24px;border:0;border-radius:6px;background:transparent;color:#3a3d44;display:grid;place-items:center;cursor:default;flex:none}
  .hw-b:hover{background:rgba(0,0,0,.08)}
  .hw-b.x:hover{background:#E84026;color:#fff}
  .hw-b svg{width:14px;height:14px}
  .hw-body{position:relative;flex:none;overflow:hidden;border-radius:0 0 12px 12px;background:#fff}
  .hw-scr{position:absolute;inset:0;overflow:hidden}
  .hw-rz{position:absolute;z-index:2;touch-action:none}
  .hw-rz[data-rz="r"]{top:32px;right:-4px;bottom:14px;width:8px;cursor:ew-resize}
  .hw-rz[data-rz="b"]{left:14px;right:14px;bottom:-4px;height:8px;cursor:ns-resize}
  .hw-rz[data-rz="rb"]{right:-4px;bottom:-4px;width:18px;height:18px;cursor:nwse-resize}
  .hw-rz[data-rz="rb"]::after{content:"";position:absolute;right:7px;bottom:7px;width:7px;height:7px;border-right:2px solid rgba(0,0,0,.28);border-bottom:2px solid rgba(0,0,0,.28);border-radius:0 0 3px 0}
  .hw-cap{position:absolute;left:0;right:0;top:calc(100% + 6px);display:flex;align-items:center;gap:8px;height:24px;padding:0 8px;border-radius:6px;background:var(--ui-popup-bg);border:1px solid var(--ui-popup-border);box-shadow:0 4px 12px rgba(0,0,0,.18);font-size:11px;color:var(--ui-fg-info);white-space:nowrap;overflow:hidden}
  .hc-st{display:flex;align-items:center;gap:5px;min-width:0;flex:1}
  .hc-sz{flex:none;font-family:var(--font-code);font-size:10.5px}
  .hc-sz .bp{margin-left:4px}

  /* ---------- 碰一碰：手机靠近电脑的动效 + 系统连接卡 ---------- */
  .tapc{position:absolute;right:16px;bottom:34px;z-index:60;width:300px;border-radius:16px;background:var(--ui-popup-bg);border:1px solid var(--ui-popup-border);box-shadow:0 14px 40px rgba(0,0,0,.38);padding:10px 12px 12px;display:flex;flex-direction:column;gap:9px;transform:translateY(14px);opacity:0;transition:transform .25s ease-out,opacity .25s}
  .tapc[hidden]{display:none}
  .tapc.in{transform:none;opacity:1}
  .tapc-hd{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ui-fg-info)}
  .tapc-hd svg.i{width:14px;height:14px;color:var(--ui-accent)}
  .tapc-hd .grow{flex:1}
  .tapc-art{position:relative;height:98px;border-radius:10px;background:var(--ui-tag-bg);overflow:hidden}
  .tc-pc{position:absolute;left:40px;top:12px;width:156px;height:76px;border-radius:9px;background:color-mix(in srgb,var(--ui-fg-info) 20%,var(--ui-bg));box-shadow:inset 0 0 0 1px var(--ui-component-border)}
  .tc-kb{position:absolute;left:10px;right:10px;top:8px;height:34px;border-radius:3px;
    background:repeating-linear-gradient(0deg,transparent 0 2px,color-mix(in srgb,var(--ui-fg-info) 22%,transparent) 2px 8px),repeating-linear-gradient(90deg,transparent 0 2px,var(--ui-bg) 2px 3px);opacity:.9}
  .tc-pad{position:absolute;left:50%;bottom:7px;width:52px;height:24px;margin-left:-26px;border-radius:4px;box-shadow:inset 0 0 0 1px var(--ui-component-border)}
  .tc-zone{position:absolute;right:13px;bottom:9px;width:20px;height:20px;border-radius:50%;border:1.5px dashed var(--ui-accent);display:grid;place-items:center}
  .tc-zone svg{width:12px;height:12px;color:var(--ui-accent)}
  .tc-ph{position:absolute;left:160px;top:36px;width:22px;height:50px;border-radius:6px;background:#15161a;border:2px solid #4a4d55;box-sizing:border-box;box-shadow:0 6px 14px rgba(0,0,0,.35);transform:translate(86px,-22px) rotate(20deg);opacity:0;transition:transform .6s cubic-bezier(.2,.8,.2,1),opacity .3s}
  .tc-ph::after{content:"";position:absolute;inset:2px;border-radius:3px;background:linear-gradient(160deg,#2b2f3a,#16181d);transition:background .3s}
  .tapc.go .tc-ph{transform:none;opacity:1}
  .tapc.ok .tc-ph::after{background:linear-gradient(160deg,#5B8CF7,#3574F0)}
  .tc-rip{position:absolute;left:173px;top:77px;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;border:2px solid var(--ui-accent);opacity:0;pointer-events:none}
  .tapc.hit .tc-rip{animation:tcrip 1s ease-out 2}
  .tapc.hit .tc-rip.r2{animation-delay:.3s}
  @keyframes tcrip{0%{transform:scale(.6);opacity:.9}100%{transform:scale(5.5);opacity:0}}
  .tc-ok{position:absolute;left:162px;top:28px;width:18px;height:18px;border-radius:50%;background:var(--ui-success);display:grid;place-items:center;transform:scale(0);transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
  .tc-ok svg{width:12px;height:12px;color:#fff}
  .tapc.ok .tc-ok{transform:scale(1)}
  .tapc-tx{display:flex;flex-direction:column;gap:2px;font-size:var(--fs-sm);line-height:var(--lh-sm);color:var(--ui-fg-info)}
  .tapc-tx > b{font-size:var(--fs-para);line-height:var(--lh-para);color:var(--ui-fg);font-weight:600}
  .tapc-tx b b{color:var(--ui-fg)}
  .tapc-m{font-family:var(--font-code);font-size:10.5px}
  @media (prefers-reduced-motion:reduce){.hwin.opening,.tapc.hit .tc-rip{animation:none}.tc-ph,.tapc{transition:none}}
</style>
</head>

<div class="ide" id="ide" data-ide-theme="dark" data-left="project" data-right="none" data-bottom="problems" data-scene="publish" role="application" aria-label="DevEco Studio">
  <div class="body">
    <div class="tw tw-left">
      <div class="pane on" data-pane="project">
        <div class="tw-hdr"><span class="title">Project <svg class="i"><use href="#i-chevD"/></svg></span><span class="grow"></span>
          <button class="abtn" title="Select Opened File"><svg class="i"><use href="#i-locate"/></svg></button>
          <button class="abtn" title="Expand All"><svg class="i"><use href="#i-expandAll"/></svg></button>

    <!-- 右侧：模拟器（选了模拟器时）/ 碰一碰连上的真机镜像（多屏协同，按真实比例并排） -->
    <div class="tw tw-right">
      <div class="pane" data-pane="phones">
        <div class="tw-hdr"><span class="title">Devices</span><span class="emu-dev" id="ph-sub"></span><span class="grow"></span>
          <button class="abtn" title="Take Screenshot"><svg class="i"><use href="#i-camera"/></svg></button>

      </div>
      <div class="pane" data-pane="devices">
        <div class="tw-hdr"><span class="title">Emulator</span><span class="emu-dev">Mate 70 Pro · API 20</span><span class="grow"></span>
          <button class="abtn" title="Take Screenshot"><svg class="i"><use href="#i-camera"/></svg></button>
          <button class="abtn" title="Rotate"><svg class="i"><use href="#i-rotate"/></svg></button>
          <button class="abtn" title="Hide|Shift+Esc" data-act="hide-right"><svg class="i"><use href="#i-hide"/></svg></button></div>
        <div class="emu">

    <div class="tw tw-bottom">
      <div class="tw-hdr"><span class="title">App Check</span>
        <span class="tabbar" id="scene-tabs"></span>

  var KW=/^(import|from|export|class|interface|const|let|return|this|if|else|for|of|private|public|static|number|string|boolean|void|new|true|false|struct|async|await|try|catch|undefined)$/;
  function hl(src){
    if(/^\s*(\/\*|\*)/.test(src))return '<span class="c">'+esc(src)+'</span>';
    var re=/(\/\/.*$)|('(?:[^'\\]|\\.)*')|(@\w+)|\b(0x[0-9a-fA-F]+|\d+(?:\.\d+)?)\b|\b([A-Za-z_]\w*)\b(?=\s*\()|(?<=\.)([A-Za-z_]\w*)\b|\b([A-Za-z_]\w*)\b/g;
    var out='',last=0,m;
    while((m=re.exec(src))){
      out+=esc(src.slice(last,m.index));last=re.lastIndex;
      var cls=m[1]?'c':m[2]?'s':m[3]?'m':m[4]?'n':'';
      var w=m[5]||m[6]||m[7];
      if(!cls&&w){cls=KW.test(w)?'k':m[5]?'f':/^[A-Z]/.test(w)?'ty':m[6]?'p':''}
      out+=cls?'<span class="'+cls+'">'+esc(m[0])+'</span>':esc(m[0]);
    }
    return out+esc(src.slice(last));
  }
  function hlJson(src){

    }
    return out+esc(src.slice(last));
  }

    var marks={};if(line&&lv)marks[line]=lv;
    $('#code').innerHTML=DemoFrame.code(file,{cur:line,hl:(line&&!opt.nohl)?[line]:[],marks:marks});
    (opt.ok||[]).forEach(function(n){var el=$('#code .ln[data-ln="'+n+'"]');if(el){el.classList.remove('hl');el.classList.add('hl-ok')}});
    $('#crumbs').innerHTML=DemoFrame.crumbs(file);
    $$('#tree .row.sel').forEach(function(x){x.classList.remove('sel')});
    var r=$('#tree .row[data-file="'+file+'"]');if(r)r.classList.add('sel');

    var ln=$('#code .ln[data-ln="'+line+'"]');if(ln)ln.scrollIntoView({block:'center'});

  /* 每一步在某台设备上怎么走：先点哪里、最后停在哪一屏、断言过不过 */

        end:JR.fixed?{k:'detail1',hot:'ok'}:{k:'detail0',hot:'err'},why:'等了 3 s，角标还是空的',kind:'cart'};
      case 'checkout':
        if(!hasStep('cart'))return {frames:[{k:'home',tap:md?'pay':'cart',cap:md?'点右栏「去结算」':'点购物车'}],ok:false,end:{k:'cartEmpty',hot:'err'},why:'购物车是空的，进不了结算页',kind:'nocart'};
        if(md)return {frames:[{k:'detail1',tap:'pay',cap:'点右栏购物车「去结算」'}],ok:JR.fixedMd,end:{k:'checkout',hot:JR.fixedMd?'ok':'err'},why:'合计 ¥0，右栏结算没重算',kind:'md'};
        return {frames:[{k:'detail1',tap:'cart',cap:'点购物车'},{k:'cartpage',tap:'pay',cap:'点「去结算」'}],ok:true,end:{k:'checkout',hot:'ok'}};

  function newR(){return {st:[],t:[],shot:[],why:[],kind:[],fi:-1,idx:0,done:false,last:{k:'login'}}}
  function devT(d){var t=0,r=R[d];if(r)r.t.forEach(function(x){t+=x||0});return t}
  function totalT(){var t=0;(JR.devs||[]).forEach(function(d){t=Math.max(t,devT(d))});return t.toFixed(1)}
  /* 各设备结果汇总到每一步：有在跑的算在跑，有没过的算没过，全过才算过 */
  function agg(){
    var devs=JR.devs||[];if(!devs.length)return;
    JR.steps.forEach(function(s,i){
      var sts=devs.map(function(d){return R[d]&&R[d].st[i]||''});
      var np=sts.filter(function(x){return x==='pass'}).length;
      s.part=0;
      s.st=sts.indexOf('run')>=0?'run':sts.indexOf('fail')>=0?'fail':np===sts.length?'pass':np&&sts.indexOf('')<0?(s.part=1,'pass'):sts.indexOf('skip')>=0&&sts.indexOf('')<0?'skip':'';
      var fd=null;devs.forEach(function(d){if(!fd&&R[d].st[i]==='fail')fd=d});
      s.fk=fd?R[fd].kind[i]:null;
      s.nf=sts.filter(function(x){return x==='fail'}).length;s.np=np;
      var sd=fd||devs.filter(function(d){return R[d].shot[i]})[0];
      s.shot=sd?R[sd].shot[i]:null;
      var t=0;devs.forEach(function(d){t=Math.max(t,R[d].t[i]||0)});s.t=t;
    });
    var ri=-1;devs.forEach(function(d){var r=R[d];if(!r.done&&r.idx<JR.steps.length&&(ri<0||r.idx<ri))ri=r.idx});
    JR.runIdx=ri;if(JR.phase==='running'&&ri>=0)JR.sel=ri;
  }
  function runJourney(done){
    var devs=targets();

    clearTimers();

    R={};devs.forEach(function(d){R[d]=newR()});
    JR.steps.forEach(function(s){s.st='';s.t=0;s.shot=null;s.fk=null});
    openSurfaces(devs);

    function tick(){agg();renderRun()}
    function devStep(d){
      var r=R[d],i=r.idx;
      if(JR.phase!=='running'||R!==RR)return;
      if(i>=n){r.done=true;devCap(d,'ok','i-check',n+'/'+n+' 通过 · '+devT(d).toFixed(1)+' s');if(d==='emu')emuCap('');check();return}
      var s=JR.steps[i],pl=plan(s,r.last,d),k=0,sp=DEV[d].sp;
      r.st[i]='run';

      (function frame(){
        if(JR.phase!=='running'||R!==RR)return;
        if(k<pl.frames.length){
          var f=pl.frames[k++];r.shot[i]=shotOf(d,{k:f.k});paintDev(d,r.shot[i],f.tap);
          if(d==='emu')emuCap(f.cap);else devCap(d,'info','spin','第 '+(i+1)+'/'+n+' 步 · '+f.cap);
          tick();later(frame,Math.round(560*sp));return;
        }
        r.st[i]=pl.ok?'pass':'fail';r.t[i]=pl.ok?s.dur*sp:(s.failDur||3.0);r.shot[i]=shotOf(d,pl.end);r.last=pl.end;r.why[i]=pl.why;r.kind[i]=pl.kind;
        paintDev(d,r.shot[i]);
        if(!pl.ok){
          for(var j=i+1;j<n;j++)r.st[j]='skip';r.fi=i;r.done=true;
          devCap(d,'err','i-err','第 '+(i+1)+' 步没过 · '+pl.why);if(d==='emu')emuCap(pl.why);
          check();return;
        }
        if(d==='emu')emuCap('断言通过 · '+r.t[i].toFixed(1)+' s');else devCap(d,'info','i-check','第 '+(i+1)+' 步通过 · '+r.t[i].toFixed(1)+' s');
        r.idx++;tick();later(function(){devStep(d)},Math.round(380*sp));
      })();
    }
    function check(){if(devs.every(function(d){return R[d].done}))finish();else tick()}
    function finish(){
      agg();
      var fails=devs.filter(function(d){return R[d].fi>=0});
      JR.phase=fails.length?'failed':'passed';JR.result=fails.length?'fail':'pass';JR.runIdx=-1;

    if(JR.phase==='empty'||JR.phase==='splitting'){f.hidden=true;return}
    f.hidden=false;
    if(JR.fixStage)h='<span class="dm-pill info"><span class="spin"></span>'+(JR.fixStage<3?'DevEco Code 在改 '+(FIX[JR.fixKind]||FIX.cart).file:'在 '+devsLabel()+' 上重跑旅程')+'</span><span class="grow"></span><span class="dm-muted">改完自动验证</span>';
    else if(JR.phase==='running')h='<span class="dm-pill info"><span class="spin"></span>在 '+devsLabel()+' 上跑 · 第 '+(JR.runIdx+1)+'/'+JR.steps.length+' 步</span>';
    else{
      var fi=failIdx();
      if(JR.phase==='failed'&&fi>=0)h+=FIX[JR.steps[fi].fk]
        ?'<button class="btn primary" id="jr-fix"><svg class="i"><use href="#i-genie"/></svg>转成修复任务</button>'
        :'<button class="btn primary" id="jr-restore"><svg class="i"><use href="#i-add"/></svg>补回「加入购物车」</button>';
      h+=!JR.saved?'<button class="btn" id="jr-save"><svg class="i"><use href="#i-json"/></svg>存为旅程文件</button>'
        :JR.dirty?'<button class="btn" id="jr-save"><svg class="i"><use href="#i-json"/></svg>保存改动</button>'
        :'<span class="dm-pill ok" id="jr-open" role="button" tabindex="0" title="打开 journeys/'+JR.file+'"><svg><use href="#i-check"/></svg>已存旅程文件</span>';
      h+=!JR.inPublish?'<button class="btn" id="jr-pubadd"><svg class="i"><use href="#i-flag"/></svg>加进上架自检</button>'
        :'<span class="dm-pill ok" id="jr-gopub" role="button" tabindex="0" title="去上架自检看"><svg><use href="#i-check"/></svg>已加进上架自检</span>';
    }
    f.innerHTML=h;
  }
  function renderJourney(anim){renderTools();renderTgt();renderSum();renderSteps(anim);renderJD();renderTabs()}

  function split(){
    var p=$('#jr-prompt').value.trim();if(!p||JR.phase==='running'||JR.fixStage||JR.phase==='splitting')return;
    JR.prompt=p;JR.phase='splitting';JR.steps=[];R={};JR.devs=null;renderJourney();
    later(function(){
      JR.steps=parsePrompt(p);
      JR.name=/结算|下单|支付/.test(p)?'下单结算':(JR.steps.length&&JR.steps[JR.steps.length-1].name)||'新旅程';
      if(!JR.saved)JR.file=JR.name==='下单结算'?'checkout.journey.json5':'journey-1.journey.json5';
      else JR.dirty=true;
      resetResults();JR.sel=0;renderJourney(true);
    },900);
  }
  function selectStep(i,jump){
    var s=JR.steps[i];if(!s)return;
    JR.sel=i;JR.view=s.st==='fail'?'fail':'step';markSel();renderJD();
    if(jump)jumpStep(s);
  }
  function jumpStep(s){
    if(s.st==='fail'&&s.fk==='cart')openFile('CartStore.ets',48,'err');
    else if(s.st==='fail'&&s.fk==='md')openFile('CheckoutPage.ets',12,'err');
    else if(s.file&&FILES[s.file])openFile(s.file,s.line,null);
  }
  function addStep(){
    if(JR.phase==='running'||JR.fixStage)return;
    JR.steps.push({id:'c'+(++uid),name:'',exp:'',ops:['跑的时候按描述定位控件'],file:null,dur:1.4,timeout:5000,st:'',t:0,shot:null,custom:1});
    if(JR.saved)JR.dirty=true;resetResults();JR.sel=JR.steps.length-1;renderJourney();
    var inp=$('#jr-steps .jr-step[data-i="'+JR.sel+'"] .jr-name');if(inp)inp.focus();
  }
  function delStep(i){
    if(JR.phase==='running'||JR.fixStage)return;
    JR.steps.splice(i,1);if(JR.saved)JR.dirty=true;resetResults();JR.sel=Math.max(0,Math.min(JR.sel,JR.steps.length-1));renderJourney();
  }

  /* ---------- 初始：上架自检第一条，编辑器停在 LoginPage.ets:12 ---------- */
  document.getElementById('tree-slot').innerHTML=DemoFrame.tree({sel:'LoginPage.ets'});
  (function(){ /* 树里补上 model/ 与两张新页面，旅程会定位到这里 */
    var pages=rowByLabel('pages');
    if(pages)pages.insertAdjacentHTML('beforebegin',treeRow(5,'#i-folder','model',{dir:1})+'<div class="kids">'+treeRow(6,'#i-ets','CartStore.ets',{file:1})+treeRow(6,'#i-ets','ItemSource.ets')+treeRow(6,'#i-ets','Sku.ets')+'</div>');
    var idx=rowByLabel('Index.ets');
    if(idx)idx.insertAdjacentHTML('beforebegin',treeRow(6,'#i-ets','CheckoutPage.ets',{file:1})+treeRow(6,'#i-ets','DetailPage.ets'));
  })();
  document.getElementById('tabs').insertAdjacentHTML('afterbegin',DemoFrame.tabs([{file:'LoginPage.ets',on:true}]));
  document.getElementById('code').innerHTML=DemoFrame.code('LoginPage.ets',{cur:12,hl:[12],marks:{12:'err'}});
  document.getElementById('jr-prompt').value=PROMPT;

  DemoFrame.init({device:'HUAWEI Mate 70 Pro',deviceIcon:'#i-phone',pos:'12:1',onReady:function(){
    ideRoot=$('#ide');
    renderTabs();renderList();renderJD();renderTgt();
    paintDev('emu',shotOf('emu',{k:'login'}));emuStrip('muted','i-phone','就绪 · 等旅程开始');
    bindWin();
    $('#scene-tabs').addEventListener('click',function(e){var b=e.target.closest('.btab');if(b)switchScene(b.dataset.scene)});
    $('#chk-list').addEventListener('click',function(e){
      if(e.target.closest('#jr-pub')){switchScene('journey');return}
      if(e.target.closest('#jr-new')){switchScene('journey');var p=$('#jr-prompt');p.focus();p.select();return}
      var r=e.target.closest('.dm-item[data-i]');if(r)select(+r.dataset.i);
    });
    $('#chk-detail').addEventListener('click',function(e){
      if(e.target.closest('#btn-fix'))fixCurrent();
      else if(e.target.closest('#btn-ignore'))ignoreCurrent();
      else if(e.target.closest('#dt-loc')){var it=scene(cur).items[selIdx];if(it)openFile(it.file,it.line,it.lv)}
    });
    $('#i-refresh-btn').addEventListener('click',function(){
      if(cur==='journey'){if(JR.steps.length&&JR.phase!=='running'&&!JR.fixStage)runJourney()}
      else autoRun();
    });
    /* 树里点有代码的文件：切编辑器（不带高亮） */
    ideRoot.addEventListener('click',function(e){
      var r=e.target.closest('#tree .row[data-file]');if(!r)return;
      var f=r.dataset.file;if(!$('.tab[data-file="'+f+'"]')&&FILES[f])openFile(f,1,null);
    });

    /* ---------- 用户旅程的交互 ---------- */
    $('#jr-tools').addEventListener('click',function(e){
      if(e.target.closest('#jr-split'))split();
      else if(e.target.closest('#jr-run')){if(JR.phase==='running')stopRun();else runJourney()}
    });
    $('#jr-tgt').addEventListener('click',function(e){
      var b=e.target.closest('.dchip');if(!b||b.disabled)return;
      var d=b.dataset.dev;
      if(!conn(d)){bump(d);return}
      var before=targets().join();
      if(d==='emu'){var on=!TG.emu;ORDER.forEach(function(x){TG[x]=false});TG.emu=on;if(!on)TG.local=true}
      else{TG[d]=!TG[d];TG.emu=false}
      afterTgtChange(before);
    });
    $('#tapc-x').addEventListener('click',function(){var c=$('#tapc');c.classList.remove('in');setTimeout(function(){if(!c.classList.contains('in'))c.hidden=true},250)});
    $('#jr-prompt').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();split()}});
    $('#jr-sum').addEventListener('click',function(e){var a=e.target.closest('#jr-add');if(a&&!a.disabled)addStep()});
    $('#jr-steps').addEventListener('click',function(e){
      var del=e.target.closest('[data-del]');if(del){if(!del.disabled)delStep(+del.dataset.del);return}
      var loc=e.target.closest('[data-loc]');if(loc){selectStep(+loc.dataset.loc,true);return}
      var row=e.target.closest('.jr-step');if(row)selectStep(+row.dataset.i,!e.target.closest('input'));
    });
    $('#jr-steps').addEventListener('input',function(e){
      var inp=e.target.closest('input[data-f]');if(!inp)return;
      var i=+inp.closest('.jr-step').dataset.i,s=JR.steps[i];if(!s)return;
      s[inp.dataset.f]=inp.value;s.edited=true;if(JR.saved)JR.dirty=true;
      if(i===JR.sel&&JR.view!=='summary')renderJD();else renderFoot();
    });
    $('#jr-steps').addEventListener('focusin',function(e){
      var inp=e.target.closest('input[data-f]');if(!inp)return;
      var i=+inp.closest('.jr-step').dataset.i;if(i!==JR.sel||JR.view==='summary')selectStep(i,false);
    });
    $('#jr-dbody').addEventListener('click',function(e){
      var c=e.target.closest('[data-cause]'),fx=e.target.closest('[data-fixloc]');
      if(c){if(c.dataset.cause==='md')openFile('CheckoutPage.ets',12,'err');else openFile('CartStore.ets',48,'err')}
      else if(fx){if(fx.dataset.fixloc==='md')openFile('CheckoutPage.ets',9,null,{ok:[9,15]});else openFile('CartStore.ets',49,null,{ok:[49]})}
      else if(e.target.closest('[data-jloc]')){var s=JR.steps[+e.target.closest('[data-jloc]').dataset.jloc];if(s)jumpStep(s)}
      else{var fg=e.target.closest('[data-fig]');if(fg)selectStep(+fg.dataset.fig,true)}
    });
    $('#jr-foot').addEventListener('click',function(e){
      if(e.target.closest('#jr-fix'))fixTask();
      else if(e.target.closest('#jr-restore'))restoreCart();
      else if(e.target.closest('#jr-save'))saveJourney();
      else if(e.target.closest('#jr-open'))openFile(JR.file,1,null,{nohl:true});
      else if(e.target.closest('#jr-pubadd'))addToPublish();
      else if(e.target.closest('#jr-gopub')){switchScene('publish');var r=$('#jr-pub');if(r)r.scrollIntoView({block:'nearest'})}
    });
    window.addEventListener('resize',function(){placeWin(true)});
  }});
DemoGuide.init([
  {"target": "#chk-list", "kind": "click", "pos": "top", "label": "点一条问题"},
  {"target": "#code", "kind": "change", "pos": "top", "label": "自动跳到那一行"},
  {"target": ".btab[data-scene=\"journey\"]", "kind": "click", "pos": "top", "label": "一句话写测试旅程"},
  {"target": "#jr-run, #jr-split", "kind": "click", "pos": "left", "label": "拆成步骤，再在本机窗口跑"},
  {"target": "#jr-tgt", "kind": "click", "pos": "top", "label": "运行在：默认本机，碰一碰加手机"},
  {"target": "#hwin", "kind": "change", "pos": "left", "label": "应用以原生窗口跑在 IDE 旁边"},
  {"target": "#jr-colhd", "kind": "change", "pos": "top", "label": "多台并行，结果按设备并排"},
  {"target": "#jr-fail", "kind": "change", "pos": "top", "label": "失败现场：截图+HiLog+代码行"}
]);
})();
</script>
</body>
</html>
