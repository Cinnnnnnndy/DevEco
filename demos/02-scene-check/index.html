<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='32' y2='32' gradientUnits='userSpaceOnUse'%3E%3Cstop stop-color='%232C8DDD'/%3E%3Cstop offset='1' stop-color='%233357AC'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='7' fill='url(%23g)'/%3E%3Ctext x='16' y='22.5' font-family='Arial,Helvetica,sans-serif' font-size='13' font-weight='700' fill='white' text-anchor='middle'%3EDE%3C/text%3E%3C/svg%3E">
<title>02 · 场景化应用体检：上架会被打回的，写代码时就暴露</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../../deveco-intui-kit/src/tokens.css">
<link rel="stylesheet" href="../../deveco-intui-kit/src/components.css">
<link rel="stylesheet" href="../_shared/frame.css">
<link rel="stylesheet" href="../_shared/guide.css">
<script src="../../deveco-intui-kit/src/icons.js"></script>
<script src="../_shared/frame.js"></script>
<script src="../_shared/guide.js"></script>
<style>
  .ide[data-ide-theme]{--bottom-h:clamp(300px,40vh,400px);--ai-w:clamp(280px,20vw,320px)} /* 带属性选择器，压过 tokens.css 里按主题写的默认值 */
  .ide[data-ide-theme][data-scene="journey"]{--bottom-h:clamp(340px,44vh,440px)} /* 用户旅程：步骤 + 失败现场要多一点高度 */
  /* 底部体检面板标题栏 */
  .tw-bottom .tw-hdr .title{margin-right:4px}
  .btab .cnt{font-family:var(--font-code);font-size:11px;font-weight:400;color:var(--ui-fg-info);margin-left:2px}
  .btab.on .cnt{color:var(--ui-fg-info)}
  .btab .cnt.bad,.btab.on .cnt.bad{color:var(--ui-error)}
  .btab svg.i{width:14px;height:14px}
  .btab.on svg.i{color:var(--ui-fg)}
  #auto-pill{margin-right:6px}
  #auto-pill .spin{width:10px;height:10px;border-width:1.5px}
  /* 面板主体：左列表 + 右详情 */
  .chk{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 360px;min-height:0;height:100%}
  .chk-list{overflow:auto;min-height:0;border-right:1px solid var(--ui-border);padding:4px 0}
  .chk-list .dm-item{cursor:default}
  .chk-list .dm-item svg.i{width:14px;height:14px}
  .chk-list .dm-item.err svg.i{color:var(--ui-error)}
  .chk-list .dm-item.warn svg.i{color:var(--ui-warning)}
  .chk-list .dm-item .msg{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
  .chk-list .dm-item .loc{flex:none}
  .chk-list .dm-item .loc.dead{color:var(--ui-fg-info)}
  .chk-list .dm-item .dm-pill{flex:none}
  .chk-list .dm-item .dm-pill .spin{width:9px;height:9px;border-width:1.5px}
  .chk-list .empty-ok{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:40px 0;color:var(--ui-fg-info);font-size:var(--fs-sm)}
  .chk-list .empty-ok svg{width:24px;height:24px;color:var(--ui-success)}
  code{font-family:var(--font-code);font-size:11px;background:var(--ui-tag-bg);padding:1px 4px;border-radius:4px;color:var(--ui-fg)}
  .chk-detail{overflow:auto;min-height:0;display:flex;flex-direction:column;gap:10px;padding:10px 14px 10px;font-size:var(--fs-para);line-height:var(--lh-para)}
  .chk-detail .dt-head{display:flex;align-items:flex-start;gap:8px;font-weight:600}
  .chk-detail .dt-head svg{width:16px;height:16px;flex:none;margin-top:1px}
  .chk-detail .dt-head.err svg{color:var(--ui-error)}
  .chk-detail .dt-head.warn svg{color:var(--ui-warning)}
  .chk-detail .dt-loc{display:flex;align-items:center;gap:6px;font-size:var(--fs-sm);color:var(--ui-fg-info)}
  .chk-detail .dt-loc .loc{font-family:var(--font-code);font-size:11px;color:var(--ui-link)}
  .chk-detail .dt-loc svg{width:14px;height:14px}
  .chk-detail .dt-h{font-size:var(--fs-sm);line-height:var(--lh-sm);font-weight:600;color:var(--ui-fg-info);margin-bottom:3px}
  .chk-detail ul{margin:0;padding-left:16px}
  .chk-detail li{margin:1px 0}
  .chk-detail p{margin:0}
  .chk-detail .grow{flex:1}
  .chk-detail .dt-acts{display:flex;gap:6px;flex:none;padding-top:2px}
  .chk-detail .dt-acts .grow{flex:1}
  .chk-detail .dt-acts .dm-muted{font-size:var(--fs-sm)}

  /* ---------- 上架自检里的「一起跑的旅程」 ---------- */
  .chk-list .dm-group.jr-grp{margin-top:6px}
  .chk-list .dm-item.jr-pub svg.i{color:var(--ui-info)}
  .chk-list .dm-item.jr-pub.err svg.i{color:var(--ui-error)}
  .chk-list .dm-item.jr-new{color:var(--ui-fg-info)}
  .chk-list .dm-item.jr-new svg.i{color:var(--ui-fg-info)}
  .chk-list .dm-item.jr-new:hover{color:var(--ui-fg)}

  /* ---------- 用户旅程：左 步骤，右 详情 ---------- */
  .jr{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 420px;min-height:0;height:100%}
  .jr-main{display:flex;flex-direction:column;min-height:0;min-width:0;border-right:1px solid var(--ui-border)}
  .jr-compose{flex:none;display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--ui-border)}
  .jr-compose > svg.i{color:var(--ui-info)}
  .jr-prompt{flex:1;min-width:0;height:28px;border:1px solid var(--ui-component-border);border-radius:6px;background:var(--ui-field-bg);color:var(--ui-fg);font:inherit;font-size:var(--fs-para);padding:0 10px;outline:none;user-select:text}
  .jr-prompt:focus{border-color:var(--ui-accent)}
  .jr-tools{display:flex;gap:6px;flex:none}
  .jr .btn,.jr-foot .btn{height:26px;white-space:nowrap}
  .jr .btn svg.i,.jr-foot .btn svg.i{width:12px;height:12px}
  .jr .btn.primary svg.i,.jr-foot .btn.primary svg.i{color:var(--ui-accent-fg)}
  .jr .btn[disabled],.jr-foot .btn[disabled]{opacity:.5}
  .jr .dm-pill .spin,.jr-foot .dm-pill .spin,.jr-sum .spin{width:9px;height:9px;border-width:1.5px}
  .jr-sum{flex:none}
  .jr-sum .jr-sumr{display:inline-flex;align-items:center;gap:6px;font-weight:400;font-size:var(--fs-sm);color:var(--ui-fg-info)}
  .jr-sum .bad{color:var(--ui-error);font-weight:600}
  .jr-sum .good{color:var(--ui-success);font-weight:600}
  .jr-steps{flex:1;overflow:auto;min-height:0;padding:2px 0 10px}
  .jr-step{display:grid;grid-template-columns:18px 28px minmax(0,1fr);gap:10px;align-items:start;padding:4px 12px 4px 10px;border-left:2px solid transparent;cursor:default}
  .jr-step:hover{background:var(--ui-hover-list)}
  .jr-step.sel{background:var(--ui-selection)}
  .jr-step.run{border-left-color:var(--ui-accent);background:color-mix(in srgb,var(--ui-accent) 14%,transparent)}
  .jr-step.fail{border-left-color:var(--ui-error)}
  .jr-step.skip .jr-body,.jr-step.skip .jr-thumb{opacity:.55}
  .jr-step.enter{animation:jrin .3s ease-out both;animation-delay:var(--d,0s)}
  @keyframes jrin{from{opacity:0;transform:translateY(4px)}}
  .jr-no{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:600;background:var(--ui-tag-bg);color:var(--ui-fg-info);margin-top:3px}
  .jr-step.pass .jr-no{background:var(--ui-success);color:var(--ui-accent-fg)}
  .jr-step.fail .jr-no{background:var(--ui-error);color:var(--ui-accent-fg)}
  .jr-step.run .jr-no{background:var(--ui-accent);color:var(--ui-accent-fg)}
  .jr-thumb{width:28px;height:61px;border-radius:4px;overflow:hidden;position:relative;border:1px solid var(--ui-component-border);background:var(--ui-tag-bg);display:grid;place-items:center;flex:none}
  .jr-thumb.none svg.i{width:12px;height:12px;color:var(--ui-fg-disabled)}
  .jr-thumb .jr-scr{position:absolute;left:0;top:0;transform:scale(.1707);transform-origin:0 0}
  .jr-thumb.lg{width:50px;height:108px}
  .jr-thumb.lg .jr-scr{transform:scale(.305)}
  .jr-step.pass .jr-thumb{border-color:color-mix(in srgb,var(--ui-success) 70%,transparent)}
  .jr-step.fail .jr-thumb{border-color:var(--ui-error)}
  .jr-step.run .jr-thumb{border-color:var(--ui-accent)}
  .jr-scr{width:164px;height:356px;background:#fff;color:#1a1a1a;font-family:var(--font-ui);font-size:11px;line-height:1.4;overflow:hidden;position:relative}
  .jr-body{min-width:0;display:flex;flex-direction:column;gap:1px}
  .jr-l1,.jr-l2,.jr-l3{display:flex;align-items:center;gap:8px;min-width:0}
  .jr-l1 .grow{flex:1}
  .jr-name,.jr-exp{min-width:0;height:22px;border:1px solid transparent;border-radius:5px;background:transparent;color:var(--ui-fg);font:inherit;font-size:var(--fs-para);padding:0 6px;outline:none;user-select:text}
  .jr-name{flex:0 1 380px;font-weight:600;margin-left:-7px}
  .jr-exp{flex:1 1 auto;max-width:640px;border-color:color-mix(in srgb,var(--ui-component-border) 70%,transparent);background:var(--ui-field-bg)}
  .jr-name:hover{border-color:var(--ui-component-border)}
  .jr-name:focus,.jr-exp:focus{border-color:var(--ui-accent);background:var(--ui-field-bg)}
  .jr-name[readonly],.jr-exp[readonly]{cursor:default}
  .jr-name::placeholder,.jr-exp::placeholder{color:var(--ui-fg-disabled);font-weight:400}
  .jr-tag{flex:none;width:26px;font-size:11px;color:var(--ui-fg-info)}
  .jr-l3{font-size:var(--fs-sm);line-height:var(--lh-sm);color:var(--ui-fg-info)}
  .jr-l3 .jr-ops{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .jr .loc{font-family:var(--font-code);font-size:11px;color:var(--ui-link);cursor:pointer;white-space:nowrap}
  .jr .loc.bad{color:var(--ui-error)}
  .jr-dur{font-family:var(--font-code);font-size:11px;color:var(--ui-fg-info);min-width:36px;text-align:right;white-space:nowrap}
  .jr-step .dm-pill{flex:none;min-width:44px;justify-content:center}
  .jr-del{flex:none}
  .jr-del svg.i{width:14px;height:14px}
  .jr-del[disabled]{opacity:.35}
  .jr-add{margin-left:8px;height:20px;padding:0 7px 0 5px;border:1px dashed var(--ui-component-border);border-radius:5px;background:transparent;color:var(--ui-fg-info);font-size:11px;font-weight:400;display:inline-flex;align-items:center;gap:3px}
  .jr-add:hover{color:var(--ui-fg);border-color:var(--ui-fg-info)}
  .jr-add svg.i{width:12px;height:12px;color:currentColor}
  .jr-add[disabled]{opacity:.45}
  .jr-busy{display:flex;align-items:center;gap:8px;padding:14px 16px;color:var(--ui-fg-info);font-size:var(--fs-sm)}
  .jr-empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--ui-fg-info);font-size:var(--fs-sm);text-align:center;padding:16px}
  .jr-empty svg{width:24px;height:24px;color:var(--ui-info)}
  /* 右侧详情 */
  .jr-detail{display:flex;flex-direction:column;min-height:0;min-width:0}
  .jr-detail .chk-detail{flex:1}
  .chk-detail .dt-head.ok svg{color:var(--ui-success)}
  .chk-detail .dt-head.info svg{color:var(--ui-info)}
  .chk-detail ol{margin:0;padding-left:18px}
  .jr-foot{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 14px;border-top:1px solid var(--ui-border)}
  .jr-foot .grow{flex:1}
  .jr-foot .dm-pill[role="button"]{cursor:pointer}
  .jr-foot .dm-muted{font-size:var(--fs-sm)}
  .jr-fail{display:flex;flex-direction:column;gap:8px}
  .jr-assert{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 8px;font-size:var(--fs-sm);line-height:var(--lh-sm)}
  .jr-assert .k2{color:var(--ui-fg-info)}
  .jr-assert .bad{color:var(--ui-error)}
  .jr-cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .jr-crop{position:relative;height:70px;overflow:hidden;border-radius:6px;border:1px solid var(--ui-component-border);background:#fff}
  .jr-crop .jr-scr{position:absolute;right:0;top:0;transform:scale(1.15);transform-origin:100% 0}
  .jr-lbl{position:absolute;left:6px;bottom:6px;height:18px;padding:0 7px;border-radius:9px;font-size:11px;line-height:18px;font-weight:600;color:var(--ui-accent-fg);white-space:nowrap}
  .jr-lbl.ok{background:var(--ui-success)}
  .jr-lbl.err{background:var(--ui-error)}
  .jr-log{font-family:var(--font-code);font-size:11px;line-height:17px;background:var(--ui-editor-bg);border:1px solid var(--ui-border);border-radius:6px;padding:5px 8px;color:var(--ui-fg);user-select:text}
  .jr-log > div{display:flex;gap:6px}
  .jr-log .jr-lt{flex:none;color:var(--ui-fg-info)}
  .jr-log .jr-lv{flex:none;width:8px;font-weight:600;color:var(--ui-fg-info)}
  .jr-log .jr-lm{min-width:0;word-break:break-all}
  .jr-log .jr-le,.jr-log .jr-le .jr-lv{color:var(--ui-error)}
  .jr-log mark{background:color-mix(in srgb,var(--ui-warning) 28%,transparent);color:inherit;border-radius:3px;padding:0 2px}
  .jr-log .jr-dadd{background:var(--diff-add);margin:0 -8px;padding:0 8px}
  .jr-log.jr-diff .jr-lm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;word-break:normal}
  .jr-ctx{display:flex;flex-wrap:wrap;gap:6px}
  .jr-ctx > span{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px;border-radius:5px;background:var(--ui-tag-bg);color:var(--ui-fg);font-size:11px}
  .jr-ctx svg.i{width:12px;height:12px}
  .jr-prog{display:flex;flex-direction:column;gap:4px;font-size:var(--fs-sm);line-height:var(--lh-sm)}
  .jr-prog > div{display:flex;align-items:center;gap:8px;min-height:20px;color:var(--ui-fg-info)}
  .jr-prog > div.done,.jr-prog > div.run{color:var(--ui-fg)}
  .jr-prog .mk{width:14px;height:14px;flex:none;display:grid;place-items:center}
  .jr-prog .mk svg{width:14px;height:14px;color:var(--ui-success)}
  .jr-prog .mk .spin{width:10px;height:10px;border-width:1.5px}
  .jr-prog .mk i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--ui-component-border)}
  .jr-verified{display:flex;gap:6px;align-items:flex-start;font-size:var(--fs-sm);line-height:var(--lh-sm)}
  .jr-verified svg{width:14px;height:14px;flex:none;color:var(--ui-success);margin-top:1px}
  .jr-film{display:flex;flex-wrap:wrap;gap:8px}
  .jr-fig{margin:0;width:74px;display:flex;flex-direction:column;align-items:center;gap:4px}
  .jr-fig figcaption{width:100%;font-size:11px;line-height:14px;color:var(--ui-fg-info);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .jr-fig.pass .jr-thumb{border-color:color-mix(in srgb,var(--ui-success) 70%,transparent)}
  .jr-sv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:start}
  .jr-sv > div:first-child{display:flex;flex-direction:column;gap:10px;min-width:0}

  /* ---------- 模拟器窗 ---------- */
  .tw-right .emu-dev{font-size:var(--fs-sm);color:var(--ui-fg-info);margin-left:2px;white-space:nowrap}
  .emu{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px 12px 12px;background:var(--ui-editor-bg)}
  .emu-strip{align-self:stretch;display:flex;align-items:center;gap:6px;min-height:28px;padding:4px 10px;border-radius:6px;background:var(--ui-tag-bg);color:var(--ui-fg);font-size:var(--fs-sm);line-height:var(--lh-sm);flex:none}
  .emu-strip svg{width:14px;height:14px;flex:none}
  .emu-strip .spin{width:10px;height:10px;border-width:1.5px}
  .emu-strip .tx{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .emu-strip.muted{color:var(--ui-fg-info)}
  .emu-strip.muted svg{color:var(--ui-icon)}
  .emu-strip.info{background:color-mix(in srgb,var(--ui-accent) 16%,transparent)}
  .emu-strip.ok{background:color-mix(in srgb,var(--ui-success) 16%,transparent)}
  .emu-strip.ok svg{color:var(--ui-success)}
  .emu-strip.err{background:color-mix(in srgb,var(--ui-error) 16%,transparent)}
  .emu-strip.err svg{color:var(--ui-error)}
  .emu .dm-device{flex:none}
  .emu-cap{font-size:var(--fs-sm);line-height:var(--lh-sm);color:var(--ui-fg-info);min-height:16px;text-align:center;flex:none}
  .jr-tap{position:absolute;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;background:color-mix(in srgb,var(--ui-accent) 35%,transparent);border:2px solid var(--ui-accent);pointer-events:none;z-index:3;animation:jrtap .7s ease-out both}
  @keyframes jrtap{0%{transform:scale(.4);opacity:0}40%{opacity:1}100%{transform:scale(1.1);opacity:.85}}
  @media (prefers-reduced-motion:reduce){.jr-tap,.jr-step.enter{animation:none}}

  /* ---------- 模拟器屏幕里的示例应用（应用自身配色，不随 IDE 主题变） ---------- */
  .mapp .m-hd{height:30px;flex:none;display:flex;align-items:center;gap:6px;padding:0 10px;font-weight:600;font-size:12px}
  .mapp .m-sp{flex:1}
  .mapp .m-cart{position:relative;width:20px;height:20px;display:grid;place-items:center;border-radius:5px;flex:none}
  .mapp .m-cart svg{width:16px;height:16px;color:#1a1a1a}
  .mapp .m-cart b{position:absolute;top:-3px;right:-4px;min-width:13px;height:13px;padding:0 3px;border-radius:7px;background:#E84026;color:#fff;font-size:8px;line-height:13px;text-align:center;font-weight:700}
  .mapp .hot-ok{outline:2px solid var(--ui-success);outline-offset:1px}
  .mapp .hot-err{outline:2px solid var(--ui-error);outline-offset:1px}
  .mapp .m-sub{padding:0 12px 8px;font-size:10px;color:#8a8f99}
  .mapp .m-inp{margin:4px 12px;height:28px;flex:none;border-radius:8px;border:1px solid #d9dce3;display:flex;align-items:center;padding:0 10px;font-size:10px;color:#1a1a1a}
  .mapp .m-btn{margin:12px 12px 0;height:30px;flex:none;border-radius:15px;background:#3574F0;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:11px}
  .mapp .m-banner{margin:0 10px 6px;height:60px;flex:none;border-radius:8px;background:linear-gradient(120deg,#3574F0,#8a6cf0);color:#fff;font-weight:600;font-size:12px;padding:10px;line-height:1.35}
  .mapp .m-banner small{font-size:9px;font-weight:400;opacity:.9}
  .mapp .search.m-on{color:#1a1a1a}
  .mapp .m-cnt{padding:0 12px 2px;font-size:9px;color:#8a8f99}
  .mapp .m-hero{margin:2px 10px 0;height:128px;flex:none;border-radius:10px;background:linear-gradient(160deg,#eef1f6,#d8dee9);display:grid;place-items:center}
  .mapp .m-hero i{width:58px;height:40px;border-radius:20px;background:#fff;box-shadow:0 4px 12px rgba(0,0,0,.12)}
  .mapp .m-price{padding:8px 12px 0;color:#E84026;font-size:16px;font-weight:700;line-height:20px}
  .mapp .m-name{padding:2px 12px 0;font-size:12px;font-weight:600}
  .mapp .m-spec{padding:2px 12px 0;font-size:9px;color:#8a8f99}
  .mapp .m-bar{flex:none;display:flex;gap:6px;padding:8px 10px 10px;border-top:1px solid #f0f0f0;align-items:center}

  var KW=/^(import|from|export|class|interface|const|let|return|this|if|else|for|of|private|public|static|number|string|boolean|void|new|true|false|struct|async|await|try|catch|undefined)$/;
  function hl(src){
    if(/^\s*(\/\*|\*)/.test(src))return '<span class="c">'+esc(src)+'</span>';
    var re=/(\/\/.*$)|('(?:[^'\\]|\\.)*')|(@\w+)|\b(0x[0-9a-fA-F]+|\d+(?:\.\d+)?)\b|\b([A-Za-z_]\w*)\b(?=\s*\()|(?<=\.)([A-Za-z_]\w*)\b|\b([A-Za-z_]\w*)\b/g;
    var out='',last=0,m;
    while((m=re.exec(src))){
      out+=esc(src.slice(last,m.index));last=re.lastIndex;
      var cls=m[1]?'c':m[2]?'s':m[3]?'m':m[4]?'n':'';
      var w=m[5]||m[6]||m[7];
      if(!cls&&w){cls=KW.test(w)?'k':m[5]?'f':/^[A-Z]/.test(w)?'ty':m[6]?'p':''}
      out+=cls?'<span class="'+cls+'">'+esc(m[0])+'</span>':esc(m[0]);
    }
    return out+esc(src.slice(last));
  }

  function emuCap(t){var c=$('#emu-cap');if(c)c.textContent=t||''}

  /* 每一步在模拟器上怎么走：先点哪里、最后停在哪一屏、断言过不过 */

  function runJourney(done){
    if(!JR.steps.length||JR.phase==='running')return;

    JR.steps.forEach(function(s){s.st='';s.t=0;s.shot=null});

  /* 旅程文件：journeys/<name>.journey.json5，可提交进仓库、在上架自检里重复跑 */
  function q(s){return String(s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'")}
  function buildJourneyFile(){

    /* ---------- 用户旅程的交互 ---------- */
    $('#jr-tools').addEventListener('click',function(e){
      if(e.target.closest('#jr-split'))split();
      else if(e.target.closest('#jr-run')){if(JR.phase==='running')stopRun();else runJourney()}
    });
    $('#jr-prompt').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();split()}});
    $('#jr-sum').addEventListener('click',function(e){var a=e.target.closest('#jr-add');if(a&&!a.disabled)addStep()});
    $('#jr-steps').addEventListener('click',function(e){
      var del=e.target.closest('[data-del]');if(del){if(!del.disabled)delStep(+del.dataset.del);return}
      var loc=e.target.closest('[data-loc]');if(loc){selectStep(+loc.dataset.loc,true);return}
      var row=e.target.closest('.jr-step');if(row)selectStep(+row.dataset.i,!e.target.closest('input'));
    });
    $('#jr-steps').addEventListener('input',function(e){
      var inp=e.target.closest('input[data-f]');if(!inp)return;
      var i=+inp.closest('.jr-step').dataset.i,s=JR.steps[i];if(!s)return;
      s[inp.dataset.f]=inp.value;s.edited=true;if(JR.saved)JR.dirty=true;
      if(i===JR.sel&&JR.view!=='summary')renderJD();else renderFoot();
    });
    $('#jr-steps').addEventListener('focusin',function(e){
      var inp=e.target.closest('input[data-f]');if(!inp)return;
      var i=+inp.closest('.jr-step').dataset.i;if(i!==JR.sel||JR.view==='summary')selectStep(i,false);
    });
    $('#jr-dbody').addEventListener('click',function(e){
      if(e.target.closest('[data-cause]'))openFile('CartStore.ets',48,'err');
      else if(e.target.closest('[data-fixloc]'))openFile('CartStore.ets',49,null,{ok:[49]});
      else if(e.target.closest('[data-jloc]')){var s=JR.steps[+e.target.closest('[data-jloc]').dataset.jloc];if(s)jumpStep(s)}
      else{var fg=e.target.closest('[data-fig]');if(fg)selectStep(+fg.dataset.fig,true)}
    });
    $('#jr-foot').addEventListener('click',function(e){
      if(e.target.closest('#jr-fix'))fixTask();
      else if(e.target.closest('#jr-restore'))restoreCart();
      else if(e.target.closest('#jr-save'))saveJourney();
      else if(e.target.closest('#jr-open'))openFile(JR.file,1,null,{nohl:true});
      else if(e.target.closest('#jr-pubadd'))addToPublish();
      else if(e.target.closest('#jr-gopub')){switchScene('publish');var r=$('#jr-pub');if(r)r.scrollIntoView({block:'nearest'})}
    });
  }});
DemoGuide.init([
  {"target": "#chk-list", "kind": "click", "pos": "top", "label": "点一条问题"},
  {"target": "#code", "kind": "change", "pos": "top", "label": "自动跳到那一行"},
  {"target": ".btab[data-scene=\"journey\"]", "kind": "click", "pos": "top", "label": "一句话写测试旅程"},
  {"target": "#jr-run, #jr-split", "kind": "click", "pos": "left", "label": "拆成步骤，再到模拟器上跑"},
  {"target": "#jr-fail", "kind": "change", "pos": "top", "label": "失败现场：截图+HiLog+代码行"}
]);
})();
</script>
