<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='32' y2='32' gradientUnits='userSpaceOnUse'%3E%3Cstop stop-color='%232C8DDD'/%3E%3Cstop offset='1' stop-color='%233357AC'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='7' fill='url(%23g)'/%3E%3Ctext x='16' y='22.5' font-family='Arial,Helvetica,sans-serif' font-size='13' font-weight='700' fill='white' text-anchor='middle'%3EDE%3C/text%3E%3C/svg%3E">
<title>16 · 多设备验证：说一句 Agent 并行跑、逐处预判，你只确认缺陷</title>
<link rel="stylesheet" href="../../deveco-intui-kit/src/tokens.css">
<link rel="stylesheet" href="../../deveco-intui-kit/src/components.css">
<link rel="stylesheet" href="../_shared/frame.css">
<link rel="stylesheet" href="../_shared/guide.css">
<script src="../../deveco-intui-kit/src/icons.js"></script>
<script src="../../deveco-intui-kit/icons/ai-icons.js"></script>
<script src="../_shared/frame.js"></script>
<script src="../_shared/stage.js"></script>
<script src="../_shared/guide.js"></script>
<style>
  .ide[data-ide-theme]{--bottom-h:clamp(400px,52vh,520px)}
  .tw-bottom .tw-hdr .dm-pill{margin-left:10px;align-self:center}
  .btn{white-space:nowrap}
  /* 底部工具窗主体：左画布，右判断 */
  .dv{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 372px;min-height:0;height:100%}
  .dv > *{min-width:0;min-height:0}
  .dv .dm-canvas{overflow:auto}
  .dv-side{box-shadow:inset 1px 0 0 var(--ui-border);overflow:auto;padding:10px 12px;display:flex;flex-direction:column;gap:10px;background:var(--ui-bg)}
  /* 热区：颜色跟边框走，选中时外发光 */
  .dm-hot{color:var(--ui-error);transition:box-shadow .15s}
  .dm-hot.ok{color:var(--ui-success)}
  .dm-hot:not(.on){opacity:.55}
  .dm-hot.on{border-width:2px}
  .dm-hot .lb.r{left:auto;right:6px}
  .dm-hot .lb.c{left:50%;transform:translateX(-50%)}
  /* 迷你应用补充：折叠屏两栏、手表标题溢出 */
  .mapp .search.sq{border-radius:6px}
  .mapp .cols{flex:1;display:flex;min-height:0}
  .mapp .col{flex:1;min-width:0;display:flex;flex-direction:column}
  .mapp .col.blank{background:#fff}
  .mapp .nav{height:28px;border-top:1px solid #f0f0f0;display:flex;align-items:center;justify-content:space-around;font-size:8px;color:#8a8f99}
  .mapp .nav b{color:#3574F0;font-weight:600}
  /* 判断列表：每条两行，第二行放动作 */
  .dv-ent{padding:5px 12px 6px;display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--ui-border);cursor:default}
  .dv-ent:first-child{border-top:0}
  .dv-ent:hover{background:var(--ui-hover-list)}
  .dv-ent.sel{background:var(--ui-selection)}
  .dv-ent .r1{display:flex;align-items:center;gap:8px;min-height:22px;white-space:nowrap}
  .dv-ent .r1 svg{width:16px;height:16px;flex:none}
  .dv-ent .r1 svg.ok{color:var(--ui-success)}
  .dv-ent .r1 svg.err{color:var(--ui-error)}
  .dv-ent .r1 .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
  .dv-ent .r2{display:flex;align-items:center;gap:6px;padding-left:24px}
  .dv-ent .r2 .dev{font-size:11px;color:var(--ui-fg-info);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dv-ent .r2 .btn.sm{font-size:11px;padding:0 7px}
  .why{padding:8px 12px;border-top:1px solid var(--ui-border);background:var(--ui-bg);font-size:var(--fs-sm);line-height:var(--lh-sm);display:flex;gap:6px}
  .why svg{width:14px;height:14px;flex:none;margin-top:1px;color:var(--ui-fg-info)}
  .why b{font-weight:500}
  .why code{font-family:var(--font-code);font-size:11px;background:var(--ui-tag-bg);padding:0 4px;border-radius:4px}
  /* 规则卡 */
  .rule{display:flex;align-items:flex-start;gap:8px;font-size:var(--fs-sm);line-height:var(--lh-sm)}
  .rule .id{font-family:var(--font-code);font-size:11px;font-weight:600;color:var(--ui-fg-info);width:22px;flex:none;padding-top:1px}
  .rule .grow{flex:1;min-width:0}
  .rule .dm-pill{flex:none}
  .rule.added{color:var(--ui-fg);background:var(--ui-tag-bg);border-radius:6px;padding:4px 6px;margin:0 -6px}
  .rule.added svg{width:14px;height:14px;flex:none;color:var(--ui-success);margin-top:1px}
  .code .ln.hl-ok{cursor:default}
  .dv[hidden]{display:none}

  /* ---------- 新增：碰一碰把桌上几台一次拉进来 ---------- */
  .tv-seg{position:static}
  .tv-seg button{height:24px}
  .tv-seg button[disabled]{color:var(--ui-fg-disabled)}
  .tdesk{position:relative;display:flex;align-items:center;justify-content:center;gap:44px;min-height:100%;padding:20px 28px 28px;box-sizing:border-box}
  .tdesk[hidden],.trun[hidden]{display:none}
  .tdeck{position:relative;width:272px;height:196px;flex:none;border-radius:14px;background:color-mix(in srgb,var(--ui-fg) 7%,var(--ui-editor-bg))}
  .tdeck .kb{position:absolute;left:14px;right:14px;top:12px;height:98px;border-radius:6px;
    background:repeating-linear-gradient(90deg,transparent 0 2px,color-mix(in srgb,var(--ui-fg) 11%,transparent) 2px 16px,transparent 16px 18px)}
  .tdeck .kb::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(180deg,transparent 0 16px,color-mix(in srgb,var(--ui-fg) 5%,var(--ui-editor-bg)) 16px 19.6px)}
  .tdeck .tp{position:absolute;left:84px;top:122px;width:104px;height:64px;border-radius:7px;background:color-mix(in srgb,var(--ui-fg) 5%,transparent)}
  .tdeck .who{position:absolute;left:14px;bottom:8px;font-size:10px;line-height:14px;color:var(--ui-fg-info)}
  .tnfc{position:absolute;left:198px;top:124px;width:58px;height:58px;border-radius:12px;border:1px dashed var(--ui-fg-info);background:color-mix(in srgb,var(--ui-fg) 8%,transparent);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--ui-fg);font-size:10px;line-height:12px}
  .tnfc svg{width:18px;height:18px}
  .tnfc .rip{position:absolute;inset:-2px;border-radius:14px;border:2px solid var(--ui-fg-info);opacity:0;pointer-events:none}
  .tdesk.touch .tnfc .rip{animation:tnrip .9s ease-out 2}
  .tdesk.touch .tnfc .rip.r2{animation-delay:.3s}
  @keyframes tnrip{0%{transform:scale(.8);opacity:.9}100%{transform:scale(1.9);opacity:0}}
  .tdesk.ask .tnfc{animation:tnwait 1.6s ease-in-out infinite}
  @keyframes tnwait{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ui-fg) 25%,transparent)}60%{box-shadow:0 0 0 8px transparent}}
  .tdevs{display:flex;align-items:flex-end;gap:30px}
  .tdev{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;border:0;background:transparent;padding:0;cursor:pointer;color:var(--ui-fg);font:inherit}
  .tdev:focus-visible{outline:2px solid var(--ui-accent);outline-offset:4px;border-radius:8px}
  .tdev.in{cursor:default}
  .tfr{display:block;background:#0f1012;padding:3px;border-radius:10px;box-shadow:0 8px 20px rgba(0,0,0,.35);box-sizing:content-box;position:relative}
  .tfr .tsc{display:block;width:100%;height:100%;border-radius:8px;background:#4a4e57;position:relative;overflow:hidden}
  .tfr .tsc::after{content:"";position:absolute;left:50%;bottom:4px;width:30%;height:2px;margin-left:-15%;border-radius:1px;background:rgba(255,255,255,.85)}
  .tfr.ph{width:56px;height:126px;border-radius:12px}
  .tfr.ph .tsc{border-radius:10px}
  .tfr.ph .hole{position:absolute;left:50%;top:6px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:#050505;z-index:1}
  .tfr.fd{width:124px;height:114px}
  .tfr.fd .crease{position:absolute;left:50%;top:3px;bottom:3px;width:1px;background:rgba(0,0,0,.28);z-index:1}
  .tfr.pd{width:192px;height:128px;border-radius:9px}
  .tfr.pd .tsc{border-radius:7px}
  .tcap{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;line-height:15px;white-space:nowrap}
  .tcap b{font-weight:500;font-size:var(--fs-sm)}
  .tcap span{color:var(--ui-fg-info)}
  .tok{position:absolute;top:-9px;right:-9px;height:18px;padding:0 7px 0 5px;border-radius:9px;background:var(--ui-success);color:#fff;font-size:10px;line-height:18px;font-weight:600;display:none;align-items:center;gap:3px;z-index:2}
  .tok svg{width:10px;height:10px}
  .tdev.in .tok{display:inline-flex;animation:tokin .3s ease-out}
  .tdev.in .tfr{opacity:.55}
  @keyframes tokin{from{transform:scale(.5);opacity:0}to{transform:none;opacity:1}}
  .ttoast{position:absolute;right:18px;top:14px;width:250px;border-radius:14px;background:var(--ui-popup-bg);box-shadow:var(--ui-shadow);padding:9px 12px;display:flex;gap:10px;align-items:center;
    font-size:var(--fs-sm);line-height:var(--lh-sm);animation:tstin .25s cubic-bezier(.2,.8,.3,1);z-index:4}
  .ttoast[hidden]{display:none}
  @keyframes tstin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
  .ttoast .ic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--ui-tag-bg);flex:none}
  .ttoast .ic svg{width:16px;height:16px;color:var(--ui-fg)}
  .ttoast .tx{display:flex;flex-direction:column;min-width:0}
  .ttoast .tx b{font-weight:500}
  .ttoast .tx span{font-size:11px;color:var(--ui-fg-info);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* 并排结果：三台按真实比例（1260×2844 / 2440×2240 / 2880×1920） */
  .trun{display:flex;align-items:center;justify-content:center;gap:40px;min-height:100%;padding:16px 28px 34px;box-sizing:border-box}
  .trun .dm-device{padding:7px;cursor:default}
  .trun .dm-device.tph{width:160px;height:344px;border-radius:24px}
  .trun .dm-device.tph .scr{border-radius:18px}
  .trun .dm-device.tfd{width:332px;height:306px;border-radius:16px}
  .trun .dm-device.tfd .scr::after{content:"";position:absolute;top:0;bottom:0;left:50%;width:1px;background:rgba(0,0,0,.14)}
  .trun .dm-device.tpd{width:428px;height:290px;border-radius:14px}
  .trun .dm-device.tpd .scr{border-radius:9px}
  .trun .dm-device .cap{bottom:-22px}
  .trun .dm-device.ds-stage > .cap{bottom:-15px}
  .trun .dm-device .cap b{color:var(--ui-fg);font-weight:500}
  .trun .dm-device.reload .scr{animation:reload .6s ease-out 1}
  @keyframes reload{0%{opacity:.35}100%{opacity:1}}
  .trun .hole{position:absolute;left:50%;top:5px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:#050505;z-index:2}
  .mapp .gbar{height:12px;display:grid;place-items:center;flex:none}
  .mapp .gbar::after{content:"";width:34%;height:3px;border-radius:2px;background:#1a1a1a}
  .mapp .dtl{flex:1;display:flex;flex-direction:column;gap:6px;padding:8px 10px;border-left:1px solid #eef0f3;min-width:0}
  .mapp .dtl .img{height:42%;border-radius:8px;background:linear-gradient(135deg,#dfe7ff,#b9c9ff)}
  .mapp .dtl b{font-size:12px}
  .mapp .dtl span{font-size:9px;color:#8a8f99}
  .mapp .dtl .pr{font-size:13px;font-weight:600;color:#DB3B4B}
  .mapp .dtl .buy{margin-top:auto;height:24px;border-radius:12px;background:#3574F0;color:#fff;display:grid;place-items:center;font-size:10px;font-weight:600}
  .mapp .rail{width:13%;flex:none;display:flex;flex-direction:column;align-items:center;gap:12px;padding-top:10px;border-right:1px solid #eef0f3;font-size:8px;color:#8a8f99}
  .mapp .rail i{display:block;width:14px;height:14px;border-radius:4px;background:#e3e6ec;margin:0 auto 2px}
  .mapp .rail b{color:#3574F0;font-weight:600}
  .mapp .rail b i{background:#3574F0}
  .mapp .rail span,.mapp .rail b{text-align:center}
  .mapp .search.full{margin:4px 8px 6px;border-radius:6px}
  .tov{position:absolute;inset:0;background:rgba(12,13,16,.72);color:#e8eaee;display:flex;flex-direction:column;justify-content:center;gap:5px;padding:0 12%;z-index:3;font-size:10px;line-height:14px}
  .tov b{font-size:11px;color:#fff;margin-bottom:2px}
  .tov .it{display:flex;align-items:center;gap:6px;color:#8a8f99;white-space:nowrap}
  .tov .it i{width:9px;height:9px;border-radius:50%;border:1.5px solid #5a5f6a;flex:none;box-sizing:border-box}
  .tov .it.ok{color:#cfd3da}.tov .it.ok i{background:#5FB865;border-color:#5FB865}
  .tov .it.run{color:#fff;font-weight:600}.tov .it.run i{border-color:#e8eaee;border-right-color:transparent;animation:spin 1s linear infinite}
  .tov .pb{height:3px;border-radius:2px;background:#262a31;overflow:hidden;margin-top:4px}
  .tov .pb i{display:block;height:100%;width:var(--v,0%);background:#cfd3da;transition:width .3s}
  .tov .tm{font-family:var(--font-code);font-size:9.5px;color:#8a8f99}

  /* 右侧：验证列表 */
  .dv-side > .dm-card{flex:none;border:0;background:color-mix(in srgb,var(--ui-fg) 5%,var(--ui-bg))}
  .dv-side .dm-card-hd{border-bottom-color:color-mix(in srgb,var(--ui-fg) 6%,transparent)}
  .dv-side .dm-card-ft{background:transparent;border-top-color:color-mix(in srgb,var(--ui-fg) 6%,transparent)}
  .dv-side .dv-ent,.dv-side .tl-row{border-top-color:color-mix(in srgb,var(--ui-fg) 6%,transparent)}
  .dv-side .why{background:transparent;border-top-color:color-mix(in srgb,var(--ui-fg) 6%,transparent)}
  .dv-side .dv-ent.sel{background:color-mix(in srgb,var(--ui-fg) 9%,transparent);box-shadow:inset 2px 0 0 var(--ui-accent)}
  .dv-side .dv-ent:hover:not(.sel){background:color-mix(in srgb,var(--ui-fg) 4%,transparent)}
  .dv-side .why a.cl,.dv-side .why code.cl{color:var(--ui-link);cursor:pointer;text-decoration:none}
  .dv-side .why a.cl:hover{text-decoration:underline}
  /* 台前调度：画布工具条 + 上台原因签 */
  .tv-col{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--ui-editor-bg)}
  .tv-bar{flex:none;display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;min-width:0;overflow:hidden}
  .ds-why{min-width:0;flex:0 1 auto}
  .ds-why #ds-why-t{min-width:0;overflow:hidden;text-overflow:ellipsis}
  /* 顶栏胶囊文字长时省略，不把整个 IDE 撑宽 */
  #hdr-agent{min-width:0;max-width:520px;display:inline-flex;overflow:hidden}
  .tv-col .dm-canvas{flex:1}
  .tv-bar .tv-seg{position:static}
  .tv-bar .ds-btn{height:24px;display:inline-flex;align-items:center;gap:5px;padding:0 9px;border-radius:var(--arc);border:0;background:color-mix(in srgb,var(--ui-fg) 8%,var(--ui-editor-bg));color:var(--ui-fg);font:inherit;font-size:12px}
  .tv-bar .ds-btn svg{width:14px;height:14px}
  .tv-bar .ds-btn.on{background:var(--ui-selection)}
  .tv-bar .ds-btn[hidden]{display:none}
  .ds-why{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 4px 0 10px;border-radius:12px;background:color-mix(in srgb,var(--ui-fg) 8%,var(--ui-editor-bg));font-size:11px;color:var(--ui-fg);white-space:nowrap}
  .ds-why[hidden]{display:none}
  .ds-why .k{color:var(--ui-fg-info)}
  .ds-why .pin{height:18px;padding:0 7px;border:0;border-radius:9px;background:transparent;color:var(--ui-fg-info);font:inherit;font-size:11px;display:inline-flex;align-items:center;gap:3px}
  .ds-why .pin.on{background:var(--ui-tag-bg);color:var(--ui-fg)}
  .ds-why .pin svg{width:11px;height:11px}
  #tcanvas.ds-on .trun{visibility:visible}
  .code .ln.ds-link{cursor:pointer}
  .tl-empty{padding:12px;font-size:var(--fs-sm);line-height:var(--lh-sm);color:var(--ui-fg-info);display:flex;gap:8px;align-items:flex-start}
  .tl-empty svg{width:14px;height:14px;flex:none;margin-top:1px;color:var(--ui-fg-info)}
  .tl-row{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 12px;border-top:1px solid var(--ui-border);font-size:var(--fs-sm);line-height:var(--lh-sm)}
  .tl-row:first-child{border-top:0}
  .tl-row.new{animation:tlin .35s ease-out}
  @keyframes tlin{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
  .tl-ic{width:22px;height:22px;display:grid;place-items:center}
  .tl-ic i{display:block;border:1.5px solid var(--ui-icon);border-radius:3px;box-sizing:border-box}
  .tl-tx{display:flex;flex-direction:column;min-width:0}
  .tl-tx b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tl-tx span{font-size:11px;color:var(--ui-fg-info);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #btn-par[disabled]{opacity:.5}

  /* ---------- Agent·验证：说一句 → 它跑、它判、出补丁 → 你只确认 ---------- */
  .ag{flex:none;border-radius:var(--ai-r);background:var(--ai-surface);padding:10px 10px 8px;display:flex;flex-direction:column;gap:8px}
  .ag-hd{display:flex;align-items:center;gap:6px;font-size:12px;padding:0 2px}
  .ag-hd svg.i{width:14px;height:14px;color:var(--ai-ink)}
  .ag-hd b{font-weight:500}.ag-hd .grow{flex:1}
  .ag .ai-field{background:var(--ai-surface-2);box-shadow:none}
  .ag .ai-field__ta{min-height:38px}
  .ag-you{align-self:flex-end;max-width:92%;padding:6px 10px;border-radius:10px;background:var(--ai-surface-2);font-size:12px;line-height:18px}
  .ag-trace{display:flex;flex-direction:column;gap:2px}
  .ag-trace:empty{display:none}
  .ag-trace .ai-toolrow{align-items:start}
  .ag-trace .ai-toolrow .what{white-space:normal;line-height:17px}
  .ag-trace .ai-toolrow>.ai-ico,.ag-trace .ai-toolrow>.ai-ring,.ag-trace .ai-toolrow>.ai-spark{margin-top:2px}
  .ag-trace .ai-ico.ok{color:var(--ui-success)}
  .ag-trace .ai-ring,.ag-trace .ai-spark{margin-left:2px}
  .ag-trace .ai-src{height:18px;margin:0 2px}
  .agt{color:var(--ai-ink);font-weight:400}
  .ag .ai-ask{margin-top:4px}
  .flash-q{animation:flashq 1.4s ease-out 1}
  @keyframes flashq{0%{background:var(--ai-wait-tint)}100%{background:transparent}}
  .dm-pill.wait{background:var(--ai-wait-tint);color:var(--ai-wait-ink)}
  /* Agent 预判的差异：没轮到的变淡；只有选中那条露出按钮；适配的收成一行 */
  .dv-ent.pending{opacity:.45}
  .dv-ent.pending .r2 .btn{display:none}
  .agent .dv-ent:not(.sel) .r2 .btn{display:none}
  .agent .dv-ent[data-fixed] .r2 .btn{display:none}
  .agent .dv-ent:not(.sel) .fx{display:none}
  .agent.folded:not(.show-ok) .dv-ent.auto{display:none}
  .dv-ent .fx{margin-left:24px;padding:6px 8px;border-radius:6px;background:var(--ai-surface-2);font-family:var(--font-code);font-size:11px;line-height:16px;display:flex;flex-direction:column;white-space:pre;overflow:hidden}
  .dv-ent .fx .at{font-family:var(--font-ui);color:var(--ui-fg-info);margin-bottom:2px}
  .dv-ent .fx .a{color:var(--ui-success)}.dv-ent .fx .d{color:var(--ui-error)}
  .ok-fold{appearance:none;border:0;background:transparent;width:100%;display:flex;align-items:center;gap:8px;padding:6px 12px;font:inherit;font-size:12px;color:var(--ui-fg);cursor:pointer;text-align:left}
  .ok-fold:hover{background:color-mix(in srgb,var(--ui-fg) 4%,transparent)}
  .ok-fold svg{width:14px;height:14px;color:var(--ui-success);flex:none}
  .ok-fold span:first-of-type{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ok-fold .more{color:var(--ui-fg-info);font-size:11px}

  /* ================= 判定列表：Agent 预判 / 手动逐条判 共用一套 ================= */
  function Judge(o){
    var list=o.list;
    function hotsOf(d){return (d.dataset.hots||d.dataset.hot||'').split(' ')}
    function recount(){
      var ents=$$('.dv-ent',list),ok=0,err=0,fixed=0;
      ents.forEach(function(e){if(e.dataset.fixed)fixed++;else if(e.dataset.kind==='ok')ok++;else err++});
      o.sum.textContent=ok+' 适配 · '+(fixed?fixed+' 已修 · ':'')+err+(T.agent?' 缺陷':' 疑似缺陷');
    }
    function select(ent,how){
      $$('.dv-ent',list).forEach(function(e){e.classList.toggle('sel',e===ent)});
      $$('.dm-hot',o.canvas).forEach(function(h){h.classList.toggle('on',!!ent&&h.id===ent.dataset.hot)});
      $$('.dm-device',o.canvas).forEach(function(d){d.classList.toggle('sel',!!ent&&hotsOf(d).indexOf(ent.dataset.hot)>=0)});

      var sd=o.why.closest('.dv-side'),a=sd.getBoundingClientRect(),w=o.why.getBoundingClientRect();if(w.bottom>a.bottom)sd.scrollTop+=w.bottom-a.bottom+8;
    }
    function done(ent){ent.dataset.judged=1;recount();if(o.onJudged)o.onJudged(ent);else select(ent)}
    function setIco(ent,kind){var ico=$('.r1 svg',ent);ico.setAttribute('class',kind);$('use',ico).setAttribute('href',kind==='ok'?'#i-checkS':'#i-err')}
    /* 其实是适配：热区变绿，判法回流成一条待入规则 */
    function markOk(ent){
      var hot=$('#'+ent.dataset.hot),pill=$('[data-pill]',ent);
      hot.classList.add('ok');$('.lb',hot).textContent='适配 · 你改判的';
      pill.className='dm-pill ok';pill.textContent='适配 · 你改判';

      if(!$('.rule.added[data-for="'+ent.dataset.hot+'"]')){
        $('#rule-bd').insertAdjacentHTML('beforeend','<div class="rule added dm-small" data-for="'+ent.dataset.hot+'"><svg><use href="#i-plus-box"/></svg><span class="grow">待入：'+ent.dataset.rule+'</span></div>');
        $('#rule-cnt').textContent='12 条 · 待入 '+$$('.rule.added').length;
      }
      done(ent);
    }
    function markBug(ent){
      var hot=$('#'+ent.dataset.hot),pill=$('[data-pill]',ent);
      hot.classList.remove('ok');$('.lb',hot).textContent='缺陷 · 已确认';
      pill.className='dm-pill err';pill.textContent='缺陷 · 已确认';
      setIco(ent,'err');ent.dataset.kind='err';
      ent.dataset.why='你确认为缺陷，已连同 '+T.run.ids.length+' 台截图进 Problems，指向 '+CL+' 这次改动。';
      var added=$('.rule.added[data-for="'+ent.dataset.hot+'"]');if(added){added.remove();var n=$$('.rule.added').length;$('#rule-cnt').textContent=n?'12 条 · 待入 '+n:'12 条'}
      done(ent);
    }
    list.addEventListener('click',function(e){
      var tg=e.target.closest('#ok-fold');if(tg){list.classList.toggle('show-ok');tg.setAttribute('aria-expanded',String(list.classList.contains('show-ok')));return}

      var b=e.target.closest('[data-act]');
      if(b){if(b.dataset.act==='fix')o.onFix(ent,done);else if(b.dataset.act==='ok')markOk(ent);else markBug(ent);return}
      if(e.shiftKey&&o.onShift){o.onShift(ent);return}
      select(ent);
    });
    o.canvas.addEventListener('click',function(e){
      var d=e.target.closest('.dm-device[data-hots]');if(!d||d.classList.contains('ds-side'))return;
      var ent=$('.dv-ent[data-hot="'+hotsOf(d)[0]+'"]',list);if(ent&&!ent.classList.contains('pending'))select(ent,'canvas');
    });
    return {select:select,recount:recount,hotsOf:hotsOf,setIco:setIco};

    var d=TD[id],w=d.ic[0],h=d.ic[1],st=T.run&&T.run.st[id],pill,sub=d.px+' · '+d.bp+' · 碰一碰 '+d.t+' s';

  $('#ds-pin').addEventListener('click',function(){DS.pinned=!DS.pinned;this.classList.toggle('on',DS.pinned);this.lastChild.textContent=DS.pinned?'已固定':'固定'});

  /* 补丁落进编辑器：Agent 写的行带来源，人改的第 12 行不打标 */
  function insertLine(){
    var code=$('#code'),after=$('.ln[data-ln="13"]',code);if(!after||$('.ln[data-ln="13b"]',code))return;
    after.insertAdjacentHTML('afterend','<div class="ln ai-block" data-ln="13b"><span class="ai-gut" data-src="Agent·验证 · 平板搜索框拉满 · 你确认的"></span><span class="g"><span class="n"></span><span class="m"></span><span class="fold"></span></span><span class="t">        .<span class="f">constraintSize</span>({ <span class="p">maxWidth</span>: 480 })</span></div>');
    $$('.ln',code).forEach(function(l,i){var n=$('.g .n',l);if(n)n.textContent=i+1});
    var row=$('.ln[data-ln="13b"]',code);code.scrollTop=row.offsetTop-code.clientHeight/2;
  }

  renderList();
  cap('idle','Agent·验证 待命 · 改动 #41 可以验了');
