<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='32' y2='32' gradientUnits='userSpaceOnUse'%3E%3Cstop stop-color='%232C8DDD'/%3E%3Cstop offset='1' stop-color='%233357AC'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='7' fill='url(%23g)'/%3E%3Ctext x='16' y='22.5' font-family='Arial,Helvetica,sans-serif' font-size='13' font-weight='700' fill='white' text-anchor='middle'%3EDE%3C/text%3E%3C/svg%3E">
<title>04 · 安卓应用转化：一键之后的活才是活</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../../deveco-intui-kit/src/tokens.css">
<link rel="stylesheet" href="../../deveco-intui-kit/src/components.css">
<link rel="stylesheet" href="../_shared/frame.css">
<link rel="stylesheet" href="../_shared/guide.css">
<script src="../../deveco-intui-kit/src/icons.js"></script>
<script src="../_shared/frame.js"></script>
<script src="../_shared/guide.js"></script>
<style>
  .ide[data-ide-theme]{--ai-w:clamp(380px,32vw,520px)} /* 带属性选择器，压过 tokens.css 里按主题写的默认值 */
  code{font-family:var(--font-code);font-size:11px;background:var(--ui-tag-bg);padding:1px 4px;border-radius:4px;color:var(--ui-fg)}
  /* 树标题栏里的进度 pill */
  #tree-prog{margin-left:2px}
  /* 编辑器顶部的转化提示条 */
  #callout-wrap{padding:8px 12px 0;flex:none;display:flex;flex-direction:column;gap:6px}
  #callout-wrap:empty{display:none}
  .dm-callout .txt{flex:1;min-width:0}
  .dm-callout .acts{display:flex;flex-direction:column;gap:4px;flex:none;align-self:center;align-items:stretch}
  .dm-callout .acts .btn{justify-content:center;white-space:nowrap}
  .dm-callout .who{font-size:var(--fs-sm);color:var(--ui-fg-info);margin-top:2px}
  .code .ln.hl-warn .g,.code .ln.hl-ok .g{background:transparent}
  /* 右侧 Migration 面板 */
  .mg-body{display:flex;flex-direction:column;padding-bottom:12px}
  .mg-top{display:flex;flex-direction:column;gap:8px;padding:10px 12px 8px}
  .mg-top .dm-row{font-size:var(--fs-sm);line-height:var(--lh-sm)}
  .mg-list .dm-item{align-items:flex-start;padding:6px 12px;white-space:normal;cursor:default}
  .mg-list .dm-item .num{width:18px;height:18px;border-radius:50%;background:var(--ui-tag-bg);color:var(--ui-tag-fg);font-family:var(--font-code);font-size:11px;font-weight:600;display:grid;place-items:center;flex:none;margin-top:1px}
  .mg-list .dm-item.sel .num{background:var(--ui-accent);color:var(--ui-accent-fg)}
  .mg-list .dm-item .grow{display:flex;flex-direction:column;gap:1px;overflow:visible}
  .mg-list .dm-item .t{display:flex;align-items:center;gap:6px;white-space:nowrap}
  .mg-list .dm-item .t b{font-weight:600}
  .mg-list .dm-item .t .f{font-family:var(--font-code);font-size:11px;color:var(--ui-link)}
  .mg-list .dm-item .t .f.dead{color:var(--ui-fg-info)}
  .mg-list .dm-item .r{font-size:var(--fs-sm);line-height:var(--lh-sm);color:var(--ui-fg-info);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mg-list .dm-item .side{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex:none;margin-top:1px}
  .mg-list .dm-item .est{font-family:var(--font-code);font-size:11px;color:var(--ui-fg-info);white-space:nowrap}
  .mg-list .dm-item.new{animation:mgin .5s ease-out}
  @keyframes mgin{from{background:color-mix(in srgb,var(--ui-accent) 20%,transparent)}to{background:transparent}}
  /* 安卓提交卡片 */
  .cm{display:flex;align-items:center;gap:8px;min-height:28px}
  .cm .sha{font-family:var(--font-code);font-size:11px;color:var(--ui-link);flex:none;width:48px}
  .cm .grow{flex:1;min-width:0;display:flex;flex-direction:column}
  .cm .grow .m{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cm .grow .s{font-size:var(--fs-sm);line-height:var(--lh-sm);color:var(--ui-fg-info);white-space:nowrap}
  .cm .btn,.cm .dm-pill{flex:none}
  .dm-card-bd .cm + .cm{border-top:1px solid var(--ui-border);padding-top:8px}
  /* 左侧真机预览 */
  .prev-split{display:flex;flex-direction:row;flex:1;min-height:0}
  .prev-col{flex:none;width:180px;display:flex;flex-direction:column;border-right:1px solid var(--ui-border);background:var(--ui-editor-bg)}
  .prev-col .previewer{flex:1;padding:12px}
  .prev-col .phone{width:148px;height:321px;border-width:5px}
  .prev-path{flex:none;padding:6px 10px;font-family:var(--font-code);font-size:11px;color:var(--ui-fg-info);border-top:1px solid var(--ui-border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .code-col{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}

  /* 预览：按 Mate 70 Pro 1260 × 2844 比例，挖孔居中 */
  .prev-col .phone::before{width:9px;height:9px;border-radius:50%;top:7px}
  .prev-col .phone .mapp{width:100%;height:100%;padding-top:20px;overflow:hidden;border-radius:21px}
  .prev-col .cmp-go{margin:0 10px 10px;justify-content:center;flex:none}
  .prev-col .cmp-go svg.i{width:14px;height:14px}

  /* ===== 并排对照：同一台鸿蒙电脑上，卓易通跑安卓原版 · 原生窗口跑鸿蒙版 ===== */
  .ide[data-ide-theme].cmp-on{--ai-w:440px}
  .prev-split.cmp .prev-col{display:none}
  .desk-col{flex:none;width:492px;display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--ui-border);background:radial-gradient(120% 70% at 15% 0%,color-mix(in srgb,var(--ui-accent) 13%,transparent),transparent 60%),radial-gradient(90% 60% at 100% 100%,color-mix(in srgb,var(--ui-success) 9%,transparent),transparent 60%),var(--ui-editor-bg)}
  .desk-col[hidden]{display:none}
  .desk-bar{height:34px;flex:none;display:flex;align-items:center;gap:6px;padding:0 8px 0 10px;border-bottom:1px solid var(--ui-border);background:var(--ui-bg);font-size:var(--fs-sm);white-space:nowrap}
  .desk-bar > svg.i{width:14px;height:14px;color:var(--ui-accent);flex:none}
  .desk-bar b{font-weight:600;flex:none}
  .desk-bar .sub{color:var(--ui-fg-info);overflow:hidden;text-overflow:ellipsis;min-width:0}
  .desk-bar .grow{flex:1}
  .desk-bar .btn{flex:none}
  .desk-bar .btn svg.i{width:12px;height:12px}
  .desk-area{position:relative;height:540px;flex:none;overflow:hidden}
  .sync-dot{position:absolute;left:235px;top:250px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--ui-accent);color:var(--ui-accent-fg);box-shadow:0 0 0 4px color-mix(in srgb,var(--ui-accent) 22%,transparent)}
  .sync-dot svg.i{width:12px;height:12px;color:#fff}
  .sync-dot.off{background:var(--ui-fg-disabled);box-shadow:none}
  .win{position:absolute;width:var(--w);border-radius:10px;background:var(--ui-popup-bg);border:1px solid var(--ui-popup-border);box-shadow:var(--ui-shadow);overflow:hidden;z-index:1}
  .win.front{z-index:2}
  .win-tb{height:28px;display:flex;align-items:center;gap:6px;padding:0 4px 0 8px;font-size:11px;color:var(--ui-fg);cursor:grab;user-select:none;white-space:nowrap;touch-action:none}
  .win.drag .win-tb{cursor:grabbing}
  .win-tb .ic{width:16px;height:16px;border-radius:4px;display:grid;place-items:center;font-size:9px;font-weight:700;color:#fff;flex:none}
  .win-tb .ic.a{background:#2E9E5B}.win-tb .ic.h{background:#0A59F7}
  .win-tb .t{min-width:0;overflow:hidden;text-overflow:ellipsis;font-weight:600}
  .win-tb .t em{font-style:normal;font-weight:400;color:var(--ui-fg-info);margin-left:4px}
  .win-tb .grow{flex:1}
  .win-tb .wb{width:20px;height:20px;display:grid;place-items:center;color:var(--ui-fg-info);flex:none}
  .win-tb .wb svg{width:10px;height:10px}
  .win-scr{position:relative;width:calc(var(--w) - 2px);height:calc((var(--w) - 2px) * 2.2571);overflow:hidden;background:#fff}
  .scr-in{position:absolute;left:0;top:0;transform-origin:0 0;transform:scale(var(--k,1))}
  .win-rs{position:absolute;right:0;bottom:0;width:16px;height:16px;cursor:nwse-resize;z-index:10;touch-action:none;background:linear-gradient(135deg,transparent 55%,color-mix(in srgb,var(--ui-fg-info) 70%,transparent) 55% 62%,transparent 62% 72%,color-mix(in srgb,var(--ui-fg-info) 70%,transparent) 72% 79%,transparent 79%)}
  /* 窗口里的应用：两边同一套基准尺寸 218 × 492 */
  .ma{position:relative;width:218px;height:492px;overflow:hidden;font-family:var(--font-ui);color:#1a1a1a;font-size:11px;line-height:1.4;background:#fff;user-select:none}
  .ma .st{height:24px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-size:10px;font-weight:600}
  .ma .st svg{width:26px;height:10px}
  .ma .gbar{position:absolute;left:50%;bottom:7px;width:64px;height:4px;margin-left:-32px;border-radius:2px;background:rgba(0,0,0,.5)}
  .ma .lg{padding:36px 18px 0;display:flex;flex-direction:column;gap:10px}
  .ma .h1{font-size:20px;font-weight:700;line-height:26px}
  .ma .h2{font-size:10px;color:#8a8f99;margin:-8px 0 8px}
  .ma .in{height:34px;border-radius:17px;background:#f1f3f5;display:flex;align-items:center;padding:0 14px;font-size:11px;letter-spacing:.5px}
  .ma .in.ph{color:#9aa0ab}
  .ma .in.focus{box-shadow:inset 0 0 0 1.5px #0A59F7}
  .ma .chip{height:26px;border-radius:13px;border:1px solid #cfd6e4;display:flex;align-items:center;gap:5px;padding:0 10px;font-size:10px;color:#0A59F7;align-self:flex-start}
  .ma .chip svg{width:11px;height:11px}
  .ma .ghost{height:26px;align-self:stretch}
  .ma .er{font-size:10px;color:#E84026;min-height:14px;margin:-4px 0 -4px 14px}
  .ma .bt{height:36px;border-radius:18px;background:#0A59F7;color:#fff;display:grid;place-items:center;font-weight:600;font-size:12px;margin-top:6px}
  .ma .ft{position:absolute;left:0;right:0;bottom:34px;text-align:center;font-size:9px;color:#8a8f99}
  .ma .toast{position:absolute;left:50%;bottom:70px;transform:translateX(-50%);padding:6px 14px;border-radius:14px;background:rgba(0,0,0,.78);color:#fff;font-size:10px;white-space:nowrap;z-index:5}
  .ma .nav{height:40px;display:flex;align-items:center;gap:4px;padding:0 12px 0 8px;font-size:14px;font-weight:700}
  .ma .nav .bk{width:24px;height:24px;display:grid;place-items:center}
  .ma .nav .bk svg{width:14px;height:14px}
  .ma .sr{margin:0 12px 6px;height:28px;border-radius:14px;background:#f1f3f5;color:#9aa0ab;font-size:10px;display:flex;align-items:center;padding:0 12px}
  .ma .rf{height:30px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:10px;color:#0A59F7}
  .ma .rf i{width:11px;height:11px;border-radius:50%;border:2px solid #0A59F7;border-right-color:transparent}
  .ma .lst{position:relative;touch-action:none}
  .ma .rw{display:flex;align-items:center;gap:10px;height:58px;padding:0 12px;border-bottom:1px solid #f0f1f3}
  .ma .rw .th{width:40px;height:40px;background:linear-gradient(135deg,#dfe7ff,#b9c9ff);flex:none}
  .ma .rw .th.r{border-radius:8px}
  .ma .rw b{display:block;font-size:11px;font-weight:600}
  .ma .rw span{display:block;font-size:9px;color:#8a8f99}
  .ma .rw .pr{margin-left:auto;font-size:11px;font-weight:700;color:#E84026}
  .ma .rw.nw{background:#f3f7ff}
  .ma [data-hs]{cursor:pointer}
  .ma .rip{position:absolute;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50%;background:rgba(10,89,247,.35);pointer-events:none;animation:marip .7s ease-out forwards;z-index:9}
  .ma .rip.miss{background:transparent;border:2px dashed #E84026;animation:none}
  @keyframes marip{from{transform:scale(.3);opacity:1}to{transform:scale(1.7);opacity:0}}
  .ma .dbox{position:absolute;border:2px solid var(--ui-error);border-radius:7px;cursor:pointer;z-index:8}
  .ma .dbox.gone{border-style:dashed}
  .ma .dbox > b{position:absolute;top:-9px;left:-9px;width:16px;height:16px;border-radius:50%;background:var(--ui-error);color:#fff;font-size:9px;line-height:16px;text-align:center;font-weight:700}
  .ma .dbox.sel{box-shadow:0 0 0 3px color-mix(in srgb,var(--ui-error) 30%,transparent)}
  .ma .dbox.ok{border-color:var(--ui-success)}
  .ma .dbox.ok > b{background:var(--ui-success)}
  .desk-log{flex:1;min-height:0;overflow:auto;margin:0 10px;border:1px solid var(--ui-border);border-radius:var(--arc);background:var(--ui-bg)}
  .desk-log .hd{position:sticky;top:0;z-index:1;height:28px;display:flex;align-items:center;gap:6px;padding:0 10px;font-size:var(--fs-sm);background:var(--ui-bg);border-bottom:1px solid var(--ui-border);white-space:nowrap}
  .desk-log .hd b{font-weight:600}
  .desk-log .hd .grow{flex:1}
  .op{display:flex;align-items:center;gap:8px;min-height:28px;padding:3px 10px;font-size:var(--fs-sm);line-height:var(--lh-sm)}
  .op + .op{border-top:1px solid var(--ui-border)}
  .op .n{font-family:var(--font-code);font-size:11px;color:var(--ui-fg-info);width:16px;flex:none}
  .op .tx{flex:1;min-width:0}
  .op .dm-pill{flex:none}
  .op.hint{color:var(--ui-fg-info)}
  .op.hint svg.i{width:12px;height:12px;flex:none}
  .dock{height:50px;flex:none;display:flex;justify-content:center;align-items:center}
  .dock > div{display:flex;gap:8px;padding:5px 10px;border-radius:12px;background:var(--ui-bg);border:1px solid var(--ui-border);box-shadow:var(--ui-shadow)}
  .dock span{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;position:relative}
  .dock span svg{width:18px;height:18px}
  .dock span.on::after{content:"";position:absolute;bottom:-4px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--ui-fg-info)}
  /* Migration 面板里的差异卡 */
  .cmp-pad{padding-bottom:4px}
  #cmp-diffs{gap:6px;padding:8px}
  .df{display:flex;flex-direction:column;gap:4px;padding:7px 9px;border:1px solid var(--ui-border);border-radius:6px;cursor:pointer;background:var(--ui-bg)}
  .df:hover{background:var(--ui-hover)}
  .df.sel{border-color:var(--ui-accent);background:color-mix(in srgb,var(--ui-accent) 10%,var(--ui-bg))}
  .df.done{opacity:.8}
  .df .t{display:flex;align-items:center;gap:6px;white-space:nowrap;min-width:0}
  .df .t .num{width:16px;height:16px;border-radius:50%;background:var(--ui-error);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;flex:none}
  .df.done .t .num{background:var(--ui-success)}
  .df .t b{font-weight:600;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .df .t .dm-pill{flex:none}
  .df .t .loc{margin-left:auto;font-family:var(--font-code);font-size:11px;color:var(--ui-link);flex:none}
  .df .sd{display:grid;grid-template-columns:52px minmax(0,1fr);gap:1px 8px;font-size:var(--fs-sm);line-height:var(--lh-sm)}
  .df .sd em{font-style:normal;color:var(--ui-fg-info)}
  .df .sd span{min-width:0}
  .df .ac{display:flex;align-items:center;gap:6px;margin-top:2px;min-width:0}
  .df .ac .btn svg.i{width:12px;height:12px}
  .df .ac .note{font-size:11px;color:var(--ui-fg-info);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .cm .dm-pill.ok{flex:none}
</style>
</head>
<body>
<div class="ide" id="ide" data-ide-theme="dark" data-left="project" data-right="inspector" data-bottom="none" role="application" aria-label="DevEco Studio">
  <div class="body">
    <div class="tw tw-left">
      <div class="pane on" data-pane="project">
        <div class="tw-hdr"><span class="title">Project <svg class="i"><use href="#i-chevD"/></svg></span><span class="dm-pill info" id="tree-prog">转化 4 / 6</span><span class="grow"></span>
          <button class="abtn" title="Select Opened File"><svg class="i"><use href="#i-locate"/></svg></button>
          <button class="abtn" title="Collapse All"><svg class="i"><use href="#i-collapseAll"/></svg></button>
          <button class="abtn" title="Options"><svg class="i"><use href="#i-moreV"/></svg></button>
          <button class="abtn" title="Hide|Shift+Esc" data-act="hide-left"><svg class="i"><use href="#i-hide"/></svg></button></div>
        <div class="tw-body" id="tree-slot"></div>
      </div>
    </div>

    <div class="editor">
      <div class="prev-split">
        <div class="prev-col">
          <div class="prev-tools"><b><svg class="i" style="width:14px;height:14px"><use href="#i-phone"/></svg>Previewer</b><span>· 1260×2844 · sm</span></div>
          <div class="previewer"><div class="phone"><div class="mapp" id="mapp"></div></div></div>
          <button class="btn cmp-go" id="btn-cmp"><svg class="i"><use href="#i-diff"/></svg>并排对照安卓原版</button>
          <div class="prev-path" id="prev-path"></div>
        </div>
        <div class="desk-col" id="desk" hidden>
          <div class="desk-bar"><svg class="i"><use href="#i-diff"/></svg><b>并排对照</b><span class="sub">同一台 MateBook Pro · 两窗都按 Mate 70 Pro 1260×2844</span><span class="grow"></span>
            <button class="btn sm" id="btn-replay"><svg class="i"><use href="#i-play"/></svg>重放一遍</button><button class="btn sm" id="btn-cmp-exit">退出</button></div>
          <div class="desk-area" id="desk-area">
            <div class="sync-dot" id="sync-dot" title="键鼠同步：点一边，另一边跟着点"><svg class="i"><use href="#i-sync"/></svg></div>
            <div class="win" id="win-a" data-side="a" style="--w:222px;left:12px;top:14px">
              <div class="win-tb"><span class="ic a">卓</span><span class="t">安卓原版<em>卓易通</em></span><span class="grow"></span><span class="wb"><svg viewBox="0 0 10 10"><path d="M1.5 5h7" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg></span><span class="wb"><svg viewBox="0 0 10 10"><rect x="1.5" y="1.5" width="7" height="7" rx="1" stroke="currentColor" stroke-width="1.2" fill="none"/></svg></span><span class="wb"><svg viewBox="0 0 10 10"><path d="M2 2l6 6M8 2L2 8" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg></span></div>
              <div class="win-scr"><div class="scr-in"><div class="ma" id="ma-a"></div></div></div>
              <div class="win-rs" title="拖动缩放"></div>
            </div>
            <div class="win front" id="win-h" data-side="h" style="--w:222px;left:257px;top:14px">
              <div class="win-tb"><span class="ic h">S</span><span class="t">鸿蒙版<em>entry · 调试</em></span><span class="grow"></span><span class="wb"><svg viewBox="0 0 10 10"><path d="M1.5 5h7" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg></span><span class="wb"><svg viewBox="0 0 10 10"><rect x="1.5" y="1.5" width="7" height="7" rx="1" stroke="currentColor" stroke-width="1.2" fill="none"/></svg></span><span class="wb"><svg viewBox="0 0 10 10"><path d="M2 2l6 6M8 2L2 8" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg></span></div>
              <div class="win-scr"><div class="scr-in"><div class="ma" id="ma-h"></div></div></div>
              <div class="win-rs" title="拖动缩放"></div>
            </div>
          </div>
          <div class="desk-log" id="desk-log"></div>
          <div class="dock"><div><span style="background:#5B6475"><svg viewBox="0 0 16 16" style="color:#fff"><use href="#i-folder"/></svg></span><span class="on" style="background:#fff"><svg viewBox="0 0 64 64"><use href="#i-logo"/></svg></span><span class="on" style="background:#2E9E5B">卓</span><span class="on" style="background:#0A59F7">S</span></div></div>
        </div>
        <div class="code-col">
          <div class="tabs" id="tabs"><span class="grow"></span><span class="tab-tools"><button class="abtn" title="Editor Options"><svg class="i"><use href="#i-moreV"/></svg></button></span></div>
          <div id="callout-wrap"></div>
          <div class="code-wrap"><div class="code" id="code"></div></div>
          <div class="breadcrumbs" id="crumbs"></div>
        </div>
      </div>
    </div>

    <div class="tw tw-right">
      <div class="pane on" data-pane="inspector">
        <div class="tw-hdr"><span class="title">Migration <span class="cnt" id="mg-cnt">4</span></span><span class="grow"></span>
          <button class="abtn" title="Rescan Android Project"><svg class="i"><use href="#i-refresh"/></svg></button>
          <button class="abtn" title="Options"><svg class="i"><use href="#i-moreV"/></svg></button>
          <button class="abtn" title="Hide|Shift+Esc" data-act="hide-right"><svg class="i"><use href="#i-hide"/></svg></button></div>
        <div class="tw-body"><div class="mg-body">
          <div class="dm-pad cmp-pad" id="cmp-pad" hidden>
            <div class="dm-card" id="cmp-card"><div class="dm-card-hd"><svg class="i"><use href="#i-diff"/></svg>并排对照 · 差异落到 ArkTS<span class="grow"></span><span class="dm-pill warn" id="cmp-cnt">1 处</span></div><div class="dm-card-bd" id="cmp-diffs"></div></div>
          </div>
          <div class="mg-top">
            <div class="dm-row"><svg class="i" style="width:14px;height:14px"><use href="#i-translate"/></svg><span>Android <code>app/</code> → HarmonyOS <code>entry/</code></span><span class="grow"></span><span class="dm-pill muted">原生 ArkTS · 无兼容层</span></div>
            <div class="dm-progress"><i id="prog-bar" style="--v:67%"></i></div>
            <div class="dm-row"><span id="prog-txt">按屏迁移 · 4 / 6 屏已转 · 2 屏需人工</span><span class="grow"></span><span class="dm-muted" id="prog-sub">上次同步安卓仓 · 今天 09:40</span></div>
            <div class="dm-seg" id="seg"><button class="on" data-mode="screen">按屏</button><button data-mode="module">按模块</button></div>
          </div>
          <div class="dm-group">剩余清单 · 建议顺序<span class="cnt" id="list-cnt">4</span><span class="grow"></span><span class="dm-small dm-muted" style="font-weight:400">先做卡住别人的，再做只差一步的</span></div>
          <div class="dm-list mg-list" id="mg-list"></div>
          <div class="dm-pad" style="padding-top:12px">
            <div class="dm-card" id="sync-card">
              <div class="dm-card-hd"><svg class="i"><use href="#i-branch"/></svg>安卓版改了，鸿蒙版还没跟上<span class="grow"></span><span class="dm-pill warn" id="sync-cnt">3 条</span></div>
              <div class="dm-card-bd" id="commits"></div>
            </div>
          </div>
        </div></div>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  var $=DemoFrame.$, $$=DemoFrame.$$, FILES=DemoFrame.FILES;

  /* ---------- 工程树上每个文件的转化状态 ---------- */
  var LABEL={ok:'已转',warn:'待查',err:'需人工',info:'待同步'};
  var FSTATE={'ItemCard.ets':'ok','Index.ets':'ok','ListPage.ets':'warn','LoginPage.ets':'err','EntryAbility.ets':'ok'};
  function pill(st){return '<span class="dm-pill '+st+'">'+LABEL[st]+'</span>'}

  /* 机器转出来的代码段：哪个安卓文件转的、还没人看过的范围、差异说明 */
  var NOTES={
    'LoginPage.ets':{range:[24,30],from:'LoginActivity.kt',
      text:'这段由 Android <code>LoginActivity.kt</code> 转出，还没人看过。安卓端用 <code>SharedPreferences</code> 存 token，鸿蒙侧已按等价写法改用 <code>preferences</code> Kit，请核对。',
      explain:'安卓 <code>prefs.edit().putString(\'token\', t).apply()</code> 是异步落盘、不阻塞；鸿蒙 <code>preferences.put(\'token\', t)</code> 只写内存，还要 <code>await prefs.flush()</code> 才落盘，转出的代码已经补上这一行。另外安卓的 <code>SmsRetriever</code> 短信自动填充没有对应 Kit，第 12 行的验证码框需要人工改成 <code>inputMethod</code> 监听或保留手动输入。'},
    'ListPage.ets':{range:[14,21],from:'ItemListFragment.kt',
      text:'这段由 Android <code>ItemListFragment.kt</code> 转出，还没人看过。<code>RecyclerView</code> + <code>Adapter</code> 已按等价写法换成 <code>List</code> + <code>ForEach</code>，但安卓侧的 <code>setItemViewCacheSize(4)</code> 没有对应过来，<code>cachedCount</code> 目前是 0，请核对。',
      explain:'<code>RecyclerView</code> 只画可见项并复用 ViewHolder；ArkTS 的 <code>List</code> + <code>ForEach</code> 会把 2000 项全建好，等价写法应是 <code>LazyForEach</code> + <code>IDataSource</code>；<code>setItemViewCacheSize(4)</code> 对应 <code>.cachedCount(4)</code>。'},
    'Index.ets':{range:null,from:'MainActivity.kt',reviewed:'李婷 · 昨天 18:20',
      text:'由 Android <code>MainActivity.kt</code> 转出，李婷已查。原生 ArkTS，没有兼容层。'}
  };

  /* ---------- 剩余清单 ---------- */
  var SCREENS=[
    {name:'登录页',file:'LoginPage.ets',why:'用了 Android 专有的短信自动填充',st:'err',est:'~2h'},
    {name:'列表页',file:'ListPage.ets',why:'RecyclerView 已转 List，缺 cachedCount',st:'warn',est:'~20min'},
    {name:'设置页',file:'SettingsPage.ets',why:'PreferenceScreen 无对应，需重画',st:'err',est:'~3h'},
    {name:'详情页',file:'DetailPage.ets',why:'已转，等真机跑一次',st:'warn',est:'~10min'}
  ];
  var MODULES=[
    {name:'自定义控件',why:'4 个自定义 View 没有对应，需重画',st:'err',est:'~4h'},
    {name:'推送',why:'FCM 无对应，改接 Push Kit',st:'err',est:'~2h'},
    {name:'网络层',why:'OkHttp 拦截器已转 rcp 拦截器，缺重试',st:'warn',est:'~30min'},
    {name:'本地存储',why:'SharedPreferences 已转 preferences Kit',st:'warn',est:'~10min'}
  ];
  var COMMITS=[
    {sha:'a3f9c1',msg:'登录失败改为提示"验证码错误"',screen:'登录页',file:'LoginPage.ets',when:'2 小时前',who:'王磊',est:'~15min'},
    {sha:'7d02be',msg:'列表加下拉刷新',screen:'列表页',file:'ListPage.ets',when:'昨天',who:'李婷',est:'~40min'},
    {sha:'c41e77',msg:'隐私声明新增设备标识',screen:'设置页',file:'SettingsPage.ets',when:'前天',who:'张伟',est:'~10min'}
  ];
  var prog={total:6,done:4,manual:2},mode='screen',curFile='LoginPage.ets',selIdx=0,explainOpen=false;

  /* ---------- 编辑器 ---------- */
  var PREV_PATH={'LoginPage.ets':'entry/pages/LoginPage','ListPage.ets':'entry/pages/ListPage','Index.ets':'entry/pages/Index'};
  function renderPreview(file){
    var m=$('#mapp'),p=$('#prev-path');if(!m)return;
    if(file==='LoginPage.ets'){
      m.innerHTML='<div class="title">欢迎回来</div><div class="inp">手机号</div><div class="inp">验证码</div>'
        +(FSTATE[file]==='err'?'<div class="err">ERR_AUTH_401</div>':'')+'<div class="fill"></div><div class="btn">登录</div>';
    }else if(file==='ListPage.ets'){
      m.innerHTML='<div class="hd">商品</div><div class="search">搜索</div>'
        +['无线鼠标 · 全新','机械键盘 · 二手','显示器支架 · 全新','蓝牙音箱 · 二手']
          .map(function(t){return '<div class="row"><div class="th"></div><div class="tx"><b>'+t.split(' · ')[0]+'</b><span>'+t.split(' · ')[1]+'</span></div></div>'}).join('');
    }else if(file==='Index.ets'){
      m.innerHTML='<div class="ring"><b>Hello</b>World</div>';
    }else{
      m.innerHTML='<div class="ring" style="color:#9aa0ab">无预览</div>';
    }
    if(p)p.textContent=PREV_PATH[file]||file;
  }
  function openFile(file,line,ok){
    if(!FILES[file])return false;
    curFile=file;explainOpen=false;
    var n=NOTES[file],st=FSTATE[file]||'ok';
    var tabs=$('#tabs');$$('.tab',tabs).forEach(function(t){t.remove()});
    tabs.insertAdjacentHTML('afterbegin',DemoFrame.tabs([{file:file,on:true}]));
    var cur=line||(n&&n.range?n.range[0]:1),marks={};
    if(n&&n.range&&!n.reviewed)marks[n.range[0]]='warn';
    $('#code').innerHTML=DemoFrame.code(file,{cur:cur,marks:marks});
    if(n&&n.range)$$('#code .ln').forEach(function(ln){var k=+ln.dataset.ln;if(k>=n.range[0]&&k<=n.range[1])ln.classList.add(n.reviewed?'hl-ok':'hl-warn')});
    (ok||[]).forEach(function(k){var l=$('#code .ln[data-ln="'+k+'"]');if(l){l.classList.remove('hl-warn');l.classList.add('hl-ok')}});
    if(line){var ll=$('#code .ln[data-ln="'+line+'"]');if(ll){if(!(ok&&ok.indexOf(line)>=0))ll.classList.add('hl');var cw=$('#code').parentNode;cw.scrollTop=Math.max(0,ll.offsetTop-cw.clientHeight/3)}}
    $('#crumbs').innerHTML=DemoFrame.crumbs(file);
    $$('#tree .row.sel').forEach(function(x){x.classList.remove('sel')});
    var r=$('#tree .row[data-file="'+file+'"]');if(r)r.classList.add('sel');
    var p=$('#status-pos');if(p)p.textContent=cur+':1';
    renderCallout();renderPreview(file);if(CMP.on)renderDiffs();
    return true;
  }
  function renderCallout(){
    var n=NOTES[curFile],w=$('#callout-wrap');
    if(!n){w.innerHTML='';return;}
    var h;
    if(n.reviewed){
      h='<div class="dm-callout ok"><svg><use href="#i-checkS"/></svg><div class="txt">'+n.text+'<div class="who">已查 · '+n.reviewed+'</div></div><div class="acts"><span class="dm-pill ok">已查</span></div></div>';
    }else{
      h='<div class="dm-callout warn"><svg><use href="#i-warn"/></svg><div class="txt">'+n.text+'<div class="who">第 '+n.range[0]+'–'+n.range[1]+' 行 · 机器转出 · 今天 09:41</div></div>'
       +'<div class="acts"><button class="btn sm primary" id="btn-reviewed"><svg class="i" style="width:12px;height:12px;color:#fff"><use href="#i-checkS"/></svg>标记为已查</button><button class="btn sm" id="btn-explain"><svg class="i" style="width:12px;height:12px"><use href="#i-genie"/></svg>'+(explainOpen?'收起解释':'让 DevEco Code 解释差异')+'</button></div></div>';
      if(explainOpen)h+='<div class="dm-callout info"><svg><use href="#i-genie"/></svg><div class="txt"><b>差异在哪</b>：'+n.explain+'</div></div>';
    }
    w.innerHTML=h;
  }
  function markReviewed(){
    var n=NOTES[curFile];if(!n||n.reviewed)return;
    n.reviewed='我 · 刚刚';
    var st=FSTATE[curFile];
    if(st==='err'){FSTATE[curFile]='warn';prog.done++;prog.manual--;}
    else if(st==='warn'){FSTATE[curFile]='ok';}
    var tp=$('#tree .row[data-file="'+curFile+'"] .dm-pill');if(tp)tp.outerHTML=pill(FSTATE[curFile]);
    SCREENS.forEach(function(s){if(s.file===curFile&&s.st==='err'){s.st='warn';s.why='已按等价写法核对，等真机跑一次'}});
    $$('#code .ln.hl-warn').forEach(function(ln){ln.classList.remove('hl-warn');ln.classList.add('hl-ok')});
    var mk=$('#code .ln[data-ln="'+n.range[0]+'"] .g .m');if(mk)mk.innerHTML='<svg class="i" style="width:14px;height:14px;color:var(--ui-success)"><use href="#i-checkS"/></svg>';
    renderCallout();renderProgress();renderList();renderPreview(curFile);
  }

  /* ---------- 右侧面板 ---------- */
  function renderProgress(){
    var pct,txt;
    if(mode==='screen'){pct=Math.round(prog.done/prog.total*100);txt='按屏迁移 · '+prog.done+' / '+prog.total+' 屏已转 · '+prog.manual+' 屏需人工';}
    else{pct=60;txt='按模块迁移 · 3 / 5 模块已转 · 2 模块需人工';}
    $('#prog-bar').style.setProperty('--v',pct+'%');$('#prog-txt').textContent=txt;
    $('#tree-prog').textContent='转化 '+prog.done+' / '+prog.total;
    var slot=$('#status-slot');if(slot&&CMP.on){var o=openDiffs();slot.innerHTML='<span class="dm-capsule"><span class="dm-dot '+(o?'warn':'ok')+'"></span>并排对照 · 差异 '+(o?o+' 处待处理':'都已对齐或已排进清单')+' · 键鼠同步</span>';return}
    if(slot)slot.innerHTML='<span class="dm-capsule" title="Android → HarmonyOS Migration"><svg class="i" style="width:12px;height:12px"><use href="#i-translate"/></svg>安卓转化 · '+prog.done+' / '+prog.total+' 屏'+(prog.manual?' · '+prog.manual+' 屏需人工':'')+'</span>';
  }
  function renderList(){
    var list=mode==='screen'?SCREENS:MODULES;
    $('#mg-list').innerHTML=list.map(function(it,i){
      var has=!!(it.file&&FILES[it.file]);
      return '<div class="dm-item'+(mode==='screen'&&i===selIdx?' sel':'')+(it.fresh?' new':'')+'" data-i="'+i+'" role="button" tabindex="0"><span class="num">'+(i+1)+'</span>'
        +'<span class="grow"><span class="t"><b>'+it.name+'</b>'+(it.file?'<span class="f'+(has?'':' dead')+'">'+it.file+'</span>':'')+'</span><span class="r">'+it.why+'</span></span>'
        +'<span class="side">'+pill(it.st)+'<span class="est">'+it.est+'</span></span></div>';
    }).join('');
    list.forEach(function(it){it.fresh=false});
    $('#list-cnt').textContent=list.length;$('#mg-cnt').textContent=list.length;
  }
  function renderCommits(){
    var left=0;
    $('#commits').innerHTML=COMMITS.map(function(c,i){
      if(!c.queued&&!c.done)left++;
      return '<div class="cm"><span class="sha">'+c.sha+'</span><span class="grow"><span class="m">'+c.msg+'</span><span class="s">'+c.screen+' · '+c.when+' · '+c.who+'</span></span>'
        +(c.done?'<span class="dm-pill ok"><svg><use href="#i-checkS"/></svg>对照已对齐</span>':(c.queued?'<span class="dm-pill muted"><svg><use href="#i-checkS"/></svg>已排进清单</span>':'<button class="btn sm" data-sync="'+i+'"><svg class="i" style="width:12px;height:12px"><use href="#i-sync"/></svg>同步到鸿蒙版</button>'))+'</div>';
    }).join('');
    var sc=$('#sync-cnt');sc.className='dm-pill '+(left?'warn':'ok');sc.textContent=left?left+' 条':'都跟上了';
  }
  function syncCommit(i){
    var c=COMMITS[i];if(c.queued||c.done)return;c.queued=true;
    SCREENS.push({name:c.screen,file:c.file,why:'同步安卓提交 '+c.sha+'：'+c.msg,st:'info',est:c.est,fresh:true});
    renderCommits();
    if(mode!=='screen'){mode='screen';$$('#seg button').forEach(function(b){b.classList.toggle('on',b.dataset.mode==='screen')});renderProgress();}
    renderList();
    var last=$('#mg-list .dm-item:last-child');if(last)last.scrollIntoView({block:'nearest'});
  }

  /* ---------- 初始 ---------- */
  document.getElementById('tree-slot').innerHTML=DemoFrame.tree({sel:'LoginPage.ets',decorate:function(name){return FSTATE[name]?pill(FSTATE[name]):''}});
  document.getElementById('tabs').insertAdjacentHTML('afterbegin',DemoFrame.tabs([{file:'LoginPage.ets',on:true}]));
  document.getElementById('code').innerHTML=DemoFrame.code('LoginPage.ets',{cur:24,marks:{24:'warn'}});
  /* 让 entryability 目录展开，EntryAbility.ets 的「已转」标记露出来 */
  (function(){var r=$$('#tree .row[data-dir]').filter(function(x){return /entryability/.test(x.textContent)})[0];if(r&&r.dataset.open==='0'){r.dataset.open='1';var k=r.nextElementSibling;if(k)k.hidden=false;var u=$('.tg use',r);if(u)u.setAttribute('href','#i-chevD')}})();

  DemoFrame.init({device:'HUAWEI Mate 70 Pro',deviceIcon:'#i-phone',pos:'24:1',onReady:function(){
    openFile('LoginPage.ets');renderProgress();renderList();renderCommits();
    $('#callout-wrap').addEventListener('click',function(e){
      if(e.target.closest('#btn-reviewed'))markReviewed();
      else if(e.target.closest('#btn-explain')){explainOpen=!explainOpen;renderCallout();}
    });
    $('#seg').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;mode=b.dataset.mode;$$('#seg button').forEach(function(x){x.classList.toggle('on',x===b)});renderProgress();renderList();});
    $('#mg-list').addEventListener('click',function(e){
      var r=e.target.closest('.dm-item');if(!r)return;
      if(mode!=='screen')return;
      selIdx=+r.dataset.i;renderList();
      var it=SCREENS[selIdx];if(it&&it.file&&FILES[it.file])openFile(it.file);
    });
    $('#commits').addEventListener('click',function(e){var b=e.target.closest('[data-sync]');if(b)syncCommit(+b.dataset.sync)});
    /* 树里点有代码的文件：切编辑器 */
    $('#ide').addEventListener('click',function(e){
      var r=e.target.closest('#tree .row[data-file]');if(!r)return;
      var f=r.dataset.file;if(FILES[f]&&f!==curFile)openFile(f);
    });
  }});
DemoGuide.init([{"target": "#btn-reviewed", "kind": "click", "pos": "top", "label": "点这里标记已查"}, {"target": "#tree-prog", "kind": "change", "pos": "top", "label": "进度 4/6→5/6"}]);
})();
</script>
</body>
</html>
