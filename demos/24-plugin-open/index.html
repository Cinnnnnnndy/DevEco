<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='32' y2='32' gradientUnits='userSpaceOnUse'%3E%3Cstop stop-color='%232C8DDD'/%3E%3Cstop offset='1' stop-color='%233357AC'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='7' fill='url(%23g)'/%3E%3Ctext x='16' y='22.5' font-family='Arial,Helvetica,sans-serif' font-size='13' font-weight='700' fill='white' text-anchor='middle'%3EDE%3C/text%3E%3C/svg%3E">
<title>24 · 插件化开放：模拟器、调测、调优装进任何宿主，三方工具挂进原生位置</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../../deveco-intui-kit/src/tokens.css">
<link rel="stylesheet" href="../../deveco-intui-kit/src/components.css">
<link rel="stylesheet" href="../_shared/frame.css">
<link rel="stylesheet" href="../_shared/guide.css">
<script src="../../deveco-intui-kit/src/icons.js"></script>
<script src="../_shared/frame.js"></script>
<script src="../_shared/guide.js"></script>
<style>
  .ide[data-ide-theme]{--ai-w:clamp(360px,26vw,420px)}
  /* ---- 编辑区 ---- */
  .emap{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--ui-editor-bg);color:var(--ui-fg);font-size:var(--fs-para);line-height:var(--lh-para)}
  .emap-bar{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--ui-border);flex:none}
  .emap-bar .grow{flex:1}
  .emap-bar b{font-weight:600}
  .emap-body{flex:1;min-height:0;overflow:auto;padding:28px 16px 24px}
  .hostseg button{display:inline-flex;align-items:center;gap:6px}
  .hostseg .hl{width:14px;height:14px;border-radius:3px;display:grid;place-items:center;font-size:8px;font-weight:700;color:#fff;flex:none}

  /* 宿主徽标 */
  .hb{display:inline-flex;align-items:center;gap:3px;height:18px;padding:0 6px;border-radius:5px;font-size:10.5px;background:var(--ui-tag-bg);color:var(--ui-fg-info);white-space:nowrap}
  .hb.cur{background:color-mix(in srgb,var(--ui-accent) 18%,transparent);color:var(--ui-info);font-weight:600}
  .hb.no{text-decoration:line-through;opacity:.55}
  .hb i{width:6px;height:6px;border-radius:50%;background:var(--ui-success);display:inline-block}
  .hb.off i{background:var(--ui-fg-disabled)}

  /* ---- Studio 扩展点地图 ---- */
  .smap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:14px}
  .xz{position:relative;border:1.5px dashed color-mix(in srgb,var(--ui-accent) 45%,var(--ui-border));border-radius:10px;padding:8px 12px 12px;background:color-mix(in srgb,var(--ui-accent) 3%,transparent);min-width:0}
  .xz .zh{display:flex;align-items:center;gap:6px;height:22px;margin-bottom:8px;font-size:11.5px;white-space:nowrap;font-weight:600}
  .xz .zh .grow{flex:1}
  .xz .zh .no{width:15px;height:15px;border-radius:50%;background:var(--ui-accent);color:#fff;display:grid;place-items:center;font-size:9.5px;font-weight:700}
  .xz .zh code{font-family:var(--font-code);font-size:10.5px;color:var(--ui-fg-info)}
  .xz .zc{font-size:10.5px;font-weight:400;color:var(--ui-fg-info)}
  .xz.span2{grid-column:1 / -1}
  .xz.dead>.live{display:none}
  .xz .deadmsg{display:none;padding:18px 8px;text-align:center;color:var(--ui-fg-info);font-size:var(--fs-sm)}
  .xz.dead .deadmsg{display:block}

  /* 原生控件样子 */
  .nbtn{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 8px;border-radius:6px;background:var(--ui-hover);font-size:12.5px;white-space:nowrap}
  .nbtn svg{width:14px;height:14px;color:var(--ui-icon)}
  .npop{margin-top:4px;border:1px solid var(--ui-popup-border);border-radius:var(--arc);background:var(--ui-popup-bg);box-shadow:var(--ui-shadow);padding:5px 0;font-size:12.5px}
  .npop .mh{padding:3px 12px 3px;font-size:11px;color:var(--ui-fg-info)}
  .npop .mi{display:flex;align-items:center;gap:8px;min-height:26px;padding:2px 12px;white-space:nowrap}
  .npop .mi svg{width:14px;height:14px;color:var(--ui-icon);flex:none}
  .npop .mi .grow{flex:1}
  .npop .mi.sel{background:var(--ui-selection)}
  .npop .ms{height:1px;background:var(--ui-border);margin:4px 0}
  .by{font-size:10.5px;color:var(--ui-fg-disabled);white-space:nowrap;cursor:pointer;margin-left:auto;padding-left:10px}
  .by:hover{color:var(--ui-link);text-decoration:underline}
  .fresh{animation:fresh 1.6s ease-out}
  @keyframes fresh{0%{background:color-mix(in srgb,var(--ui-success) 35%,transparent)}100%{background:transparent}}
  .nfrom{font-size:10.5px;color:var(--ui-fg-disabled)}

  /* Profiler / 日志面板 */
  .npanel{border:1px solid var(--ui-border);border-radius:var(--arc);background:var(--ui-bg);overflow:hidden}
  .ntabs{display:flex;align-items:stretch;height:30px;border-bottom:1px solid var(--ui-border);padding:0 4px}
  .ntab{display:flex;align-items:center;gap:5px;padding:0 10px;font-size:12.5px;position:relative;color:var(--ui-fg);opacity:.75;border:0;background:transparent;white-space:nowrap}
  .ntab.on{opacity:1}
  .ntab.on::after{content:"";position:absolute;left:6px;right:6px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--ui-accent)}
  .ntab svg{width:13px;height:13px;color:var(--ui-icon)}
  .ntab.tp{font-weight:600}
  .nbody{padding:10px 12px;min-height:150px;font-size:var(--fs-sm);line-height:var(--lh-sm);background:var(--ui-editor-bg)}
  .bars{display:flex;align-items:flex-end;gap:3px;height:96px;padding-top:6px;border-bottom:1px solid var(--ui-border)}
  .bars i{flex:1;background:var(--ui-progress);border-radius:2px 2px 0 0;height:var(--h)}
  .bars i.bad{background:var(--ui-error)}
  .ntbl{width:100%;border-collapse:collapse;font-family:var(--font-code);font-size:11px}
  .ntbl th{text-align:left;font-weight:400;color:var(--ui-fg-info);padding:3px 6px;border-bottom:1px solid var(--ui-border)}
  .ntbl td{padding:3px 6px;border-bottom:1px solid var(--ui-border);white-space:nowrap}
  .ntbl td.slow{color:var(--ui-error)}
  .lfil{display:flex;align-items:center;gap:6px;padding:6px 8px;border-bottom:1px solid var(--ui-border);flex-wrap:wrap}
  .fchip{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:5px;border:1px solid var(--ui-component-border);font-size:11.5px;white-space:nowrap;background:var(--ui-field-bg)}
  .fchip.on{border-color:var(--ui-accent);background:color-mix(in srgb,var(--ui-accent) 12%,var(--ui-field-bg))}
  .fchip svg{width:11px;height:11px}
  .lines{padding:6px 10px;font-family:var(--font-code);font-size:11px;line-height:1.7;background:var(--ui-editor-bg);min-height:96px}
  .lines div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lines .w{color:var(--ui-warning)}.lines .e{color:var(--ui-error)}.lines .d{color:var(--ui-fg-info)}
  .clu{display:flex;align-items:center;gap:8px;padding:4px 0;font-family:var(--font-ui);font-size:12px}
  .clu b{font-family:var(--font-code);font-size:11px;min-width:36px;color:var(--ui-error)}

  /* ---- VS Code / Cursor 迷你宿主 ---- */
  .vs{border:1px solid var(--ui-component-border);border-radius:10px;overflow:hidden;background:var(--ui-bg);box-shadow:var(--ui-shadow);display:grid;grid-template-rows:30px minmax(0,1fr) 22px;height:640px;font-size:12px}
  .vs-title{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--ui-bg);border-bottom:1px solid var(--ui-border);font-size:11.5px;color:var(--ui-fg-info);position:relative}
  .vs-title .dots{position:absolute;left:10px;display:flex;gap:6px}
  .vs-title .dots i{width:10px;height:10px;border-radius:50%;background:var(--ui-component-border)}
  .vs-main{display:grid;grid-template-columns:44px 230px minmax(0,1fr) var(--vs-agent,0px);min-height:0}
  .vs-act{border-right:1px solid var(--ui-border);display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:6px;background:var(--ui-bg)}
  .vs-act span{width:34px;height:34px;display:grid;place-items:center;border-radius:6px;color:var(--ui-fg-info);position:relative}
  .vs-act span svg{width:18px;height:18px}
  .vs-act span.on{color:var(--ui-fg);background:var(--ui-hover)}
  .vs-act span.on::before{content:"";position:absolute;left:-5px;top:6px;bottom:6px;width:2px;background:var(--ui-accent);border-radius:1px}
  .vs-act span.ours{color:var(--ui-info)}
  .vs-side{border-right:1px solid var(--ui-border);display:flex;flex-direction:column;min-height:0;background:var(--ui-bg)}
  .vs-h{height:28px;display:flex;align-items:center;padding:0 12px;font-size:10.5px;font-weight:600;letter-spacing:.04em;color:var(--ui-fg-info)}
  .vs-row{display:flex;align-items:center;gap:6px;min-height:24px;padding:0 12px 0 16px;white-space:nowrap}
  .vs-row svg{width:14px;height:14px;color:var(--ui-icon);flex:none}
  .vs-row .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
  .vs-row .by{padding-left:4px}
  .vs-center{display:grid;grid-template-rows:minmax(0,1fr) 230px;min-height:0;min-width:0}
  .vs-ed{background:var(--ui-editor-bg);font-family:var(--font-code);font-size:11.5px;line-height:1.7;padding:8px 12px;overflow:hidden;color:var(--ui-fg-info);white-space:pre}
  .vs-ed .k{color:var(--ui-link)}
  .vs-pan{border-top:1px solid var(--ui-border);display:flex;flex-direction:column;min-height:0;background:var(--ui-editor-bg)}
  .vs-ptabs{display:flex;gap:2px;padding:0 8px;height:30px;align-items:stretch;flex:none}
  .vs-ptabs button{border:0;background:transparent;color:var(--ui-fg-info);font-size:10.5px;letter-spacing:.04em;padding:0 8px;position:relative}
  .vs-ptabs button.on{color:var(--ui-fg)}
  .vs-ptabs button.on::after{content:"";position:absolute;left:8px;right:8px;bottom:4px;height:1px;background:var(--ui-fg)}
  .vs-pb{flex:1;min-height:0;overflow:auto}
  .vs-status{display:flex;align-items:center;gap:14px;padding:0 10px;background:var(--ui-accent);color:#fff;font-size:11px;white-space:nowrap;overflow:hidden}
  .vs-status .grow{flex:1}
  .vs-status span{display:inline-flex;align-items:center;gap:4px}
  .vs-status svg{width:12px;height:12px}
  .vs-agent{border-left:1px solid var(--ui-border);background:var(--ui-bg);padding:10px;display:flex;flex-direction:column;gap:8px}
  .vs-agent i{display:block;height:8px;border-radius:4px;background:var(--ui-tag-bg)}
  .vs-empty{padding:12px 16px;color:var(--ui-fg-info);font-size:11.5px}

  /* ---- CLI ---- */
  .term{border:1px solid var(--ui-component-border);border-radius:10px;background:#16171a;color:#d4d6db;font-family:var(--font-code);font-size:12px;line-height:1.75;padding:12px 16px;min-height:420px;white-space:pre;overflow:auto}
  .term .p{color:#6fb3ff}.term .g{color:#6fd08c}.term .d{color:#8a8f99}.term .w{color:#e6c35c}

  /* ---- 右侧 Extensions ---- */
  .ext-body{padding:8px 12px 20px;display:flex;flex-direction:column;gap:8px}
  .ext-srch{display:flex;align-items:center;gap:6px;height:28px;padding:0 8px;border:1px solid var(--ui-component-border);border-radius:6px;background:var(--ui-field-bg);color:var(--ui-fg-disabled);font-size:12px}
  .ext-srch svg{width:14px;height:14px}
  .pl{border:1px solid var(--ui-border);border-radius:var(--arc);background:var(--ui-field-bg);padding:9px 10px;display:grid;grid-template-columns:32px minmax(0,1fr);gap:4px 10px}
  .pl .ic{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;background:color-mix(in srgb,var(--ui-accent) 16%,transparent);color:var(--ui-info);grid-row:span 3}
  .pl .ic svg{width:18px;height:18px}
  .pl .t1{display:flex;align-items:center;gap:6px}
  .pl .t1 b{font-weight:600}
  .pl .t1 .grow{flex:1}
  .pl .t1 .v{font-family:var(--font-code);font-size:10.5px;color:var(--ui-fg-info)}
  .pl .t2{font-size:var(--fs-sm);line-height:var(--lh-sm);color:var(--ui-fg-info)}
  .pl .t3{display:flex;flex-wrap:wrap;gap:4px}
  .pl.hit,.tp.hit{border-color:var(--ui-accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--ui-accent) 30%,transparent)}
  .tp{border:1px solid var(--ui-border);border-radius:var(--arc);background:var(--ui-field-bg);padding:7px 10px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;align-items:center}
  .tp b{font-weight:600}
  .tp .s{font-size:var(--fs-sm);line-height:var(--lh-sm);color:var(--ui-fg-info);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tp .s code{font-family:var(--font-code);font-size:10.5px}
  .tp .btn{grid-row:span 2}
  .tp.on{border-color:color-mix(in srgb,var(--ui-success) 50%,var(--ui-border))}
  /* ---- 鸿蒙电脑：插件拆成自由窗口 ---- */
  .zh .pop{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px;border:1px solid var(--ui-component-border);border-radius:5px;background:transparent;color:var(--ui-fg);font-size:11px;font-weight:400;white-space:nowrap}
  .zh .pop:hover{background:var(--ui-hover)}
  .zh .pop svg{width:12px;height:12px;color:var(--ui-icon)}
  .away{display:flex;align-items:center;gap:10px;padding:14px 12px;border:1px dashed var(--ui-component-border);border-radius:var(--arc);color:var(--ui-fg-info);font-size:var(--fs-sm);line-height:var(--lh-sm)}
  .away svg{width:16px;height:16px;color:var(--ui-accent);flex:none}
  .away .grow{flex:1}
  .away b{color:var(--ui-fg);font-weight:600}
  .fw-pick{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:-14px 0 12px}
  .fw-pick>b{font-weight:600;margin-right:4px}
  .pk{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border:1px solid var(--ui-component-border);border-radius:6px;background:var(--ui-field-bg);color:var(--ui-fg);font-size:12px;white-space:nowrap}
  .pk:hover{border-color:var(--ui-accent)}
  .pk svg{width:13px;height:13px;color:var(--ui-icon)}
  .pk .st{font-size:11px;color:var(--ui-fg-info)}
  .pk.on{border-color:var(--ui-accent);background:color-mix(in srgb,var(--ui-accent) 12%,var(--ui-field-bg))}
  .pk.on .st{color:var(--ui-info)}
  .pk:disabled{opacity:.5}
  .pk .tpb{font-size:10px;padding:0 4px;border-radius:3px;background:color-mix(in srgb,var(--ui-warning) 20%,transparent);color:color-mix(in srgb,var(--ui-warning) 80%,var(--ui-fg))}
  .desk{position:relative;display:grid;grid-template-columns:minmax(0,1.62fr) minmax(0,1fr);gap:18px;align-items:start}
  .desk-side{display:flex;flex-direction:column;gap:14px;align-items:center}
  .dsw{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%}
  .dsw.pad{width:78%}
  .bz{width:100%;padding:6px;border-radius:12px;background:#101114;box-shadow:0 0 0 1px rgba(255,255,255,.07),0 8px 22px rgba(0,0,0,.28)}
  .bz.pad{border-radius:16px;padding:8px}
  .scr{position:relative;width:100%;overflow:hidden;border-radius:6px;background:linear-gradient(140deg,#24406e 0%,#3b3f7a 45%,#6a4c7e 100%);transition:box-shadow .15s}
  .scr.main{aspect-ratio:3296/2472}
  .scr.ext{aspect-ratio:3840/2160;background:linear-gradient(140deg,#1f3a4f,#2f5566 55%,#40607a)}
  .scr.pad{aspect-ratio:2880/1920;border-radius:9px;background:linear-gradient(150deg,#3a4b7c,#5b5f9a 50%,#8a6f9f)}
  .scr.drop{box-shadow:inset 0 0 0 3px #4C9BFF}
  .scr-cap{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ui-fg-info);white-space:nowrap}
  .scr-cap b{color:var(--ui-fg);font-weight:600}
  .scr-cap .dm-mono{font-size:10.5px}
  .sys{position:absolute;left:0;right:0;top:0;height:3.4%;min-height:16px;display:flex;align-items:center;gap:8px;padding:0 10px;background:rgba(0,0,0,.28);color:#fff;font-size:10px;font-weight:600;z-index:1}
  .sys .grow{flex:1}
  .sys svg{width:11px;height:11px}
  .dock{position:absolute;left:50%;bottom:1.6%;transform:translateX(-50%);display:flex;gap:6px;padding:5px 8px;border-radius:12px;background:rgba(255,255,255,.22);z-index:1}
  .dock i{width:20px;height:20px;border-radius:6px;display:block}
  .dock i.act{box-shadow:0 0 0 1.5px #fff}
  .scr-empty{position:absolute;inset:0;display:grid;place-items:center;color:rgba(255,255,255,.72);font-size:11px;text-align:center;line-height:16px;padding:0 12px}
  .snap-pv{position:absolute;z-index:40;border-radius:6px;background:rgba(76,155,255,.28);box-shadow:inset 0 0 0 2px #4C9BFF;pointer-events:none;transition:all .12s}
  /* 自由窗口 */
  .fw{position:absolute;z-index:5;display:flex;flex-direction:column;border-radius:8px;overflow:hidden;background:var(--ui-bg);color:var(--ui-fg);box-shadow:0 0 0 1px var(--ui-popup-border),0 8px 20px rgba(0,0,0,.35);min-width:0}
  .fw.focus{z-index:8;box-shadow:0 0 0 1.5px var(--ui-accent),0 10px 26px rgba(0,0,0,.45)}
  .fw.ide{z-index:2}
  .fw.ide.focus{z-index:3}
  .fw-tb{flex:none;height:24px;display:flex;align-items:center;gap:6px;padding:0 2px 0 8px;border-bottom:1px solid var(--ui-border);background:var(--ui-bg);cursor:grab;user-select:none;touch-action:none;min-width:0}
  .fw-tb:active{cursor:grabbing}
  .fw-tb .ti{width:14px;height:14px;border-radius:4px;display:grid;place-items:center;flex:none;color:#fff;font-size:8px;font-weight:700;background:linear-gradient(135deg,#2C8DDD,#3357AC)}
  .fw-tb .ti svg{width:10px;height:10px}
  .fw-tb .tt{flex:1;min-width:0;font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fw-tb .tt span{font-weight:400;color:var(--ui-fg-info)}
  .fw-tb .src{flex:none;font-size:9.5px;line-height:14px;padding:0 4px;border-radius:3px;background:var(--ui-tag-bg);color:var(--ui-fg-info)}
  .fw-tb .src.tp{background:color-mix(in srgb,var(--ui-warning) 22%,transparent);color:color-mix(in srgb,var(--ui-warning) 80%,var(--ui-fg))}
  .fw-tb button{flex:none;width:22px;height:20px;border:0;border-radius:4px;background:transparent;color:var(--ui-icon);display:grid;place-items:center;padding:0}
  .fw-tb button:hover{background:var(--ui-hover)}
  .fw-tb button.x:hover{background:#E5484D;color:#fff}
  .fw-tb button svg{width:11px;height:11px}
  .fw-bd{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;background:var(--ui-editor-bg);font-size:10.5px;line-height:14px}
  .fw-ft{flex:none;display:flex;align-items:center;gap:5px;flex-wrap:wrap;padding:3px 8px;border-top:1px solid var(--ui-border);background:var(--ui-bg);font-size:10px;line-height:14px;color:var(--ui-fg-info);cursor:pointer}
  .fw-ft svg{width:11px;height:11px;flex:none;color:var(--ui-success)}
  .fw-ft.tp svg{color:var(--ui-warning)}
  .fw-ft .pm{padding:0 4px;border-radius:3px;background:var(--ui-tag-bg);white-space:nowrap}
  .fw-ft b{color:var(--ui-fg);font-weight:600;white-space:nowrap}
  .fw-rs{position:absolute;right:0;bottom:0;width:14px;height:14px;cursor:nwse-resize;touch-action:none;z-index:2;background:linear-gradient(135deg,transparent 50%,color-mix(in srgb,var(--ui-fg-info) 60%,transparent) 50%,transparent 62%,color-mix(in srgb,var(--ui-fg-info) 60%,transparent) 62%,transparent 74%)}
  .fw.snapped .fw-rs{display:none}
  /* 迷你 IDE */
  .mi-ide{flex:1;min-height:0;display:grid;grid-template-columns:18px minmax(0,1fr) var(--mi-r,26%);grid-template-rows:minmax(0,1fr) auto}
  .mi-st{grid-row:span 2;border-right:1px solid var(--ui-border);display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:6px;background:var(--ui-bg)}
  .mi-st i{width:9px;height:9px;border-radius:2px;background:var(--ui-fg-disabled);display:block}
  .mi-ed{padding:6px 8px;display:flex;flex-direction:column;gap:4px;overflow:hidden;font-family:var(--font-code);font-size:9.5px;line-height:12px;color:var(--ui-fg-info);white-space:nowrap}
  .mi-ed .k{color:var(--ui-link)}
  .mi-ag{border-left:1px solid var(--ui-border);background:var(--ui-bg);padding:6px;display:flex;flex-direction:column;gap:4px;overflow:hidden}
  .mi-ag i{display:block;height:5px;border-radius:3px;background:var(--ui-tag-bg)}
  .mi-bt{grid-column:2 / 4;border-top:1px solid var(--ui-border);background:var(--ui-bg);display:flex;align-items:center;gap:8px;padding:0 8px;height:18px;font-size:9.5px;color:var(--ui-fg-info);white-space:nowrap;overflow:hidden}
  .mi-bt .on{color:var(--ui-fg)}
  .mi-bt .gone{text-decoration:line-through;opacity:.6}
  /* 插件窗口内容 */
  .pw-h{display:flex;align-items:center;gap:6px;padding:4px 8px;border-bottom:1px solid var(--ui-border);white-space:nowrap;overflow:hidden}
  .pw-h .grow{flex:1}
  .pw-h .dm-pill{font-size:9.5px;height:15px;line-height:15px;padding:0 5px}
  .pw-bars{flex:1;min-height:30px;display:flex;align-items:flex-end;gap:2px;padding:6px 8px 0;border-bottom:1px solid var(--ui-border)}
  .pw-bars i{flex:1;background:var(--ui-progress);border-radius:1px 1px 0 0;height:var(--h)}
  .pw-bars i.bad{background:var(--ui-error)}
  .pw-rows{padding:3px 8px;font-family:var(--font-code);font-size:9.5px;line-height:14px;overflow:hidden}
  .pw-rows div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pw-rows .w{color:var(--ui-warning)}.pw-rows .e{color:var(--ui-error)}.pw-rows .d{color:var(--ui-fg-info)}
  .pw-emu{flex:1;min-height:0;display:flex;gap:6px;padding:8px;align-items:stretch;justify-content:center}
  .pw-ph{height:100%;max-width:100%;aspect-ratio:1260/2844;border-radius:12px;background:#0b0c0f;padding:3px;flex:none}
  .pw-ph .s{width:100%;height:100%;border-radius:10px;background:#f3f4f7;display:flex;flex-direction:column;gap:4%;padding:12% 7% 0;overflow:hidden}
  .pw-ph .s i{display:block;height:9%;border-radius:4px;background:#fff;box-shadow:0 0 0 1px #e3e5ea}
  .pw-ph .s i:first-child{height:5%;width:50%;background:#1b1d22;box-shadow:none}
  .pw-tools{display:flex;flex-direction:column;gap:6px;padding-top:2px}
  .pw-tools span{width:18px;height:18px;border-radius:4px;display:grid;place-items:center;color:var(--ui-icon);background:var(--ui-hover)}
  .pw-tools svg{width:11px;height:11px}
  /* 三指甩窗手势 */
  .fing{position:absolute;z-index:60;pointer-events:none;display:flex;gap:10px}
  .fing i{width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:0 0 0 3px rgba(76,155,255,.55),0 0 14px rgba(76,155,255,.8)}
  .fw-act{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:14px;padding:8px 10px;border:1px solid var(--ui-border);border-radius:var(--arc);background:var(--ui-field-bg)}
  .fw-act .who{display:flex;align-items:center;gap:6px;font-weight:600;margin-right:6px;white-space:nowrap}
  .fw-act .who svg{width:14px;height:14px;color:var(--ui-icon)}
  .fw-act .grow{flex:1}
  .fw-act .btn{white-space:nowrap}
  .fw-act .btn svg{width:12px;height:12px}
</style>

<script>
(function(){
  var $=DemoFrame.$, $$=DemoFrame.$$;
  var esc=function(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')};

  var HOSTS=[
    {id:'studio',nm:'DevEco Studio',lg:'DE',c:'#2C8DDD',note:'原生宿主'},
    {id:'vscode',nm:'VS Code',lg:'VS',c:'#2F80C8',note:'同一插件，装进 VS Code'},
    {id:'cursor',nm:'Cursor',lg:'Cu',c:'#3A3A3A',note:'同一插件，装进 Cursor'},
    {id:'cli',nm:'CLI',lg:'>_',c:'#5A5F69',note:'同一能力，deveco 子命令'},
    {id:'free',nm:'自由窗口',lg:'窗',c:'#0A59F7',note:'鸿蒙电脑 · 插件拆成独立窗口，吸附在 IDE 旁'}
  ];
  var PL=[
    {id:'emu',nm:'Emulator',cn:'模拟器',v:'7.0.1',ic:'#i-phone',d:'手机 / 折叠 / 平板 / 穿戴模拟器，启动、旋转、注入定位。',hosts:['studio','vscode','cursor','cli']},
    {id:'hilog',nm:'HiLog & Debug',cn:'日志与调试',v:'7.0.1',ic:'#i-tw-device',d:'HiLog 过滤、ArkTS 断点、ArkUI Inspector 看组件树。',hosts:['studio','vscode','cursor','cli']},
    {id:'prof',nm:'Profiler',cn:'调优',v:'7.0.0',ic:'#i-gauge',d:'Frame、ArkTS CPU、Memory、冷启动分阶段。',hosts:['studio','vscode','cursor']},
    {id:'check',nm:'App Check',cn:'体检',v:'1.3.2',ic:'#i-ok',d:'上架前体检：隐私、权限、一多适配、包体。',hosts:['studio','vscode','cursor','cli']}
  ];
  var INST={studio:{emu:1,hilog:1,prof:1,check:1},vscode:{emu:1,hilog:1},cursor:{},cli:{hilog:1,check:1}};
  var TP=[
    {id:'netcap',nm:'网络抓包',ext:'profiler.tab',zone:'prof',need:'prof',by:'com.example.netcap',d:'HTTP / WebSocket 请求瀑布'},
    {id:'cloud',nm:'云真机',ext:'device.provider',zone:'dev',need:null,by:'com.example.clouddevice',d:'远程真机出现在设备下拉'},
    {id:'replay',nm:'UI 自动化回放',ext:'run.configuration',zone:'run',need:null,by:'com.example.uireplay',d:'录制的操作脚本作为 Run 配置'},
    {id:'crash',nm:'崩溃聚类',ext:'hilog.filter',zone:'log',need:'hilog',by:'com.example.crashinsight',d:'按栈指纹把 FaultLog 归并'},
    {id:'design',nm:'设计稿导入',ext:'file.new',zone:'new',need:null,by:'com.example.design2ets',d:'从设计稿生成 ArkTS 页面'}
  ];
  var ON={cloud:1};
  var host='studio',fresh=null,profTab='frame',logClu=false,vsTab='hilog';
  var tpById=function(id){return TP.filter(function(t){return t.id===id})[0]};
  var plById=function(id){return PL.filter(function(t){return t.id===id})[0]};
  var hk=function(h){h=h||host;return h==='free'?'studio':h};
  var inst=function(p,h){return !!INST[hk(h)][p]};
  var tpLive=function(id,h){var t=tpById(id);return ON[id]&&(!t.need||inst(t.need,h))};
  var by=function(id){return '<span class="by" data-by="'+id+'">由 '+tpById(id).by+' 提供</span>'};
  var fr=function(id){return fresh===id?' fresh':''};

  /* ---------------- 右侧 Extensions ---------------- */
  function renderExt(){
    var H=HOSTS.filter(function(h){return h.id===host})[0];
    $('#pl-host').textContent='当前宿主：'+H.nm;
    $('#pls').innerHTML=PL.map(function(p){
      var sup=p.hosts.indexOf(hk())>=0,on=inst(p.id);
      var badges=HOSTS.filter(function(h){return h.id!=='free'}).map(function(h){var s=p.hosts.indexOf(h.id)>=0;return '<span class="hb'+(h.id===hk()?' cur':'')+(s?'':' no')+(s&&!INST[h.id][p.id]?' off':'')+'" title="'+(s?(INST[h.id][p.id]?'已装':'可装'):'不支持')+'">'+(s?'<i></i>':'')+h.nm+'</span>'}).join('');
      var btn=host==='free'&&on&&WD[p.id]?(WIN[p.id]?'<button class="btn sm" data-recall="'+p.id+'">收回 IDE</button>':'<button class="btn sm primary" data-detach="'+p.id+'"><svg class="i" style="width:12px;height:12px"><use href="#i-popout"/></svg>拆出</button>'):!sup?'<span class="dm-pill muted">'+H.nm+' 不支持</span>':on?'<button class="btn sm" data-uninst="'+p.id+'">卸载</button>':'<button class="btn sm primary" data-inst="'+p.id+'">装到 '+H.nm+'</button>';
      return '<div class="pl" id="pl-'+p.id+'"><span class="ic"><svg><use href="'+p.ic+'"/></svg></span>'
        +'<div class="t1"><b>'+p.nm+'</b><span class="dm-muted dm-small">'+p.cn+'</span><span class="v">v'+p.v+'</span><span class="grow"></span>'+(on?'<span class="dm-pill ok">已装</span>':'')+btn+'</div>'
        +'<div class="t2">'+esc(p.d)+'</div><div class="t3">'+badges+'</div></div>';
    }).join('');
    $('#pl-cnt').textContent=PL.filter(function(p){return inst(p.id)}).length+' / '+PL.length;
    $('#tps').innerHTML=TP.map(function(t){
      var on=!!ON[t.id],blocked=t.need&&!inst(t.need);
      return '<div class="tp'+(on?' on':'')+'" id="tp-'+t.id+'"><div><b>'+t.nm+'</b> <span class="dm-small dm-muted">'+esc(t.d)+'</span></div>'
        +(on?'<button class="btn sm" data-tp="'+t.id+'">停用</button>':'<button class="btn sm primary" data-tp="'+t.id+'">启用</button>')
        +'<div class="s">挂到 <code>'+t.ext+'</code> · '+t.by+(blocked?' · <span style="color:var(--ui-warning)">需先装 '+plById(t.need).nm+'</span>':'')+'</div></div>';
    }).join('');
    $('#tp-cnt').textContent='已启用 '+Object.keys(ON).filter(function(k){return ON[k]}).length+' / '+TP.length;
  }
  $('#pls').addEventListener('click',function(e){
    var i=e.target.closest('[data-inst]'),u=e.target.closest('[data-uninst]');
    if(i){INST[hk()][i.dataset.inst]=1;render();}
    if(u){delete INST[hk()][u.dataset.uninst];if(WIN[u.dataset.uninst])delete WIN[u.dataset.uninst];render();}
    var dt=e.target.closest('[data-detach]'),rc=e.target.closest('[data-recall]');
    if(dt)detach(dt.dataset.detach);
    if(rc)recall(rc.dataset.recall);
  });
  $('#tps').addEventListener('click',function(e){
    var b=e.target.closest('[data-tp]');if(!b)return;var id=b.dataset.tp;
    ON[id]=!ON[id];fresh=ON[id]?id:null;
    if(ON[id]&&id==='netcap'){profTab='netcap';vsTab='prof';}
    if(ON[id]&&id==='crash'){logClu=true;vsTab='hilog';}
    render();
    var el=$('#emap .fresh');if(el)el.scrollIntoView({block:'nearest',behavior:'smooth'});
  });

  /* ---------------- 宿主切换 ---------------- */
  function renderSeg(){
    $('#hostseg').innerHTML=HOSTS.map(function(h){return '<button data-host="'+h.id+'"'+(h.id===host?' class="on"':'')+'><span class="hl" style="background:'+h.c+'">'+h.lg+'</span>'+h.nm+'</button>'}).join('');
    var H=HOSTS.filter(function(h){return h.id===host})[0];
    $('#host-note').textContent=H.note;
    var n=PL.filter(function(p){return inst(p.id)}).length,m=TP.filter(function(t){return tpLive(t.id)}).length;
    $('#host-sum').textContent='已装官方插件 '+n+' · 生效三方工具 '+m;
  }
  $('#hostseg').addEventListener('click',function(e){var b=e.target.closest('[data-host]');if(!b)return;host=b.dataset.host;fresh=null;render();});

  /* ---------------- Studio 扩展点地图 ---------------- */
  function zone(id,no,nm,ext,inner,opt){
    opt=opt||{};
    var n=TP.filter(function(t){return t.zone===id&&tpLive(t.id)}).length;
    if(opt.pop&&WIN[opt.pop]&&opt.away)inner=awayHTML(opt.pop);
    return '<div class="xz'+(opt.span?' span2':'')+(opt.dead?' dead':'')+'" id="zone-'+id+'"><div class="zh"><span class="no">'+no+'</span>'+nm+'<code>'+ext+'</code><span class="grow"></span>'+(opt.pop&&!opt.dead&&!WIN[opt.pop]&&inst(WD[opt.pop].pl)?'<button class="pop" data-detach="'+opt.pop+'" title="在鸿蒙电脑上拆成独立的自由窗口"><svg><use href="#i-popout"/></svg>'+(opt.popLabel||'拆出为窗口')+'</button>':'')+'<span class="zc">'+(n?'三方 '+n:'暂无三方')+'</span></div>'
      +'<div class="live">'+inner+'</div><div class="deadmsg">'+(opt.deadMsg||'')+'</div></div>';
  }
  function awayHTML(id){
    return '<div class="away"><svg><use href="#i-popout"/></svg><span class="grow"><b>'+WD[id].nm+' 正在独立窗口运行</b> · '+placeName(id)+'</span><button class="btn sm" data-show="'+id+'">查看窗口</button><button class="btn sm" data-recall="'+id+'">收回</button></div>';
  }
  function studioMap(){
    var emu=inst('emu'),hl=inst('hilog'),pf=inst('prof');
    /* ① 设备下拉 */
    var dev='<span class="nbtn"><svg><use href="#i-phone"/></svg>HUAWEI Mate 70 Pro<svg><use href="#i-chevD"/></svg></span><div class="npop">'
      +'<div class="mh">Physical</div><div class="mi sel"><svg><use href="#i-usb"/></svg>HUAWEI Mate 70 Pro<span class="grow"></span><span class="nfrom">USB</span></div>'
      +(emu?'<div class="ms"></div><div class="mh">Emulator</div><div class="mi"><svg><use href="#i-fold"/></svg>Pura X Emulator<span class="grow"></span><span class="nfrom">API 20</span></div><div class="mi"><svg><use href="#i-tablet"/></svg>MatePad Pro Emulator<span class="grow"></span><span class="nfrom">API 20</span></div>':'<div class="ms"></div><div class="mh">Emulator 插件未安装</div>')
      +(tpLive('cloud')?'<div class="ms"></div><div class="mh">Remote</div><div class="mi'+fr('cloud')+'"><svg><use href="#i-cloud"/></svg>Mate 70 Pro · 云真机'+by('cloud')+'</div><div class="mi'+fr('cloud')+'"><svg><use href="#i-cloud"/></svg>Pura 80 · 云真机'+by('cloud')+'</div>':'')
      +'<div class="ms"></div><div class="mi"><svg><use href="#i-settings"/></svg>Device Manager…</div></div>';
    /* ② Run 配置 */
    var run='<span class="nbtn"><svg><use href="#i-module"/></svg>entry<svg><use href="#i-chevD"/></svg></span><div class="npop">'
      +'<div class="mi sel"><svg><use href="#i-module"/></svg>entry</div><div class="mi"><svg><use href="#i-testRoot"/></svg>entry (ohosTest)</div>'
      +(tpLive('replay')?'<div class="ms"></div><div class="mi'+fr('replay')+'"><svg><use href="#i-play"/></svg>UI 回放：登录流程'+by('replay')+'</div><div class="mi'+fr('replay')+'"><svg><use href="#i-play"/></svg>UI 回放：下单流程'+by('replay')+'</div>':'')
      +'<div class="ms"></div><div class="mi"><svg><use href="#i-settings"/></svg>Edit Configurations…</div></div>';
    /* ③ File › New */
    var nw='<span class="nbtn">File › New</span><div class="npop">'
      +'<div class="mi"><svg><use href="#i-ets"/></svg>ArkTS File</div><div class="mi"><svg><use href="#i-ui"/></svg>Page</div><div class="mi"><svg><use href="#i-cube"/></svg>Component</div><div class="mi"><svg><use href="#i-module"/></svg>Ability</div>'
      +(tpLive('design')?'<div class="ms"></div><div class="mi'+fr('design')+'"><svg><use href="#i-layout"/></svg>从设计稿导入页面…'+by('design')+'</div>':'')
      +'</div>';
    /* ④ Profiler 页签 */
    var tabs=[['frame','Frame','#i-gauge'],['cpu','ArkTS CPU','#i-profile'],['mem','Memory','#i-lib'],['launch','Launch','#i-bolt']];
    if(tpLive('netcap'))tabs.push(['netcap','网络抓包','#i-wifi']);
    if(profTab==='netcap'&&!tpLive('netcap'))profTab='frame';
    var pb;
    if(profTab==='netcap'){
      pb='<table class="ntbl"><tr><th>Method</th><th>URL</th><th>Status</th><th>Size</th><th>Time</th></tr>'
        +'<tr><td>GET</td><td>/api/feed?page=1</td><td>200</td><td>48 KB</td><td class="slow">1 280 ms</td></tr>'
        +'<tr><td>GET</td><td>/img/cover/1024.webp</td><td>200</td><td>312 KB</td><td>410 ms</td></tr>'
        +'<tr><td>POST</td><td>/api/track</td><td>204</td><td>0 B</td><td>62 ms</td></tr>'
        +'<tr><td>WS</td><td>wss://…/push</td><td>101</td><td>—</td><td>open</td></tr></table>'

        +'<button class="btn sm" data-fa="right"'+dis(w.scr==='main'&&w.mode==='right')+'><svg class="i"><use href="#i-snapR"/></svg>吸附到 IDE 右侧</button>'
        +'<button class="btn sm" data-fa="ext"'+dis(w.scr==='ext')+'><svg class="i"><use href="#i-fingers"/></svg>三指一甩 → 外接屏</button>'
        +'<button class="btn sm" data-fa="pad"'+dis(w.scr==='pad')+'><svg class="i"><use href="#i-fingers"/></svg>三指一甩 → 平板</button>'
        +'<span class="grow"></span><button class="btn sm" data-fa="recall"><svg class="i"><use href="#i-undo"/></svg>收回 IDE</button>';
    }else act='<span class="dm-small dm-muted">点上面的插件，把它从 IDE 里拆成鸿蒙自由窗口；拖标题栏到屏幕左右边缘会吸附在 IDE 旁</span>';
    return pick+desk+'<div class="fw-act" id="fw-act">'+act+'</div>';
  }
  function flip(before){
    $$('#emap .fw').forEach(function(el){
      var b=before[el.dataset.w],a=el.getBoundingClientRect();
      if(!el.animate)return;
      if(!b){el.animate([{opacity:0,transform:'scale(.9)'},{opacity:1,transform:'none'}],{duration:260,easing:'ease-out'});return;}
      if(Math.abs(b.left-a.left)<1&&Math.abs(b.top-a.top)<1&&Math.abs(b.width-a.width)<1&&Math.abs(b.height-a.height)<1)return;
      el.animate([{transformOrigin:'0 0',transform:'translate('+(b.left-a.left)+'px,'+(b.top-a.top)+'px) scale('+(b.width/a.width)+','+(b.height/a.height)+')'},{transformOrigin:'0 0',transform:'none'}],{duration:340,easing:'cubic-bezier(.2,.8,.2,1)'});
    });
  }
  function detach(id){
    if(!WD[id]||!canDetach(id))return;
    host='free';fresh=null;
    if(!WIN[id]){var f=WD[id].f;WIN[id]={scr:'main',mode:'float',x:f.x,y:f.y,w:f.w,h:f.h};WSEQ=WSEQ.filter(function(x){return x!==id});WSEQ.push(id);}
    focusId=id;render();
  }
  function recall(id){delete WIN[id];if(focusId===id)focusId=null;render();}
  function winAct(id,a){
    var w=WIN[id];if(!w||flingBusy)return;
    if(a==='recall'){recall(id);return;}
    if(a==='max'){if(w.mode==='max'){w.mode=w.prev||'float';}else{w.prev=w.mode;w.mode='max';}render();return;}
    if(a==='left'||a==='right'){w.scr='main';w.mode=a;render();return;}
    if(a==='ext'||a==='pad'){fling(id,a);}
  }
  function fling(id,to){
    var el=$('#emap .fw[data-w="'+id+'"]'),tg=$('#desk .scr[data-scr="'+to+'"]'),dk=$('#desk');
    if(!el||!tg||!dk){WIN[id].scr=to;WIN[id].mode='tile';render();return;}
    flingBusy=true;
    var r=el.getBoundingClientRect(),t=tg.getBoundingClientRect(),d=dk.getBoundingClientRect();
    var g=document.createElement('div');g.className='fing';g.innerHTML='<i></i><i></i><i></i>';
    var x0=r.left+r.width/2-d.left-34,y0=r.top+r.height/2-d.top-8;
    g.style.left=x0+'px';g.style.top=y0+'px';dk.appendChild(g);
    var dx=Math.max(-120,Math.min(160,(t.left+t.width/2)-(r.left+r.width/2))),dy=Math.max(-120,Math.min(120,(t.top+t.height/2)-(r.top+r.height/2)));
    tg.classList.add('drop');
    var done=function(){g.remove();WIN[id].scr=to;WIN[id].mode='tile';flingBusy=false;render();};
    if(g.animate){var an=g.animate([{transform:'translate(0,0)',opacity:.2},{transform:'translate(0,0)',opacity:1,offset:.2},{transform:'translate('+dx+'px,'+dy+'px)',opacity:0}],{duration:480,easing:'ease-in'});an.onfinish=done;}
    else done();
  }
  /* 拖动标题栏移动 / 拖右下角缩放 / 拖到屏幕边缘吸附 / 拖到另一块屏 */
  var drag=null;
  function scrAt(x,y){var hit=null;$$('#desk .scr').forEach(function(s){var r=s.getBoundingClientRect();if(x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom)hit=s});return hit;}
  function pv(side){
    var old=$('#desk .snap-pv');if(!side){if(old)old.remove();return;}
    var m=$('#desk .scr.main');if(!old){old=document.createElement('div');old.className='snap-pv';m.appendChild(old);}
    old.style.cssText='top:'+TOP+'%;height:'+(BOT-TOP)+'%;width:36%;'+(side==='left'?'left:0':'right:0');
  }
  $('#emap').addEventListener('pointerdown',function(e){
    if(host!=='free'||flingBusy)return;
    var el=e.target.closest('.fw');if(!el||e.target.closest('button'))return;
    var id=el.dataset.w;
    if(focusId!==id){focusId=id;$$('#emap .fw').forEach(function(x){x.classList.toggle('focus',x===el)});var a=$('#fw-act');if(a&&id!=='ide'){render();el=$('#emap .fw[data-w="'+id+'"]');}}
    if(id==='ide')return;
    var tb=e.target.closest('.fw-tb'),rs=e.target.closest('.fw-rs');
    if(!tb&&!rs)return;
    e.preventDefault();
    var sc=el.parentNode,sr=sc.getBoundingClientRect(),r=el.getBoundingClientRect();
    drag={id:id,el:el,kind:rs?'size':'move',sx:e.clientX,sy:e.clientY,from:sc.dataset.scr,sr:sr,x:(r.left-sr.left)/sr.width*100,y:(r.top-sr.top)/sr.height*100,w:r.width/sr.width*100,h:r.height/sr.height*100,moved:false,hint:null};
    drag.nx=drag.x;drag.ny=drag.y;drag.nw=drag.w;drag.nh=drag.h;
    try{el.setPointerCapture(e.pointerId)}catch(err){}
  });
  document.addEventListener('pointermove',function(e){
    if(!drag)return;
    var d=drag,dx=(e.clientX-d.sx)/d.sr.width*100,dy=(e.clientY-d.sy)/d.sr.height*100;
    if(Math.abs(e.clientX-d.sx)+Math.abs(e.clientY-d.sy)>3)d.moved=true;
    if(!d.moved)return;
    d.el.classList.remove('snapped');
    if(d.kind==='size'){d.nw=Math.max(16,Math.min(100-d.x,d.w+dx));d.nh=Math.max(20,Math.min(BOT-d.y,d.h+dy));d.el.style.width=d.nw+'%';d.el.style.height=d.nh+'%';return;}
    d.nx=Math.max(-d.w+10,Math.min(92,d.x+dx));d.ny=Math.max(d.from==='main'?TOP:0,Math.min(88,d.y+dy));
    d.el.style.left=d.nx+'%';d.el.style.top=d.ny+'%';d.el.style.width=d.w+'%';d.el.style.height=d.h+'%';
    var s=scrAt(e.clientX,e.clientY),to=s&&s.dataset.scr;
    $$('#desk .scr').forEach(function(x){x.classList.toggle('drop',!!to&&x===s&&to!==d.from)});
    d.hint=null;
    if(to&&to!==d.from){d.hint=to;pv(null);}
    else if(to==='main'){var mr=s.getBoundingClientRect(),rx=(e.clientX-mr.left)/mr.width;d.hint=rx<.06?'left':rx>.94?'right':null;pv(d.hint);d.px=rx*100;d.py=(e.clientY-mr.top)/mr.height*100;}
    else pv(null);
    if(to==='main'&&d.from!=='main'){var mr2=s.getBoundingClientRect();d.px=(e.clientX-mr2.left)/mr2.width*100;d.py=(e.clientY-mr2.top)/mr2.height*100;}
  });
  document.addEventListener('pointerup',function(){
    if(!drag)return;var d=drag;drag=null;pv(null);$$('#desk .scr').forEach(function(x){x.classList.remove('drop')});
    if(!d.moved)return;
    var w=WIN[d.id];if(!w)return;
    if(d.kind==='size'){w.scr=d.from;w.mode='float';w.x=d.x;w.y=d.y;w.w=d.nw;w.h=d.nh;}
    else if(d.hint==='left'||d.hint==='right'){w.scr='main';w.mode=d.hint;}
    else if(d.hint==='main'){var f=WD[d.id].f;w.scr='main';w.mode='float';w.w=f.w;w.h=f.h;w.x=Math.max(0,Math.min(100-f.w,d.px-f.w/2));w.y=Math.max(TOP,Math.min(BOT-f.h,d.py-2));}
    else if(d.hint==='ext'||d.hint==='pad'){w.scr=d.hint;w.mode='tile';}
    else if(d.from==='main'){w.scr='main';w.mode='float';w.x=d.nx;w.y=d.ny;w.w=d.w;w.h=d.h;}
    render();
  });

  /* ---------------- 渲染 ---------------- */
  function render(){
    renderSeg();renderExt();
    var before={};$$('#emap .fw').forEach(function(el){before[el.dataset.w]=el.getBoundingClientRect()});
    $('#emap').innerHTML=host==='studio'?studioMap():host==='cli'?cliMock():host==='free'?deskView():vsMock();
    if(host==='free')flip(before);
    var cw=$('#cap-win');if(cw)cw.textContent=Object.keys(WIN).length;
    var c=$('#cap-tp');if(c)c.textContent=TP.filter(function(t){return tpLive(t.id)}).length;
    var c2=$('#cap-pl');if(c2)c2.textContent=PL.filter(function(p){return inst(p.id)}).length;
  }
  $('#emap').addEventListener('click',function(e){
    var t=e.target.closest('[data-ptab]');if(t){profTab=t.dataset.ptab;fresh=null;render();return;}
    var v=e.target.closest('[data-vtab]');if(v){vsTab=v.dataset.vtab;fresh=null;render();return;}
    var c=e.target.closest('[data-clu]');if(c){logClu=!logClu;fresh=null;render();return;}
    var dt=e.target.closest('[data-detach]');if(dt){detach(dt.dataset.detach);return;}
    var rc=e.target.closest('[data-recall]');if(rc){recall(rc.dataset.recall);return;}
    var sh=e.target.closest('[data-show]');if(sh){host='free';focusId=sh.dataset.show;fresh=null;render();return;}
    var pk=e.target.closest('[data-pk]');if(pk){var pid=pk.dataset.pk;if(WIN[pid]){focusId=pid;render();}else detach(pid);return;}
    var fa=e.target.closest('[data-fa]');if(fa){winAct(focusId,fa.dataset.fa);return;}
    var wa=e.target.closest('[data-wa]');if(wa){var wid=wa.closest('.fw').dataset.w;focusId=wid;winAct(wid,wa.dataset.wa);return;}
    var sf=e.target.closest('[data-srcof]');if(sf){var el0=$(sf.dataset.srcof);if(el0){DemoFrame.setSide('right','web');el0.scrollIntoView({block:'nearest'});el0.classList.add('hit');setTimeout(function(){el0.classList.remove('hit')},1600);}return;}
    var b=e.target.closest('[data-by]');if(b){
      var el=$('#tp-'+b.dataset.by);if(!el)return;DemoFrame.setSide('right','web');
      el.scrollIntoView({block:'nearest'});el.classList.add('hit');setTimeout(function(){el.classList.remove('hit')},1600);
    }
  });

  document.getElementById('tree-slot').innerHTML=DemoFrame.tree({sel:'ListPage.ets'});
  document.getElementById('code').innerHTML=DemoFrame.code('ListPage.ets',{cur:28});
  DemoFrame.init({device:'HUAWEI Mate 70 Pro',deviceIcon:'#i-phone',pos:'1:1',
    stripeRight:[{right:'notifications',icon:'#i-tw-notifications',title:'Notifications'},{right:'agent',icon:'#i-genie',title:'DevEco Code'},{right:'docs',icon:'#i-hdoc',title:'HarmonyOS Docs'},{right:'web',icon:'#i-puzzle',title:'Extensions'},{more:1},{right:'devices',icon:'#i-phone',title:'Device Manager'}],
    onReady:function(){
      render();
      $('#status-slot').innerHTML='<span class="dm-capsule"><svg class="i" style="width:12px;height:12px"><use href="#i-puzzle"/></svg>插件 <span id="cap-pl">4</span> · 三方扩展 <span id="cap-tp">1</span> · 独立窗口 <span id="cap-win">0</span></span>';render();
    }});
  DemoGuide.init([
    {target:"#tp-netcap",kind:"click",pos:"top",label:"点「启用」网络抓包"},
    {target:'#zone-prof',kind:'change',pos:'top',label:'Profiler 原生页签里多出一项'},
    {target:'#hostseg [data-host="vscode"]',kind:'click',pos:'bottom',label:'切到 VS Code 看同一插件'},
    {target:'#zone-prof [data-detach]',kind:'click',pos:'bottom',label:'点这里：拆成鸿蒙自由窗口'},
    {target:'#fw-act [data-fa="right"]',kind:'click',pos:'top',label:'吸附到 IDE 旁，或拖标题栏到屏幕边'},
    {target:'.fw.focus .fw-ft',kind:'change',pos:'bottom',label:'窗口里仍标着来源与权限'}
  ]);
})();
</script>
