<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='32' y2='32' gradientUnits='userSpaceOnUse'%3E%3Cstop stop-color='%232C8DDD'/%3E%3Cstop offset='1' stop-color='%233357AC'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='7' fill='url(%23g)'/%3E%3Ctext x='16' y='22.5' font-family='Arial,Helvetica,sans-serif' font-size='13' font-weight='700' fill='white' text-anchor='middle'%3EDE%3C/text%3E%3C/svg%3E">
<title>24 · 插件化开放：模拟器、调测、调优装进任何宿主，三方工具挂进原生位置</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../../deveco-intui-kit/src/tokens.css">
<link rel="stylesheet" href="../../deveco-intui-kit/src/components.css">
<link rel="stylesheet" href="../_shared/frame.css">
<link rel="stylesheet" href="../_shared/guide.css">
<script src="../../deveco-intui-kit/src/icons.js"></script>
<script src="../_shared/frame.js"></script>
<script src="../_shared/guide.js"></script>
<style>
  .ide[data-ide-theme]{--ai-w:clamp(360px,26vw,420px)}
  /* ---- 编辑区 ---- */
  .emap{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--ui-editor-bg);color:var(--ui-fg);font-size:var(--fs-para);line-height:var(--lh-para)}
  .emap-bar{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--ui-border);flex:none}
  .emap-bar .grow{flex:1}
  .emap-bar b{font-weight:600}
  .emap-body{flex:1;min-height:0;overflow:auto;padding:28px 16px 24px}
  .hostseg button{display:inline-flex;align-items:center;gap:6px}
  .hostseg .hl{width:14px;height:14px;border-radius:3px;display:grid;place-items:center;font-size:8px;font-weight:700;color:#fff;flex:none}

  /* 宿主徽标 */
  .hb{display:inline-flex;align-items:center;gap:3px;height:18px;padding:0 6px;border-radius:5px;font-size:10.5px;background:var(--ui-tag-bg);color:var(--ui-fg-info);white-space:nowrap}
  .hb.cur{background:color-mix(in srgb,var(--ui-accent) 18%,transparent);color:var(--ui-info);font-weight:600}
  .hb.no{text-decoration:line-through;opacity:.55}
  .hb i{width:6px;height:6px;border-radius:50%;background:var(--ui-success);display:inline-block}
  .hb.off i{background:var(--ui-fg-disabled)}

  /* ---- Studio 扩展点地图 ---- */
  .smap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:14px}
  .xz{position:relative;border:1.5px dashed color-mix(in srgb,var(--ui-accent) 45%,var(--ui-border));border-radius:10px;padding:8px 12px 12px;background:color-mix(in srgb,var(--ui-accent) 3%,transparent);min-width:0}
  .xz .zh{display:flex;align-items:center;gap:6px;height:22px;margin-bottom:8px;font-size:11.5px;white-space:nowrap;font-weight:600}
  .xz .zh .grow{flex:1}
  .xz .zh .no{width:15px;height:15px;border-radius:50%;background:var(--ui-accent);color:#fff;display:grid;place-items:center;font-size:9.5px;font-weight:700}
  .xz .zh code{font-family:var(--font-code);font-size:10.5px;color:var(--ui-fg-info)}
  .xz .zc{font-size:10.5px;font-weight:400;color:var(--ui-fg-info)}
  .xz.span2{grid-column:1 / -1}
  .xz.dead>.live{display:none}
  .xz .deadmsg{display:none;padding:18px 8px;text-align:center;color:var(--ui-fg-info);font-size:var(--fs-sm)}
  .xz.dead .deadmsg{display:block}

  /* 原生控件样子 */
  .nbtn{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 8px;border-radius:6px;background:var(--ui-hover);font-size:12.5px;white-space:nowrap}
  .nbtn svg{width:14px;height:14px;color:var(--ui-icon)}
  .npop{margin-top:4px;border:1px solid var(--ui-popup-border);border-radius:var(--arc);background:var(--ui-popup-bg);box-shadow:var(--ui-shadow);padding:5px 0;font-size:12.5px}
  .npop .mh{padding:3px 12px 3px;font-size:11px;color:var(--ui-fg-info)}
  .npop .mi{display:flex;align-items:center;gap:8px;min-height:26px;padding:2px 12px;white-space:nowrap}
  .npop .mi svg{width:14px;height:14px;color:var(--ui-icon);flex:none}
  .npop .mi .grow{flex:1}
  .npop .mi.sel{background:var(--ui-selection)}
  .npop .ms{height:1px;background:var(--ui-border);margin:4px 0}
  .by{font-size:10.5px;color:var(--ui-fg-disabled);white-space:nowrap;cursor:pointer;margin-left:auto;padding-left:10px}
  .by:hover{color:var(--ui-link);text-decoration:underline}
  .fresh{animation:fresh 1.6s ease-out}
  @keyframes fresh{0%{background:color-mix(in srgb,var(--ui-success) 35%,transparent)}100%{background:transparent}}
  .nfrom{font-size:10.5px;color:var(--ui-fg-disabled)}

  /* Profiler / 日志面板 */
  .npanel{border:1px solid var(--ui-border);border-radius:var(--arc);background:var(--ui-bg);overflow:hidden}
  .ntabs{display:flex;align-items:stretch;height:30px;border-bottom:1px solid var(--ui-border);padding:0 4px}
  .ntab{display:flex;align-items:center;gap:5px;padding:0 10px;font-size:12.5px;position:relative;color:var(--ui-fg);opacity:.75;border:0;background:transparent;white-space:nowrap}
  .ntab.on{opacity:1}
  .ntab.on::after{content:"";position:absolute;left:6px;right:6px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--ui-accent)}
  .ntab svg{width:13px;height:13px;color:var(--ui-icon)}
  .ntab.tp{font-weight:600}
  .nbody{padding:10px 12px;min-height:150px;font-size:var(--fs-sm);line-height:var(--lh-sm);background:var(--ui-editor-bg)}
  .bars{display:flex;align-items:flex-end;gap:3px;height:96px;padding-top:6px;border-bottom:1px solid var(--ui-border)}
  .bars i{flex:1;background:var(--ui-progress);border-radius:2px 2px 0 0;height:var(--h)}
  .bars i.bad{background:var(--ui-error)}
  .ntbl{width:100%;border-collapse:collapse;font-family:var(--font-code);font-size:11px}
  .ntbl th{text-align:left;font-weight:400;color:var(--ui-fg-info);padding:3px 6px;border-bottom:1px solid var(--ui-border)}
  .ntbl td{padding:3px 6px;border-bottom:1px solid var(--ui-border);white-space:nowrap}
  .ntbl td.slow{color:var(--ui-error)}
  .lfil{display:flex;align-items:center;gap:6px;padding:6px 8px;border-bottom:1px solid var(--ui-border);flex-wrap:wrap}
  .fchip{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:5px;border:1px solid var(--ui-component-border);font-size:11.5px;white-space:nowrap;background:var(--ui-field-bg)}
  .fchip.on{border-color:var(--ui-accent);background:color-mix(in srgb,var(--ui-accent) 12%,var(--ui-field-bg))}
  .fchip svg{width:11px;height:11px}
  .lines{padding:6px 10px;font-family:var(--font-code);font-size:11px;line-height:1.7;background:var(--ui-editor-bg);min-height:96px}
  .lines div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lines .w{color:var(--ui-warning)}.lines .e{color:var(--ui-error)}.lines .d{color:var(--ui-fg-info)}
  .clu{display:flex;align-items:center;gap:8px;padding:4px 0;font-family:var(--font-ui);font-size:12px}
  .clu b{font-family:var(--font-code);font-size:11px;min-width:36px;color:var(--ui-error)}

  /* ---- VS Code / Cursor 迷你宿主 ---- */
  .vs{border:1px solid var(--ui-component-border);border-radius:10px;overflow:hidden;background:var(--ui-bg);box-shadow:var(--ui-shadow);display:grid;grid-template-rows:30px minmax(0,1fr) 22px;height:640px;font-size:12px}
  .vs-title{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--ui-bg);border-bottom:1px solid var(--ui-border);font-size:11.5px;color:var(--ui-fg-info);position:relative}
  .vs-title .dots{position:absolute;left:10px;display:flex;gap:6px}
  .vs-title .dots i{width:10px;height:10px;border-radius:50%;background:var(--ui-component-border)}
  .vs-main{display:grid;grid-template-columns:44px 230px minmax(0,1fr) var(--vs-agent,0px);min-height:0}
  .vs-act{border-right:1px solid var(--ui-border);display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:6px;background:var(--ui-bg)}
  .vs-act span{width:34px;height:34px;display:grid;place-items:center;border-radius:6px;color:var(--ui-fg-info);position:relative}
  .vs-act span svg{width:18px;height:18px}
  .vs-act span.on{color:var(--ui-fg);background:var(--ui-hover)}
  .vs-act span.on::before{content:"";position:absolute;left:-5px;top:6px;bottom:6px;width:2px;background:var(--ui-accent);border-radius:1px}
  .vs-act span.ours{color:var(--ui-info)}
  .vs-side{border-right:1px solid var(--ui-border);display:flex;flex-direction:column;min-height:0;background:var(--ui-bg)}
  .vs-h{height:28px;display:flex;align-items:center;padding:0 12px;font-size:10.5px;font-weight:600;letter-spacing:.04em;color:var(--ui-fg-info)}
  .vs-row{display:flex;align-items:center;gap:6px;min-height:24px;padding:0 12px 0 16px;white-space:nowrap}
  .vs-row svg{width:14px;height:14px;color:var(--ui-icon);flex:none}
  .vs-row .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
  .vs-row .by{padding-left:4px}
  .vs-center{display:grid;grid-template-rows:minmax(0,1fr) 230px;min-height:0;min-width:0}
  .vs-ed{background:var(--ui-editor-bg);font-family:var(--font-code);font-size:11.5px;line-height:1.7;padding:8px 12px;overflow:hidden;color:var(--ui-fg-info);white-space:pre}
  .vs-ed .k{color:var(--ui-link)}
  .vs-pan{border-top:1px solid var(--ui-border);display:flex;flex-direction:column;min-height:0;background:var(--ui-editor-bg)}
  .vs-ptabs{display:flex;gap:2px;padding:0 8px;height:30px;align-items:stretch;flex:none}
  .vs-ptabs button{border:0;background:transparent;color:var(--ui-fg-info);font-size:10.5px;letter-spacing:.04em;padding:0 8px;position:relative}
  .vs-ptabs button.on{color:var(--ui-fg)}
  .vs-ptabs button.on::after{content:"";position:absolute;left:8px;right:8px;bottom:4px;height:1px;background:var(--ui-fg)}
  .vs-pb{flex:1;min-height:0;overflow:auto}
  .vs-status{display:flex;align-items:center;gap:14px;padding:0 10px;background:var(--ui-accent);color:#fff;font-size:11px;white-space:nowrap;overflow:hidden}
  .vs-status .grow{flex:1}
  .vs-status span{display:inline-flex;align-items:center;gap:4px}
  .vs-status svg{width:12px;height:12px}
  .vs-agent{border-left:1px solid var(--ui-border);background:var(--ui-bg);padding:10px;display:flex;flex-direction:column;gap:8px}
  .vs-agent i{display:block;height:8px;border-radius:4px;background:var(--ui-tag-bg)}
  .vs-empty{padding:12px 16px;color:var(--ui-fg-info);font-size:11.5px}

  /* ---- CLI ---- */
  .term{border:1px solid var(--ui-component-border);border-radius:10px;background:#16171a;color:#d4d6db;font-family:var(--font-code);font-size:12px;line-height:1.75;padding:12px 16px;min-height:420px;white-space:pre;overflow:auto}
  .term .p{color:#6fb3ff}.term .g{color:#6fd08c}.term .d{color:#8a8f99}.term .w{color:#e6c35c}

  /* ---- 右侧 Extensions ---- */
  .ext-body{padding:8px 12px 20px;display:flex;flex-direction:column;gap:8px}
  .ext-srch{display:flex;align-items:center;gap:6px;height:28px;padding:0 8px;border:1px solid var(--ui-component-border);border-radius:6px;background:var(--ui-field-bg);color:var(--ui-fg-disabled);font-size:12px}
  .ext-srch svg{width:14px;height:14px}
  .pl{border:1px solid var(--ui-border);border-radius:var(--arc);background:var(--ui-field-bg);padding:9px 10px;display:grid;grid-template-columns:32px minmax(0,1fr);gap:4px 10px}
  .pl .ic{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;background:color-mix(in srgb,var(--ui-accent) 16%,transparent);color:var(--ui-info);grid-row:span 3}
  .pl .ic svg{width:18px;height:18px}
  .pl .t1{display:flex;align-items:center;gap:6px}
  .pl .t1 b{font-weight:600}
  .pl .t1 .grow{flex:1}
  .pl .t1 .v{font-family:var(--font-code);font-size:10.5px;color:var(--ui-fg-info)}
  .pl .t2{font-size:var(--fs-sm);line-height:var(--lh-sm);color:var(--ui-fg-info)}
  .pl .t3{display:flex;flex-wrap:wrap;gap:4px}
  .pl.hit,.tp.hit{border-color:var(--ui-accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--ui-accent) 30%,transparent)}
  .tp{border:1px solid var(--ui-border);border-radius:var(--arc);background:var(--ui-field-bg);padding:7px 10px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;align-items:center}
  .tp b{font-weight:600}
  .tp .s{font-size:var(--fs-sm);line-height:var(--lh-sm);color:var(--ui-fg-info);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tp .s code{font-family:var(--font-code);font-size:10.5px}
  .tp .btn{grid-row:span 2}
  .tp.on{border-color:color-mix(in srgb,var(--ui-success) 50%,var(--ui-border))}
</style>
</head>
<body>
<div class="ide" id="ide" data-ide-theme="dark" data-left="none" data-right="web" data-bottom="none" role="application" aria-label="DevEco Studio">
  <div class="body">
    <div class="tw tw-left">
      <div class="pane" data-pane="project">
        <div class="tw-hdr"><span class="title">Project <svg class="i"><use href="#i-chevD"/></svg></span><span class="grow"></span>
          <button class="abtn" title="Hide|Shift+Esc" data-act="hide-left"><svg class="i"><use href="#i-hide"/></svg></button></div>
        <div class="tw-body" id="tree-slot"></div>
      </div>
    </div>

    <div class="editor">
      <div class="tabs" id="tabs">
        <button class="tab" data-file="ListPage.ets"><svg class="i"><use href="#i-ets"/></svg>ListPage.ets<span class="x"><svg class="i"><use href="#i-closeS"/></svg></span></button>
        <button class="tab on" data-file="扩展点地图"><svg class="i"><use href="#i-puzzle"/></svg>扩展点地图<span class="x"><svg class="i"><use href="#i-closeS"/></svg></span></button>
        <span class="grow"></span><span class="tab-tools"><button class="abtn" title="Editor Options"><svg class="i"><use href="#i-moreV"/></svg></button></span>
      </div>
      <div class="code-wrap" data-for-file="ListPage.ets" hidden><div class="code" id="code"></div></div>
      <div class="emap" data-for-file="扩展点地图">
        <div class="emap-bar">
          <b>宿主</b>
          <span class="dm-seg hostseg" id="hostseg"></span>
          <span class="dm-small dm-muted" id="host-note"></span>
          <span class="grow"></span>
          <span class="dm-small dm-muted" id="host-sum"></span>
        </div>
        <div class="emap-body" id="emap"></div>
      </div>
      <div class="breadcrumbs" id="crumbs"></div>
    </div>

    <div class="tw tw-right">
      <div class="pane on" data-pane="web">
        <div class="tw-hdr"><span class="title">Extensions</span><span class="grow"></span>
          <button class="abtn" title="Refresh"><svg class="i"><use href="#i-refresh"/></svg></button>
          <button class="abtn" title="Settings"><svg class="i"><use href="#i-settings"/></svg></button>
          <button class="abtn" title="Hide|Shift+Esc" data-act="hide-right"><svg class="i"><use href="#i-hide"/></svg></button></div>
        <div class="tw-body">
          <div class="ext-body">
            <div class="ext-srch"><svg><use href="#i-search"/></svg>搜索插件与扩展点</div>
            <div class="dm-group" style="padding:0">官方插件 · 从 Studio 拆出<span class="cnt" id="pl-cnt"></span><span class="grow"></span><span class="dm-small dm-muted" style="font-weight:400" id="pl-host"></span></div>
            <div class="dm-col" id="pls" style="gap:6px"></div>
            <div class="dm-group" style="padding:0;margin-top:4px">三方工具 · 注册到扩展点<span class="cnt" id="tp-cnt"></span></div>
            <div class="dm-small dm-muted" style="margin-top:-4px">启用后出现在原生位置，不单开插件页</div>
            <div class="dm-col" id="tps" style="gap:6px"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  var $=DemoFrame.$, $$=DemoFrame.$$;
  var esc=function(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')};

  var HOSTS=[
    {id:'studio',nm:'DevEco Studio',lg:'DE',c:'#2C8DDD',note:'原生宿主'},
    {id:'vscode',nm:'VS Code',lg:'VS',c:'#2F80C8',note:'同一插件，装进 VS Code'},
    {id:'cursor',nm:'Cursor',lg:'Cu',c:'#3A3A3A',note:'同一插件，装进 Cursor'},
    {id:'cli',nm:'CLI',lg:'>_',c:'#5A5F69',note:'同一能力，deveco 子命令'}
  ];
  var PL=[
    {id:'emu',nm:'Emulator',cn:'模拟器',v:'7.0.1',ic:'#i-phone',d:'手机 / 折叠 / 平板 / 穿戴模拟器，启动、旋转、注入定位。',hosts:['studio','vscode','cursor','cli']},
    {id:'hilog',nm:'HiLog & Debug',cn:'日志与调试',v:'7.0.1',ic:'#i-tw-device',d:'HiLog 过滤、ArkTS 断点、ArkUI Inspector 看组件树。',hosts:['studio','vscode','cursor','cli']},
    {id:'prof',nm:'Profiler',cn:'调优',v:'7.0.0',ic:'#i-gauge',d:'Frame、ArkTS CPU、Memory、冷启动分阶段。',hosts:['studio','vscode','cursor']},
    {id:'check',nm:'App Check',cn:'体检',v:'1.3.2',ic:'#i-ok',d:'上架前体检：隐私、权限、一多适配、包体。',hosts:['studio','vscode','cursor','cli']}
  ];
  var INST={studio:{emu:1,hilog:1,prof:1,check:1},vscode:{emu:1,hilog:1},cursor:{},cli:{hilog:1,check:1}};
  var TP=[
    {id:'netcap',nm:'网络抓包',ext:'profiler.tab',zone:'prof',need:'prof',by:'com.example.netcap',d:'HTTP / WebSocket 请求瀑布'},
    {id:'cloud',nm:'云真机',ext:'device.provider',zone:'dev',need:null,by:'com.example.clouddevice',d:'远程真机出现在设备下拉'},
    {id:'replay',nm:'UI 自动化回放',ext:'run.configuration',zone:'run',need:null,by:'com.example.uireplay',d:'录制的操作脚本作为 Run 配置'},
    {id:'crash',nm:'崩溃聚类',ext:'hilog.filter',zone:'log',need:'hilog',by:'com.example.crashinsight',d:'按栈指纹把 FaultLog 归并'},
    {id:'design',nm:'设计稿导入',ext:'file.new',zone:'new',need:null,by:'com.example.design2ets',d:'从设计稿生成 ArkTS 页面'}
  ];
  var ON={cloud:1};
  var host='studio',fresh=null,profTab='frame',logClu=false,vsTab='hilog';
  var tpById=function(id){return TP.filter(function(t){return t.id===id})[0]};
  var plById=function(id){return PL.filter(function(t){return t.id===id})[0]};
  var inst=function(p,h){return !!INST[h||host][p]};
  var tpLive=function(id,h){var t=tpById(id);return ON[id]&&(!t.need||inst(t.need,h))};
  var by=function(id){return '<span class="by" data-by="'+id+'">由 '+tpById(id).by+' 提供</span>'};
  var fr=function(id){return fresh===id?' fresh':''};

  /* ---------------- 右侧 Extensions ---------------- */
  function renderExt(){
    var H=HOSTS.filter(function(h){return h.id===host})[0];
    $('#pl-host').textContent='当前宿主：'+H.nm;
    $('#pls').innerHTML=PL.map(function(p){
      var sup=p.hosts.indexOf(host)>=0,on=inst(p.id);
      var badges=HOSTS.map(function(h){var s=p.hosts.indexOf(h.id)>=0;return '<span class="hb'+(h.id===host?' cur':'')+(s?'':' no')+(s&&!INST[h.id][p.id]?' off':'')+'" title="'+(s?(INST[h.id][p.id]?'已装':'可装'):'不支持')+'">'+(s?'<i></i>':'')+h.nm+'</span>'}).join('');
      var btn=!sup?'<span class="dm-pill muted">'+H.nm+' 不支持</span>':on?'<button class="btn sm" data-uninst="'+p.id+'">卸载</button>':'<button class="btn sm primary" data-inst="'+p.id+'">装到 '+H.nm+'</button>';
      return '<div class="pl" id="pl-'+p.id+'"><span class="ic"><svg><use href="'+p.ic+'"/></svg></span>'
        +'<div class="t1"><b>'+p.nm+'</b><span class="dm-muted dm-small">'+p.cn+'</span><span class="v">v'+p.v+'</span><span class="grow"></span>'+(on?'<span class="dm-pill ok">已装</span>':'')+btn+'</div>'

  function pad(s,n){s=String(s);while(s.length<n)s+=' ';return s}
