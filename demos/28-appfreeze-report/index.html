<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>冻屏分析报告</title>
<script>try{var t=localStorage.getItem('deveco-theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="stylesheet" href="../../deveco-intui-kit/src/tokens.css">
<link rel="stylesheet" href="../../deveco-intui-kit/src/ai.css">
<link rel="stylesheet" href="../_shared/guide.css">
<script src="../../deveco-intui-kit/icons/ai-icons.js"></script>
<link rel="icon" type="image/svg+xml" href="../../deveco-intui-kit/icons/deveco-code-logo-16.svg">
<style>
/* ===== 令牌：全部取自 deveco-intui-kit/src/tokens.css，深浅两套 ===== */
:root{
  --page:var(--Gray13); --paper:var(--Gray14); --fill:var(--Gray12); --fill2:var(--Gray11);
  --ink:var(--ui-fg); --ink1:var(--ui-fg); --ink2:var(--Gray4); --ink3:var(--ui-fg-info); --ink4:var(--ui-fg-disabled);
  --line:var(--Gray12); --accent:var(--ui-accent); --soft:var(--ui-hover);
  --yes:var(--ui-success); --yes-soft:color-mix(in srgb,var(--ui-success) 14%,transparent);
  --part:#9A5B00; --part-soft:color-mix(in srgb,var(--ui-warning) 20%,transparent);
  --no:var(--ui-error); --no-soft:color-mix(in srgb,var(--ui-error) 12%,transparent);
  --step:color-mix(in srgb,var(--ui-warning) 30%,var(--paper)); --step-over:color-mix(in srgb,var(--ui-error) 26%,var(--paper));
  --font:var(--font-ui); --mono:var(--font-code);
  --r-card:12px; --r-sm:8px; --top:40px; --wrap:1440px;
}
:root[data-theme="dark"]{--page:var(--Gray1);--paper:var(--Gray2);--fill:var(--Gray3);--fill2:var(--Gray4);--ink2:var(--Gray10);--line:var(--Gray3);--part:#E8B65C}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--page:var(--Gray1);--paper:var(--Gray2);--fill:var(--Gray3);--fill2:var(--Gray4);--ink2:var(--Gray10);--line:var(--Gray3);--part:#E8B65C}}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-padding-top:calc(var(--top) + 16px)}
body{font-family:var(--font);color:var(--ink1);background:var(--page);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;margin:0}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
code,.mono{font-family:var(--mono);font-size:12.5px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ===== 顶部：产品栏（白） ===== */
.top{position:sticky;top:0;z-index:50}
.sub{height:40px;background:var(--paper);display:flex;align-items:center;gap:12px;padding:0 56px}
.sub .grow{flex:1}
.sub .tbtn{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;color:var(--ink3)}
.sub .tbtn:hover{background:var(--fill)}
.sub .prod{font-weight:600;font-size:14px;white-space:nowrap}
@media (max-width:900px){.sub .prod{display:none}.sub{gap:8px}}


/* ===== 头图：DevEco Studio 页式的蓝色渐变淡出 ===== */
.hero{background:transparent}
.hero-in{max-width:var(--wrap);margin:0 auto;padding:22px 56px 18px;display:flex;align-items:flex-end;gap:24px;flex-wrap:wrap}
.hero .l{flex:1;min-width:320px}
.pill{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 10px;border-radius:999px;font-size:12px;background:var(--fill);color:var(--ink2);white-space:nowrap}
.hero .pill{background:var(--fill)}
.pill.yes{background:var(--yes-soft);color:var(--yes)}
.pill.part{background:var(--part-soft);color:var(--part)}
.pill.no{background:var(--no-soft);color:var(--no)}
.hero .pill.no{background:var(--no-soft);color:var(--no)}
.pill svg.i{width:13px;height:13px}
h1{font-size:30px;font-weight:600;line-height:1.3;color:var(--ink)}
.subtitle{margin-top:4px;font-size:18px;font-weight:500;line-height:1.5;color:var(--ink2)}
.meta{margin-top:10px;font-size:13px;color:var(--ink2);display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px}
.meta .pill+.pill{margin-left:-8px}

/* ===== 骨架：文档中心式居中容器，左树 + 正文 ===== */
.wrap{max-width:var(--wrap);margin:0 auto;display:flex;gap:36px;padding:8px 56px 88px}
.side{width:196px;flex:none;position:sticky;top:calc(var(--top) + 20px);align-self:flex-start;max-height:calc(100vh - var(--top) - 40px);overflow:auto;padding-top:6px}
.tree{border-left:1px solid var(--line);display:flex;flex-direction:column;margin-bottom:24px}
.tree a{display:flex;align-items:center;gap:8px;min-height:30px;padding:3px 0 3px 18px;margin-left:-1px;border-left:2px solid transparent;color:var(--ink2);text-decoration:none;font-size:13px}
.tree a:hover{color:var(--ink1)}
.tree a.on{border-left-color:var(--ink);color:var(--ink);font-weight:600}
.tree a .n{margin-left:auto;font-size:11.5px;color:var(--ink4);font-family:var(--mono);font-weight:400}
.main{flex:1;min-width:0}
@media (min-width:901px){.wrap{padding-right:104px}.hero-in{padding-left:calc(56px + 196px + 36px);padding-right:104px}.hero-in .l{max-width:1040px}}


/* ===== 两栏正文 ===== */
.sec-t{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.sec-t h2{font-size:18px;font-weight:600;color:var(--ink)}
.sec-t .sub2{font-size:13px;color:var(--ink3)}
.card{background:var(--paper);border-radius:var(--r-card);padding:20px}

/* 结论卡 */
.verdict{padding:22px 26px}
.vlabel{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;background:var(--btn);color:#fff;font-size:12px;font-weight:600;margin-bottom:10px}
.vrows{display:grid;grid-template-columns:84px minmax(0,1fr);gap:10px 16px;margin-top:16px;padding-top:16px;border-top:1px solid var(--line);font-size:14px;line-height:1.6}
.vrows dt{color:var(--ink3);font-weight:600}
.vrows dd{margin:0;color:var(--ink1);min-width:0;overflow-wrap:anywhere}
.vrows dd .loc{white-space:normal}
.vrows dd .loc{margin-right:16px}
.vrows code{background:var(--fill);border-radius:4px;padding:0 4px}
.vrows .pill{margin-left:8px;vertical-align:1px}
.vrows .muted{color:var(--ink4);font-size:13px}
.verdict h3{font-size:22px;font-weight:600;line-height:1.45;color:var(--ink)}

/* 时间线卡 */
.chart{background:var(--paper);border-radius:var(--r-card);padding:14px 16px 12px}
#tl{width:100%;height:auto;display:block;overflow:visible}
#tl text{font-family:var(--mono);font-size:11.5px;fill:var(--ink3)}
#tl .ln{font-family:var(--font);font-size:13px;font-weight:600;fill:var(--ink1)}
#tl .st{cursor:pointer;transition:opacity .15s}
#tl .st:hover{opacity:.7}
.story-t{font-size:15px;font-weight:600;color:var(--ink);margin:18px 0 8px;padding-top:16px;border-top:1px solid var(--line)}
.story{list-style:none;display:flex;flex-direction:column;gap:8px;margin-bottom:6px}
.story li{display:grid;grid-template-columns:128px minmax(0,1fr);gap:12px;font-size:14px;color:var(--ink2);line-height:1.6}
.story li{border-radius:8px;padding:4px 8px;margin:0 -8px;transition:background .12s}
.story li:not(.off){cursor:default}
.story li.on{background:var(--fill)}
.story li.on .t{color:var(--ink)}
.story .t{font-family:var(--mono);font-size:12.5px;color:var(--ink1);padding-top:1px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink3);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.tip{position:fixed;z-index:90;pointer-events:none;background:#191919;color:#fff;border-radius:10px;padding:8px 10px;font-size:12px;line-height:1.5;max-width:420px;opacity:0;transition:opacity .1s}
.tip.on{opacity:1}
.tip code{font-size:11.5px;color:#DFE1E5}

/* 因果链 */

/* 修复 */
#sec-fix .fix{background:var(--paper);border-radius:var(--r-card);padding:18px 22px}
#sec-fix .fix+.fix{margin-top:12px}
.fix-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.fix-h .no{width:24px;height:24px;border-radius:50%;background:var(--fill);color:var(--ink);font-size:12px;font-weight:600;display:grid;place-items:center;flex:none}
.fix.dir .fix-h .no{background:var(--part-soft);color:var(--part)}
.fix-h h4{font-size:16px;font-weight:600;flex:1;min-width:200px;color:var(--ink)}
.code{background:var(--fill);border-radius:var(--r-sm);overflow:auto;font-family:var(--mono);font-size:12.5px;line-height:20px;padding:8px 0}
.code .r{display:grid;grid-template-columns:22px 1fr;white-space:pre;padding-right:12px}
.code.plain .r{grid-template-columns:1fr;padding-left:16px}
.code .r .s{color:var(--ink4);user-select:none}
.code .r.add{background:var(--yes-soft)}.code .r.add .s{color:var(--yes)}
.code .r.del{background:var(--no-soft)}.code .r.del .s{color:var(--no)}
.code .r.ctx{color:var(--ink2)}.code .r.gap{color:var(--ink4)}

/* 三轴 */
.axes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.ax{background:var(--paper);border-radius:var(--r-card);padding:14px 16px 12px;display:flex;flex-direction:column;gap:4px}
.ax .k{font-size:12px;color:var(--ink3)}
.ax .v{font-size:18px;font-weight:600;display:flex;align-items:center;gap:6px}
.ax .v i{width:8px;height:8px;border-radius:50%;display:inline-block}
.ax.yes .v{color:var(--yes)}.ax.yes .v i{background:var(--yes)}
.ax.part .v{color:var(--part)}.ax.part .v i{background:var(--part)}

/* 证据清单 */
.checks{background:var(--paper);border-radius:var(--r-card);padding:6px}
.ck{border-radius:12px}
.ck+.ck{margin-top:2px}
.ck-h{display:grid;grid-template-columns:60px 1fr 16px;gap:12px;align-items:center;width:100%;text-align:left;padding:10px 12px;border-radius:12px}
.ck-h:hover{background:var(--fill)}
.ck-h .tt{font-size:14px;font-weight:600;color:var(--ink1)}
.ck-h .one{display:block;font-size:12.5px;color:var(--ink3);margin-top:1px}
.ck-h .chev{color:var(--ink4);transition:transform .15s}
.ck.open .ck-h .chev{transform:rotate(90deg)}
.st-t{font-size:12px;height:24px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;width:60px}
.s-hit .st-t{background:var(--no-soft);color:var(--no)}
.s-pass .st-t{background:var(--yes-soft);color:var(--yes)}
.s-excl .st-t{background:var(--fill);color:var(--ink3)}
.s-miss .st-t{background:var(--part-soft);color:var(--part)}
.ck-b{display:none;padding:2px 14px 14px 84px}
@media (max-width:900px){.ck-b{padding-left:14px}}
.ck.open .ck-b{display:block}
.ck-b ul{list-style:none;display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
.ck-b li{font-size:13px;color:var(--ink2);padding-left:12px;position:relative}
.ck-b li::before{content:'';position:absolute;left:0;top:9px;width:4px;height:4px;border-radius:50%;background:var(--ink3)}
.raw summary{font-size:12.5px;color:var(--ui-link);cursor:pointer;list-style:none;display:inline-flex;align-items:center;gap:4px}
.raw summary::-webkit-details-marker{display:none}
.copy{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:6px;color:var(--ink3);background:none;flex:none}
.copy:hover{color:var(--ink1)}
.copy svg.i{width:16px;height:16px}
.copy.done{color:var(--yes)}
.raw summary .copy{margin-left:6px}
.raw pre{margin-top:8px;background:var(--fill);border-radius:var(--r-sm);padding:10px 12px;font-family:var(--mono);font-size:12px;line-height:1.6;white-space:pre-wrap;word-break:break-all;color:var(--ink2);position:relative}
.frames{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:12.5px;margin-bottom:10px}
.frames .f{font-family:var(--mono);color:var(--ink3)}
.frames .e{color:var(--ink2)}

/* 排除项 & 线程 */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.xchip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 14px;border-radius:999px;background:var(--paper);font-size:13px;color:var(--ink2);cursor:default}
.xchip svg{width:12px;height:12px;color:var(--ink4);stroke-width:2.2}

/* 右侧悬浮工具条（同官网） */

/* 代码面板 */

.fade{animation:fade .35s ease}
@keyframes fade{from{opacity:.2;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (max-width:900px){.side{display:none}.wrap{padding:8px 16px 60px}.hero-in{padding:18px 16px 14px}.sub{padding:0 16px;gap:12px}h1{font-size:24px}.subtitle{font-size:15px}.axes{grid-template-columns:1fr}.vrows{grid-template-columns:1fr;gap:2px 0}.vrows dd{margin-bottom:8px}.story li{grid-template-columns:1fr;gap:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.stack{display:flex;flex-direction:column;gap:28px;max-width:1040px}
.sec-t .grow{flex:1}
.loc{font-family:var(--mono);font-size:12.5px;color:var(--ink3);white-space:nowrap}
.tt2{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:4px}
.tt2 th{text-align:left;font-weight:600;color:var(--ink3);padding:6px 8px;border-bottom:1px solid var(--line)}
.tt2 td{padding:6px 8px;border-bottom:1px solid var(--line);color:var(--ink2);vertical-align:top}
.tt2 td.mono{font-size:12px}
.ck-b .chips{margin-bottom:10px}
/* ===== 终轮：Agent 生成的报告 · 证据 / 推断 · 让 Agent 修 ===== */
#tl .grid{stroke:var(--line)} #tl .qbar{fill:var(--fill)} #tl .hlr{fill:color-mix(in srgb,var(--ui-fg) 8%,transparent)}
#tl text.tc{fill:var(--ink2)} #tl .lc{stroke:var(--ink3)} #tl .cc{fill:var(--ink1)}
#tl .s0{fill:var(--step)} #tl .s1{fill:var(--step-over)} #tl .rno{fill:none;stroke:var(--no)} #tl .lno{stroke:var(--no)} #tl .lpart{stroke:var(--part)}
#tl text.tpart{fill:var(--part)} #tl text.tno{fill:var(--no)} #tl .qn{fill:var(--no)}
.meta-ai{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink3);margin-bottom:10px;flex-wrap:wrap}
.meta-ai svg{width:14px;height:14px;flex:none}
.meta-ai b{color:var(--ink1);font-weight:500}
.strength{margin-top:8px;display:flex;gap:6px 14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink3)}
.strength span b{font-weight:500;color:var(--ink1)} .strength .part b{color:var(--part)}
.tag{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:9px;font-size:11px;line-height:18px;white-space:nowrap;vertical-align:1px;margin-right:6px;font-weight:400;cursor:help}
.tag.ev{background:var(--fill);color:var(--ink1)}
.tag.inf{background:transparent;color:var(--ink3);box-shadow:inset 0 0 0 1px var(--fill2)}
.tag.ok{background:var(--yes-soft);color:var(--yes)}
.vfixed{margin-top:14px;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--yes)}
.agbox{background:var(--paper);border-radius:var(--r-card);padding:14px 16px;margin-bottom:12px;display:flex;flex-direction:column;gap:10px}
.agbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13.5px;color:var(--ink2)}
.agbar svg.lg{width:16px;height:16px;flex:none}
.agbar .grow{flex:1;min-width:200px}
.agbox .ai-btn{font-family:var(--font)}
.agbox .ai-toolrow{cursor:default;margin:0 -6px}
.agbox .ai-toolrow .end .ok{color:var(--ui-success)}
.agbox .ai-approve{background:var(--fill)}
.agbox .ai-approve__cmd{background:var(--paper)!important;white-space:pre-wrap}
.agbox .ai-answer{background:var(--fill);padding:12px 14px 8px}
.agbox .ai-answer code,.agbox .ai-approve__why code,.ck-b .ref code{font-family:var(--mono);font-size:12px;padding:0 4px;border-radius:4px;background:var(--paper)}
.agbox .evl{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--ink3)}
.fix-h .ai-src{flex:none}
.ck-h .who{font-size:11.5px;color:var(--ink3);margin-left:6px;font-weight:400}
.ck-b .ref{display:flex;flex-direction:column;gap:8px;padding:10px 12px;border-radius:var(--r-sm);background:var(--fill);font-size:13px;color:var(--ink2);margin-bottom:10px}
.ck-b .ref .act{display:flex;gap:6px}
.s-hit.refd .st-t{background:var(--no-soft)}
</style>
</head>

  if(p==='run'||p==='done') h+=trow('ai-verify',`在 ${DEV} 上连点两次保存 · 看主线程与 EventHandler`,p==='run'?'run':'ok',p==='run'?`${AG.n} / 3 轮`:'3 / 3 轮');
  if(p==='done') h+=`<div class="ai-answer"><p class="ai-answer__lead">修好了：连点两次保存，主线程最长任务 4.0 s → 21 ms，3 轮都没触发冻屏。</p><p class="ai-answer__body">HiLog 里 <code>saveNoteWithAttachmentsAsync</code> 8 步都在 await 间让出主线程；EventHandler 队列峰值 115 → 6。复测记录已加到证据清单最后一项。</p><div class="evl"><span class="tag ev">证据</span>任务「FREEZE-0605」· Agent·冻屏 · ${DEV} · 3 轮 HiLog 与 EventHandler dump</div><div class="ai-answer__foot"><button class="ai-btn ai-btn--fill" type="button" data-ag="checks">看复测证据</button><button class="ai-btn" type="button" data-ag="revert"><svg><use href="#ai-revert"/></svg>退回</button><span class="grow"></span><span class="ai-fb"><button type="button" title="有用"><svg><use href="#ai-thumb-up"/></svg></button><button type="button" title="没用"><svg><use href="#ai-thumb-down"/></svg></button></span></div></div>`;
  return h;
}
function agLater(fn,ms){AG.t.push(setTimeout(fn,ms))}
function agSet(p){AG.phase=p;const b=document.getElementById('agbox');if(b)b.innerHTML=agHTML(mode==='v2');}
function agAct(a){
  if(a==='askread')agSet('waitread');
  else if(a==='noread')agSet('noread');
  else if(a==='read'){AG.n=0;agSet('reading');agLater(()=>{AG.n=1;agSet('reading')},800);agLater(()=>{AG.phase='idle';AG.n=0;AG.fromV1=true;location.hash='#v2'},1700);}
  else if(a==='fix'){agSet('write');agLater(()=>{AG.written=true;render();agSet('build')},900);agLater(()=>agSet('wait'),1900);}
  else if(a==='go'){AG.n=1;agSet('run');[2,3].forEach((k,i)=>agLater(()=>{AG.n=k;agSet('run')},700*(i+1)));agLater(()=>{AG.phase='done';openChecks.add('retest');render();document.getElementById('agbox').scrollIntoView({block:'center'})},2300);}
  else if(a==='revert'){AG.t.forEach(clearTimeout);AG={phase:'idle',written:false,ref:AG.ref,n:0,t:[]};render();}
  else if(a==='checks'){const el=document.querySelector('.ck[data-id="retest"]');if(el)el.scrollIntoView({block:'center'});}
  else if(a==='ref'){AG.ref=true;render();const el=document.querySelector('.ck[data-id="sample"]');if(el)el.scrollIntoView({block:'center'});}
}
const openChecks=new Set(['queue','sample']);

        <span class="mono">com.example.freezetest</span><span>进程 19655 · 前台</span><span>发生于 2026-06-05 <span class="mono">11:15:10.313</span></span><span>生成于 ${v2?'22:07':'21:04'}</span>

      <h3>${esc(d.title)}</h3>
      <div class="strength">${d.axes.map(a=>`<span class="${a[2]}">${a[0]} <b>${a[1]}</b></span>`).join('')}</div>
      <dl class="vrows">${d.rows.map((r,i)=>`<dt>${r[0]}</dt><dd>${kindTag(KIND[mode][i])}${r[1]}</dd>`).join('')}</dl>
      ${AG.phase==='done'&&v2?`<div class="vfixed">${ic('check')}已修复 · Agent·冻屏 在 HUAWEI Mate 70 Pro 上复测 3 / 3 通过</div>`:''}
    </section>

    <section id="sec-timeline">
      <div class="sec-t"><h2>主线程时间线与发生经过</h2><span class="sub2">2026-06-05 11:15:02 – 11:15:11</span></div>
      <div class="chart"><svg id="tl" viewBox="0 0 1000 222"></svg>
        <div class="legend"><span><i style="background:var(--step)"></i>保存流水线的一步（约 500ms）</span><span><i style="background:var(--no-soft)"></i>单任务执行超过 3s</span><span><i style="background:var(--ink1);border-radius:50%"></i>点击</span><span><i style="background:var(--fill)"></i>点击排队等待</span></div>
        <h3 class="story-t">发生经过</h3>
        <ol class="story" id="story">${d.chain.map(([t,x,r],i)=>`<li data-i="${i}" class="${r?'':'off'}"><span class="t">${t}</span><span>${esc(x)}</span></li>`).join('')}</ol>
      </div>
    </section>

    <section id="sec-fix">
      <div class="sec-t"><h2>修复建议</h2><span class="sub2">${v2?'源码差异对比':'源码不可达，提供通用方向与模板'}</span></div>
      <div class="agbox" id="agbox">${agHTML(v2)}</div>
      ${fixes.map((f,i)=>fixCard(f,i)).join('')}

    <section id="sec-checks">
      <div class="sec-t"><h2>证据清单</h2></div>
      <div class="checks" id="checks">${cks.map(ckRow).join('')}</div>
    </section>
  </div>`;
  drawTimeline();
  spy();
}

function fixCard(f,i){
  const rows = f.dir
    ? f.code.map(t=>`<div class="r ctx"><span>${esc(t)||' '}</span></div>`).join('')
    : f.diff.map(([k,t])=>`<div class="r ${k==='a'?'add':k==='d'?'del':'ctx'}"><span class="s">${k==='a'?'+':k==='d'?'−':''}</span><span>${esc(t)||' '}</span></div>`).join('');
  return `<div class="fix ${f.dir?'dir':''}">
    <div class="fix-h"><span class="no">${i+1}</span><h4>${f.t}</h4>
      ${f.dir?`<span class="pill part">通用方向</span>`:`<span class="loc">${f.loc}</span>`}${AG.written&&!f.dir?`<span class="ai-src"><span class="ai-spark"></span>Agent·冻屏 写入<i>·</i><button type="button" data-ag="revert">退回</button></span>`:''}<button class="copy" type="button" title="复制" aria-label="复制">${ic('copy')}</button></div>
    <div class="code ${f.dir?'plain':''}">${rows}</div>
  </div>`;
}

function ckRow(c){
  const lbl={hit:'命中',pass:'通过',excl:'已排除',miss:'缺数据'}[c.s];
  const who=c.who?`<span class="who">${c.who}</span>`:'';
  const open=openChecks.has(c.id);
  return `<div class="ck s-${c.s} ${c.who?'refd':''} ${open?'open':''}" data-id="${c.id}">
    <button class="ck-h" aria-expanded="${open}"><span class="st-t">${lbl}</span>
      <span><span class="tt">${c.t}${who}</span><span class="one">${c.one}</span></span>${ic('chev','chev')}</button>
    <div class="ck-b">
      ${c.ref?`<div class="ref">${c.ref}</div>`:''}
      ${c.frames?`<div class="frames">${c.frames.map(f=>`<span class="f">${f[0]}</span><span class="e">${f[1]}</span>`).join('')}</div>`:''}
      ${c.chips?`<div class="chips">${c.chips.map(x=>`<span class="xchip">${ic('x')}${x}</span>`).join('')}</div>`:''}
      ${c.pts?`<ul>${c.pts.map(p=>`<li>${esc(p)}</li>`).join('')}</ul>`:''}
      ${c.table?`<table class="tt2"><thead><tr><th>TID</th><th>线程名</th><th>栈顶</th><th>状态</th></tr></thead><tbody>${c.table.map(r=>`<tr>${r.map((x,k)=>`<td class="${k<1||k==2?'mono':''}">${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table>`:''}
      ${c.raw?`<details class="raw"><summary>${ic('chev')}原始日志<button class="copy" type="button" title="复制" aria-label="复制">${ic('copy')}</button></summary><pre><span class="txt">${esc(c.raw)}</span></pre></details>`:''}
    </div></div>`;
}

/* ---------- 时间线：数据全部来自原报告的应用日志、任务队列与抓栈时间 ---------- */
const X0=80, PX=100;
const tx=s=>X0+(parseFloat(s)-2)*PX;
function drawTimeline(){
  const svg=$('#tl'); if(!svg) return;
  const Y={click:34,main:86,dog:136,queue:180}, axisY=214; let g='<g id="hl"></g>';
  for(let s=2;s<=11;s++){const x=tx(s);g+=`<line x1="${x}" y1="10" x2="${x}" y2="${axisY-12}" class="grid"/><text x="${x}" y="${axisY}" text-anchor="middle">:${String(s).padStart(2,'0')}</text>`;}
  [['点击',Y.click],['主线程',Y.main],['看门狗',Y.dog],['任务队列',Y.queue]].forEach(([n,y])=>g+=`<text class="ln" x="0" y="${y+4}">${n}</text>`);
  // 点击：第 2 次点击到被分发之间画成水平「排队」条，终点对齐第 2 轮开始
  g+=`<rect x="${tx(3.418)}" y="${Y.click-6}" width="${tx(6.639)-tx(3.418)}" height="12" rx="6" class="qbar"/>`;
  g+=`<text x="${(tx(3.418)+tx(6.639))/2}" y="${Y.click+4}" text-anchor="middle" class="tc">排队 3.2s</text>`;
  g+=`<line x1="${tx(6.639)}" y1="${Y.click+6}" x2="${tx(6.639)}" y2="${Y.main-12}" class="lc" stroke-dasharray="3 3"/>`;
  g+=`<line x1="${tx(2.631)}" y1="${Y.click+6}" x2="${tx(2.631)}" y2="${Y.main-12}" class="lc" stroke-dasharray="3 3"/>`;
  g+=`<circle cx="${tx(2.631)}" cy="${Y.click}" r="6" class="cc"/><text x="${tx(2.631)-10}" y="${Y.click+4}" text-anchor="end">02.631</text>`;
  g+=`<circle cx="${tx(3.418)}" cy="${Y.click}" r="6" class="cc"/>`;
  g+=`<text x="${tx(3.418)}" y="${Y.click-12}" text-anchor="middle">03.418</text>`;
  // 主线程：两轮保存，每段对应一条应用日志
  const round=(arr,r)=>arr.map((st,i)=>{const s=parseFloat(st[0]);const e=i<arr.length-1?parseFloat(arr[i+1][0]):(r===1?6.639:10.313);
    const over=r===2 && s>=9.639; const x=tx(s), w=Math.max(2,tx(e)-x-1.5);
    return `<rect data-tip="11:15:${st[0]} saveNoteSync: ${st[1]}..." x="${x}" y="${Y.main-12}" width="${w}" height="24" rx="3" class="st ${over?'s1':'s0'}"/>`}).join('');
  g+=round(ROUND1,1)+round(ROUND2,2);
  g+=`<rect x="${tx(10.313)}" y="${Y.main-12}" width="${tx(10.8)-tx(10.313)}" height="24" rx="3" class="rno" stroke-dasharray="3 3"/>`;
  g+=`<text x="${(tx(2.632)+tx(6.639))/2}" y="${Y.main+28}" text-anchor="middle" class="tpart">第 1 轮保存 · 4.0s</text>`;
  g+=`<text x="${(tx(6.639)+tx(10.313))/2}" y="${Y.main+28}" text-anchor="middle" class="tpart">第 2 轮保存 · 至 10.313 上报仍在执行</text>`;
  // 看门狗：两次抓栈
  g+=`<line x1="${tx(7.142)}" y1="${Y.dog-14}" x2="${tx(7.142)}" y2="${Y.dog+16}" class="lpart" stroke-width="2"/><text x="${tx(7.142)+8}" y="${Y.dog-2}" class="tpart">3S 抓栈 07.142</text><text x="${tx(7.142)+8}" y="${Y.dog+12}">栈顶 Jeqz</text>`;
  g+=`<line x1="${tx(10.14)}" y1="${Y.dog-14}" x2="${tx(10.14)}" y2="${Y.dog+16}" class="lno" stroke-width="2"/><text x="${tx(10.14)-8}" y="${Y.dog-2}" class="tno" text-anchor="end">6S 抓栈 10.140</text><text x="${tx(10.14)-8}" y="${Y.dog+12}" text-anchor="end">栈顶 Ldobjbyname</text>`;
  // 任务队列：只有两次采样，画两根比例柱，不连线
  const base=Y.queue+14, hq=n=>Math.round(n/115*26);
  [[7.127,62],[10.128,115]].forEach(([t,n])=>{const x=tx(t);
    g+=`<rect x="${x-5}" y="${base-hq(n)}" width="10" height="${hq(n)}" rx="2" class="qn" opacity=".75"/><text x="${x+10}" y="${base-hq(n)+10}" class="tno">${n}</text>`;});
  g+=`<text x="${tx(7.127)-12}" y="${base-2}" text-anchor="end">总任务数</text>`;
  svg.innerHTML=g;
}

/* ---------- 时间线 ⇄ 发生经过 联动 ---------- */
function highlight(i){
  const hl=$('#hl'); if(!hl) return;
  $$('#story li').forEach(li=>li.classList.toggle('on',+li.dataset.i===i));
  const step=i==null?null:V[mode].chain[i]; const r=step&&step[2];
  hl.innerHTML=r?r.map(([a,b])=>`<rect x="${tx(a)-4}" y="6" width="${Math.max(8,tx(b)-tx(a)+8)}" height="196" rx="4" class="hlr"/>`).join(''):'';
}
document.addEventListener('mouseover',e=>{const li=e.target.closest('#story li'); if(li && !li.classList.contains('off')) highlight(+li.dataset.i);});
document.addEventListener('mouseout',e=>{if(e.target.closest('#story li') && !e.relatedTarget?.closest?.('#story li')) highlight(null);});
document.addEventListener('mousemove',e=>{
  const svg=e.target.closest('#tl'); if(!svg) return;
  const pt=svg.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY; const x=pt.matrixTransform(svg.getScreenCTM().inverse()).x;
  const t=(x-X0)/PX+2; let best=null, bw=1e9;
  V[mode].chain.forEach((c,i)=>(c[2]||[]).forEach(([a,b])=>{const pad=a===b?.12:.06; if(t>=a-pad&&t<=b+pad&&(b-a)<bw){bw=b-a;best=i;}}));
  highlight(best);
});
document.addEventListener('pointerout',e=>{if(e.target.closest&&e.target.closest('#tl')&&!e.relatedTarget?.closest?.('#tl')) highlight(null);});

/* ---------- 交互：切换版本、展开证据、目录高亮、时间线悬停看原日志 ---------- */
document.addEventListener('click',e=>{
  const ag=e.target.closest('[data-ag]');if(ag){e.preventDefault();agAct(ag.dataset.ag);return;}
  const cp=e.target.closest('.copy');
  if(cp){
    e.preventDefault(); e.stopPropagation();
    const det=cp.closest('details'), fix=cp.closest('.fix');
    const text = det ? det.querySelector('.txt').textContent
      : [...fix.querySelectorAll('.code .r')].map(r=>{const sg=r.querySelector('.s'); const t=r.lastElementChild.textContent; return (sg?(sg.textContent==='−'?'-':sg.textContent||' '):'')+t;}).join('\n');
    const done=()=>{cp.classList.add('done'); cp.title='已复制'; cp.innerHTML=ic('check'); clearTimeout(cp._t); cp._t=setTimeout(()=>{cp.classList.remove('done'); cp.title='复制'; cp.innerHTML=ic('copy');},1600);};
    if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(text).then(done,()=>fallback(text,done));} else fallback(text,done);
    return;
  }
  const h=e.target.closest('.ck-h');
  if(h){ const row=h.closest('.ck'); row.classList.toggle('open'); const o=row.classList.contains('open');
    o?openChecks.add(row.dataset.id):openChecks.delete(row.dataset.id); h.setAttribute('aria-expanded',o); }
});
document.addEventListener('mousemove',e=>{
  const s=e.target.closest('#tl .st'), tip=$('#tip');
  if(!s){ tip.classList.remove('on'); return; }
  tip.innerHTML=`<code>${esc(s.dataset.tip)}</code>`; tip.classList.add('on');
  tip.style.left=Math.min(innerWidth-440,e.clientX+14)+'px'; tip.style.top=(e.clientY+16)+'px';
});
function fallback(text,done){const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(_){}ta.remove();done();}
function spy(){
  const ids=$$('.side a[data-s]').map(a=>a.dataset.s); let cur=ids[0], best=-1e9;
  if(scrollY>40) ids.forEach(id=>{const el=document.getElementById(id); if(!el) return; const t=el.getBoundingClientRect().top; if(t<innerHeight*.35 && t>best){best=t;cur=id;}});
  $$('.side a[data-s]').forEach(a=>a.classList.toggle('on',a.dataset.s===cur));
}
addEventListener('scroll',spy,{passive:true});
addEventListener('hashchange',()=>{
  mode=location.hash==='#v1'?'v1':'v2';
  const fromV1=AG.fromV1;AG.t.forEach(clearTimeout);AG={phase:'idle',written:false,ref:AG.ref,n:0,t:[]};
  render(true);
  const f=document.getElementById('sec-fix');if(fromV1&&f)f.scrollIntoView();else scrollTo({top:0});
});

],{scene:{
