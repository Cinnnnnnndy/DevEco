<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>28 · 冻屏分析报告：先给判决，再给卷宗</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230A59F7'/%3E%3Cpath d='M8 20h4l3-9 3 12 3-7h3' fill='none' stroke='white' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
/* ===== 令牌：华为开发者联盟官网（与 deck-blueprint-style 同一套） ===== */
:root{
  --paper:#FFFFFF; --panel:#F1F3F5; --card:#F4F6F7;
  --ink:#141414; --ink2:#4D4D4D; --ink3:#7A7A7A; --ink4:#A3A3A3;
  --line:#E8E8E8; --accent:#0A59F7; --accent-hover:#0047D6; --soft:#E6EEFE;
  --yes:#237A45; --yes-soft:#E4F2E9; --part:#8F5A00; --part-soft:#FBF0DC; --no:#C4322A; --no-soft:#FBE7E5;
  --font:'HarmonyOS Sans SC','PingFang SC','Microsoft YaHei','Noto Sans CJK SC',system-ui,sans-serif;
  --mono:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace;
  --r-card:12px; --r-sm:8px;
  --hdr:64px; --nav-w:248px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-padding-top:calc(var(--hdr) + 16px)}
body{font-family:var(--font);color:var(--ink);background:var(--paper);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
code,.mono{font-family:var(--mono);font-size:12.5px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ===== 顶部全局导航 ===== */
.gh{position:sticky;top:0;z-index:50;height:var(--hdr);background:rgba(255,255,255,.96);backdrop-filter:blur(12px);display:flex;align-items:center;gap:28px;padding:0 32px;box-shadow:0 1px 0 var(--line)}
.brand{display:flex;align-items:center;gap:10px;white-space:nowrap}
.tile{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#2E7BFF,#0A59F7 60%,#0843C4);position:relative;overflow:hidden;display:grid;place-items:center;color:#fff}
.tile::before{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.16) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.16) 1px,transparent 1px);background-size:6px 6px}
.tile svg{position:relative;width:18px;height:18px;stroke-width:2}
.brand b{font-weight:500;font-size:16px}
.brand span{color:var(--ink3);font-size:14px}
.gh nav{display:flex;gap:4px;height:100%}
.gh nav a{display:flex;align-items:center;padding:0 12px;color:var(--ink2);text-decoration:none;font-size:14px;position:relative}
.gh nav a.on{color:var(--ink)}
.gh nav a.on::after{content:'';position:absolute;left:12px;right:12px;bottom:0;height:2px;background:var(--accent);border-radius:2px}
.gh .grow{flex:1}
.seg{display:inline-flex;background:var(--panel);border-radius:999px;padding:3px}
.seg button{height:28px;padding:0 14px;border-radius:999px;font-size:13px;color:var(--ink2);white-space:nowrap}
.seg button.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.seg-lbl{font-size:12px;color:var(--ink4);margin-right:8px}

/* ===== 骨架：左目录 + 正文 ===== */
.shell{display:flex;min-height:calc(100vh - var(--hdr))}
.side{width:var(--nav-w);flex:none;background:var(--panel);position:sticky;top:var(--hdr);height:calc(100vh - var(--hdr));overflow:auto;padding:20px 12px 24px}
.side h6{font-size:12px;font-weight:400;color:var(--ink4);padding:0 12px;margin:4px 0 8px}
.side a{display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;border-radius:8px;color:var(--ink2);text-decoration:none;font-size:14px}
.side a:hover{background:rgba(0,0,0,.04)}
.side a.on{background:var(--soft);color:var(--accent)}
.side a .n{margin-left:auto;font-size:12px;color:var(--ink4);font-family:var(--mono)}
.side a.on .n{color:var(--accent)}
.side .sep{height:16px}
body.is-empty .side .rep{display:none}
.side .other a{font-size:13px;height:32px}
.main{flex:1;min-width:0;padding:18px 40px 80px}
.crumb{font-size:13px;color:var(--ink4);display:flex;gap:6px;align-items:center;margin-bottom:10px}
.crumb a{color:var(--ink3);text-decoration:none}.crumb a:hover{color:var(--accent)}

/* ===== 报告头 ===== */
.head{display:flex;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:14px}
.head .l{flex:1;min-width:320px}
.eyebrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.pill{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 10px;border-radius:999px;font-size:12px;background:var(--panel);color:var(--ink2);white-space:nowrap}
.pill.blue{background:var(--soft);color:var(--accent)}
.pill.yes{background:var(--yes-soft);color:var(--yes)}
.pill.part{background:var(--part-soft);color:var(--part)}
.pill.no{background:var(--no-soft);color:var(--no)}
.pill svg.i{width:13px;height:13px}
h1{font-size:24px;font-weight:400;line-height:1.35;letter-spacing:-.005em}
.meta{margin-top:8px;font-size:13px;color:var(--ink3);display:flex;flex-wrap:wrap;gap:4px 16px}
.meta .mono{font-size:12.5px}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 18px;border-radius:999px;font-size:14px;white-space:nowrap;transition:background .15s}
.btn.pri{background:var(--accent);color:#fff}.btn.pri:hover{background:var(--accent-hover)}
.btn.sec{background:var(--soft);color:var(--accent)}.btn.sec:hover{background:#D6E3FD}
.btn.ter{color:var(--ink2);background:var(--panel)}.btn.ter:hover{background:#E6E9EC}
.btn.sm{height:30px;padding:0 14px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{color:var(--accent);cursor:pointer;font-family:var(--mono);font-size:12.5px;white-space:nowrap;text-decoration:none}
.link:hover{text-decoration:underline}

/* ===== 横幅 ===== */
.banner{display:flex;align-items:center;gap:12px;padding:8px 10px 8px 16px;border-radius:var(--r-card);margin-bottom:16px;font-size:14px}
.banner.warn{background:var(--part-soft);color:#5E3B00}
.banner.info{background:var(--soft);color:#0B3A99}
.banner.ok{background:var(--yes-soft);color:#154D2B}
.banner.bad{background:var(--no-soft);color:#7A1C16}
.banner .t{flex:1}
.banner b{font-weight:500}

/* ===== 两栏 ===== */
.grid2{display:grid;grid-template-columns:minmax(0,58fr) minmax(0,42fr);gap:20px;align-items:start}
.col{display:flex;flex-direction:column;gap:20px;min-width:0}
@media (max-width:1200px){.grid2{grid-template-columns:1fr}}
.sec-t{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sec-t h2{font-size:18px;font-weight:400}
.sec-t .sub{font-size:13px;color:var(--ink4)}
.sec-t .grow{flex:1}
.card{background:var(--card);border-radius:var(--r-card);padding:20px}
.verdict{padding:16px 20px}
a.btn{text-decoration:none}

/* 结论卡 */
.verdict h3{font-size:19px;font-weight:400;line-height:1.45;margin-bottom:8px}
.path{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--ink2);margin-bottom:10px}
.path .sep{color:var(--ink4)}
.pts{list-style:none;display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.pts li{display:grid;grid-template-columns:20px 1fr auto;gap:8px;align-items:start;font-size:14px;color:var(--ink2);line-height:1.55}
.pts li .dot{width:20px;height:20px;border-radius:50%;background:var(--paper);color:var(--accent);font-size:11px;display:grid;place-items:center;font-family:var(--mono);margin-top:1px}
.pts li.unk .dot{color:var(--part)}
.pts li code{background:var(--paper);border-radius:4px;padding:0 4px}
.vfoot{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap}
.vmeta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--ink3);margin-left:auto}
.vmeta b{font-weight:400;color:var(--ink)}
.kv{display:none}
.kv div{background:var(--paper);padding:10px 12px}
.kv dt{font-size:12px;color:var(--ink4)}
.kv dd{font-size:14px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:1400px){.kv{grid-template-columns:repeat(3,minmax(0,1fr))}}
.verdict .acts{justify-content:flex-start}
.upg{display:flex;gap:10px;align-items:center;margin-top:14px;padding:12px 14px;background:var(--paper);border-radius:var(--r-sm)}
.upg .st{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink4)}
.upg .st.on{color:var(--accent)}.upg .st.done{color:var(--yes)}
.upg .st .b{width:18px;height:18px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font-size:11px}
.upg .st.on .b{background:var(--soft)}.upg .st.done .b{background:var(--yes-soft)}
.upg .ar{color:var(--ink4)}

/* 图表容器：蓝图格 + 制图角标 */
.chart{position:relative;background:var(--paper);border-radius:var(--r-card);padding:12px 14px 10px;
  background-image:linear-gradient(rgba(10,89,247,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(10,89,247,.05) 1px,transparent 1px);background-size:20px 20px;background-color:#FBFCFE}
.chart .cn{position:absolute;width:13px;height:13px;border-color:rgba(10,89,247,.38);border-style:solid;border-width:0}
.chart .cn.tl{top:0;left:0;border-top-width:1.25px;border-left-width:1.25px}
.chart .cn.tr{top:0;right:0;border-top-width:1.25px;border-right-width:1.25px}
.chart .cn.bl{bottom:0;left:0;border-bottom-width:1.25px;border-left-width:1.25px}
.chart .cn.br{bottom:0;right:0;border-bottom-width:1.25px;border-right-width:1.25px}
#tl{width:100%;height:auto;display:block;overflow:visible}
#tl text{font-family:var(--mono);font-size:11.5px;fill:var(--ink3)}
#tl .ln{font-family:var(--font);font-size:13px;fill:var(--ink2)}
#tl .st{cursor:pointer;transition:opacity .15s}
#tl .st:hover,#tl .st.hl{opacity:.72}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink3);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.tip{position:fixed;z-index:90;pointer-events:none;background:#1F2329;color:#fff;border-radius:8px;padding:8px 10px;font-size:12px;line-height:1.5;max-width:420px;opacity:0;transition:opacity .1s}
.tip.on{opacity:1}
.tip code{font-size:11.5px;color:#C9D7FF}

/* 因果链 */
.chain summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink2)}
.chain summary::-webkit-details-marker{display:none}
.chain summary svg{transition:transform .15s}
.chain[open] summary svg{transform:rotate(90deg)}
.chain ol{margin:12px 0 0 0;padding:0;list-style:none;counter-reset:c;display:flex;flex-direction:column;gap:8px}
.chain li{counter-increment:c;display:grid;grid-template-columns:24px 1fr;gap:8px;font-size:14px;color:var(--ink2)}
.chain li::before{content:counter(c);width:22px;height:22px;border-radius:50%;background:var(--paper);display:grid;place-items:center;font-size:12px;color:var(--ink3);font-family:var(--mono)}

/* 修复 */
.fix{background:var(--card);border-radius:var(--r-card);padding:18px 20px}
.fix+.fix{margin-top:12px}
.fix-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.fix-h .no{width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;display:grid;place-items:center;flex:none}
.fix.dir .fix-h .no{background:var(--part)}
.fix-h h4{font-size:16px;font-weight:400;flex:1;min-width:200px}
.fix p.why{font-size:13px;color:var(--ink3);margin:8px 0 12px}
.fix p.cav{font-size:13px;color:var(--part);margin:-4px 0 12px;display:flex;gap:6px}
.code{background:var(--paper);border-radius:var(--r-sm);overflow:auto;font-family:var(--mono);font-size:12.5px;line-height:20px;padding:8px 0}
.code .r{display:grid;grid-template-columns:44px 16px 1fr;white-space:pre}
.code .r .n{color:var(--ink4);text-align:right;padding-right:8px;user-select:none}
.code .r .s{color:var(--ink4);user-select:none}
.code .r.add{background:var(--yes-soft)}.code .r.add .s{color:var(--yes)}
.code .r.del{background:var(--no-soft)}.code .r.del .s{color:var(--no)}
.code .r.ctx{color:var(--ink2)}
.code .r.gap{color:var(--ink4)}
.fix .acts{margin-top:12px}
.verify{margin-top:16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:16px 20px;border-radius:var(--r-card);background:var(--soft)}
.verify .t{flex:1;min-width:240px;font-size:14px;color:#0B3A99}
.verify .t small{display:block;color:var(--ink3);font-size:12.5px;margin-top:2px}
.verify.ok{background:var(--yes-soft)}.verify.ok .t{color:#154D2B}
.verify.off{background:var(--panel)}.verify.off .t{color:var(--ink3)}

/* 三轴 */
.axes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.ax{background:var(--card);border-radius:var(--r-card);padding:14px 14px 12px;display:flex;flex-direction:column;gap:6px}
.ax .k{font-size:12px;color:var(--ink4)}
.ax .v{font-size:17px;display:flex;align-items:center;gap:6px}
.ax .v i{width:8px;height:8px;border-radius:50%;display:inline-block}
.ax .d{font-size:12.5px;color:var(--ink3);line-height:1.5}
.ax.yes .v{color:var(--yes)}.ax.yes .v i{background:var(--yes)}
.ax.part .v{color:var(--part)}.ax.part .v i{background:var(--part)}

/* 证据清单 */
.sum{display:flex;gap:6px;flex-wrap:wrap}
.checks{background:var(--card);border-radius:var(--r-card);padding:6px}
.ck{border-radius:10px}
.ck+.ck{margin-top:2px}
.ck-h{display:grid;grid-template-columns:22px 1fr auto 16px;gap:10px;align-items:center;width:100%;text-align:left;padding:10px 10px;border-radius:10px}
.ck-h:hover{background:rgba(0,0,0,.03)}
.ck.focus .ck-h{background:var(--paper);box-shadow:inset 2px 0 0 var(--accent)}
.ck-h .ic{width:22px;height:22px;border-radius:50%;display:grid;place-items:center}
.ck-h .ic svg{width:13px;height:13px;stroke-width:2.2}
.ck-h .tt{font-size:14px;color:var(--ink)}
.ck-h .one{display:block;font-size:12.5px;color:var(--ink3);margin-top:1px}
.ck-h .chev{color:var(--ink4);transition:transform .15s}
.ck.open .ck-h .chev{transform:rotate(90deg)}
.s-hit .ic{background:var(--no-soft);color:var(--no)}
.s-pass .ic{background:var(--yes-soft);color:var(--yes)}
.s-excl .ic{background:#E9EBED;color:var(--ink3)}
.s-miss .ic{background:var(--part-soft);color:var(--part)}
.st-t{font-size:12px;padding:0 8px;height:22px;border-radius:999px;display:inline-flex;align-items:center}
.s-hit .st-t{background:var(--no-soft);color:var(--no)}
.s-pass .st-t{background:var(--yes-soft);color:var(--yes)}
.s-excl .st-t{background:#E9EBED;color:var(--ink3)}
.s-miss .st-t{background:var(--part-soft);color:var(--part)}
.ck-b{display:none;padding:2px 12px 14px 42px}
.ck.open .ck-b{display:block}
.ck-b ul{list-style:none;display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
.ck-b li{font-size:13px;color:var(--ink2);padding-left:12px;position:relative}
.ck-b li::before{content:'';position:absolute;left:0;top:9px;width:4px;height:4px;border-radius:50%;background:var(--accent)}
.raw summary{font-size:12.5px;color:var(--accent);cursor:pointer;list-style:none;display:inline-flex;align-items:center;gap:4px}
.raw summary::-webkit-details-marker{display:none}
.raw pre{margin-top:8px;background:var(--paper);border-radius:var(--r-sm);padding:10px 12px;font-family:var(--mono);font-size:12px;line-height:1.6;white-space:pre-wrap;word-break:break-all;color:var(--ink2);position:relative}
.raw pre .cp{position:absolute;top:6px;right:6px}
.frames{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:12.5px;margin-bottom:10px}
.frames .f{font-family:var(--mono);color:var(--ink3)}
.frames .e{color:var(--ink2)}

/* 排除项 & 线程 */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.xchip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;background:var(--card);font-size:13px;color:var(--ink2);cursor:default}
.xchip svg{width:12px;height:12px;color:var(--ink4);stroke-width:2.2}
.xchip:hover{background:#E9EBED}
.dec{display:grid;grid-template-columns:auto 1fr 1fr;border-radius:var(--r-card);overflow:hidden;background:var(--card);font-size:13px;margin-bottom:12px}
.dec div{padding:8px 12px;color:var(--ink2)}
.dec .h{color:var(--ink4);font-size:12px;background:var(--panel)}
.dec .k{color:var(--ink3)}
.dec .hit{color:var(--no);background:rgba(196,50,42,.05)}
.threads{background:var(--card);border-radius:var(--r-card);padding:16px}
.tdots{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tdots i{width:14px;height:14px;border-radius:4px;background:#D9DDE1}
.tdots i.r{background:var(--no)}
.tgrp{display:grid;grid-template-columns:1fr auto auto;gap:4px 14px;font-size:13px;color:var(--ink2)}
.tgrp .m{font-family:var(--mono);font-size:12px;color:var(--ink3)}
.tgrp .r{color:var(--no)}

/* 代码抽屉（替代 IDE 分屏） */
.scrim{position:fixed;inset:var(--hdr) 0 0 0;background:rgba(20,20,20,.18);opacity:0;pointer-events:none;transition:opacity .2s;z-index:60}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:var(--hdr);right:0;bottom:0;width:min(760px,56vw);background:var(--paper);z-index:61;transform:translateX(100%);transition:transform .22s ease;display:flex;flex-direction:column;box-shadow:-1px 0 0 var(--line)}
.drawer.on{transform:none}
.dr-h{display:flex;align-items:center;gap:10px;padding:14px 20px;background:var(--panel)}
.dr-h .f{font-family:var(--mono);font-size:13px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dr-tabs{display:flex;gap:4px;padding:10px 16px 0;background:var(--panel)}
.dr-tabs button{height:32px;padding:0 12px;border-radius:8px 8px 0 0;font-size:12.5px;font-family:var(--mono);color:var(--ink3)}
.dr-tabs button.on{background:var(--paper);color:var(--ink)}
.dr-b{flex:1;overflow:auto;position:relative;padding:8px 0 40px}
.src .r{display:grid;grid-template-columns:52px 1fr;font-family:var(--mono);font-size:12.5px;line-height:21px;white-space:pre;color:var(--ink2)}
.src .r .n{color:var(--ink4);text-align:right;padding-right:14px;user-select:none}
.src .r.hl{background:var(--no-soft);box-shadow:inset 3px 0 0 var(--no);animation:flash .9s ease-out}
.src .r.hl2{background:var(--part-soft);box-shadow:inset 3px 0 0 var(--part)}
.src .kw{color:#C4322A}.src .str{color:#237A45}.src .cm{color:var(--ink4);font-style:italic}.src .ty{color:#0A59F7}
@keyframes flash{0%{filter:brightness(.88)}100%{filter:none}}
.flag{position:sticky;top:8px;float:right;margin-right:16px;z-index:2;background:var(--no);color:#fff;font-size:12px;border-radius:999px;padding:4px 12px}
.flag.part{background:var(--part)}
.dr-f{padding:10px 20px;background:var(--panel);font-size:12.5px;color:var(--ink3);display:flex;gap:10px;align-items:center}

/* 空态 / 分析中 */
.empty{max-width:880px;margin:48px auto;text-align:center}
.empty h1{margin-bottom:6px}
.empty p{color:var(--ink3)}
.drop{margin:28px auto 22px;border-radius:var(--r-card);padding:34px;background:var(--card);color:var(--ink3);display:flex;flex-direction:column;align-items:center;gap:10px}

  g+=`<text x="${(tx(2.632)+tx(6.639))/2}" y="104" text-anchor="middle" fill="#8F5A00">MMITask #1 · 8 × 500ms = 4.0s</text>`;
  g+=`<text x="${(tx(6.639)+tx(10.313))/2}" y="104" text-anchor="middle" fill="#8F5A00">MMITask #2 · ≥ 3.7s</text>`;
  // 看门狗
  g+=`<g id="tl-watch"><line x1="${tx(7.142)}" y1="114" x2="${tx(7.142)}" y2="142" stroke="#8F5A00" stroke-width="2"/><text x="${tx(7.142)+6}" y="126" fill="#8F5A00">3S 告警 07.142</text><text x="${tx(7.142)+6}" y="139">抓栈 · Jeqz</text>`;
  g+=`<line x1="${tx(10.313)}" y1="114" x2="${tx(10.313)}" y2="142" stroke="#C4322A" stroke-width="2"/><text x="${tx(10.313)-6}" y="126" fill="#C4322A" text-anchor="end">6S 上报 10.313</text><text x="${tx(10.313)-6}" y="139" text-anchor="end">抓栈 · Ldobjbyname</text></g>`;
  // 队列
  g+=`<g id="tl-queue"><polyline points="${tx(7.127)},180 ${tx(10.128)},160" fill="none" stroke="#C4322A" stroke-width="2"/><circle cx="${tx(7.127)}" cy="180" r="3.5" fill="#C4322A"/><circle cx="${tx(10.128)}" cy="160" r="3.5" fill="#C4322A"/><text x="${tx(7.127)-8}" y="184" text-anchor="end">62 个任务</text><text x="${tx(10.128)+8}" y="160">115</text><text x="${tx(7.9)}" y="190">VIP 52 → 105</text></g>`;
  if(verified){
    g+=`<circle cx="${tx(2.631)}" cy="222" r="5" fill="#237A45"/><circle cx="${tx(3.418)}" cy="222" r="5" fill="#237A45"/>`;
    g+=`<rect x="${tx(2.64)}" y="214" width="6" height="16" rx="2" fill="#237A45"/><rect x="${tx(3.43)}" y="214" width="5" height="16" rx="2" fill="#237A45"/>`;
    g+=`<text x="${tx(3.8)}" y="226" fill="#237A45">两次点击各 14ms / 9ms 返回 · 保存在后台完成 · 未触发 3S / 6S</text>`;
  }
  svg.setAttribute('viewBox',`0 0 720 ${H}`);
  svg.innerHTML=g;
}

/* ---------- 空态 ---------- */
function renderEmpty(){
  $('#main').innerHTML=`<div class="empty fade">
    <h1>选择一条冻屏记录开始分析</h1>
    <p>从 FaultLog 面板拖入 faultlog，或从设备上拉取最近的故障。</p>
    <div class="drop">${ic('upload')}<span>把 <span class="mono">appfreeze-*.log</span> 拖到这里</span><button class="btn sec sm" data-act="noop">从设备拉取</button></div>
    <div class="samples">
      <button class="sample" data-act="load" data-m="v2"><span class="pill no" style="align-self:flex-start">THREAD_BLOCK_6S</span><b>保存笔记时主线程卡死 · 可读取源码</b><span>com.example.freezetest · 2026-06-05 11:15 · 定位到行、给出补丁</span></button>
      <button class="sample" data-act="load" data-m="v1"><span class="pill no" style="align-self:flex-start">THREAD_BLOCK_6S</span><b>同一条记录 · 只有 faultlog</b><span>未授权读取源码 · 定位到业务函数、给出通用方向</span></button>
    </div></div>`;
}

/* 分析中：证据清单逐项点亮 */
function analyze(m){
  mode=m; verified=false; setSeg(); render(true);
  const box=$('#checks'); box.classList.add('analyzing');
  const rows=$$('#checks .ck'); rows.forEach(r=>r.classList.remove('open'));
  rows.forEach((r,i)=>setTimeout(()=>r.classList.add('lit'),180*(i+1)));
  setTimeout(()=>{box.classList.remove('analyzing');rows.forEach(r=>{r.classList.remove('lit');if(openChecks.has(r.dataset.id))r.classList.add('open')})},180*(rows.length+1));
}

/* 源码授权：三步进度后就地升级 */
function upgrade(){
  const box=$('#upg'); if(!box) return;
  $('#sec-verdict').scrollIntoView({block:'start'});
  const st=['读取工程','版本比对 · 4ca0c7e','重新定位'];
  const draw=k=>box.innerHTML=`<div class="upg">${st.map((s,i)=>`<span class="st ${i<k?'done':i===k?'on':''}"><span class="b">${i<k?'✓':i+1}</span>${s}</span>${i<2?'<span class="ar">›</span>':''}`).join('')}</div>`;
  draw(0); setTimeout(()=>draw(1),650); setTimeout(()=>draw(2),1300);
  setTimeout(()=>{mode='v2';setSeg();render(true);toast('已读取源码：定位到 3 个文件 7 处行号')},2000);
}

/* 复现验证 */
function verify(){
  const vb=$('#vb'); if(!vb) return;
  vb.querySelector('button').disabled=true;
  const t=vb.querySelector('.t'); const steps=['安装工作区构建到模拟器…','进入笔记详情页，连点两次保存…','采集主线程任务与看门狗事件…'];
  steps.forEach((s,i)=>setTimeout(()=>t.innerHTML=`复现中<small>${s}</small>`,i*700));
  setTimeout(()=>{verified=true;render();$('#sec-timeline').scrollIntoView({block:'start'});toast('未再触发 3S / 6S')},2200);
}

/* ---------- 代码抽屉 ---------- */
const KW=/\b(import|from|export|class|interface|struct|private|static|async|await|const|return|if|else|while|try|finally|new|function|void|boolean|string|number)\b/g;
function hlSrc(line){
  if(/^\s*(\/\/|\/?\*)/.test(line)) return `<span class="cm">${esc(line)}</span>`;
  const ci=line.indexOf('//'); let tail='';
  if(ci>=0 && !/'[^']*\/\/[^']*'/.test(line)){ tail=`<span class="cm">${esc(line.slice(ci))}</span>`; line=line.slice(0,ci); }
  return line.split(/('[^']*')/).map(seg=> seg.startsWith("'")&&seg.endsWith("'")&&seg.length>1
    ? `<span class="str">${esc(seg)}</span>`
    : esc(seg).replace(KW,'<span class="kw">$1</span>').replace(/(@\w+)/g,'<span class="ty">$1</span>')).join('')+tail;
}
function openCode(file,a,b){
  const src=SRC[file]; if(!src) return;
  const fix=FIX.v2.find(f=>f.file===file&&f.range[0]<=a&&f.range[1]>=b) || FIX.v2.find(f=>f.file===file);
  const cause = file==='FreezeTestHelper.ets'?3:(fix?fix.cause:1);
  $('#dr-path').textContent=src.path+':'+(a===b?a:a+'-'+b);
  $('#dr-ver').textContent='故障版本 4ca0c7e';
  $('#dr-tabs').innerHTML=Object.keys(SRC).map(f=>`<button class="${f===file?'on':''}" data-act="tab" data-f="${f}">${f}</button>`).join('');
  const hot = file==='FreezeNoteDetailPage.ets'?[48,48]:[a,b];
  const second = file==='FreezeNoteDetailPage.ets'?[86,89]:null;
  $('#dr-body').innerHTML=`<span class="flag">${CAUSE_LABEL[cause]}</span><div class="src">`+src.lines.map((l,i)=>{const n=i+1;
    const cls=n>=hot[0]&&n<=hot[1]?'hl':(second&&n>=second[0]&&n<=second[1]?'hl2':'');
    return `<div class="r ${cls}" id="L${n}"><span class="n">${n}</span><span>${hlSrc(l)||' '}</span></div>`}).join('')+'</div>';
  $('#dr-foot').innerHTML= file==='FreezeNoteDetailPage.ets'
    ? `<span class="pill no">48</span>误判条件<span class="pill part">86–89</span>把误判结果传给 options.sync`
    : file==='FreezeTestHelper.ets' ? `<span class="pill no">26–31</span>while 忙等，对应两次栈顶的 Date.now 取值与循环判定`
    : `<span class="pill no">${hot[0]}–${hot[1]}</span>${hot[0]===44?'sync 为 true 时同步调用':'8 × injectDelay(500) 在主线程顺序执行'}`;
  $('#drawer').classList.add('on');$('#drawer').setAttribute('aria-hidden','false');$('#scrim').classList.add('on');
  const el=$('#L'+Math.max(1,hot[0]-4)); if(el) $('#dr-body').scrollTop=el.offsetTop-12;
}
function closeCode(){$('#drawer').classList.remove('on');$('#drawer').setAttribute('aria-hidden','true');$('#scrim').classList.remove('on')}
function openWorkspaceDiff(){
  $('#dr-path').textContent='工作区改动 · 相对 4ca0c7e';
  $('#dr-ver').textContent='未提交';
  $('#dr-tabs').innerHTML='';
  $('#dr-body').innerHTML='<div style="padding:12px 20px;display:flex;flex-direction:column;gap:16px">'+FIX.v2.map((f,i)=>`<div><div style="display:flex;gap:8px;align-items:center;margin-bottom:6px"><span class="pill blue">M</span><span class="mono">${f.file}</span><span style="color:var(--ink3);font-size:13px">· ${f.t}</span></div><div class="code" style="background:var(--card)">${f.diff.map(([k,n,t])=>`<div class="r ${k==='a'?'add':k==='d'?'del':k==='g'?'gap':'ctx'}"><span class="n">${n??''}</span><span class="s">${k==='a'?'+':k==='d'?'−':''}</span><span>${esc(t)}</span></div>`).join('')}</div></div>`).join('')+'</div>';
  $('#dr-foot').innerHTML='工作区的 2 个文件与报告给出的 3 处修复一致；验证通过后即可提交。';
  $('#drawer').classList.add('on');$('#scrim').classList.add('on');
}

/* ---------- 交互 ---------- */
function setSeg(){ $$('#mode button').forEach(b=>b.classList.toggle('on',b.dataset.m===mode)); }
function setFocus(i,scroll=true){
  const rows=$$('#checks .ck'); if(!rows.length) return;
  focusIdx=Math.max(0,Math.min(rows.length-1,i));
  rows.forEach((r,k)=>r.classList.toggle('focus',k===focusIdx));
  if(scroll) rows[focusIdx].scrollIntoView({block:'nearest'});
}
function toggleCheck(row){
  const id=row.dataset.id; row.classList.toggle('open');
  row.classList.contains('open')?openChecks.add(id):openChecks.delete(id);
  row.querySelector('.ck-h').setAttribute('aria-expanded',row.classList.contains('open'));
}
function reportText(){
  const d=V[mode];
  return `【应用冻屏 · THREAD_BLOCK_6S】${d.title}\n责任领域：应用 · 页面：FreezeNoteDetailPage · com.example.freezetest\n`+
    d.pts.map((p,i)=>`${i+1}. ${p.h.replace(/<[^>]+>/g,'')}${p.loc?'（'+p.loc[0]+':'+p.loc[1]+'）':''}`).join('\n')+
    `\n证据强度：${d.axes.map(a=>a[0].split(' · ')[0]+' '+a[1]).join(' / ')}`;
}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act],[data-loc],#mode button,#dr-close,#scrim'); if(!t) return;
  if(t.matches('#mode button')){ const m=t.dataset.m; if(m===mode) return; mode=m; verified=false; setSeg(); render(true); window.scrollTo({top:0}); return; }
  if(t.id==='dr-close'||t.id==='scrim'){ closeCode(); return; }
  const a=t.dataset.act;
  if(t.dataset.loc && (!a||a==='open')){ e.preventDefault(); const [f,x,y]=t.dataset.loc.split('|'); openCode(f,+x,+y); return; }
  switch(a){
    case 'toggle': toggleCheck(t.closest('.ck')); setFocus(+t.closest('.ck').dataset.i,false); break;
    case 'to-tl': $('#sec-timeline').scrollIntoView({block:'start'}); break;
    case 'upgrade': upgrade(); break;
    case 'verify': verify(); break;
    case 'reverify': verified=false; render(); setTimeout(verify,50); break;
    case 'diffws': openWorkspaceDiff(); break;
    case 'tab': { const f=t.dataset.f; const r=f==='FreezeNoteDetailPage.ets'?[48,48]:f==='NoteRepository.ets'?[64,102]:[26,31]; openCode(f,r[0],r[1]); break; }
    case 'copy-verdict': copy(reportText(),'结论已复制，可直接贴进工单'); break;
    case 'copy-diff': { const f=FIX[mode][+t.dataset.i]; copy(f.diff.filter(d=>d[0]!=='g').map(([k,,x])=>(k==='a'?'+':k==='d'?'-':' ')+x).join('\n'),mode==='v2'?'diff 已复制':'示例代码已复制'); break; }
    case 'copy-raw': { e.preventDefault(); const c=checks(mode).find(c=>c.id===t.dataset.id); copy(c.raw,'原始日志已复制'); break; }
    case 'export': toast('已导出单文件报告 appfreeze-20260605-111510.html'); break;
    case 'load': analyze(t.dataset.m); break;
  }
});
document.addEventListener('keydown',e=>{
  if(e.target.closest('input,textarea')) return;
  if(e.key==='Escape'){ closeCode(); return; }
  if(mode==='empty') return;
  if(e.key==='j'||e.key==='J'){ setFocus(focusIdx+1); e.preventDefault(); }
  else if(e.key==='k'||e.key==='K'){ setFocus(focusIdx<0?0:focusIdx-1); e.preventDefault(); }
  else if(e.key==='Enter' && focusIdx>=0 && !e.target.closest('button,a,summary')){ toggleCheck($$('#checks .ck')[focusIdx]); e.preventDefault(); }
  else if(e.key==='g'||e.key==='G'){ $('#sec-fix').scrollIntoView({block:'start'}); }
});
/* 时间线 hover 显示对应应用日志 */
document.addEventListener('mousemove',e=>{
  const s=e.target.closest('#tl .st'), tip=$('#tip');
  if(!s){ tip.classList.remove('on'); return; }
  tip.innerHTML=`<code>${esc(s.dataset.tip)}</code>`; tip.classList.add('on');
  tip.style.left=Math.min(innerWidth-440,e.clientX+14)+'px'; tip.style.top=(e.clientY+16)+'px';
});
/* 因果链：结论卡里的「展开因果链」联动下方 details */
document.addEventListener('toggle',e=>{
  if(e.target.matches('.verdict details.chain') && e.target.open){ e.target.open=false; const c=$('#chain'); c.open=true; c.scrollIntoView({block:'center'}); }
},true);
/* 左侧目录高亮 */
function spy(){
  const ids=$$('.side a[data-s]').map(a=>a.dataset.s); let cur=ids[0], best=-1e9;
  if(scrollY>40) ids.forEach(id=>{const el=document.getElementById(id); if(!el) return; const t=el.getBoundingClientRect().top; if(t<innerHeight*.35 && t>best){best=t;cur=id;}});
  $$('.side a[data-s]').forEach(a=>a.classList.toggle('on',a.dataset.s===cur));
}
addEventListener('scroll',spy,{passive:true});

render();
</script>
