<style>
/* ===== 令牌：鸿蒙开发者官网（按 developer.huawei.com 文档中心 / 开发 / DevEco Studio 页截图） ===== */
:root{
  --page:#F1F3F5; --paper:#FFFFFF; --fill:#F1F3F5; --fill2:#E8EBEE; --hdr-bg:#EFF1F3;
  --ink:#000000; --ink1:#191919; --ink2:#4D4D4D; --ink3:#808080; --ink4:#A6A6A6;
  --line:#E3E5E8; --accent:#0A59F7; --accent-hover:#0047D6; --soft:#E6EEFE; --soft2:#DCE6FB;
  --btn:#000000; --btn-hover:#2B2B2B;
  --yes:#237A45; --yes-soft:#E4F2E9; --part:#8F5A00; --part-soft:#FBF0DC; --no:#C4322A; --no-soft:#FBE7E5;
  --font:'HarmonyOS Sans SC','HarmonyOS Sans','PingFang SC','Microsoft YaHei','Noto Sans CJK SC',system-ui,sans-serif;
  --mono:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace;
  --r-card:16px; --r-sm:10px;
  --top:40px; --wrap:1440px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-padding-top:calc(var(--top) + 16px)}
body{font-family:var(--font);color:var(--ink1);background:var(--page);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
code,.mono{font-family:var(--mono);font-size:12.5px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ===== 顶部：产品栏（白） ===== */
.top{position:sticky;top:0;z-index:50}
.sub{height:40px;background:var(--paper);display:flex;align-items:center;gap:20px;padding:0 56px;box-shadow:0 1px 0 var(--line)}
.sub .prod{font-weight:700;font-size:14px;white-space:nowrap}
@media (max-width:900px){.sub .prod{display:none}.sub{gap:8px}}
.sub .grow{flex:1}
.seg{display:inline-flex;background:var(--fill);border-radius:999px;padding:2px}
.seg button{height:26px;padding:0 12px;border-radius:999px;font-size:12.5px;color:var(--ink2);white-space:nowrap}
.seg button.on{background:var(--paper);color:var(--ink1);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg-lbl{font-size:12px;color:var(--ink4);margin-right:-10px}

/* ===== 全宽提示条（同官网「对鸿蒙开发还不太熟悉？」） ===== */
.band{height:40px;display:flex;align-items:center;justify-content:center;gap:10px;font-size:13.5px;padding:0 16px;text-align:center}
.band.info{background:var(--soft);color:var(--accent)}
.band.warn{background:var(--part-soft);color:#6B4300}
.band .go{color:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
.band .go:hover{text-decoration:underline}
.band .mono{font-size:12.5px}
.band:empty{display:none}

/* ===== 头图：DevEco Studio 页式的蓝色渐变淡出 ===== */
.hero{background:linear-gradient(180deg,#C9D9FF 0%,#E4ECFD 55%,var(--page) 100%)}
.hero-in{max-width:var(--wrap);margin:0 auto;padding:22px 56px 18px;display:flex;align-items:flex-end;gap:24px;flex-wrap:wrap}
.hero .l{flex:1;min-width:320px}
.eyebrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.pill{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 10px;border-radius:999px;font-size:12px;background:var(--fill);color:var(--ink2);white-space:nowrap}
.hero .pill{background:rgba(255,255,255,.72)}
.pill.yes{background:var(--yes-soft);color:var(--yes)}
.pill.part{background:var(--part-soft);color:var(--part)}
.pill.no{background:var(--no-soft);color:var(--no)}
.hero .pill.no{background:#fff;color:var(--no)}
.pill svg.i{width:13px;height:13px}
h1{font-size:30px;font-weight:700;line-height:1.3;color:var(--ink)}
.meta{margin-top:6px;font-size:13px;color:var(--ink2);display:flex;flex-wrap:wrap;gap:4px 16px}

/* ===== 骨架：文档中心式居中容器，左树 + 正文 ===== */
.wrap{max-width:var(--wrap);margin:0 auto;display:flex;gap:36px;padding:8px 56px 88px}
.side{width:196px;flex:none;position:sticky;top:calc(var(--top) + 20px);align-self:flex-start;max-height:calc(100vh - var(--top) - 40px);overflow:auto;padding-top:6px}
.side h6{font-size:15px;font-weight:700;color:var(--ink1);padding-bottom:12px;margin-bottom:12px;border-bottom:1px solid var(--line)}
.tree{border-left:1px solid #D5D8DC;display:flex;flex-direction:column;margin-bottom:24px}
.tree a{display:flex;align-items:center;gap:8px;min-height:30px;padding:3px 0 3px 18px;margin-left:-1px;border-left:2px solid transparent;color:var(--ink2);text-decoration:none;font-size:13px}
.tree a:hover{color:var(--ink1)}
.tree a.on{border-left-color:var(--ink);color:var(--ink);font-weight:700}
.tree a .n{margin-left:auto;font-size:11.5px;color:var(--ink4);font-family:var(--mono);font-weight:400}
.main{flex:1;min-width:0}
@media (min-width:901px){.wrap{padding-right:104px}}


/* ===== 两栏正文 ===== */
.sec-t{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.sec-t h2{font-size:18px;font-weight:700;color:var(--ink)}
.sec-t .sub2{font-size:13px;color:var(--ink3)}
.card{background:var(--paper);border-radius:var(--r-card);padding:20px}

/* 结论卡 */
.verdict{padding:18px 22px}
.verdict h3{font-size:19px;font-weight:700;line-height:1.45;margin-bottom:8px;color:var(--ink)}
.path{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--ink2);margin-bottom:10px}
.path .sep{color:var(--ink4)}
.pts{list-style:none;display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.pts li{display:grid;grid-template-columns:20px 1fr auto;gap:8px;align-items:start;font-size:14px;color:var(--ink2);line-height:1.55}
.pts li .dot{width:20px;height:20px;border-radius:50%;background:var(--fill);color:var(--ink1);font-size:11px;font-weight:600;display:grid;place-items:center;font-family:var(--mono);margin-top:1px}
.pts li.unk .dot{background:var(--part-soft);color:var(--part)}
.pts li code{background:var(--fill);border-radius:4px;padding:0 4px}
.vmeta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--ink3);margin-left:auto}
.vmeta b{font-weight:600;color:var(--ink1)}

/* 时间线卡 */
.chart{background:var(--paper);border-radius:var(--r-card);padding:14px 16px 12px}
#tl{width:100%;height:auto;display:block;overflow:visible}
#tl text{font-family:var(--mono);font-size:11.5px;fill:var(--ink3)}
#tl .ln{font-family:var(--font);font-size:13px;font-weight:600;fill:var(--ink1)}
#tl .st{cursor:pointer;transition:opacity .15s}
#tl .st:hover{opacity:.7}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink3);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.tip{position:fixed;z-index:90;pointer-events:none;background:#191919;color:#fff;border-radius:10px;padding:8px 10px;font-size:12px;line-height:1.5;max-width:420px;opacity:0;transition:opacity .1s}
.tip.on{opacity:1}
.tip code{font-size:11.5px;color:#C9D7FF}

/* 因果链 */
.chain{padding:18px 22px}
.chain ol{margin:0;padding:0;list-style:none;counter-reset:c;display:flex;flex-direction:column;gap:8px}
.chain li{counter-increment:c;display:grid;grid-template-columns:24px 1fr;gap:8px;font-size:14px;color:var(--ink2)}
.chain li::before{content:counter(c);width:22px;height:22px;border-radius:50%;background:var(--fill);display:grid;place-items:center;font-size:12px;color:var(--ink2);font-family:var(--mono)}

/* 修复 */
.fix{background:var(--paper);border-radius:var(--r-card);padding:18px 22px}
.fix+.fix{margin-top:12px}
.fix-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.fix-h .no{width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;font-size:12px;font-weight:600;display:grid;place-items:center;flex:none}
.fix.dir .fix-h .no{background:var(--part)}
.fix-h h4{font-size:16px;font-weight:700;flex:1;min-width:200px;color:var(--ink)}
.fix p.why{font-size:13px;color:var(--ink3);margin:12px 0 0;line-height:1.6}
.code{background:var(--fill);border-radius:var(--r-sm);overflow:auto;font-family:var(--mono);font-size:12.5px;line-height:20px;padding:8px 0}
.code .r{display:grid;grid-template-columns:22px 1fr;white-space:pre;padding-right:12px}
.code.plain .r{grid-template-columns:1fr;padding-left:16px}
.code .r .s{color:var(--ink4);user-select:none}
.code .r.add{background:var(--yes-soft)}.code .r.add .s{color:var(--yes)}
.code .r.del{background:var(--no-soft)}.code .r.del .s{color:var(--no)}
.code .r.ctx{color:var(--ink2)}.code .r.gap{color:var(--ink4)}

/* 三轴 */
.axes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.ax{background:var(--paper);border-radius:var(--r-card);padding:14px 16px 12px;display:flex;flex-direction:column;gap:4px}
.ax .k{font-size:12px;color:var(--ink3)}
.ax .v{font-size:18px;font-weight:700;display:flex;align-items:center;gap:6px}
.ax .v i{width:8px;height:8px;border-radius:50%;display:inline-block}
.ax .d{font-size:12.5px;color:var(--ink3);line-height:1.5}
.ax.yes .v{color:var(--yes)}.ax.yes .v i{background:var(--yes)}
.ax.part .v{color:var(--part)}.ax.part .v i{background:var(--part)}

/* 证据清单 */
.sum{display:flex;gap:6px;flex-wrap:wrap}
.checks{background:var(--paper);border-radius:var(--r-card);padding:6px}
.ck{border-radius:12px}
.ck+.ck{margin-top:2px}
.ck-h{display:grid;grid-template-columns:22px 1fr auto 16px;gap:10px;align-items:center;width:100%;text-align:left;padding:10px 12px;border-radius:12px}
.ck-h:hover{background:var(--fill)}
.ck-h .ic{width:22px;height:22px;border-radius:50%;display:grid;place-items:center}
.ck-h .ic svg{width:13px;height:13px;stroke-width:2.2}
.ck-h .tt{font-size:14px;font-weight:600;color:var(--ink1)}
.ck-h .one{display:block;font-size:12.5px;color:var(--ink3);margin-top:1px}
.ck-h .chev{color:var(--ink4);transition:transform .15s}
.ck.open .ck-h .chev{transform:rotate(90deg)}
.s-hit .ic{background:var(--no-soft);color:var(--no)}
.s-pass .ic{background:var(--yes-soft);color:var(--yes)}
.s-excl .ic{background:var(--fill);color:var(--ink3)}
.s-miss .ic{background:var(--part-soft);color:var(--part)}
.st-t{font-size:12px;padding:0 8px;height:22px;border-radius:999px;display:inline-flex;align-items:center}
.s-hit .st-t{background:var(--no-soft);color:var(--no)}
.s-pass .st-t{background:var(--yes-soft);color:var(--yes)}
.s-excl .st-t{background:var(--fill);color:var(--ink3)}
.s-miss .st-t{background:var(--part-soft);color:var(--part)}
.ck-b{display:none;padding:2px 14px 14px 44px}
.ck.open .ck-b{display:block}
.ck-b ul{list-style:none;display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
.ck-b li{font-size:13px;color:var(--ink2);padding-left:12px;position:relative}
.ck-b li::before{content:'';position:absolute;left:0;top:9px;width:4px;height:4px;border-radius:50%;background:var(--ink3)}
.raw summary{font-size:12.5px;color:var(--accent);cursor:pointer;list-style:none;display:inline-flex;align-items:center;gap:4px}
.raw summary::-webkit-details-marker{display:none}
.raw pre{margin-top:8px;background:var(--fill);border-radius:var(--r-sm);padding:10px 12px;font-family:var(--mono);font-size:12px;line-height:1.6;white-space:pre-wrap;word-break:break-all;color:var(--ink2);position:relative}
.raw pre .cp{position:absolute;top:6px;right:6px;background:var(--paper)}
.frames{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:12.5px;margin-bottom:10px}
.frames .f{font-family:var(--mono);color:var(--ink3)}
.frames .e{color:var(--ink2)}

/* 排除项 & 线程 */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.xchip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 14px;border-radius:999px;background:var(--paper);font-size:13px;color:var(--ink2);cursor:default}
.xchip svg{width:12px;height:12px;color:var(--ink4);stroke-width:2.2}

/* 右侧悬浮工具条（同官网） */

/* 代码面板 */

.fade{animation:fade .35s ease}
@keyframes fade{from{opacity:.2;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (max-width:900px){.side{display:none}.wrap{padding:8px 16px 60px}.hero-in{padding:18px 16px 14px}.sub{padding:0 16px;gap:12px}.seg-lbl{display:none}.seg button{padding:0 8px;font-size:12px}
  h1{font-size:24px}.axes{grid-template-columns:1fr}.pts li{grid-template-columns:20px 1fr}.pts li>span:last-child{grid-column:2}.vmeta{margin-left:0}.band{height:auto;padding:8px 16px;flex-wrap:wrap}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.stack{display:flex;flex-direction:column;gap:28px;max-width:1040px}
.sec-t .grow{flex:1}
.loc{font-family:var(--mono);font-size:12.5px;color:var(--ink3);white-space:nowrap}
.vmeta{margin-left:0}
.fixnote{font-size:13px;color:var(--ink3);margin-top:12px;line-height:1.6}
.tt2{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:4px}
.tt2 th{text-align:left;font-weight:600;color:var(--ink3);padding:6px 8px;border-bottom:1px solid var(--line)}
.tt2 td{padding:6px 8px;border-bottom:1px solid var(--line);color:var(--ink2);vertical-align:top}
.tt2 td.mono{font-size:12px}
.ck-b .chips{margin-bottom:10px}
</style>
</head>

function fixCard(f,i){
  const rows = f.dir
    ? f.code.map(t=>`<div class="r ctx"><span>${esc(t)||' '}</span></div>`).join('')
    : f.diff.map(([k,t])=>`<div class="r ${k==='a'?'add':k==='d'?'del':'ctx'}"><span class="s">${k==='a'?'+':k==='d'?'−':''}</span><span>${esc(t)||' '}</span></div>`).join('');
  return `<div class="fix ${f.dir?'dir':''}">
    <div class="fix-h"><span class="no">${i+1}</span><h4>${f.t}</h4>
      ${f.dir?`<span class="pill part">通用方向</span>`:`<span class="loc">${f.loc}</span>`}</div>
    <div class="code ${f.dir?'plain':''}">${rows}</div>
    <p class="why">${f.why}</p>
  </div>`;
}

  for(let s=2;s<=11;s++){const x=tx(s);g+=`<line x1="${x}" y1="6" x2="${x}" y2="${bottom-6}" stroke="rgba(10,89,247,.10)"/><text x="${x}" y="${bottom+10}" text-anchor="middle">:${String(s).padStart(2,'0')}</text>`;}
  [['点击',30],['主线程',78],['看门狗',128],['队列',170]].forEach(([n,y])=>g+=`<text class="ln" x="0" y="${y+4}">${n}</text>`);
  g+=`<circle cx="${tx(2.631)}" cy="30" r="6" fill="#0A59F7"/><text x="${tx(2.631)-10}" y="18" text-anchor="end">① 02.631</text>`;
  g+=`<circle cx="${tx(3.418)}" cy="30" r="6" fill="#0A59F7"/><text x="${tx(3.418)+10}" y="18">② 03.418 · 排队至 06.639</text>`;
  g+=`<path d="M${tx(3.418)} 36 C ${tx(4.6)} 54, ${tx(5.8)} 54, ${tx(6.639)} 62" fill="none" stroke="#0A59F7" stroke-dasharray="4 3" stroke-width="1.2"/>`;
  const round=(arr,r)=>arr.map((st,i)=>{const s=parseFloat(st[0]);const e=i<arr.length-1?parseFloat(arr[i+1][0]):(r===1?6.639:10.313);
    const over=r===2 && s>=9.639; const x=tx(s), w=Math.max(2,tx(e)-x-1.5);
    return `<rect class="st" data-tip="11:15:${st[0]} saveNoteSync: ${st[1]}..." x="${x}" y="66" width="${w}" height="24" rx="3" fill="${over?'#F6D5D2':'#F3E3C6'}"/>`}).join('');
  g+=round(ROUND1,1)+round(ROUND2,2);
  g+=`<text x="${(tx(2.632)+tx(6.639))/2}" y="104" text-anchor="middle" fill="#8F5A00">MMITask #1 · 4.0s</text>`;
  g+=`<text x="${(tx(6.639)+tx(10.313))/2}" y="104" text-anchor="middle" fill="#8F5A00">MMITask #2 · 至上报时仍在执行</text>`;
  g+=`<line x1="${tx(7.142)}" y1="114" x2="${tx(7.142)}" y2="142" stroke="#8F5A00" stroke-width="2"/><text x="${tx(7.142)+6}" y="126" fill="#8F5A00">3S 抓栈 07.142</text><text x="${tx(7.142)+6}" y="139">栈顶 Jeqz</text>`;
  g+=`<line x1="${tx(10.313)}" y1="114" x2="${tx(10.313)}" y2="142" stroke="#C4322A" stroke-width="2"/><text x="${tx(10.313)-6}" y="126" fill="#C4322A" text-anchor="end">6S 上报 10.313</text><text x="${tx(10.313)-6}" y="139" text-anchor="end">栈顶 Ldobjbyname</text>`;
  g+=`<polyline points="${tx(7.127)},180 ${tx(10.128)},160" fill="none" stroke="#C4322A" stroke-width="2"/><circle cx="${tx(7.127)}" cy="180" r="3.5" fill="#C4322A"/><circle cx="${tx(10.128)}" cy="160" r="3.5" fill="#C4322A"/><text x="${tx(7.127)-8}" y="184" text-anchor="end">62 个任务</text><text x="${tx(10.128)+8}" y="160">115</text>`;
  svg.innerHTML=g;
}

/* ---------- 交互：切换版本、展开证据、目录高亮、时间线悬停看原日志 ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('#mode button');
  if(b){ if(b.dataset.m!==mode){ mode=b.dataset.m; $$('#mode button').forEach(x=>x.classList.toggle('on',x===b)); render(true); window.scrollTo({top:0}); } return; }
  const h=e.target.closest('.ck-h');
  if(h){ const row=h.closest('.ck'); row.classList.toggle('open'); const o=row.classList.contains('open');
    o?openChecks.add(row.dataset.id):openChecks.delete(row.dataset.id); h.setAttribute('aria-expanded',o); }
});
document.addEventListener('mousemove',e=>{
  const s=e.target.closest('#tl .st'), tip=$('#tip');
  if(!s){ tip.classList.remove('on'); return; }
  tip.innerHTML=`<code>${esc(s.dataset.tip)}</code>`; tip.classList.add('on');
  tip.style.left=Math.min(innerWidth-440,e.clientX+14)+'px'; tip.style.top=(e.clientY+16)+'px';
});
function spy(){
  const ids=$$('.side a[data-s]').map(a=>a.dataset.s); let cur=ids[0], best=-1e9;
  if(scrollY>40) ids.forEach(id=>{const el=document.getElementById(id); if(!el) return; const t=el.getBoundingClientRect().top; if(t<innerHeight*.35 && t>best){best=t;cur=id;}});
  $$('.side a[data-s]').forEach(a=>a.classList.toggle('on',a.dataset.s===cur));
}
addEventListener('scroll',spy,{passive:true});

render();
</script>
