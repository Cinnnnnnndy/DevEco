const $ = s=>document.querySelector(s), $$ = s=>[...document.querySelectorAll(s)];
const esc = s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const ic = (id,cls='')=>`<svg class="i ${cls}"><use href="#i-${id}"/></svg>`;
let mode=location.hash==='#v1'?'v1':'v2';
const openChecks=new Set([3]);

      <p class="axnote"><b>线程状态：</b>${esc(d.state)}</p>

/* 极简 ArkTS 高亮：注释 / 字符串 / 关键字 */
const KW=/\b(import|from|export|class|interface|struct|private|static|async|await|const|let|return|if|else|while|try|finally|new|function|void|boolean|string|number|true|false|this)\b/g;
function hl(line){
  const ci=line.indexOf('//');
  let code=ci>=0?line.slice(0,ci):line, cm=ci>=0?line.slice(ci):'';
  code=code.split(/('[^']*')/).map(seg=>seg.length>1&&seg[0]==="'"&&seg.endsWith("'")?`<span class="str">${esc(seg)}</span>`:esc(seg).replace(KW,'<span class="kw">$1</span>').replace(/(@\w+)/g,'<span class="ty">$1</span>')).join('');
  return code+(cm?`<span class="cm">${esc(cm)}</span>`:'');
}

function fixCard(f,i){
  const rows = f.dir
    ? f.code.map(t=>`<div class="r ctx"><span>${hl(t)||' '}</span></div>`).join('')
    : f.diff.map(([k,t])=>`<div class="r ${k==='a'?'add':k==='d'?'del':'ctx'}"><span class="s">${k==='a'?'+':k==='d'?'−':''}</span><span>${hl(t)||' '}</span></div>`).join('');
  return `<div class="fix ${f.dir?'dir':''}">
    <div class="fix-h"><span class="no">${i+1}</span><h4>${f.t}</h4>
      <button class="copy" type="button" title="复制" aria-label="复制">${ic('copy')}</button></div>
    ${f.loc?`<div class="floc">${f.loc}</div>`:''}
    <div class="code ${f.dir?'plain':''}">${rows}</div>
  </div>`;
}

function ckRow(c,i,s,one){
  const lbl={hit:'命中',pass:'通过',excl:'已排除',miss:'缺数据'}[s];
  const open=openChecks.has(i);
  const body=c.items.map(it=>{
    const L=it.label?`<div class="lbl">${esc(it.label)}</div>`:'';
    if(it.k==='p') return L+`<p>${esc(it.t)}</p>`;
    if(it.k==='ul') return L+`<ul>${it.t.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
    if(it.k==='table') return L+`<div class="tblw"><table class="tt2"><thead><tr>${it.t[0].map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${it.t.slice(1).map(r=>`<tr>${r.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    if(it.k==='raw') return `<details class="raw"><summary>${ic('chev')}${esc(it.label)}<button class="copy" type="button" title="复制" aria-label="复制">${ic('copy')}</button></summary><pre><span class="txt">${it.t.split('\n').map(l=>{const m=l.match(/^(.*?)(\s+←.*)$/); return m?esc(m[1])+`<span class="ann">  ${esc(m[2].trim())}</span>`:esc(l);}).join('\n')}</span></pre></details>`;
    return '';
  }).join('');
  return `<div class="ck s-${s} ${open?'open':''}" data-i="${i}">
    <button class="ck-h" aria-expanded="${open}"><span class="st-t">${lbl}</span>
      <span><span class="tt">${i+1}. ${esc(c.t)}</span><span class="one">${esc(one)}</span></span>${ic('chev','chev')}</button>
    <div class="ck-b">${body}</div></div>`;
}

/* ---------- 时间线：数据全部来自原报告的应用日志、任务队列与抓栈时间 ---------- */
const X0=80, PX=100;
const tx=s=>X0+(parseFloat(s)-2)*PX;
function drawTimeline(){
  const svg=$('#tl'); if(!svg) return;
  const Y={click:34,main:86,dog:136,queue:180}, axisY=214; let g='<g id="hl"></g>';
  for(let s=2;s<=11;s++){const x=tx(s);g+=`<line x1="${x}" y1="10" x2="${x}" y2="${axisY-12}" stroke="rgba(0,0,0,.06)"/><text x="${x}" y="${axisY}" text-anchor="middle">:${String(s).padStart(2,'0')}</text>`;}
  [['点击',Y.click],['主线程',Y.main],['看门狗',Y.dog],['任务队列',Y.queue]].forEach(([n,y])=>g+=`<text class="ln" x="0" y="${y+4}">${n}</text>`);
  // 点击：第 2 次点击到被分发之间画成水平「排队」条，终点对齐第 2 轮开始
  g+=`<rect x="${tx(3.418)}" y="${Y.click-6}" width="${tx(6.639)-tx(3.418)}" height="12" rx="6" fill="rgba(10,89,247,.10)"/>`;
  g+=`<text x="${(tx(3.418)+tx(6.639))/2}" y="${Y.click+4}" text-anchor="middle" fill="#0A59F7">排队 3.2s</text>`;
  g+=`<line x1="${tx(6.639)}" y1="${Y.click+6}" x2="${tx(6.639)}" y2="${Y.main-12}" stroke="#0A59F7" stroke-dasharray="3 3"/>`;
  g+=`<line x1="${tx(2.631)}" y1="${Y.click+6}" x2="${tx(2.631)}" y2="${Y.main-12}" stroke="#0A59F7" stroke-dasharray="3 3"/>`;
  g+=`<circle cx="${tx(2.631)}" cy="${Y.click}" r="6" fill="#0A59F7"/><text x="${tx(2.631)-10}" y="${Y.click+4}" text-anchor="end">02.631</text>`;
  g+=`<circle cx="${tx(3.418)}" cy="${Y.click}" r="6" fill="#0A59F7"/>`;
  g+=`<text x="${tx(3.418)}" y="${Y.click-12}" text-anchor="middle">03.418</text>`;
  // 主线程：两轮保存，每段对应一条应用日志
  const round=(arr,r)=>arr.map((st,i)=>{const s=parseFloat(st[0]);const e=i<arr.length-1?parseFloat(arr[i+1][0]):(r===1?6.639:10.313);
    const over=r===2 && s>=9.639; const x=tx(s), w=Math.max(2,tx(e)-x-1.5);
    return `<rect class="st" data-tip="11:15:${st[0]} saveNoteSync: ${st[1]}..." x="${x}" y="${Y.main-12}" width="${w}" height="24" rx="3" fill="${over?'#F6D5D2':'#F3E3C6'}"/>`}).join('');
  g+=round(ROUND1,1)+round(ROUND2,2);
  g+=`<rect x="${tx(10.313)}" y="${Y.main-12}" width="${tx(10.8)-tx(10.313)}" height="24" rx="3" fill="none" stroke="#C4322A" stroke-dasharray="3 3"/>`;
  g+=`<text x="${(tx(2.632)+tx(6.639))/2}" y="${Y.main+28}" text-anchor="middle" fill="#8F5A00">第 1 轮保存 · 4.0s</text>`;
  g+=`<text x="${(tx(6.639)+tx(10.313))/2}" y="${Y.main+28}" text-anchor="middle" fill="#8F5A00">第 2 轮保存 · 至 10.313 上报仍在执行</text>`;
  // 看门狗：两次抓栈
  g+=`<line x1="${tx(7.142)}" y1="${Y.dog-14}" x2="${tx(7.142)}" y2="${Y.dog+16}" stroke="#8F5A00" stroke-width="2"/><text x="${tx(7.142)+8}" y="${Y.dog-2}" fill="#8F5A00">3S 抓栈 07.142</text><text x="${tx(7.142)+8}" y="${Y.dog+12}">栈顶 Jeqz</text>`;
  g+=`<line x1="${tx(10.14)}" y1="${Y.dog-14}" x2="${tx(10.14)}" y2="${Y.dog+16}" stroke="#C4322A" stroke-width="2"/><text x="${tx(10.14)-8}" y="${Y.dog-2}" fill="#C4322A" text-anchor="end">6S 抓栈 10.140</text><text x="${tx(10.14)-8}" y="${Y.dog+12}" text-anchor="end">栈顶 Ldobjbyname</text>`;
  // 任务队列：只有两次采样，画两根比例柱，不连线
  const base=Y.queue+14, hq=n=>Math.round(n/115*26);
  [[7.127,62],[10.128,115]].forEach(([t,n])=>{const x=tx(t);
    g+=`<rect x="${x-5}" y="${base-hq(n)}" width="10" height="${hq(n)}" rx="2" fill="#C4322A" opacity=".75"/><text x="${x+10}" y="${base-hq(n)+10}" fill="#C4322A">${n}</text>`;});
  g+=`<text x="${tx(7.127)-12}" y="${base-2}" text-anchor="end">总任务数</text>`;
  svg.innerHTML=g;
}

/* ---------- 时间线 ⇄ 根本原因 联动 ---------- */
function highlight(i){
  const hl=$('#hl'); if(!hl) return;
  $$('#story li').forEach(li=>li.classList.toggle('on',+li.dataset.i===i));
  const step=i==null?null:V[mode].chain[i]; const r=step&&step[2];
  hl.innerHTML=r?r.map(([a,b])=>`<rect x="${tx(a)-4}" y="6" width="${Math.max(8,tx(b)-tx(a)+8)}" height="196" rx="4" fill="rgba(10,89,247,.10)"/>`).join(''):'';
}
document.addEventListener('mouseover',e=>{const li=e.target.closest('#story li'); if(li && !li.classList.contains('off')) highlight(+li.dataset.i);});
document.addEventListener('mouseout',e=>{if(e.target.closest('#story li') && !e.relatedTarget?.closest?.('#story li')) highlight(null);});
document.addEventListener('mousemove',e=>{
  const svg=e.target.closest('#tl'); if(!svg) return;
  const pt=svg.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY; const x=pt.matrixTransform(svg.getScreenCTM().inverse()).x;
  const t=(x-X0)/PX+2; let best=null, bw=1e9;
  V[mode].chain.forEach((c,i)=>(c[2]||[]).forEach(([a,b])=>{const pad=a===b?.12:.06; if(t>=a-pad&&t<=b+pad&&(b-a)<bw){bw=b-a;best=i;}}));
  highlight(best);
});
document.addEventListener('pointerout',e=>{if(e.target.closest&&e.target.closest('#tl')&&!e.relatedTarget?.closest?.('#tl')) highlight(null);});

/* ---------- 交互：切换版本、展开证据、目录高亮、时间线悬停看原日志 ---------- */
document.addEventListener('click',e=>{
  const cp=e.target.closest('.copy');
  if(cp){
    e.preventDefault(); e.stopPropagation();
    const det=cp.closest('details'), fix=cp.closest('.fix');
    const text = det ? (()=>{const c=det.querySelector('.txt').cloneNode(true); c.querySelectorAll('.ann').forEach(a=>a.remove()); return c.textContent;})()
      : [...fix.querySelectorAll('.code .r')].map(r=>{const sg=r.querySelector('.s'); const t=r.lastElementChild.textContent; return (sg?(sg.textContent==='−'?'-':sg.textContent||' '):'')+t;}).join('\n');
    const done=()=>{cp.classList.add('done'); cp.title='已复制'; cp.innerHTML=ic('check'); clearTimeout(cp._t); cp._t=setTimeout(()=>{cp.classList.remove('done'); cp.title='复制'; cp.innerHTML=ic('copy');},1600);};
    if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(text).then(done,()=>fallback(text,done));} else fallback(text,done);
    return;
  }
  const h=e.target.closest('.ck-h');
  if(h){ const row=h.closest('.ck'); row.classList.toggle('open'); const o=row.classList.contains('open');
    o?openChecks.add(+row.dataset.i):openChecks.delete(+row.dataset.i); h.setAttribute('aria-expanded',o); }
});
document.addEventListener('mousemove',e=>{
  const s=e.target.closest('#tl .st'), tip=$('#tip');
  if(!s){ tip.classList.remove('on'); return; }
  tip.innerHTML=`<code>${esc(s.dataset.tip)}</code>`; tip.classList.add('on');
  tip.style.left=Math.min(innerWidth-440,e.clientX+14)+'px'; tip.style.top=(e.clientY+16)+'px';
});
function fallback(text,done){const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(_){}ta.remove();done();}
function spy(){
  const ids=$$('.side a[data-s]').map(a=>a.dataset.s); let cur=ids[0], best=-1e9;
  if(scrollY>40) ids.forEach(id=>{const el=document.getElementById(id); if(!el) return; const t=el.getBoundingClientRect().top; if(t<innerHeight*.35 && t>best){best=t;cur=id;}});
  $$('.side a[data-s]').forEach(a=>a.classList.toggle('on',a.dataset.s===cur));
}
addEventListener('scroll',spy,{passive:true});
addEventListener('hashchange',()=>{mode=location.hash==='#v1'?'v1':'v2'; render(true); scrollTo({top:0});});

render();
