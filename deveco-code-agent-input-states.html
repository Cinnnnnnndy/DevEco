<script>
/* 旧锚点 #s1…#s9（九个场景）、#foot（来源与已知局限）→ 新页对应位置 */
(function(){
  var h=location.hash.replace('#',''),m=/^s([1-9])$/.exec(h);
  var to=m?'in-'+m[1]:(h==='foot'?'input-refs':'input');
  location.replace('deveco-intui-kit/docs/ai-system.html#'+to);
})();
</script>

<p>《DevEco Code Agent 输入框 · 场景与状态说明》已并入 <a href="deveco-intui-kit/docs/ai-system.html#input">DevEco 智能 · 视觉与交互 → 输入框</a>。九个场景、设计依据与已知局限都在那一章。</p>
</body>
