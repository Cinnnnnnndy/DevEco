<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>文件窗口 · 对照</title>
  <link rel="stylesheet" href="../tokens/index.css">
  <link rel="stylesheet" href="compare.css">
</head>
<body>
  <main class="wrap">
    <p class="nav"><a href="index.html">对照索引</a>
<a href="file-window.html">文件窗口</a>
<a href="menu.html">菜单</a>
<a href="tree.html">树</a>
<a href="tabs.html">页签</a>
<a href="tooltip.html">提示</a>
<a href="tool-menu.html">工具菜单</a>
<a href="../docs/index.html">组件文档</a></p>
    <h1>文件窗口</h1>
    <p class="note">左为鸿蒙电脑文件管理帧。右用 WindowFrame、Toolbar、SearchField、NavList、Chip、StatusBar 拼。图标字体仍缺，所以右侧工具栏只有稿上能读出的「新建 / 查看 / 预览」。</p>
    <div class="pair">
      <figure>
        <img src="frames/file-window.jpg" alt="Pixso 预览">
        <figcaption>Pixso 预览</figcaption>
      </figure>
      <div>
        <div id="stage" class="rebuild" data-system="pc-mac" data-theme="light">
          <section class="de-window" style="min-height:380px">
        <header class="de-titlebar"><span class="de-titlebar__mark"></span><span class="de-titlebar__title">主页</span><span class="de-titlebar__spacer"></span>
          <div class="de-window__controls" aria-hidden="true"><button type="button" tabindex="-1">□</button><button type="button" tabindex="-1">–</button><button type="button" tabindex="-1">×</button></div></header>
        <div class="de-toolbar"><button type="button" class="de-button de-button--toolbar de-button--m"><span class="de-button__label">新建</span></button>
          <button type="button" class="de-button de-button--toolbar de-button--m"><span class="de-button__label">查看</span></button>
          <span class="de-toolbar__spacer"></span>
          <button type="button" class="de-button de-button--toolbar de-button--m"><span class="de-button__label">预览</span></button></div>
        <div class="de-toolbar"><span class="de-crumb"><strong>主页</strong></span><span class="de-toolbar__spacer"></span>
          <label class="de-search" style="width:180px"><input placeholder="搜索..." aria-label="搜索"></label></div>
        <div class="de-window__body">
          <nav class="de-nav" aria-label="位置"><button type="button" class="de-nav__item" aria-current="page">主页</button>
            <div class="de-nav__label">快速访问</div>
            <button type="button" class="de-nav__item">桌面</button>
            <button type="button" class="de-nav__item">文档</button>
            <button type="button" class="de-nav__item">下载</button></nav>
          <div class="de-main"><div class="de-pad"><div class="de-chip-row">
            <button type="button" class="de-chip" aria-pressed="true">全部</button>
            <button type="button" class="de-chip">图片</button>
            <button type="button" class="de-chip">文档</button></div>
            <p class="de-empty">在打开或创建某些文件后，将会在此处显示最近文件</p></div>
            <footer class="de-statusbar"><span>共 0 个文件，6 个文件夹</span></footer></div>
        </div>
      </section>
        </div>
        <p class="note">右：本库组件，不是截图。</p>
      </div>
    </div>
  </main>
</body>
</html>
