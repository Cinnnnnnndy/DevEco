    <h1>工具菜单</h1>
    <p class="note">左为 Studio 工具菜单。底约 #2C2C30，当前项约 #2E436E。右用 ToolMenu。公共名不用 IntelliJ。</p>
    <div class="pair">
      <figure>
        <img src="frames/tool-menu.jpg" alt="Pixso 预览">
        <figcaption>Pixso 预览</figcaption>
      </figure>
      <div>
        <div id="stage" class="rebuild" data-system="pc-mac" data-theme="light">
          <ul class="de-menu de-tool-menu" role="menu">
        <li role="none"><button type="button" class="de-menu__item" role="menuitem" aria-current="true"><span class="de-menu__label">提交</span><span class="de-menu__shortcut">⌘0</span></button></li>
        <li role="none"><button type="button" class="de-menu__item" role="menuitem"><span class="de-menu__label">Bookmarks</span><span class="de-menu__shortcut">⌘2</span></button></li>
        <li role="none"><button type="button" class="de-menu__item" role="menuitem"><span class="de-menu__label">查找</span><span class="de-menu__shortcut">⌘3</span></button></li>
        <li role="none"><button type="button" class="de-menu__item" role="menuitem"><span class="de-menu__label">运行</span><span class="de-menu__shortcut">⌘4</span></button></li>
        <li role="none"><button type="button" class="de-menu__item" role="menuitem"><span class="de-menu__label">调试</span><span class="de-menu__shortcut">⌘5</span></button></li>
      </ul>
        </div>
        <p class="note">右：本库组件，不是截图。</p>
      </div>
    </div>
