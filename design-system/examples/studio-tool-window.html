<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StudioToolWindow 示例 · DevEco</title>
  <link rel="stylesheet" href="../tokens/index.css?v=4">
  <link rel="stylesheet" href="../docs/docs.css?v=4">
</head>
<body>
  <main class="content" style="max-width:1100px;margin:0 auto">
    <p class="kicker"><a href="../docs/index.html">组件索引</a> · 工作流 C</p>
    <h1>StudioToolWindow</h1>
    <p class="desc">Studio 工具条加工具菜单。编辑器画布的语法色没有印出，中间留空，并标成缺口，不填一套假的代码配色。</p>
    <div class="demo-bar">
      <button type="button" data-set-system="harmony">鸿蒙</button>
      <button type="button" data-set-system="pc-mac">PC / Mac</button>
      <button type="button" data-set-theme="dark">深色</button>
      <button type="button" data-set-theme="light">浅色</button>
    </div>
    <div id="stage" class="stage" data-system="harmony" data-theme="dark">
      <section class="de-window de-studio" style="min-height:420px">
        <nav class="de-stripe" aria-label="工具">
          <button type="button" class="de-icon-button de-icon-button--m" aria-label="构建">
            <svg viewBox="0 0 16 16" width="16" height="16"><path d="M9 7 4.2 11.8M6 4.5l2.2-2.2 3.5 3.5L9.5 8" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          </button>
          <button type="button" class="de-icon-button de-icon-button--m" aria-label="运行" aria-pressed="true">
            <svg viewBox="0 0 16 16" width="16" height="16"><path d="M5 3.5v9l7-4.5-7-4.5Z" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
          </button>
          <button type="button" class="de-icon-button de-icon-button--m" aria-label="调试">
            <svg viewBox="0 0 16 16" width="16" height="16"><circle cx="8" cy="8" r="3" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
          </button>
          <button type="button" class="de-icon-button de-icon-button--m" aria-label="终端">
            <svg viewBox="0 0 16 16" width="16" height="16"><path d="M4.5 6.5 7 8.2 4.5 10M8.2 10.2H11" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          </button>
        </nav>
        <div class="de-main">
          <div class="de-pad" style="flex-direction:row;align-items:flex-start;gap:16px">
            <ul class="de-menu de-tool-menu" role="menu">
        <li role="none"><button type="button" role="menuitem" class="de-menu__item" aria-current="true"><span class="de-menu__icon" title="采样"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><title>采样</title><path d="M2.5 8h5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><circle cx="10.2" cy="8" r="2.1" fill="none" stroke="currentColor" stroke-width="1.3"/></svg></span><span class="de-menu__label">提交</span><span class="de-menu__shortcut">⌘0</span></button></li>
        <li role="none"><button type="button" role="menuitem" class="de-menu__item"><span class="de-menu__icon" title="采样"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><title>采样</title><path d="M4.5 2.5h7v11L8 11.2 4.5 13.5Z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg></span><span class="de-menu__label">Bookmarks</span><span class="de-menu__shortcut">⌘2</span></button></li>
        <li role="none"><button type="button" role="menuitem" class="de-menu__item"><span class="de-menu__icon" title="采样"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><title>采样</title><circle cx="7" cy="7" r="3.2" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M9.4 9.4 12.2 12.2" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></span><span class="de-menu__label">查找</span><span class="de-menu__shortcut">⌘3</span></button></li>
        <li role="none"><button type="button" role="menuitem" class="de-menu__item"><span class="de-menu__icon" title="采样"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><title>采样</title><path d="M5.5 3.8v8.4l6.2-4.2-6.2-4.2Z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg></span><span class="de-menu__label">运行</span><span class="de-menu__shortcut">⌘4</span></button></li>
        <li role="none"><button type="button" role="menuitem" class="de-menu__item"><span class="de-menu__icon" title="采样"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><title>采样</title><circle cx="8" cy="8.2" r="2.6" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M8 5.6V3.4M5.6 6.2 4 4.8M10.4 6.2 12 4.8M5.2 10.2 3.6 11.6M10.8 10.2 12.4 11.6" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg></span><span class="de-menu__label">调试</span><span class="de-menu__shortcut">⌘5</span></button></li>
        <li role="none"><button type="button" role="menuitem" class="de-menu__item"><span class="de-menu__icon" title="采样"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><title>采样</title><path d="M11.2 6.2A3.6 3.6 0 1 0 12 9.6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M11 4.2v2.4h2.4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="de-menu__label">API Change Assistant</span></button></li>
        <li role="none"><button type="button" role="menuitem" class="de-menu__item"><span class="de-menu__icon" title="采样"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><title>采样</title><path d="M4.2 2h5L12.2 5v8.8H4.2Z" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M9 2.2V5h3" fill="none" stroke="currentColor" stroke-width="1.3"/></svg></span><span class="de-menu__label">API参考</span></button></li>
      </ul>
            <article class="de-gap">
              <strong>缺口 · 编辑器画布</strong>
              <p>语法色和编辑器底没有从预览读出。不在这页发明一套代码高亮。</p>
            </article>
          </div>
        </div>
      </section>
    </div>
    <h2>复用了哪些组件</h2>
    <p>ToolStripe、IconButton、ToolMenu。没有使用别的系统的外壳、渐变、光标点阵或播放条。</p>
    <p class="note">对应源码：<code>patterns/studio-tool-window.tsx</code>。</p>
  </main>
  <script src="../docs/docs.js"></script>
</body>
</html>
