<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='32' y2='32' gradientUnits='userSpaceOnUse'%3E%3Cstop stop-color='%232C8DDD'/%3E%3Cstop offset='1' stop-color='%233357AC'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='7' fill='url(%23g)'/%3E%3Ctext x='16' y='22.5' font-family='Arial,Helvetica,sans-serif' font-size='13' font-weight='700' fill='white' text-anchor='middle'%3EDE%3C/text%3E%3C/svg%3E">
<title>鸿蒙开发工具体验</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="deveco-intui-kit/src/tokens.css">
<link rel="stylesheet" href="site/launcher.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-moon" viewBox="0 0 16 16"><path d="M13.5 9.5A5.5 5.5 0 0 1 6.5 2.5a5.5 5.5 0 1 0 7 7Z" stroke="currentColor" stroke-linejoin="round" fill="none"/></symbol>
<symbol id="i-sun" viewBox="0 0 16 16"><circle cx="8" cy="8" r="3" stroke="currentColor" fill="none"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4" stroke="currentColor" stroke-linecap="round"/></symbol>
<symbol id="i-search" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5" stroke="currentColor" fill="none"/><path d="M13.5 13.5L10.4 10.4" stroke="currentColor" stroke-linecap="round"/></symbol>
<symbol id="i-ext" viewBox="0 0 16 16"><path d="M6.5 3.5H3.5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V9.5M9.5 2.5h4v4M13.5 2.5 7.5 8.5" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" fill="none"/></symbol>
<!-- 分类导航图标 -->
<symbol id="i-cat-all" viewBox="0 0 16 16"><rect x="2" y="2" width="5" height="5" rx="1" stroke="currentColor" fill="none"/><rect x="9" y="2" width="5" height="5" rx="1" stroke="currentColor" fill="none"/><rect x="2" y="9" width="5" height="5" rx="1" stroke="currentColor" fill="none"/><rect x="9" y="9" width="5" height="5" rx="1" stroke="currentColor" fill="none"/></symbol>
<symbol id="i-cat-basics" viewBox="0 0 16 16"><path d="M2 4.5h6M11 4.5h3M2 11.5h3M8 11.5h6" stroke="currentColor" stroke-linecap="round"/><circle cx="9.5" cy="4.5" r="1.5" stroke="currentColor" fill="none"/><circle cx="6.5" cy="11.5" r="1.5" stroke="currentColor" fill="none"/></symbol>
<symbol id="i-cat-ai" viewBox="0 0 16 16"><path d="M8 1.5l1.6 4.4L14 7.5l-4.4 1.6L8 13.5 6.4 9.1 2 7.5l4.4-1.6z" stroke="currentColor" stroke-linejoin="round" fill="none"/></symbol>
<symbol id="i-cat-harmony" viewBox="0 0 16 16"><rect x="1.5" y="3" width="8" height="10" rx="1.5" stroke="currentColor" fill="none"/><rect x="11" y="6" width="3.5" height="7" rx="1" stroke="currentColor" fill="none"/><path d="M4.5 11h2" stroke="currentColor" stroke-linecap="round"/></symbol>
<symbol id="i-cat-window" viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="10" rx="1.5" stroke="currentColor" fill="none"/><path d="M2 6h12" stroke="currentColor"/><circle cx="4" cy="4.5" r=".55" fill="currentColor"/><circle cx="5.7" cy="4.5" r=".55" fill="currentColor"/></symbol>
<symbol id="i-cat-chip" viewBox="0 0 16 16"><rect x="3" y="3" width="7" height="7" rx="1.5" stroke="currentColor" fill="none"/><rect x="7.5" y="7.5" width="6" height="6" rx="1.5" stroke="currentColor" fill="none"/></symbol>
<symbol id="i-cat-chart" viewBox="0 0 16 16"><path d="M2.5 13.5v-4M6.5 13.5v-8M10.5 13.5v-5.5M14 13.5V4" stroke="currentColor" stroke-linecap="round"/><path d="M2 13.5h12.5" stroke="currentColor" stroke-linecap="round"/></symbol>
<symbol id="i-cat-book" viewBox="0 0 16 16"><path d="M2.5 3.2c1.6-.6 3.3-.5 5 .5v9.1c-1.7-1-3.4-1.1-5-.5z" stroke="currentColor" stroke-linejoin="round" fill="none"/><path d="M13.5 3.2c-1.6-.6-3.3-.5-5 .5v9.1c1.7-1 3.4-1.1 5-.5z" stroke="currentColor" stroke-linejoin="round" fill="none"/></symbol>
<symbol id="i-guide" viewBox="0 0 16 16"><path d="M8 1.5c-2.8 0-5 2-5 4.5 0 1.6.8 2.7 1.8 3.6.5.4.7.8.7 1.4v.3h5v-.3c0-.6.2-1 .7-1.4C12.2 8.7 13 7.6 13 6c0-2.5-2.2-4.5-5-4.5z" stroke="currentColor" fill="none" stroke-linejoin="round"/><path d="M6.7 13.7h2.6M6.9 12h2.2" stroke="currentColor" stroke-linecap="round"/></symbol>
<symbol id="i-flag" viewBox="0 0 16 16"><path d="M3.5 14V2.5h9l-2 3 2 3h-9" stroke="currentColor" stroke-linejoin="round" fill="none"/></symbol>
<symbol id="i-cat-open" viewBox="0 0 16 16"><path d="M6 2.5v3M10 2.5v3" stroke="currentColor" stroke-linecap="round"/><path d="M4 5.5h8v2.5a4 4 0 0 1-8 0z" stroke="currentColor" stroke-linejoin="round" fill="none"/><path d="M8 12v2" stroke="currentColor" stroke-linecap="round"/></symbol>
<symbol id="i-cat-cloud" viewBox="0 0 16 16"><path d="M4.5 12.5a3 3 0 0 1-.4-6 4 4 0 0 1 7.8 1 2.5 2.5 0 0 1-.4 5H4.5Z" stroke="currentColor" stroke-linejoin="round" fill="none"/></symbol>
<symbol id="i-cat-version" viewBox="0 0 16 16"><path d="M2 7.5V3.5a1 1 0 0 1 1-1h4l6.5 6.5a1 1 0 0 1 0 1.4l-4 4a1 1 0 0 1-1.4 0L2 8.4a1 1 0 0 1 0-.9z" stroke="currentColor" stroke-linejoin="round" fill="none"/><circle cx="5.3" cy="5.3" r="1" fill="currentColor"/></symbol>
</defs></svg>

<div class="page">
  <header class="mast">
    <h1 id="title">鸿蒙开发工具体验</h1>
    <span class="grow"></span>
    <button type="button" class="tbtn" id="guide-btn" title="demo 页面上「点这里 / 这里会变」的标注，所有 demo 一起开关"><svg><use href="#i-guide"/></svg><span id="guide-label">demo 标注：开</span></button>
    <button type="button" class="tbtn" id="theme-btn" title="切换深色 / 浅色"><svg><use href="#i-moon"/></svg><span id="theme-label">深色</span></button>
  </header>

  <div class="layout">
    <aside class="sidebar" aria-label="分类">
      <div class="sd-title">分类</div>
      <nav id="cats"></nav>
      <div class="sd-legend" id="legend" aria-label="卡片状态图例"></div>
    </aside>

    <main>
      <div class="mainbar">
        <h2 id="section-title">全部项目</h2>
        <span class="grow"></span>
        <span class="count" id="count"></span>
      </div>
      <div class="search-row">
        <div class="search"><svg class="i"><use href="#i-search"/></svg><input id="search" type="search" placeholder="搜标题、说明、标签…" aria-label="搜索条目"></div>
      </div>
      <div id="groups"></div>
    </main>
  </div>

  <footer>
    <span>新增条目：编辑 <code>site/catalog.js</code>，在对应分类里加一条，刷新即可。</span>
    <span>新 demo 放在 <code>demos/&lt;slug&gt;/index.html</code>，截图存 <code>site/thumbs/</code>。</span>
    <span>颜色与字号来自 <code>deveco-intui-kit/src/tokens.css</code>，与界面稿同一套 token。</span>
  </footer>
</div>

<script src="site/catalog.js"></script>
<script src="site/launcher.js"></script>
</body>
</html>
